<meta charset="utf-8">
<title>理論科目 3D工場</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="電験三種 理論科目の9つの実験台（静電気・磁気・直流・交流・過渡・三相・電子回路・電子の運動・計測）を3Dに並べ、理論Wikiと過去問に結びつけて眺めるビューア">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF0EC; --panel:#F8F9F6; --ink:#1E2328; --ink-2:#4B555E; --ink-3:#7C8790;
  --line:#D6DAD3; --line-2:#E4E7E1;
  --accent:#B5601F; --accent-ink:#8C4612; --accent-soft:#F4E5D7;
  --steel:#3B5A73; --steel-soft:#DDE6EE;
  --canvas:#1A2028;
  --font-sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
    --line:#2E353C; --line-2:#262C33;
    --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
    --steel:#8FB0CC; --steel-soft:#22313D;
    --canvas:#0F1419;
  }
}
:root[data-theme="dark"]{
  --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
  --line:#2E353C; --line-2:#262C33;
  --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
  --steel:#8FB0CC; --steel-soft:#22313D;
  --canvas:#0F1419;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--font-serif);font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-family:var(--font-sans);font-weight:400;color:var(--ink-3);font-size:12px;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--steel);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:inherit;opacity:.7;margin-right:4px}
.wikilink{margin-left:auto;font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.wikilink:hover{color:var(--accent-ink)}
.stage{display:flex;flex-direction:column;background:var(--canvas);min-height:0}
.view{position:relative;flex:1;min-height:0}
.view canvas{display:block;width:100%;height:100%}
.ctrlbar{background:#141920;color:#E6E9E4;border-top:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-end;font-size:12.5px}
.ctrlbar .title{font-size:11.5px;letter-spacing:.08em;color:#AEB6BD;align-self:center;white-space:nowrap}
.ctrlbar details.more{flex-basis:100%;order:1;border-top:1px dashed rgba(255,255,255,.14);padding-top:4px}
.ctrlbar details.more>summary{cursor:pointer;color:#C5CCD3;font-size:12px;letter-spacing:.04em;padding:4px 0;list-style-position:inside}
.ctrlbar details.more[open]>summary{color:#F0B57E}
.ctrlbar .moregrid{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.cg{display:grid;gap:3px;min-width:150px}
.cg>label{font-size:11.5px;color:#AEB6BD;white-space:nowrap;display:flex;justify-content:space-between;gap:8px}
.cg .val{font-family:var(--font-mono);color:#F0B57E;font-variant-numeric:tabular-nums}
.cg input[type=range]{width:100%;accent-color:#D9853F;margin:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6E9E4;border-radius:4px;padding:2px 9px;font-size:12px}
.seg button[aria-pressed="true"]{background:#D9853F;border-color:#D9853F;color:#1A2028}
.readout{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:12px;margin:0 0 0 auto;align-self:center}
.readout dt{color:#AEB6BD;margin:0;text-align:right}
.readout dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.readout.has-hot dt:not(.hot),.readout.has-hot dd:not(.hot){opacity:.7}   /* 薄くしても 4.5:1 以上（項目名 4.85・値 7.6）*/
.readout dt.hot{color:#E6E9E4}
.readout dd.hot{color:#F0B57E;font-weight:600}
.readout dt,.readout dd{transition:opacity .2s}
.labels svg{position:absolute;inset:0;width:100%;height:100%}
.labels svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* 凡例。順序固定で動かない。行に触れた1件だけ引き出し線が出る */
.legend{position:absolute;left:10px;top:10px;max-width:min(46%,300px);background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px;backdrop-filter:blur(3px);pointer-events:auto}
.legend.hidden{display:none}
.lgrow{display:grid;grid-template-columns:11px 1fr;gap:8px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:4px 8px;color:#C5CCD3;font-size:12px;line-height:1.5}
.lgrow i{width:11px;height:11px;border-radius:2px;margin-top:4px;display:block}
.lgrow:hover,.lgrow.on{background:rgba(217,133,63,.92);color:#1A2028}
.lgcap{font-size:10.5px;letter-spacing:.06em;color:#7B858E;padding:2px 8px 4px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lgcap button{background:transparent;border:0;color:#7B858E;font-size:10.5px;padding:0 2px;text-decoration:underline}
.lgcap button:hover{color:#D9853F}
.lgshow{position:absolute;left:10px;top:10px;background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);color:#AEB6BD;border-radius:6px;padding:4px 12px;font-size:11.5px}
.lgshow.hidden{display:none}
.points{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;align-items:start}
.points .k{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600;margin-top:2px}
.points b{font-weight:500}
.points span{color:var(--ink-2)}
.tour{border:1px solid var(--accent);border-radius:6px;padding:12px 14px;background:var(--accent-soft)}
.tour .step{font-family:var(--font-mono);font-size:11.5px;color:var(--accent-ink);letter-spacing:.06em}
.tour h4{margin:2px 0 4px;font-size:15px;font-weight:700;font-family:var(--font-serif)}
.tour p{margin:0 0 10px;font-size:13px;color:var(--ink)}
.tsteps{display:grid;gap:6px;margin:0 0 10px}
.tsteps>div{display:grid;grid-template-columns:3.6em 1fr;gap:9px;align-items:baseline}
.tsteps dt{margin:0;font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:1px 0;text-align:center}
.tsteps dd{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.tq{border-top:1px dashed var(--accent);padding-top:8px;margin:0 0 10px;display:grid;gap:5px}
.tq .cap{font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink)}
.tq a{display:grid;grid-template-columns:5.6em 1fr;gap:8px;text-decoration:none;color:var(--ink);font-size:12.5px;line-height:1.5}
.tq a:hover{color:var(--accent-ink);text-decoration:underline}
.tq .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tour .nav{display:flex;gap:6px;align-items:center}
.tour .nav button{border:1px solid var(--accent);background:var(--panel);color:var(--accent-ink);border-radius:4px;padding:3px 12px;font-size:12.5px}
.tour .nav button:disabled{opacity:.4;cursor:default}
.tour .nav .dots{margin-left:auto;display:flex;gap:4px}
.tour .nav .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.tour .nav .dots i.on{background:var(--accent)}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check details{border:1px solid var(--line-2);border-radius:4px;padding:8px 12px}
.check summary{cursor:pointer;font-size:13px;font-weight:500}
.check summary::marker{color:var(--accent)}
.check p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;color:#E9EDF0;background:rgba(16,20,26,.72);padding:2px 8px;border-radius:3px;white-space:nowrap;letter-spacing:.02em;border-left:2px solid var(--lc,#B5601F)}
.lbl.big{font-size:13px;font-weight:500;padding:4px 10px;pointer-events:auto;cursor:pointer}
.hint{position:absolute;right:12px;top:10px;font-size:11.5px;color:#8E98A2;text-align:right;line-height:1.5}
.hint kbd{font-family:var(--font-mono);color:#C5CCD3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 40px}
aside h2{font-family:var(--font-serif);font-size:22px;margin:0 0 4px;line-height:1.35;text-wrap:balance}
aside h2 .num{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);font-weight:400;margin-right:8px}
.kicker{font-size:11.5px;letter-spacing:.1em;color:var(--accent-ink);font-weight:500;margin-bottom:6px}
.lead{color:var(--ink-2);margin:0 0 8px}
.viewnote{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--steel);padding:2px 0 2px 10px;margin:0 0 14px}
.viewnote:empty{display:none}
aside h3{font-size:12.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
aside h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.parts li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;font-size:13px}
.parts .sw{width:12px;height:12px;border-radius:2px;margin-top:7px;border:1px solid rgba(0,0,0,.15)}
.parts b{font-weight:500}
.parts span{color:var(--ink-2)}
.secs{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.secs a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;padding:7px 10px;border:1px solid var(--line-2);border-radius:4px;text-decoration:none;color:var(--ink);background:transparent}
.secs a:hover{border-color:var(--accent);background:var(--accent-soft)}
.secs .why{grid-column:1/-1;font-size:12px;color:var(--ink-2);line-height:1.55}
.secs .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kak{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.kak li{display:grid;grid-template-columns:5.6em 1fr;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line-2)}
.kak .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kak a{color:var(--ink);text-decoration:none}
.kak a:hover{color:var(--accent-ink);text-decoration:underline}
.kak .d{color:var(--accent);letter-spacing:-.1em;margin-left:4px;font-size:11px}
.kak .k3d{border:1px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:3px;padding:0 6px;font-size:10.5px;line-height:1.5;margin-left:6px;vertical-align:1px}
.kak .k3d:hover{background:var(--accent-soft)}
.secgroup{font-size:12px;color:var(--ink-2);margin:10px 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.secgroup button{background:transparent;border:1px solid var(--accent);color:var(--accent-ink);border-radius:3px;padding:1px 9px;font-size:11.5px;white-space:nowrap}
.secgroup button:hover{background:var(--accent-soft)}
.cg.off{opacity:.35}
.cg.off input,.cg.off button{pointer-events:none}
.flow{display:grid;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{position:relative;padding:8px 0 8px 34px;counter-increment:f;border-left:2px solid var(--line);margin-left:11px}
.flow li::before{content:counter(f);position:absolute;left:-13px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--steel);color:var(--steel);font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600}
.flow li.here{border-left-color:var(--accent)}
.flow li.here::before{background:var(--accent);border-color:var(--accent);color:#fff}
.flow b{display:block;font-weight:500}
.flow span{color:var(--ink-2);font-size:12.5px}
.flow a{text-decoration:none}
.note{background:var(--steel-soft);border-radius:4px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.note b{color:var(--ink);font-weight:500}
canvas.mini{width:100%;height:150px;display:block;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.mini-cap{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}
.overview-grid{display:grid;gap:8px}
.overview-grid button{text-align:left;border:1px solid var(--line-2);background:transparent;border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
.overview-grid button:hover{border-color:var(--accent);background:var(--accent-soft)}
.overview-grid .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.overview-grid .t{font-weight:500}
.overview-grid .c{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.overview-grid .s{grid-column:2/-1;font-size:12px;color:var(--ink-2)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .view{flex:none;height:46vh;min-height:260px}
  /* チップが縦に折り返すとヘッダだけで画面を食う。横1列の横スクロールにする。
     flex だと flex-basis:100% が本質サイズ計算で中身の幅に落ちてページごと横に伸びるため、
     minmax(0,1fr) で潰せるグリッドにする。 */
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:7px 10px;align-items:center}
  header h1{grid-column:1;grid-row:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wikilink{grid-column:2;grid-row:1;margin-left:0}
  .chips{grid-column:1/-1;grid-row:2;min-width:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;min-height:34px;display:flex;align-items:center}
  .legend{max-width:calc(100% - 20px)}
  .ctrlbar{gap:8px 16px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  header h1 small{display:none}
}

/* ---- 30秒理解 ---- */
.oneliner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 5px 5px 0;font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink);margin:0 0 12px}
.oneliner small{display:block;font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:3px}
/* ---- 狙われるポイント ---- */
.exam{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.exam li{border:1px solid var(--line-2);border-radius:5px;padding:8px 11px;display:grid;gap:3px}
.exam .en{font-size:11.5px;letter-spacing:.04em;color:var(--ink-3)}
.exam .ef{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--accent-ink);word-break:break-word}
.exam .ew{font-size:12px;color:var(--ink-2);line-height:1.55}
/* ---- 予想クイズ ---- */
.quiz{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:q}
.quiz>li{border:1px solid var(--line);border-radius:6px;padding:11px 13px;background:var(--panel);counter-increment:q}
.quiz>li.done{border-color:var(--line-2)}
.qq{font-size:13.5px;font-weight:500;line-height:1.6;margin-bottom:9px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.qn{font-family:var(--font-mono);font-size:11px;background:var(--steel);color:var(--panel);border-radius:3px;padding:1px 6px;margin-top:3px}
.qopts{display:grid;gap:5px}
.qopts button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 12px;font-size:13px;min-height:38px;line-height:1.4;display:flex;align-items:center;gap:8px}
.qopts button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qopts button:disabled{cursor:default}
.qopts button .mk{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);flex:none}
.qopts button.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.qopts button.ng{border-color:var(--danger);background:var(--danger-soft)}
.qopts button.dim{opacity:.45}
.qfb{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.qfb b{color:var(--ink)}
.qfb .verdict{display:block;font-weight:700;margin-bottom:3px}
.qfb .verdict.ok{color:var(--ok)}
.qfb .verdict.ng{color:var(--danger)}
.qfb .again{background:none;border:0;color:var(--accent-ink);font-size:12px;text-decoration:underline;padding:4px 0 0;min-height:32px}
/* ---- もう一歩カード ---- */
.cards{display:grid;gap:8px}
.cards details{border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.cards summary{cursor:pointer;font-size:13px;font-weight:500;padding:9px 12px;min-height:38px;display:flex;align-items:center}
.cards summary::marker{color:var(--accent)}
.cards .cbody{padding:2px 12px 12px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.cards .cbody b{color:var(--ink)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
.tbl table{border-collapse:collapse;width:100%;min-width:min(100%,340px);font-size:12px}
.tbl th,.tbl td{border:1px solid var(--line-2);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg-sunken,var(--accent-soft));font-weight:600;color:var(--ink);white-space:nowrap}
.tbl td{color:var(--ink-2)}
.chain{list-style:none;padding:0;margin:8px 0;display:grid;gap:0}
.chain li{position:relative;padding:5px 0 5px 20px;font-size:12.5px;color:var(--ink-2)}
.chain li::before{content:"↓";position:absolute;left:4px;top:4px;color:var(--accent);font-size:11px}
.chain li:first-child::before{content:"●";font-size:8px;top:9px}
.chain li b{color:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
.segsm{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.segsm button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 11px;font-size:12px;min-height:34px;color:var(--ink-2)}
.segsm button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.convwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.convfig{display:block;width:100%;min-width:430px;height:auto}
/* ---- 次にやること ---- */
.steps{display:grid;gap:6px;margin:0}

/* ---------- 計算モデル（読み値・図・3D はすべてここを見る） ----------
   式は理論Wikiの各ページの公式タブと同じ形にそろえる。数値は練習用の例。 */
const E0 = 8.854e-12, MU0 = 4*Math.PI*1e-7, QE = 1.602e-19, ME = 9.109e-31;

/* 1. 平行平板コンデンサ。面積 S は 0.01 m²（10 cm 角）に固定。
   誘電体: none（空気）・full（全体）・stack（厚さの半分を上下に積層＝直列）・split（面積の半分を左右に分割＝並列）。
   定電圧（電源につないだまま）なら V 一定。定電荷（切り離した）なら Q = Cchg·V0 で一定。
   Cchg は「切り離したときの静電容量」。切り離したあとに間隔や誘電体を変えても Q は動かない
   （電荷の逃げ道が無い）。V0 は最初の充電電圧（eV）。
   Cchg の決め方: ツアー・予想クイズで状態を当てたときは、本文の前提どおり「空気のまま、その間隔で
   充電して切り離した」とみなす（esCchg = null → 空気の C0）。操作帯で「切り離した」を押したときは、
   押した瞬間の静電容量で固定する（押しただけで電圧が飛ばないように）。 */
const ES_S = .01;
let esCchg = null, esLastMode = 'v';   // esLastMode: 直前に計算したときの電源の状態（押し直しを見分ける）
function esCap(){
  const st = state, d = st.eD*1e-3, C0 = E0*ES_S/d, er = st.eEr;
  const C = st.eFill==='full' ? er*C0 : st.eFill==='stack' ? C0*2*er/(1+er) : st.eFill==='split' ? C0*(1+er)/2 : C0;
  return {d, C0, C, er};
}
function esModel(){
  const st = state, {d, C0, C, er} = esCap();
  if (st.eMode==='q' && esCchg===null) esCchg = C0;
  const Q = st.eMode==='v' ? C*st.eV : esCchg*st.eV, V = Q/C, W = Q*Q/(2*C);
  esLastMode = st.eMode;
  /* 空気部分と誘電体部分の電界。積層（直列）は電束密度 D = Q/S が共通、分割（並列）・全体は E = V/d が共通 */
  let Ea, Ed;
  if (st.eFill==='stack'){ const D = Q/ES_S; Ea = D/E0; Ed = D/(E0*er); }
  else { Ea = V/d; Ed = V/d; }
  if (st.eFill==='none') Ed = null;
  if (st.eFill==='full') Ea = null;
  return {C0, C, Q, V, W, Ea, Ed};
}

/* 2. 磁気回路（環状鉄心＋空隙）と、平行導体間の力。
   鉄心の平均磁路長 l = 0.3 m、断面積 A = 4 cm²。磁気抵抗 Rm = l/(μ0μr A) と 空隙 lg/(μ0 A) の直列 */
const MG_L = .3, MG_A = 4e-4;
function mgModel(){
  const st = state, Rc = MG_L/(MU0*st.mMu*MG_A), Rg = st.mGap*1e-3/(MU0*MG_A), F = st.mN*st.mI, Rm = Rc + Rg;
  const Phi = F/Rm, B = Phi/MG_A, L = st.mN*st.mN/Rm, W = L*st.mI*st.mI/2;
  const f = MU0*st.fI1*st.fI2/(2*Math.PI*st.fR);           // 導体 1 m あたりの力 [N/m]
  return {Rc, Rg, F, Rm, Phi, B, L, W, f, attract: st.fDir==='same'};
}

/* 3. 直流: ホイートストンブリッジ（検流計の抵抗 Rg、電源 E・内部抵抗なし）を節点方程式で解く。
   節点 a（電源+）・b（R1-R3 の間、検流計の片側）・c（R2-R4 の間、もう片側）・d（電源−）= 0 V。
   R1: a-b、R2: a-c、R3: b-d、R4: c-d。平衡条件 R1·R4 = R2·R3 */
function brModel(){
  const st = state, E = st.bE, g1 = 1/st.bR1, g2 = 1/st.bR2, g3 = 1/st.bR3, g4 = 1/st.bR4, gg = 1/st.bRg;
  /* 未知数 Vb, Vc（Va = E, Vd = 0） */
  const a11 = g1 + g3 + gg, a12 = -gg, a21 = -gg, a22 = g2 + g4 + gg, b1 = g1*E, b2 = g2*E;
  const det = a11*a22 - a12*a21, Vb = (b1*a22 - a12*b2)/det, Vc = (a11*b2 - a21*b1)/det;
  const Ig = (Vb - Vc)*gg, I1 = (E - Vb)*g1, I2 = (E - Vc)*g2;
  /* テブナンで見ると: 検流計を外したときの b-c 間の電圧 Vth と、電源を短絡して見た抵抗 Rth。Ig = Vth/(Rth + Rg) */
  const Vth = E*(st.bR3/(st.bR1 + st.bR3) - st.bR4/(st.bR2 + st.bR4)), Rth = st.bR1*st.bR3/(st.bR1 + st.bR3) + st.bR2*st.bR4/(st.bR2 + st.bR4);
  return {Vb, Vc, Ig, I1, I2, I: I1 + I2, bal: st.bR1*st.bR4 - st.bR2*st.bR3, Vth, Rth};
}
/* 最大電力の定理: 内部抵抗 r の電源 E から負荷 RL へ。P = E²RL/(r+RL)²、RL = r で最大 E²/(4r) */
function mpModel(RL = state.pRL){
  const st = state, I = st.pE/(st.pr + RL);
  return {I, P: I*I*RL, Pmax: st.pE*st.pE/(4*st.pr), eta: RL/(st.pr + RL)};
}

/* 4. RLC 回路（直列／並列）。L は mH、C は μF */
function acModel(f = state.aF){
  const st = state, w = 2*Math.PI*f, XL = w*st.aL*1e-3, XC = 1/(w*st.aC*1e-6);
  const f0 = 1/(2*Math.PI*Math.sqrt(st.aL*1e-3*st.aC*1e-6));
  if (st.aConn==='series'){
    const X = XL - XC, Z = Math.hypot(st.aR, X), I = st.aV/Z, phi = Math.atan2(X, st.aR);
    return {XL, XC, X, Z, I, phi, P: I*I*st.aR, Q: I*I*X, S: st.aV*I, pf: st.aR/Z, f0, Qf: Math.sqrt(st.aL*1e-3/(st.aC*1e-6))/st.aR,
            VR: I*st.aR, VL: I*XL, VC: I*XC};
  }
  const G = 1/st.aR, B = 1/XC - 1/XL, Y = Math.hypot(G, B), I = st.aV*Y, phi = -Math.atan2(B, G);   // phi>0 は遅れ（誘導性）
  return {XL, XC, Y, Z: 1/Y, I, phi, P: st.aV*st.aV*G, Q: -st.aV*st.aV*B, S: st.aV*I, pf: G/Y, f0, Qf: st.aR*Math.sqrt(st.aC*1e-6/(st.aL*1e-3)),
          IR: st.aV*G, IL: st.aV/XL, IC: st.aV/XC};
}

/* 5. 過渡現象。RC（C は μF）・RL（L は mH）。経過時間は τ を単位にして t/τ で動かす */
function trModel(k = state.tK){
  const st = state, tau = st.tType==='rc' ? st.tR*st.tC*1e-6 : st.tL*1e-3/st.tR, ex = Math.exp(-k), I0 = st.tE/st.tR;
  let x, i;                                              // x: RC は vC、RL は i
  if (st.tType==='rc'){ x = st.tPh==='on' ? st.tE*(1 - ex) : st.tE*ex; i = (st.tPh==='on' ? 1 : -1)*I0*ex; }
  else { i = st.tPh==='on' ? I0*(1 - ex) : I0*ex; x = st.tPh==='on' ? st.tE*ex : -st.tE*ex; }   // RL の x は vL
  return {tau, t: k*tau, x, i, I0, ratio: 1 - ex};
}

/* 6. 三相平衡負荷（Y／Δ）。線間電圧 V、1相のインピーダンス Z、力率 cosφ */
function thModel(conn = state.hConn){
  const st = state, Y = conn==='Y', Vp = Y ? st.hV/Math.sqrt(3) : st.hV, Ip = Vp/st.hZ, IL = Y ? Ip : Math.sqrt(3)*Ip;
  return {Vp, Ip, IL, P: 3*Vp*Ip*st.hPf, P2: Math.sqrt(3)*st.hV*IL*st.hPf, S: Math.sqrt(3)*st.hV*IL};
}

/* 7. 電子回路。ダイオード整流の平均値、エミッタ接地の直流動作点と電圧利得、オペアンプの増幅 */
const VBE = .6, VSAT = 13;
function elModel(){
  const st = state, Vm = Math.SQRT2*st.xVin, Vavg = st.xRect==='half' ? Vm/Math.PI : 2*Vm/Math.PI;
  const Ib = Math.max(0, (st.xVcc - VBE)/(st.xRb*1e3)), IcLin = st.xHfe*Ib, IcSat = st.xVcc/(st.xRc*1e3);
  const sat = IcLin >= IcSat, Ic = Math.min(IcLin, IcSat), Vce = st.xVcc - Ic*st.xRc*1e3;
  const Av = -st.xHfe*st.xRc/st.xHie;                       // Rc・hie は kΩ どうしなので比は無次元
  const G = st.xOp==='inv' ? -st.xRf/st.xRi : 1 + st.xRf/st.xRi, Vo = Math.max(-VSAT, Math.min(VSAT, G*st.xVi));
  return {Vm, Vavg, Ib, Ic, IcLin, sat, Vce, Av, G, Vo, clip: Math.abs(G*st.xVi) > VSAT};
}

/* 8. 電子の運動。加速電圧 Va で速さ v = √(2eVa/m)。偏向板（長さ 5 cm・間隔 1 cm）の電界では放物線、
   一様磁界 B では半径 r = mv/(eB) の円運動。電子は板の中央から入るので、変位が d/2 に届くと板に当たって出てこない */
const EM_LP = .05, EM_DP = .02;
function emModel(){
  const st = state, v = Math.sqrt(2*QE*st.zVa/ME), t = EM_LP/v, Ef = st.zVd/EM_DP, a = QE*Ef/ME;
  const y = a*t*t/2, yf = st.zVd*EM_LP*EM_LP/(4*EM_DP*st.zVa), r = st.zB > 0 ? ME*v/(QE*st.zB*1e-3) : Infinity;
  const hit = yf >= EM_DP/2, xHit = hit ? v*Math.sqrt(EM_DP/a) : null;   // 板に当たる位置（入口からの距離）
  return {v, t, Ef, a, y, yf, hit, xHit, r, T: 2*Math.PI*ME/(QE*Math.max(1e-9, st.zB*1e-3))};
}

/* 9. 計器の測定範囲の拡大。電流計（内部抵抗 Ra、最大目盛 Ifs）に分流器 Rs = Ra/(n−1)、
   電圧計（内部抵抗 Rv、最大目盛 Vfs）に倍率器 Rm = (n−1)Rv */
function mtModel(){
  const st = state, n = st.kN;
  if (st.kType==='A'){
    const Rs = n > 1 ? st.kRa/(n - 1) : Infinity, Im = st.kX/n, frac = Im/st.kIfs;     // kX・Im・kIfs はすべて mA
    return {Rs, Im, frac, range: n*st.kIfs};
  }
  const Rm = (n - 1)*st.kRv*1e3, Vm = st.kX/n, frac = Vm/st.kVfs;
  return {Rm, Vm, frac, range: n*st.kVfs};
}

  plate: std({color:0xb9c2ca, metalness:.7, roughness:.3}),
  diel: std({color:0xf0b57e, transparent:true, opacity:.4, roughness:.4, depthWrite:false}),   // 中の電気力線が透けて見えるように深度を書かない
  board: std({color:0x2c3a2f, roughness:.9}),
  res: std({color:0xd9c7a0, roughness:.6}),
  dotP: std({color:0xff8a7a, emissive:0xd24a43, emissiveIntensity:1.1}),
  dotN: std({color:0x8ab8ff, emissive:0x3572d6, emissiveIntensity:1.1}),
  dotI: std({color:0xffe0a0, emissive:0xf0b57e, emissiveIntensity:1.2}),
  glass: std({color:0x9fb3c4, transparent:true, opacity:.18, roughness:.1, side:THREE.DoubleSide}),
  field: new THREE.LineBasicMaterial({color:0xfff4d6, transparent:true, opacity:.8}),   // 誘電体（橙）の中でも見分けられる明るい色
  fieldD: new THREE.LineBasicMaterial({color:0xffd9b0, transparent:true, opacity:.8}),
  core: std({color:0x6b7580, metalness:.6, roughness:.45}),
  chip: std({color:0x1f2226, roughness:.5}),
  lamp: std({color:0xfff2c0, emissive:0xffd060, emissiveIntensity:1}),
  meterFace: std({color:0xf4f1e8, roughness:.8}),
};
/* 電流などの流れを光点で描く道。pts の順が流れる向き */
function rrPath(parent, pts, n, mat, closed){
  if (closed) pts = pts.concat([pts[0]]);
  const cum = [0]; for (let i=1;i<pts.length;i++) cum.push(cum[i-1] + pts[i].distanceTo(pts[i-1]));
  const dots = []; for (let i=0;i<n;i++){ const d = mesh(new THREE.SphereGeometry(.05,8,8), mat, parent); d.castShadow = false; dots.push(d); }
  return {pts, cum, total:cum[cum.length-1], dots};
}
const _rrp = new THREE.Vector3();
/* 光点の大きさを量に比例させる（基準の量で 1 倍、0.35〜3 倍に収める）。比べる表示と同じ向きで 3D でも差が見えるように */
function rrScale(p, ratio){ const k = Math.max(.35, Math.min(3, ratio)); p.dots.forEach(d => d.scale.setScalar(k)); }
function rrRun(p, T, on){
  p.dots.forEach((d, i) => { d.visible = on; if (!on) return;
    let s = ((T + i/p.dots.length*p.total) % p.total + p.total) % p.total, k = 1;
    while (k < p.cum.length-1 && p.cum[k] < s) k++;
    const a = p.pts[k-1], b = p.pts[k], f = (s - p.cum[k-1])/Math.max(1e-6, p.cum[k] - p.cum[k-1]);
    d.position.copy(_rrp.copy(a).lerp(b, f)); });
}
const P3 = (x,y,z=0) => new THREE.Vector3(x,y,z);
const wr = (a, b, parent, mat=M.copper, r=.025) => wire3(a, b, mat, parent, r);
const board = (g, w=6, d=3) => mesh(new THREE.BoxGeometry(w,.12,d), RR.board, g, 0, .06, 0);
/* 抵抗器（色帯つきの小さな円柱）。x 方向に寝かせる */
function resistor(parent, x, y, z, len=.6, rotY=0){
  const o = new THREE.Group(); o.position.set(x,y,z); o.rotation.y = rotY; parent.add(o);
  const b = mesh(new THREE.CylinderGeometry(.09,.09,len,14), RR.res, o); b.rotation.z = Math.PI/2;
  for (const dx of [-.15,0,.15]) { const r = mesh(new THREE.CylinderGeometry(.095,.095,.04,14), M.u, o, dx*len/.6, 0, 0); r.rotation.z = Math.PI/2; }
  return o;
}
/* 針つきの丸い計器。needle.rotation.z で振れを描く */
function dial(parent, x, y, z, r=.35){
  const o = new THREE.Group(); o.position.set(x,y,z); parent.add(o);
  mesh(new THREE.CylinderGeometry(r, r, .12, 28), M.steelDark, o).rotation.x = Math.PI/2;
  mesh(new THREE.CylinderGeometry(r*.88, r*.88, .02, 28), RR.meterFace, o, 0, 0, .07).rotation.x = Math.PI/2;
  const needle = new THREE.Group(); needle.position.set(0, -r*.55, .09); o.add(needle);
  mesh(new THREE.BoxGeometry(.025, r*1.15, .015), M.u, needle, 0, r*.57, 0);
  o.userData.needle = needle; return o;
}

/* ---------- 1. 静電気・コンデンサ ----------
   平行平板。量に比例させた誇張表示で、変化を目で数えられるようにする（実寸ではない）:
   極板の間隔 ∝ d／電気力線の本数 ∝ 電界 E（力線の密度＝電界の強さ、という定義どおり）／極板の粒の数 ∝ 電荷 Q */
const ES_DOTS = 40, ES_LINES = 28, ES_E_REF = 100/2e-3;   // 粒・力線の上限。電界の基準は 100 V・2 mm（5×10⁴ V/m で 7 本）
function buildStatics(g){
  board(g, 5, 3);
  const top = mesh(new THREE.BoxGeometry(2.6,.06,1.8), RR.plate, g, 0, 2.0, 0);
  const bot = mesh(new THREE.BoxGeometry(2.6,.06,1.8), RR.plate, g, 0, .9, 0);
  const slab = mesh(new THREE.BoxGeometry(1,1,1), RR.diel, g); slab.castShadow = false;
  const lines = [], lineGeo = new THREE.BufferGeometry().setFromPoints([P3(0,0,0), P3(0,1,0)]);
  /* 7×4 の格子に 28 本。rank は「何本目に表示するか」。11 は 28 と互いに素なので、少ない本数でも格子全体に散らばる */
  for (let i=0;i<7;i++) for (let j=0;j<4;j++) for (const half of [0,1]){ const l = new THREE.Line(lineGeo, RR.field.clone()); l.position.set(-1.05 + i*.35, 0, -.6 + j*.4); l.userData.x = l.position.x; l.userData.half = half; l.userData.rank = ((i*4 + j)*11) % 28; g.add(l); lines.push(l); }   // half 0 = 下半分、1 = 上半分
  const pos = [], neg = [];
  for (let i=0;i<ES_DOTS;i++){ const x = -1.15 + (i%8)*.33, z = -.72 + Math.floor(i/8)*.36;
    const p = mesh(new THREE.SphereGeometry(.05,8,8), RR.dotP, g, x, 0, z); p.castShadow = false; pos.push(p);
    const n = mesh(new THREE.SphereGeometry(.05,8,8), RR.dotN, g, x, 0, z); n.castShadow = false; neg.push(n); }
  const bat = mesh(new THREE.BoxGeometry(.4,.6,.4), M.steelDark, g, 2.0, .45, 0);
  const wTop = new THREE.Group(), wBot = new THREE.Group(); g.add(wTop, wBot);
  wr(P3(1.3,2.0), P3(2.0,2.0), wTop); wr(P3(2.0,2.0), P3(2.0,1.0), wTop);
  wr(P3(1.3,.9), P3(1.75,.9), wBot); wr(P3(1.75,.9), P3(1.75,.75), wBot);
  Object.assign(g.userData, {top, bot, slab, lines, pos, neg, wTop});
  g.userData.labels = (st) => [
    {obj:top, t:'上の極板（＋電荷）', c:'#D24A43'},
    {obj:bot, t:'下の極板（−電荷）', c:'#3572D6'},
    ...(st.eFill!=='none' ? [{obj:slab, t: st.eFill==='stack' ? '誘電体（上下に積層＝直列）' : st.eFill==='split' ? '誘電体（左右に分割＝並列）' : '誘電体（全体）', c:'#F0B57E'}] : []),
    /* 電気力線は本数を電界に比例させて出す（rank の小さい線から出る）。rank 0 の線は電界があれば必ず出るのでそれを指す。
       以前は lines[13]（rank 10）で、既定の 7 本では描かれず、指し示しが黙って外れていた（2026-10-12 measure_3d_tour_camera.py の注） */
    {obj:lines.find(l => l.userData.rank === 0 && l.userData.half === 1), t:'電気力線（本数が多いほど電界が強い）', c:'#F0B57E'},
    {obj:bat, t: st.eMode==='v' ? '電源（つないだまま＝電圧一定）' : '電源（切り離した＝電荷一定）', c:'#3B5A73'},
  ];
}
function animStatics(g, t, st, dt){
  const u = g.userData, m = esModel(), gap = st.eD*.28, y0 = .9, y1 = y0 + gap;   // 間隔は d に比例
  u.top.position.y = y1; u.wTop.position.y = y1 - 2.0; u.wTop.children[1].visible = st.eMode==='v';
  /* 誘電体の形 */
  u.slab.visible = st.eFill!=='none';
  if (st.eFill==='full'){ u.slab.scale.set(2.6, gap-.06, 1.8); u.slab.position.set(0, y0 + gap/2, 0); }
  else if (st.eFill==='stack'){ u.slab.scale.set(2.6, gap/2-.03, 1.8); u.slab.position.set(0, y0 + gap/4, 0); }
  else if (st.eFill==='split'){ u.slab.scale.set(1.3, gap-.06, 1.8); u.slab.position.set(-.65, y0 + gap/2, 0); }
  /* 電気力線: 本数を電界 E に比例させる（基準 5×10⁴ V/m で 7 本、28 本で頭打ち）。
     積層では下半分が誘電体なので、上下の半分で本数が変わる。分割・全体は E が共通 */
  u.lines.forEach(l => {
    const inDiel = st.eFill==='full' || (st.eFill==='split' && l.userData.x < 0) || (st.eFill==='stack' && l.userData.half===0);
    const E = inDiel ? (m.Ed || 0) : (m.Ea || 0), n = E > 0 ? Math.max(1, Math.min(ES_LINES, Math.round(7*E/ES_E_REF))) : 0;   // 電界があれば最低1本
    l.position.y = y0 + .03 + l.userData.half*(gap/2 - .03); l.scale.y = gap/2 - .03;
    l.visible = l.userData.rank < n; l.material.opacity = .85;
  });
  /* 電荷: 空気・d 2 mm・100 V のときの Q を 6 粒として、Q に比例させる（40 粒で頭打ち） */
  const q0 = E0*ES_S/(2e-3)*100, nq = Math.max(1, Math.min(ES_DOTS, Math.round(6*m.Q/q0)));
  u.pos.forEach((p, i) => { p.visible = i < nq; p.position.y = y1 + .06; });
  u.neg.forEach((p, i) => { p.visible = i < nq; p.position.y = y0 - .06; });
}

/* ---------- 2. 磁気回路・電磁力 ----------
   core: 空隙のある環状鉄心に巻いたコイル。光点が磁束（速さ ∝ 磁束密度 B）
   force: 2本の平行導体。電流の向きで引き合う／反発する */
function buildMagnet(g){
  board(g, 5, 3);
  const core = new THREE.Group(); g.add(core);
  const ring = new THREE.Group(); core.add(ring); ring.position.set(0, 1.4, 0);
  const coil = new THREE.Group(); ring.add(coil);
  for (let i=0;i<14;i++){ const a = Math.PI*.55 + i*.065; const c = mesh(new THREE.TorusGeometry(.24,.025,6,16), M.copper, coil, Math.cos(a), Math.sin(a), 0);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), new THREE.Vector3(-Math.sin(a), Math.cos(a), 0)); }   // 巻線の輪の軸を鉄心の接線にそろえる
  const flux = new THREE.Group(); ring.add(flux);
  const fdots = []; for (let i=0;i<16;i++){ const d = mesh(new THREE.SphereGeometry(.05,8,8), RR.dotI, flux); d.castShadow = false; fdots.push(d); }
  const force = new THREE.Group(); g.add(force);
  const rodA = mesh(new THREE.CylinderGeometry(.06,.06,2.6,14), M.copper, force, -.6, 1.2, 0); rodA.rotation.x = Math.PI/2;
  const rodB = mesh(new THREE.CylinderGeometry(.06,.06,2.6,14), M.copper, force, .6, 1.2, 0); rodB.rotation.x = Math.PI/2;
  const cone = (parent, mat) => { const c = mesh(new THREE.ConeGeometry(.12,.3,14), mat, parent); return c; };
  const iA = cone(force, M.u), iB = cone(force, M.u), fA = cone(force, RR.dotI), fB = cone(force, RR.dotI);
  const rings = []; for (const x of [-.6,.6]) for (const r of [.3,.5]){ const o = new THREE.Mesh(new THREE.TorusGeometry(r,.008,4,40), RR.fieldD); o.position.set(x,1.2,0); force.add(o); rings.push(o); }
  Object.assign(g.userData, {core, ring, fdots, force, rodA, rodB, iA, iB, fA, fB, rings, T:0, coil});
  g.userData.labels = (st) => st.mView==='force' ? [
    {obj:rodA, t:'導体 1（電流 I₁）', c:'#C07A3A'},
    {obj:rodB, t:'導体 2（電流 I₂）', c:'#C07A3A'},
    {obj:fA, t:'導体に働く力（矢印の向き）', c:'#F0B57E'},
    {obj:rings[0], t:'導体のまわりの磁界（同心円）', c:'#FFD9B0'},
  ] : [
    {obj:ring, t:'環状鉄心（磁路長 30 cm・断面積 4 cm²）', c:'#6B7580'},
    {obj:coil, t:'コイル（巻数 N・電流 I）', c:'#C07A3A'},
    {obj:flux, t:'磁束 Φ（光点の数 ∝ B）', c:'#F0B57E'},
  ];
}
function animMagnet(g, t, st, dt){
  const u = g.userData, m = mgModel(); if (!st.paused) u.T += Math.max(0, dt);   // 最初のフレームは dt が負になりうる
  u.core.visible = st.mView!=='force'; u.force.visible = st.mView==='force';
  if (st.mView!=='force'){
    /* 鉄心は空隙の角度だけ欠いた円環。空隙は 0〜5 mm を 0〜0.5 rad に誇張 */
    const gapA = .04 + st.mGap*.09;
    if (u.ringKey !== gapA){ u.ringKey = gapA;
      if (u.torus){ u.ring.remove(u.torus); u.torus.geometry.dispose(); }
      u.torus = mesh(new THREE.TorusGeometry(1, .14, 14, 64, Math.PI*2 - gapA), RR.core, u.ring); u.torus.rotation.z = -Math.PI/2 + gapA/2; }
    /* 光点の数 ∝ 磁束密度 B（初期状態の B ≈ 0.39 T で 4 個、16 個まで）。速さは一定にして、数で比べる */
    const nB = m.B > 0 ? Math.max(1, Math.min(16, Math.round(4*m.B/.386))) : 0, gapA2 = u.ringKey;
    u.fdots.forEach((d, i) => { d.visible = i < nB; const a = -Math.PI/2 + gapA2/2 + (((u.T*.8 + i/Math.max(1, nB)*(Math.PI*2)) % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); d.position.set(Math.cos(a), Math.sin(a), .16); });
  } else {
    const s = st.fDir==='same' ? 1 : -1, gap = .3 + st.fR*4;
    u.rodA.position.x = -gap/2; u.rodB.position.x = gap/2;
    u.iA.position.set(-gap/2, 1.2, 1.45); u.iA.rotation.set(Math.PI/2, 0, 0);
    u.iB.position.set(gap/2, 1.2, s>0 ? 1.45 : -1.45); u.iB.rotation.set(s>0 ? Math.PI/2 : -Math.PI/2, 0, 0);
    const k = Math.max(.15, Math.min(2.4, m.f/2e-4*.8));    // 力の矢印の大きさ ∝ F（初期状態 2×10⁻⁴ N/m で 0.8）
    u.fA.position.set(-gap/2 + (s>0 ? .3 : -.3), 1.6, 0); u.fA.rotation.set(0, 0, s>0 ? -Math.PI/2 : Math.PI/2); u.fA.scale.setScalar(k);
    u.fB.position.set(gap/2 + (s>0 ? -.3 : .3), 1.6, 0); u.fB.rotation.set(0, 0, s>0 ? Math.PI/2 : -Math.PI/2); u.fB.scale.setScalar(k);
    u.rings.forEach((o, i) => { o.position.x = i < 2 ? -gap/2 : gap/2; });
  }
}

/* ---------- 3. 直流回路（ブリッジ・最大電力） ---------- */
function buildDC(g){
  board(g, 5.4, 3.2);
  const br = new THREE.Group(); g.add(br);
  const A = P3(-1.6,.25,0), B = P3(0,.25,-1.0), C = P3(0,.25,1.0), D = P3(1.6,.25,0);
  const leg = (p, q) => { const m = p.clone().lerp(q, .5), ang = Math.atan2(q.z - p.z, q.x - p.x);
    wr(p, q, br); return resistor(br, m.x, .25, m.z, .55, -ang); };
  const r1 = leg(A, B), r2 = leg(A, C), r3 = leg(B, D), r4 = leg(C, D);
  wr(B, C, br, M.copper, .015);
  const gal = dial(br, 0, .7, 0, .32); gal.rotation.x = -Math.PI/2.4;
  const bat = mesh(new THREE.BoxGeometry(.5,.5,.35), M.steelDark, br, 0, .35, -1.45);
  wr(A, P3(-1.6,.25,-1.45), br); wr(P3(-1.6,.25,-1.45), P3(-.25,.25,-1.45), br); wr(P3(.25,.25,-1.45), P3(1.6,.25,-1.45), br); wr(P3(1.6,.25,-1.45), D, br);
  const fb = rrPath(br, [B, C], 6, RR.dotI);
  const mp = new THREE.Group(); g.add(mp);
  const bat2 = mesh(new THREE.BoxGeometry(.5,.6,.4), M.steelDark, mp, -1.6, .4, 0);
  const rint = resistor(mp, -.7, .3, -.8, .5);
  const load = resistor(mp, 1.2, .3, 0, .6, Math.PI/2);
  const lamp = mesh(new THREE.SphereGeometry(.22,16,16), RR.lamp.clone(), mp, 1.2, .85, 0);
  const loop = [P3(-1.6,.3,-.8), P3(1.2,.3,-.8), P3(1.2,.3,.8), P3(-1.6,.3,.8)];
  for (let i=0;i<4;i++) wr(loop[i], loop[(i+1)%4], mp);
  const fm = rrPath(mp, loop, 12, RR.dotI, true);
  Object.assign(g.userData, {br, mp, gal, fb, fm, lamp, T:0});
  g.userData.labels = (st) => st.bView==='maxp' ? [
    {obj:bat2, t:'電源 E', c:'#3B5A73'}, {obj:rint, t:'内部抵抗 r', c:'#D9C7A0'}, {obj:load, t:'負荷抵抗 RL', c:'#D9C7A0'}, {obj:lamp, t:'負荷の電力（明るさ）', c:'#FFD060'},
  ] : [
    {obj:r1, t:'R1', c:'#D9C7A0'}, {obj:r2, t:'R2', c:'#D9C7A0'}, {obj:r3, t:'R3', c:'#D9C7A0'}, {obj:r4, t:'R4', c:'#D9C7A0'},
    {obj:gal, t:'検流計（平衡すると 0）', c:'#F4F1E8'}, {obj:bat, t:'電源 E', c:'#3B5A73'},
  ];
}
function animDC(g, t, st, dt){
  const u = g.userData; if (!st.paused) u.T += Math.max(0, dt);   // 最初のフレームは dt が負になりうる
  u.br.visible = st.bView!=='maxp'; u.mp.visible = st.bView==='maxp';
  if (st.bView!=='maxp'){
    const m = brModel(); u.gal.userData.needle.rotation.z = -Math.max(-1.2, Math.min(1.2, m.Ig*40));
    rrRun(u.fb, u.T*Math.sign(m.Ig)*Math.min(3, Math.abs(m.Ig)*80), Math.abs(m.Ig) > 1e-4 && !st.paused);
  } else {
    const m = mpModel(); u.lamp.material.emissiveIntensity = .2 + .8*Math.min(3, m.P/5);   // 明るさ ∝ P（初期状態の最大電力 5 W で 1、3 倍で頭打ち）。P/Pmax だと E を変えても変わらない
    rrRun(u.fm, u.T*Math.min(3, m.I), !st.paused);
  }
}

/* ---------- 4. 交流 RLC ---------- */
function buildAC(g){
  board(g, 5.4, 3.2);
  const src = mesh(new THREE.CylinderGeometry(.3,.3,.4,24), M.steelDark, g, -2.0, .35, 0);
  const ser = new THREE.Group(), par = new THREE.Group(); g.add(ser, par);
  const mkL = (parent, x, z) => { const o = new THREE.Group(); o.position.set(x,.3,z); parent.add(o);
    for (let i=0;i<7;i++){ const c = mesh(new THREE.TorusGeometry(.12,.025,6,14), M.copper, o, -.21 + i*.07, 0, 0); c.rotation.y = Math.PI/2; } return o; };
  const mkC = (parent, x, z) => { const o = new THREE.Group(); o.position.set(x,.3,z); parent.add(o);
    for (const dx of [-.05,.05]) mesh(new THREE.BoxGeometry(.03,.36,.3), RR.plate, o, dx, 0, 0); return o; };
  /* 直列: R → L → C が1本の輪 */
  const sR = resistor(ser, -.9, .3, -.8, .5), sL = mkL(ser, .2, -.8), sC = mkC(ser, 1.3, -.8);
  const sl = [P3(-2,.3,-.8), P3(1.9,.3,-.8), P3(1.9,.3,.8), P3(-2,.3,.8)];
  for (let i=0;i<3;i++) wr(sl[i], sl[i+1], ser);
  const fs = rrPath(ser, sl, 14, RR.dotI);
  /* 並列: 3本の枝 */
  const pR = resistor(par, .4, .3, -.9, .5), pL = mkL(par, .4, 0), pC = mkC(par, .4, .9);
  for (const z of [-.9,0,.9]){ wr(P3(-1.2,.3,z), P3(1.6,.3,z), par); }
  wr(P3(-1.2,.3,-.9), P3(-1.2,.3,.9), par); wr(P3(1.6,.3,-.9), P3(1.6,.3,.9), par); wr(P3(-2,.3,0), P3(-1.2,.3,0), par);
  const fp = [-.9,0,.9].map(z => rrPath(par, [P3(-1.2,.3,z), P3(1.6,.3,z)], 5, RR.dotI));
  Object.assign(g.userData, {ser, par, fs, fp, T:0});
  g.userData.labels = (st) => st.aConn==='parallel' ? [
    {obj:src, t:'交流電源 V・f', c:'#3B5A73'}, {obj:pR, t:'抵抗 R', c:'#D9C7A0'}, {obj:pL, t:'コイル L', c:'#C07A3A'}, {obj:pC, t:'コンデンサ C', c:'#B9C2CA'},
  ] : [

  const gun = mesh(new THREE.CylinderGeometry(.18,.25,.5,16), M.steelDark, g, -2.0, 1.2, 0); gun.rotation.z = Math.PI/2;
  const plates = new THREE.Group(); g.add(plates);

  const bfield = new THREE.Group(); g.add(bfield);
  for (let i=0;i<3;i++) for (let j=0;j<2;j++){ const d = mesh(new THREE.SphereGeometry(.035,8,8), RR.dotN, bfield, -1.2 + i*.6, .8 + j*.8, .5); }
  const screen = mesh(new THREE.BoxGeometry(.04,1.0,1.0), std({color:0x7fb069, emissive:0x2f6a20, emissiveIntensity:.6}), g, 2.2, 1.2, 0);
  const beam = []; for (let i=0;i<40;i++){ const d = mesh(new THREE.SphereGeometry(.03,6,6), RR.dotN, g); d.castShadow = false; beam.push(d); }
  Object.assign(g.userData, {plates, bfield, beam, T:0});
  g.userData.labels = (st) => st.zMode==='B' ? [
    {obj:gun, t:'電子銃（加速電圧 Va）', c:'#3B5A73'}, {obj:bfield, t:'一様な磁界 B（紙面から出る向き・点）', c:'#3572D6'}, {obj:screen, t:'蛍光面', c:'#7FB069'},
  ] : [
    {obj:gun, t:'電子銃（加速電圧 Va）', c:'#3B5A73'}, {obj:plates, t:'偏向板（電圧 Vd・上が＋）', c:'#B9C2CA'}, {obj:screen, t:'蛍光面', c:'#7FB069'},
  ];
}
function animElectron(g, t, st, dt){
  const u = g.userData, m = emModel(); if (!st.paused) u.T += Math.max(0, dt);   // 最初のフレームは dt が負になりうる
  const E = st.zMode!=='B'; u.plates.visible = E; u.bfield.visible = !E;
  /* 経路（模式）。電界: 偏向板の間で放物線、そのあと直進。磁界: 円弧（半径を見やすく縮尺） */
  const pts = [];
  if (E){
    /* 偏向板は中心から ±0.35 の位置に描いてあり、これが ±d/2。変位 y を同じ比で描き、d/2 に届いたら板で止める */
    const k = m.yf/(EM_DP/2)*.35, fHit = m.hit ? m.xHit/EM_LP : null;
    for (let i=0;i<=40;i++){ const x = -1.75 + i*3.9/40; let y = 0, f = (x + 1.1)/1.0;
      if (m.hit && f >= fHit){ pts.push([-1.1 + fHit, 1.2 + .35]); continue; }
      if (x > -1.1 && x <= -.1) y = k*f*f; else if (x > -.1) y = k + 2*k*(x + .1)/1.0;
      pts.push([x, 1.2 + Math.min(.5, y)]); }
  } else {
    const R = Math.max(.6, Math.min(30, m.r*20));        // 1 m を 20 単位に縮める（模式）
    for (let i=0;i<=40;i++){ const s = i*3.9/40, a = s/R; const x = -1.75 + R*Math.sin(Math.min(a, Math.PI/2)), y = R*(1 - Math.cos(Math.min(a, Math.PI/2)));
      pts.push([x, 1.2 + Math.min(.5, y)]); }
  }
  const ph = (u.T*2) % 1;
  u.beam.forEach((d, i) => { const j = Math.min(40, Math.floor((i/40 + ph/40)*40)); d.position.set(pts[j][0], pts[j][1], 0); });
}

/* 工場全景は「並んだ機器が全部入る距離」を実寸から計算する。
   手で決めると機器を足すたびに外す——実測で、5台の時点ですでに幅の狭い画面では
   パワエレが枠外に出ていた（気づかないまま公開していた）。
   camera.aspect は resize() の直後だけ信用できるので、そこから呼ぶ。 */
function fitOverview(){
  if (!groups[ORDER[0]]) return;
  const box = new THREE.Box3();
  for (const id of ORDER) box.expandByObject(groups[id]);

               ['y','板を出るときの変位 y = Vd·l²/(4d·Va)', m.hit ? '板に衝突（入口から '+f1(m.xHit*100,1)+' cm で変位が d/2 = 10 mm に届く）' : f1(m.yf*1e3,2)+' mm（l = 5 cm・d/2 = 10 mm まで）']])];
    note = state.zMode==='B' ? '※ 磁界の力（ローレンツ力 evB）は速度に垂直なので速さは変わらず、等速円運動。周期は速さによらない'
                             : '※ 電界の力 eE は一定なので、板の間では放物線（等加速度運動）。変位は Vd に比例し、加速電圧 Va に反比例。電子は板の中央から入るので、変位が板の間隔の半分に届くと板に当たる';
  }
  if (id==='meter'){
    const m = mtModel(), A = state.kType==='A';
    rows = A ? [['Rs','分流器 Rs = Ra/(n − 1)', isFinite(m.Rs) ? f1(m.Rs,4)+' Ω' : '不要（n = 1）'],
                ['range','測れる最大の電流', f1(m.range,0)+' mA'],
                ['Im','電流計そのものに流れる電流', f1(m.Im,2)+' mA（全体の 1/n）'],
                ['frac','針の振れ', f1(Math.min(m.frac,9.99)*100,0)+' %'+(m.frac > 1 ? '（振り切れ）' : '')]]
             : [['Rm','倍率器 Rm = (n − 1)·Rv', f1(m.Rm/1e3,1)+' kΩ'],
                ['range','測れる最大の電圧', f1(m.range,0)+' V'],
                ['Vm','電圧計そのものにかかる電圧', f1(m.Vm,2)+' V（全体の 1/n）'],
                ['frac','針の振れ', f1(Math.min(m.frac,9.99)*100,0)+' %'+(m.frac > 1 ? '（振り切れ）' : '')]];
    note = A ? '※ 電流計は回路に直列。分流器は電流計に並列につなぎ、(n − 1)/n の電流を逃がす。電流計の内部抵抗は小さいほど良い'
             : '※ 電圧計は回路に並列。倍率器は電圧計に直列につなぎ、(n − 1)/n の電圧を受け持つ。電圧計の内部抵抗は大きいほど良い';
  }
  /* 強調表示。いま見るべき行を明るく、ほかを薄くする（機械・電力の3D工場と同じ規則） */
  const sig = id+'|'+rows.map(r=>r[0]).join(',');
  if (rdState.tourText !== null){
    const t = rdState.tourText;
    rdState.hot = rows.filter(([k,l]) => { const name = String(l).replace(/<[^>]*>/g,'').split(/[（(]/)[0].trim();
      const tok = name.split(/[\s=:：]+/).filter(x => x.length >= 2);
      return name && (t.includes(name) || tok.some(x => t.includes(x))) || (rdState.tourKeys || []).includes(k); }).map(r=>r[0]);
  } else if (rdState.sig !== sig){ rdState.hot = [];
  } else {
    const ch = rows.filter(([k,,v]) => rdState.vals[k] !== undefined && rdState.vals[k] !== String(v)).map(r=>r[0]);
    if (ch.length) rdState.hot = ch;
  }
  rdState.sig = sig; rdState.tourText = null;
  rdState.vals = Object.fromEntries(rows.map(([k,,v]) => [k, String(v)]));
  const hot = new Set(rdState.hot);
  readoutEl.classList.toggle('has-hot', hot.size > 0);
  readoutEl.innerHTML = rows.map(([k,l,v])=>{ const c = hot.has(k) ? ' class="hot"' : ''; return '<dt data-k="'+k+'"'+c+'>'+l+'</dt><dd data-k="'+k+'"'+c+'>'+v+'</dd>'; }).join('')
    + (note? '<div class="rnote">'+note+'</div>' : '');
  drawMini(); syncCards();
}

/* ---------- 右パネルの小さな図 ---------- */
function drawMini(){
  const c = document.getElementById('mini'); if (!c) return;
  const ctx = c.getContext('2d'), W = c.width, H = c.height; ctx.clearRect(0,0,W,H);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim(), ink3 = css.getPropertyValue('--ink-3').trim(), acc = css.getPropertyValue('--accent').trim(),
        line = css.getPropertyValue('--line').trim(), steel = css.getPropertyValue('--steel').trim();
  ctx.font = '21px "JetBrains Mono", monospace'; ctx.lineWidth = 2.5;
  const L=60, R=W-20, T=24, B=H-44;
  const cap = document.getElementById('miniCap');
  const axes = () => { ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke(); };
  const curve = (xs, ys, col, dash=[]) => { const mx = Math.max(...ys.map(Math.abs), 1e-12), xmin = xs[0], xmax = xs[xs.length-1];
    ctx.strokeStyle=col; ctx.setLineDash(dash); ctx.beginPath(); xs.forEach((x,i) => { const px = L + (x - xmin)/(xmax - xmin)*(R-L), py = B - ys[i]/mx*(B-T); i? ctx.lineTo(px,py) : ctx.moveTo(px,py); }); ctx.stroke(); ctx.setLineDash([]);
    return {xOf: x => L + (x - xmin)/(xmax - xmin)*(R-L), yOf: y => B - y/mx*(B-T)}; };
  const dot = (x, y, col=acc) => { ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill(); };
  const bars = (items, unit) => {
    const mx = Math.max(...items.map(x=>x[1]), 1e-12), bw = (R-L)/items.length*.6;
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.stroke();
    items.forEach(([lab, v, col, txt], i) => { const x = L + (R-L)/items.length*(i+.2), h = v/mx*(B-T-24);
      ctx.fillStyle = col; ctx.fillRect(x, B-h, bw, h); ctx.fillStyle = ink; ctx.fillText(txt || (f1(v, v < 10 ? 2 : 0)+unit), x, B-h-8);
      ctx.fillStyle = ink3; ctx.fillText(lab, x, B+28); });
  };
  const id = state.current;
  if (id==='statics'){
    const m = esModel();
    bars([['空気中の E', m.Ea || 0, steel, m.Ea==null ? '—' : sci(m.Ea,1)], ['誘電体中の E', m.Ed || 0, acc, m.Ed==null ? '—' : sci(m.Ed,1)]], '');
    cap.textContent = '極板の間の電界の強さ。上下に積層すると、誘電率の小さい空気側の電界が強くなる（電束密度 D が共通で E = D/ε）。左右に分割・全体なら E = V/d で同じ。';
  } else if (id==='magnet' && state.mView!=='force'){
    const xs = [], ys = []; for (let i=0;i<=50;i++){ const lg = i/10; xs.push(lg); ys.push(state.mN*state.mI/(MG_L/(MU0*state.mMu*MG_A) + lg*1e-3/(MU0*MG_A))/MG_A); }
    axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.mGap), f.yOf(mgModel().B));
    ctx.fillStyle=ink3; ctx.fillText('空隙 0 mm', L, B+28); ctx.fillText('5 mm', R-60, B+28); ctx.fillText('B', L+8, T+16);
    cap.textContent = '空隙の長さと磁束密度 B。空隙が 0 から 1 mm 開くだけで B は大きく落ちる。空隙の磁気抵抗が鉄心より大きくなるため。点がいまの状態。';
  } else if (id==='magnet'){
    const xs = [], ys = []; for (let i=1;i<=50;i++){ const r = i/100; xs.push(r); ys.push(MU0*state.fI1*state.fI2/(2*Math.PI*r)); }
    axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.fR), f.yOf(mgModel().f));
    ctx.fillStyle=ink3; ctx.fillText('r = 1 cm', L, B+28); ctx.fillText('50 cm', R-80, B+28); ctx.fillText('F', L+8, T+16);
    cap.textContent = '導体の間隔 r と 1 m あたりの力 F。F は r に反比例する（2乗ではない）。点がいまの間隔。';
  } else if (id==='dc' && state.bView==='maxp'){
    const xs = [], ys = []; for (let i=1;i<=60;i++){ const RL = i/2; xs.push(RL); ys.push(mpModel(RL).P); }
    axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.pRL), f.yOf(mpModel().P));
    ctx.setLineDash([5,5]); ctx.strokeStyle=ink3; ctx.beginPath(); ctx.moveTo(f.xOf(state.pr),T); ctx.lineTo(f.xOf(state.pr),B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ink3; ctx.fillText('RL = r', f.xOf(state.pr)+6, T+16); ctx.fillText('RL', R-40, B+28); ctx.fillText('P', L+8, T+16);
    cap.textContent = '負荷抵抗 RL と負荷の電力 P。破線（RL = r）で最大になる。点がいまの RL。';
  } else if (id==='dc'){
    const m = brModel();
    bars([['R1·R4', state.bR1*state.bR4, steel], ['R2·R3', state.bR2*state.bR3, acc]], ' Ω²');
    cap.textContent = '向かい合う辺の積を比べた棒。2本の高さがそろうと平衡し、検流計の電流が 0 になる。いまの検流計の電流は '+f1(m.Ig*1e3,3)+' mA。';
  } else if (id==='ac'){
    const xs = [], ys = []; for (let i=1;i<=100;i++){ const f = i*2; xs.push(f); ys.push(acModel(f).I); }
    axes(); const fc = curve(xs, ys, acc); dot(fc.xOf(state.aF), fc.yOf(acModel().I));
    const f0 = acModel().f0; ctx.setLineDash([5,5]); ctx.strokeStyle=ink3; ctx.beginPath(); ctx.moveTo(fc.xOf(f0),T); ctx.lineTo(fc.xOf(f0),B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ink3; ctx.fillText('f0', fc.xOf(f0)+6, T+16); ctx.fillText('2 Hz', L, B+28); ctx.fillText('200 Hz', R-90, B+28); ctx.fillText('I', L+8, T+16);
    cap.textContent = state.aConn==='parallel' ? '周波数と電源の電流。並列共振の f0（破線）で電流が最小になる。点がいまの周波数。'
                                               : '周波数と電流。直列共振の f0（破線）で電流が最大になる。R を小さくすると山が鋭くなる（Q が大きい）。点がいまの周波数。';
  } else if (id==='transient'){
    const xs = [], ys = []; for (let i=0;i<=100;i++){ const k = i/20; xs.push(k); const m = trModel(k); ys.push(state.tType==='rc' ? m.x : Math.abs(m.i)); }
    axes(); const f = curve(xs, ys, acc); const m = trModel(); dot(f.xOf(state.tK), f.yOf(state.tType==='rc' ? m.x : Math.abs(m.i)));
    ctx.setLineDash([5,5]); ctx.strokeStyle=ink3; ctx.beginPath(); ctx.moveTo(f.xOf(1),T); ctx.lineTo(f.xOf(1),B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ink3; ctx.fillText('τ', f.xOf(1)+6, T+16); ctx.fillText('0', L, B+28); ctx.fillText('5τ', R-40, B+28); ctx.fillText(state.tType==='rc' ? 'vC' : '|i|', L+8, T+16);
    cap.textContent = 'スイッチを操作してからの変化。破線が t = τ で、ここで変化全体の 63.2 % が済む。5τ でほぼ終わる。点がいまの時刻。';
  } else if (id==='three'){
    /* 相電圧（細）と線間電圧（太）のフェーザ。Y では線間が √3 倍・30° 進み */
    const cx = (L+R)/2, cy = (T+B)/2, sc = (B-T)/2*.9/Math.sqrt(3);
    const arr = (ang, len, col, w) => { ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+len*Math.cos(ang), cy-len*Math.sin(ang)); ctx.stroke(); };
    const Y = state.hConn==='Y';
    for (let k=0;k<3;k++){ const a = Math.PI/2 - k*2*Math.PI/3; arr(a, sc, steel, 2.5); arr(a + (Y ? 1 : -1)*Math.PI/6, sc*Math.sqrt(3), acc, 3.5); }
    ctx.lineWidth = 2.5; ctx.fillStyle=ink3; ctx.fillText(Y ? '相電圧（細）' : '相電流（細）', L, B+28); ctx.fillText(Y ? '線間電圧（太）' : '線電流（太）', R-170, B+28);
    cap.textContent = Y ? 'Y 結線の電圧のフェーザ。線間電圧（太）は相電圧（細）の √3 倍で、30° 進む。電流は線と相で同じ。'
                        : 'Δ 結線の電流のフェーザ。線電流（太）は相電流（細）の √3 倍で、30° 遅れる。電圧は線間と相で同じ。';
  } else if (id==='elec' && state.xView==='diode'){
    const xs = [], ys = []; for (let i=0;i<=120;i++){ const th = i/120*4*Math.PI; xs.push(th); const v = Math.sin(th); ys.push(state.xRect==='half' ? Math.max(0, v) : Math.abs(v)); }
    axes(); curve(xs, ys, acc); const avg = state.xRect==='half' ? 1/Math.PI : 2/Math.PI;
    ctx.setLineDash([5,5]); ctx.strokeStyle=ink3; ctx.beginPath(); ctx.moveTo(L, B - avg*(B-T)); ctx.lineTo(R, B - avg*(B-T)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ink3; ctx.fillText('平均 '+(state.xRect==='half' ? 'Vm/π' : '2Vm/π'), R-180, B - avg*(B-T) - 8);
    cap.textContent = '出力の波形（2周期）。破線が平均値。半波は負の半周期が捨てられて Vm/π、全波は折り返して 2Vm/π。';
  } else if (id==='elec' && state.xView==='tr'){
    /* 直流負荷線と動作点 */
    const Vcc = state.xVcc, Icmax = Vcc/(state.xRc*1e3), m = elModel(), xOf = v => L + v/Vcc*(R-L), yOf = i => B - i/Icmax*(B-T);
    axes(); ctx.strokeStyle=acc; ctx.beginPath(); ctx.moveTo(xOf(0), yOf(Icmax)); ctx.lineTo(xOf(Vcc), yOf(0)); ctx.stroke();
    dot(xOf(m.Vce), yOf(m.Ic)); ctx.fillStyle=ink3; ctx.fillText('VCE', R-60, B+28); ctx.fillText('IC', L+8, T+16); ctx.fillText('VCC', xOf(Vcc)-50, B-8);
    cap.textContent = '直流負荷線 IC = (VCC − VCE)/RC と動作点。RB を小さくするとベース電流が増え、動作点が左上へ動き、端に着くと飽和する。';
  } else if (id==='elec'){
    const xs = [], ys = []; const G = elModel().G; for (let i=0;i<=80;i++){ const v = -2 + i/20; xs.push(v); ys.push(Math.max(-VSAT, Math.min(VSAT, G*v)) + VSAT); }
    axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.xVi), f.yOf(elModel().Vo + VSAT));
    ctx.fillStyle=ink3; ctx.fillText('Vi −2 V', L, B+28); ctx.fillText('+2 V', R-60, B+28); ctx.fillText('Vo', L+8, T+16);
    cap.textContent = '入力 Vi と出力 Vo（縦の中央が 0 V）。傾きが増幅度で、±13 V で頭打ちになる。反転増幅は右下がり、非反転は右上がり。';
  } else if (id==='electron'){
    const m = emModel();
    if (state.zMode==='B'){ const xs = [], ys = []; for (let i=1;i<=50;i++){ const b = i/10; xs.push(b); ys.push(ME*m.v/(QE*b*1e-3)*100); }
      axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.zB), f.yOf(m.r*100)); ctx.fillStyle=ink3; ctx.fillText('B 0.1 mT', L, B+28); ctx.fillText('5 mT', R-70, B+28); ctx.fillText('r', L+8, T+16);
      cap.textContent = '磁束密度 B と円運動の半径 r。r は B に反比例し、速さ v（√Va）に比例する。'; }
    else { const xs = [], ys = []; for (let i=1;i<=50;i++){ const va = i*100; xs.push(va); ys.push(state.zVd*EM_LP*EM_LP/(4*EM_DP*va)*1e3); }
      for (let i=0;i<ys.length;i++) ys[i] = Math.min(ys[i], 14);   // 目盛を見やすく（14 mm で頭打ち）
      axes(); const f = curve(xs, ys, acc); dot(f.xOf(state.zVa), f.yOf(Math.min(14, m.yf*1e3)), m.hit ? '#D24A43' : acc);
      ctx.setLineDash([5,5]); ctx.strokeStyle=ink3; ctx.beginPath(); ctx.moveTo(L, f.yOf(10)); ctx.lineTo(R, f.yOf(10)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=ink3; ctx.fillText('Va 100 V', L, B+28); ctx.fillText('5000 V', R-90, B+28); ctx.fillText('y', L+8, T+16); ctx.fillText('板に衝突', R-110, f.yOf(10)-6);
      cap.textContent = '加速電圧 Va と偏向板を出るときの変位 y。速い電子ほど板の間にいる時間が短く、曲がりにくい（y ∝ 1/Va）。破線（d/2 = 10 mm）より上は板に当たって出てこない。'; }
  } else if (id==='meter'){
    const m = mtModel(), A = state.kType==='A';
    bars([[A ? '電流計' : '電圧計', 1/state.kN, acc, f1(100/state.kN,1)+' %'], [A ? '分流器' : '倍率器', 1 - 1/state.kN, steel, f1(100 - 100/state.kN,1)+' %']], '');
    cap.textContent = A ? '電流の分け方。電流計には全体の 1/n だけが流れ、残りを分流器が逃がす。' : '電圧の分け方。電圧計には全体の 1/n だけがかかり、残りを倍率器が受け持つ。';
  }
}

/* カードは理論の3D工場では使わない（機械の3D工場と同じ枠組みを保つための空の定義） */
const CARD_BODY = {};
function cardBody(k){ return CARD_BODY[k] || ''; }
function bindCards(){ syncCards(); }
function syncCards(){
  const vn = document.getElementById('viewnote'); if (!vn) return;
  const N = {

    magnet: () => state.mView==='force' ? 'いま見ているのは<b>平行導体間の力</b>。' : 'いま見ているのは<b>磁気回路</b>（空隙つき環状鉄心）。',

    elec: () => ({diode:'いま見ているのは<b>整流</b>。', tr:'いま見ているのは<b>トランジスタの直流動作点</b>。', op:'いま見ているのは<b>オペアンプ</b>（理想）。'})[state.xView],

/* ---------- 比べる（原因 → 結果を、基準の値と並べて操作帯の先頭に出す） ----------
   3D に重ねると、スマホでは誇張した 3D（間隔・力線・粒）が隠れる。だから 3D のすぐ下の操作帯に置く。
   読み値の表だけでは「何が何倍になったか」が見えず、動かすと前の値も消える。
   そこで基準（実験台に入ったとき・ツアーの歩を当てたとき・「いまを基準にする」を押したとき）を覚えておき、
   変えた原因と、変わった結果を「基準 → 今」の棒と倍率で並べる。
   予想クイズの答え合わせでは、答え合わせの状態を基準にする（クイズの前提は問ごとに違い、初期状態と比べると答えと違う比が出るため）。
   棒は行ごとに、基準と今の大きいほうを全幅にする（2本を同じ物差しで比べるため）。 */
const CAUSAL = {
  statics: {
    inputs: [
      ['eMode', '電源', v => v==='v' ? 'つないだまま' : '切り離した'],
      ['eFill', '誘電体', v => ({none:'なし', full:'全体', stack:'上下に積層', split:'左右に分割'})[v]],
      ['eEr', '比誘電率 εr', v => f1(v,1), 1],
      ['eD', '間隔 d', v => f1(v,1)+' mm', 1],
      ['eV', '充電電圧', v => v+' V', 1],
    ],
    /* 電界は上の層・下の層（積層では下が誘電体）の2つで持つ。基準と今の両方で2つが等しければ
       「電界 E」1行にまとめる（誘電体を入れても電界は「なくなる」わけではない）。
       積層が絡むときは層ごとに比べる（基準の空気層とだけ比べると、下の層の増加が隠れる） */
    outs: () => { const m = esModel(), st = state.eFill==='stack';
      const Eu = st ? m.Ea : (m.Ea ?? m.Ed), El = st ? m.Ed : (m.Ea ?? m.Ed);
      return [['C', '静電容量 C', m.C], ['Q', '電荷 Q', m.Q], ['V', '電圧 V', m.V],
        ['Eu', st ? 'E（上の層・空気）' : 'E（上半分）', Eu, null, 'E'], ['El', st ? 'E（下の層・誘電体）' : 'E（下半分）', El, null, 'E'],
        ['W', 'エネルギー W', m.W]]; },

let causalBase = null, causalHidden = false, causalEl = null;
/* inputs の値で outs を計算する（state を一時的に差し替えて戻す）。切り離しの電荷は本文の前提（空気で充電）で計算する */
function causalSnap(id, inputs){
  const keep = {}, keepC = esCchg;
  for (const k in inputs){ keep[k] = state[k]; state[k] = inputs[k]; }
  esCchg = null;
  const outs = CAUSAL[id].outs();
  Object.assign(state, keep); esCchg = keepC;
  return {inputs: {...inputs}, outs};
}
const causalLive = id => Object.fromEntries(CAUSAL[id].inputs.map(([k]) => [k, state[k]]));
function causalReset(fromInit){
  const id = state.current;
  if (!CAUSAL[id]){ causalBase = null; return; }
  causalBase = fromInit ? {id, ...causalSnap(id, CAUSAL_INIT[id])} : {id, inputs: causalLive(id), outs: CAUSAL[id].outs()};
  causalBase.ctx = (CAUSAL[id].ctx || []).map(k => state[k]).join('|');
}
/* 倍率を試験の言い方に寄せる: 2 倍・1/4 倍・そのまま。きれいな比でなければ小数 */
function ratioText(r){
  if (!isFinite(r)) return '—';
  r *= 1 + 1e-12;   // 0.375 が 0.37499… になって行ごとに丸めが分かれないように
  if (Math.abs(r - 1) < .001) return 'そのまま';
  const near = (x, half) => { for (const k of [2,3,4,5,6,8,9,10,16,25]) if (Math.abs(x - k) < .002*k) return k; if (half) for (const k of [1.5,2.5]) if (Math.abs(x - k) < .002*k) return k; return null; };   // 0.2 % 以内だけを「きれいな比」と言う
  const dg = Math.abs(r - 1) < .01 ? 3 : 2;   // 1 % 未満の変化は 3 桁で出す（「1.00 倍 ↓」では向きしか読めない）
  if (r < .1 || r > 100) return Number(r.toPrecision(2)).toLocaleString('ja-JP', {maximumSignificantDigits:2}) + ' 倍';   // 「0.00 倍」にしない（有効数字 2 桁）
  if (r > 1){ const k = near(r, true); return (k ? k : f1(r, dg)) + ' 倍'; }
  const k = near(1/r, false); return k ? '1/' + k + ' 倍' : f1(r, dg) + ' 倍';   // 1/2.5 のような分母は書かない
}
function renderCausal(){
  const id = state.current;
  if (!causalEl){
    causalEl = document.createElement('div'); causalEl.className = 'causal'; causalEl.setAttribute('aria-live', 'polite');
  }
  if (causalEl.parentNode !== ctrlbar) ctrlbar.prepend(causalEl);   // buildCtrl が操作帯を作り直すたびに外れるので付け直す
  const c = CAUSAL[id];
  if (!c){ causalEl.hidden = true; return; }
  causalEl.hidden = false;
  const ctxSig = () => (c.ctx || []).map(k => state[k]).join('|');
  if (!causalBase || causalBase.id !== id || causalBase.ctx !== ctxSig()) causalReset();
  if (causalHidden){
    causalEl.innerHTML = '<button class="cz-show">比べる表示を出す</button>';
    causalEl.querySelector('.cz-show').onclick = () => { causalHidden = false; renderCausal(); };
    return;
  }
  const base = causalBase, nowIn = causalLive(id), now = c.outs();
  /* 原因に数えるのは、今の操作帯に出ているつまみだけ（見る対象と関係の無いつまみを原因に挙げない） */
  const live = new Set([...ctrlbar.querySelectorAll('[data-key]')].map(e => e.dataset.key));
  const changed = c.inputs.filter(([k]) => live.has(k) && nowIn[k] !== base.inputs[k]);
  const cause = changed.map(([k, lab, fmt, num]) => {
    const a = base.inputs[k], b = nowIn[k];
    return `<b>${lab}</b> ${fmt(a)} → ${fmt(b)}` + (num && a && b && Math.sign(a) === Math.sign(b) ? `（${ratioText(b/a)}）` : '');   // 0 や符号の変わる変化には倍率を付けない
  }).join('、');
  const rows = [], same = [];
  const baseOf = (k, alts) => { for (const key of [k, ...(alts || [])]){ const r = base.outs.find(x => x[0] === key); if (r) return r[2]; } return null; };
  /* 5 番目が同じ行どうし（上の層・下の層の電界）は、基準でも今でも値が等しければ1行にまとめる */
  const eqv = (a, b) => a == null ? b == null : b != null && Math.abs(a - b) <= 1e-9*Math.abs(a);
  const merged = new Set();
  for (const g of new Set(now.map(x => x[4]).filter(Boolean))){
    const ns = now.filter(x => x[4] === g), bs = base.outs.filter(x => x[4] === g);
    if (ns.length > 1 && ns.every(x => eqv(x[2], ns[0][2])) && bs.every(x => eqv(x[2], bs[0][2]))) merged.add(g);
  }
  const shown = [];
  for (const x of now){
    if (x[4] && merged.has(x[4])){ if (!shown.some(y => y[0] === x[4])) shown.push([x[4], '電界 E', x[2], [x[0]]]); }
    else shown.push(x);
  }
  shown.forEach(([k, lab, v, alts, , eps]) => {
    const b0 = baseOf(k, alts);
    if (v == null && b0 == null) return;
    /* eps: 計算誤差で 0 にならない量（平衡の電流など）の絶対の許容。行の 6 番目に書く */
    const fin = x => isFinite(x) ? Math.abs(x || 0) : 0;   // ∞ は棒の物差しに入れない（今の棒は全幅で描く）
    const mx = Math.max(fin(b0), fin(v)) || 1, zero = x => Math.abs(x) <= Math.max(1e-9*mx, eps || 0);
    let txt, dir;
    if (b0 === Infinity || v === Infinity){ if (b0 === v){ same.push(lab); return; } txt = v === Infinity ? '∞ に ↑' : '∞ から ↓'; dir = v === Infinity ? 'up' : 'down'; }
    else if (b0 == null || v == null){ if (v == null){ txt = 'なくなる'; dir = 'down'; } else { txt = '新たに'; dir = 'up'; } }
    else if (zero(b0) && zero(v)){ same.push(lab); return; }
    else if (zero(b0)){ txt = '0 から ↑'; dir = 'up'; }
    else if (zero(v)){ txt = '0 になる ↓'; dir = 'down'; }
    else if (Math.sign(v) !== Math.sign(b0)){ const r = Math.abs(v/b0); txt = '向きが逆' + (Math.abs(r - 1) < .001 ? '' : '・' + ratioText(r)); dir = r >= 1 ? 'up' : 'down'; }
    /* 0.1 % 以内だけを「変わらない」と言う */
    else { const r = v/b0; if (Math.abs(r - 1) < .001){ same.push(lab); return; } dir = r > 1 ? 'up' : 'down'; txt = ratioText(r) + (dir === 'up' ? ' ↑' : ' ↓'); }
    rows.push(`<div class="cz-row"><span class="cz-lab">${lab}</span>`
      + `<span class="cz-bar"><i class="cz-was" style="width:${b0 === Infinity ? 100 : (fin(b0)/mx*100).toFixed(1)}%"></i><i class="cz-now ${dir}" style="width:${v === Infinity ? 100 : (fin(v)/mx*100).toFixed(1)}%"></i></span>`
      + `<span class="cz-r ${dir}">${txt}</span></div>`);
  });
  causalEl.innerHTML = `<div class="cz-head"><span>基準と比べる</span><button class="cz-reset" title="いまの状態を新しい基準にする">いまを基準に</button><button class="cz-hide" aria-label="比べる表示を隠す">×</button></div>`
    + (changed.length
      ? `<p class="cz-cause">${cause}</p><div class="cz-rows">${rows.join('')}</div>`
        + (same.length ? `<p class="cz-same">変わらない: ${same.join('・')}</p>` : '')
      : `<p class="cz-cause">つまみを動かすと、ここに「基準 → 今」で何が何倍になったかが並ぶ。</p>`)
    + `<p class="cz-note"><span class="cz-key">灰の棒＝基準、色の棒＝今（橙は増、青は減）。</span>${typeof c.note === 'function' ? c.note() : c.note}</p>`;
  causalEl.querySelector('.cz-reset').onclick = () => { causalReset(); renderCausal(); };
  causalEl.querySelector('.cz-hide').onclick = () => { causalHidden = true; renderCausal(); };
}

  const m = MACHINES[id], st = STUDY[id];
  const qs = KAKOMON.filter(q=>q.p===id && q.v!==0);
  const older = KAKOMON.filter(q=>q.p===id && q.v===0).reverse();   // 新しい回から
  const bySec = {}; for (const q of qs) (bySec[q.sec] ||= []).push(q);
  const secOrder = m.sections.map(x=>x[0]);
  const extraSecs = Object.keys(bySec).filter(x=>!secOrder.includes(x));
  const secLabel = x => (m.sections.find(y=>y[0]===x)||[])[1] || x;
  /* 節 → その論点を動かして見せるツアーの歩。過去問の側から3Dへ戻る道 */
  const tourBySec = {}; st.tour.forEach((x,k)=>{ if (x.sec && !(x.sec in tourBySec)) tourBySec[x.sec] = k; });
  /* 過去問1問 → その問題を名指ししているツアーの歩 */
  const stepByQ = {}; st.tour.forEach((x,k)=>{ for (const qid of (x.q||[])) if (!(qid in stepByQ)) stepByQ[qid] = k; });
  const charts = `<canvas class="mini" id="mini" width="700" height="300"></canvas><p class="mini-cap" id="miniCap"></p>`;
  panel.innerHTML = `
    <div class="kicker">${esc(m.kicker)}</div>
    <h2><span class="num">${m.num}</span>${m.title}</h2>
    <div class="oneliner"><small>30秒理解</small>${esc(st.oneLiner)}</div>
    <p class="lead">${esc(m.lead)}</p>
    <p class="viewnote" id="viewnote"></p>

    <h3>電験で狙われるポイント</h3>
    <ul class="exam">${st.exam.map(([n,f,w])=>`<li><span class="en">${esc(n)}</span><span class="ef">${esc(f)}</span><span class="ew">${mark(w)}</span></li>`).join('')}</ul>

    <h3>予想してから動かす</h3>
    <ol class="quiz" id="quiz">${st.predict.map((p,i)=>`
      <li data-q="${i}">
        <div class="qq"><span class="qn">Q${i+1}</span><span>${esc(p.q)}</span></div>
        <div class="qopts">${p.opts.map((o,k)=>`<button data-o="${k}"><span class="mk">${'アイウエ'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div class="qfb" hidden></div>
      </li>`).join('')}</ol>

    ${charts}

    <h3>見どころツアー <span style="font-family:var(--font-mono);font-weight:400">${st.tour.length}歩</span></h3>
    <div class="tour" id="tour"></div>

    <h3>見えているもの</h3>
    <ul class="parts">${m.parts.map(([c,n,d])=>`<li><span class="sw" style="background:${c}"></span><div><b>${esc(n)}</b>${d?`<br><span>${mark(d)}</span>`:''}</div></li>`).join('')}</ul>

    <h3>もう一歩</h3>
    <div class="cards" id="cards">${(st.cards||[]).map(k=>`<details data-card="${k}"><summary>${esc(CARDS[k].t)}</summary><div class="cbody">${cardBody(k)}</div></details>`).join('')}</div>

    <h3>即答チェック</h3>
    <ul class="check">${st.check.map(([q,a])=>`<li><details><summary>${esc(q)}</summary><p>${esc(a)}</p></details></li>`).join('')}</ul>

    <h3>次にやること</h3>
    <div class="steps">
      <div class="here"><span class="sn">1</span><span>3Dで構造と動きを確かめる<small>いま見ているところ</small></span></div>
      <a href="${wikiUrl(m.page)}" target="_blank" rel="noopener"><span class="sn">2</span><span>理論Wikiで式と例題を確認 ↗<small>数値・導出・解説はWikiが正本</small></span></a>
      <a href="${wikiUrl('reuse-ranking')}" target="_blank" rel="noopener"><span class="sn">3</span><span>再出題ランキングで頻出テーマを見る ↗<small>解けたら1へ戻る</small></span></a>
    </div>

    <h3>Wikiの節へ</h3>
    <ul class="secs">${m.sections.map(([x,l,why])=>`<li><a href="${secUrl(id,x)}" target="_blank" rel="noopener"><span>${esc(l)}</span><span class="cnt">${bySec[x]? '過去問 '+bySec[x].length : ''}</span><span class="why">${mark(why)}</span></a></li>`).join('')}</ul>

    <h3>この理解を使う過去問 <span style="font-family:var(--font-mono);font-weight:400">${qs.length}問</span></h3>
    ${[...secOrder.filter(x=>bySec[x]), ...extraSecs].map(x=>`
      <div class="secgroup"><span>${esc(secLabel(x))}</span>${tourBySec[x]!=null ? `<button data-step="${tourBySec[x]}">3Dで見る →</button>` : ''}</div>
      <ul class="kak">${bySec[x].map(q=>`<li><span class="id">${q.s} 問${q.c}</span><span><a href="${secUrl(id,x)}" target="_blank" rel="noopener">${esc(q.t)}</a>${stepByQ[q.s+'/'+q.c]!=null ? `<button class="k3d" data-step="${stepByQ[q.s+'/'+q.c]}" title="この論点を3Dで見る">3D</button>` : ''}</span></li>`).join('')}</ul>`).join('')}
    ${older.length ? `<details class="older"><summary>H18〜R2 の同じ機器（${older.length}問・題名索引のみ／一次照合未了）</summary>
      <ul class="kak">${older.map(q=>`<li><span class="id">${q.s} 問${q.c}</span><span><a href="${secUrl(id,q.sec)}" target="_blank" rel="noopener">${esc(q.t)}</a>${stepByQ[q.s+'/'+q.c]!=null ? `<button class="k3d" data-step="${stepByQ[q.s+'/'+q.c]}" title="この論点を3Dで見る">3D</button>` : ''}</span></li>`).join('')}</ul>
      <p class="note">解説サイトの題名を索引として写したもので、問題冊子では確かめていない。上の件数には入れていない。</p></details>` : ''}
    <div class="note">過去問の行をクリックすると、その論点のWikiの節が開く。解説・答えはWiki側。ここは形と動きを見る場所。</div>`;
  bindQuiz(st);
  bindCards();
  panel.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
    tourStep = +b.dataset.step; renderTour();
    document.getElementById('tour').scrollIntoView({behavior: reduced?'auto':'smooth', block:'center'});
  });
  tourStep = 0; renderTour(false);
  drawMini();
}

/* 見えているものの説明だけ **強調** を許す（本文の意味は変えず、条件語を目立たせるため） */
function mark(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--ink)">$1</b>'); }

/* ---------- 予想 → 操作 → 確認 ----------
   選ぶ前に答えを見せない。選んだ瞬間に 3D と操作帯を実際にその状態へ動かし、
   どの読み値の話かを光らせる。式の暗記を「見た動き」に結び直すのが狙い。 */
function bindQuiz(st){
  const box = document.getElementById('quiz'); if (!box) return;
  box.querySelectorAll('li[data-q]').forEach(li=>{
    const qi = +li.dataset.q, item = st.predict[qi];
    const fb = li.querySelector('.qfb');
    const btns = [...li.querySelectorAll('.qopts button')];
    const answer = (k)=>{
      const ok = k === item.ans;
      btns.forEach((b,bi)=>{ b.disabled = true;
        if (bi === item.ans) b.classList.add('ok');
        else if (bi === k) b.classList.add('ng');
        else b.classList.add('dim'); });
      li.classList.add('done');
      fb.hidden = false;
      fb.innerHTML = '<span class="verdict '+(ok?'ok':'ng')+'">'+(ok?'正解':'惜しい')+'</span>'+esc(item.why)
        + '<br><button class="again">もう一度やる</button>';
      fb.querySelector('.again').onclick = ()=>{
        btns.forEach(b=>{ b.disabled=false; b.classList.remove('ok','ng','dim'); });
        li.classList.remove('done'); fb.hidden = true; fb.innerHTML='';
      };
      if (item.set){ Object.assign(state, item.set); onSetApplied(item.set, true); }   // クイズは初期状態からの変化として書いてあるので、初期状態を基準にする
      refreshCtrl(); openMoreFor(item.set, item.q);
      litReadout(item.hi);
    };
    btns.forEach((b,k)=>b.onclick = ()=>answer(k));
  });
}

let tourStep = 0;
function renderTour(apply=true){
  const box = document.getElementById('tour'); if (!box || !state.current) return;
  const steps = STUDY[state.current].tour; const i = tourStep; const stp = steps[i];
  const qs = (stp.q || []).map(k => QID.get(k)).filter(Boolean);
  box.innerHTML = `<div class="step">${i+1} / ${steps.length}</div><h4>${esc(stp.t)}</h4>
    <dl class="tsteps">
      <div><dt>操作</dt><dd>${esc(stp.op)}</dd></div>
      <div><dt>画面</dt><dd>${esc(stp.see)}</dd></div>
      <div><dt>だから</dt><dd>${esc(stp.so)}</dd></div>
    </dl>
    ${qs.length ? `<div class="tq"><span class="cap">関連する過去問（リンク先は、その問を引用している Wiki の節）</span>${qs.map(q=>`<a href="${secUrl(q.p,q.sec)}" target="_blank" rel="noopener"><span class="id">${q.s} 問${q.c}${q.v===0 ? '・未照合' : ''}</span><span>${esc(q.t)}</span></a>`).join('')}</div>` : ''}
    <div class="nav"><button id="tPrev" ${i===0?'disabled':''}>← 前</button><button id="tNext" ${i===steps.length-1?'disabled':''}>次 →</button><button id="tApply">この状態にする</button><div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div></div>`;
  box.querySelector('#tPrev').onclick=()=>{ tourStep=Math.max(0,tourStep-1); renderTour(); };
  box.querySelector('#tNext').onclick=()=>{ tourStep=Math.min(steps.length-1,tourStep+1); renderTour(); };
  box.querySelector('#tApply').onclick=()=>applyStep(stp);
  if (apply) applyStep(stp);
}
function applyStep(stp){
  Object.assign(state, stp.set || {}); onSetApplied(stp.set);   // ツアーの歩の出発状態を、比べる表示の基準にする
  rdState.tourText = [stp.op, stp.see, stp.so].join(' ');
  rdState.tourKeys = stp.hi || [];
  /* 先に操作帯と凡例を作り直してから指す。逆順だと、回路や見る対象を切り替える歩で
     rebuildLabels が指した行を消してしまい、focus が黙って外れる */
  refreshCtrl(); openMoreFor(stp.set, stp.op);
  focusByName(stp.focus || null);
}

/* ---------- ミニ図（右パネルの曲線。形だけの模式図） ---------- */
const backBtn = document.getElementById('backbtn');
backBtn.onclick = ()=>select(null);
function select(id){
  state.current = id; causalReset();
  backBtn.classList.toggle('hidden', !id);
  if (reduced){ const v = VIEWS[id||'overview']; cam.target.set(...v.target); cam.dist=v.dist; cam.theta=v.theta; cam.phi=v.phi; cam.want=null; camShot = null; }
  else flyTo(VIEWS[id||'overview']);
  focusReq = undefined; frameWait = null; camPart = null;
  _lastSig = id ? ctrlSig() : null;
  renderChips(); buildCtrl(); renderPanel(); rebuildLabels();
  panel.scrollTop = 0;
  try { history.replaceState(null, '', id ? '#'+id : location.pathname); } catch (e) {}
}

/* ---------- ループ ---------- */
/* 描画する画素数に上限を置く。高DPIの大画面では w*h*dpr² が1千万画素を超え、
   操作に対する反応が目に見えて鈍る（実測: 2560x1300 で 2fps、負荷を落とすと 21fps）。
   スマホのように面積が小さいときは上限に当たらないので画質はそのまま。 */
const PIXEL_CAP = 2.6e6;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const pr = Math.max(0.75, Math.min(devicePixelRatio || 1, 2, Math.sqrt(PIXEL_CAP / (w * h))));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  /* 画面の形が変われば入る距離も変わる。全景を見ているときだけ組み直す
     （機器に寄っているときに引ったくらない） */
  fitOverview();
  if (!state.current) flyTo(VIEWS.overview);
}
/* resize は連続で飛んでくるので1フレームにまとめる */
let rzPending=false;
addEventListener('resize', ()=>{ if(rzPending) return; rzPending=true; requestAnimationFrame(()=>{ rzPending=false; resize(); }); });
resize();
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; const t = now/1000;
  if (cam.want){ const k = 1 - Math.pow(.001, dt); cam.target.lerp(cam.want.target, k); cam.dist += (cam.want.dist-cam.dist)*k; cam.theta += (cam.want.theta-cam.theta)*k; cam.phi += (cam.want.phi-cam.phi)*k; if (cam.target.distanceTo(cam.want.target)<.01 && Math.abs(cam.dist-cam.want.dist)<.01 && Math.abs(cam.theta-cam.want.theta)<.01 && Math.abs(cam.phi-cam.want.phi)<.01) cam.want=null; }
  applyCam();
  /* 1つの設備に寄っているあいだ、ほかの設備は動かさない（見えないものを毎フレーム計算しない）。
     カメラが移動中は全景が見えうるので全機動かす。 */
  const only = (!cam.want && state.current) ? state.current : null;
  for (const id of ORDER) if (!only || id === only) animators[id](groups[id], t, state, dt);
  if (focusReq !== undefined && state.current) resolveFocus();
  else if (frameWait && state.current) frameTick();
  hlMat.opacity = .62 + .3*Math.sin(t*4.5);
  renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(loop);
}
const initial = location.hash.replace('#','');
select(MACHINES[initial] ? initial : null);
requestAnimationFrame(loop);
</script>
