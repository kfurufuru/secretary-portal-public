    note='※ 基準容量 Pb = 10 MVA。容量の違う %Z は基準をそろえてから足す（自己容量より大きい基準にすると %Z も大きくなる）。CT は二次開放禁止、VT は二次短絡禁止';
  }
  if (id==='kakuu-souden'){
    if (state.tView==='sag'){
      const m = tdSag();
      rows=[['D','たるみ D = W·S²/(8T)', f1(m.D,2)+' m'],
            ['L','電線の実長 L = S + 8D²/(3S)', f1(m.L,3)+' m（径間より '+f1((m.L - state.tS)*100,1)+' cm 長い）'],
            ['Lt','温度変化後の実長 L(1 + αΔt)', f1(m.Lt,3)+' m'],
            ['Dt','温度変化後のたるみ √(3S(L′−S)/8)', f1(m.Dt,2)+' m']];
      note='※ 3D のたるみは見やすく 10 倍に誇張。張力を 2 倍にするとたるみは 1/2、径間を 2 倍にすると 4 倍。温度が上がると電線が伸びてたるみが増える（張力の変化は無視）';
    } else {
      const m = tdElec(), m2 = tdElec(state.tV*2);
      rows=[['I','線電流 I = P/(√3·V·cosθ)', f1(m.I,0)+' A'],
            ['dV','電圧降下 √3·I(R cosθ + X sinθ)', f1(m.dV/1000,2)+' kV（'+f1(m.dVp,2)+' %）'],
            ['loss','送電損失 3I²R', f1(m.loss/1e6,2)+' MW（損失率 '+f1(m.lossP,2)+' %）'],
            ['x2','電圧を 2 倍にすると', '損失 '+f1(m2.loss/1e6,2)+' MW（1/4）・電流 '+f1(m2.I,0)+' A（1/2）']];
      note='※ 同じ電力・力率・抵抗なら、電流は 1/V、損失は 1/V² に比例。高い電圧で送る理由がこれ';
    }
  }
  if (id==='chichuu-souden'){
    if (state.cView==='cable'){
      const m = ccModel();
      rows=[['C','1相の静電容量（全長）', f1(state.cC,2)+' μF/km × '+state.cLen+' km = '+f1(m.C*1e6,2)+' μF'],
            ['Ic','充電電流 Ic = ωCE（E は相電圧）', f1(m.Ic,1)+' A（E = '+f1(m.E/1e3,1)+' kV）'],
            ['Qc','三相の充電容量 ωCV²', f1(m.Qc/1e3,0)+' kvar'],
            ['tan','誘電正接 tanδ（目安）', state.cType==='cv' ? '0.0005（CV・XLPE は小さい）' : '0.003（OF・油浸紙は大きい）'],
            ['Pd','誘電体損（三相）ωCV²tanδ', f1(m.Pd/1e3,2)+' kW（電圧だけで決まる。無負荷でも出る）'],
            ['Pr','抵抗損（三相・負荷電流の分）3I²R', f1(m.Pr/1e3,2)+' kW（無負荷でも充電電流の分がわずかに出る）'],
            ['Cg','寸法から見た C の大きさ 1/ln(D/d)', state.cDs > state.cd ? f1(1/Math.log(state.cDs/state.cd),2)+'（C = 2πε/ln(D/d) の形。大きいほど C が大きい）' : '—'],
            ['Emax','導体表面の最大電位傾度 2E/(d·ln(D/d))', state.cDs > state.cd ? f1(m.Emax/1e3,2)+' kV/mm' : '— （D は d より大きくする）']];
      note='※ 損失は3点セット: 抵抗損（電流の2乗）・誘電体損（電圧の2乗）・シース損（単心ケーブルの遮へいに誘起される。クロスボンド接地で減らす）。最高使用温度は CV 90 ℃、OF 75〜85 ℃';
    } else if (state.cView==='fusetsu'){
      const T = {direct:['安い・短い','良い（土に直接触れる）','受けやすい','困難（掘削が要る）','不向き'],
                 duct:['中','悪い（管内の空気層で熱がこもる）','受けにくい','容易（マンホールから引替。予備管があれば増設）','中'],
                 tunnel:['高い・長い','換気で確保（多条時は相互加熱に注意）','受けにくい','容易（人が立ち入れる）','最も多条に対応']}[state.cLay];
      rows=[['cost','建設費・工期', T[0]], ['heat','放熱・許容電流', T[1]], ['ext','外傷・第三者被害', T[2]], ['maint','増設・引替・保守', T[3]], ['multi','多条数の布設', T[4]]];
      note='※ 電力Wiki 3.2 の比較表と同じ内容。直接埋設式は「安くて放熱も良いが、外傷に弱く掘り返しが要る」、管路式・暗きょ式はその裏返し';
    } else {
      const m = mlModel();
      rows=[['bal','平衡条件', 'P·(2L − x) = Q·x'],
            ['est','いまの比で読む故障点 2L·P/(P+Q)', f1(m.est,2)+' km（2L = '+f1(2*state.mL,1)+' km）'],
            ['g','検流計の振れ', Math.abs(m.g) < .005 ? '0（平衡）' : (m.g > 0 ? '右へ振れる（P が大きすぎる）' : '左へ振れる（P が小さすぎる）')],
            ['x','実際の故障点（答え合わせ）', f1(m.x,2)+' km']];
      note='※ P は故障した線側、Q は健全な線側の比例辺。電源は P・Q の接続点と故障点（大地）のあいだ。導体の抵抗が長さに比例し、2本の線が同じ太さであることが前提。平衡の式はWikiに無いので、ブリッジの電位から導いた';
    }
  } else if (id==='haiden' && state.hView==='tp'){
    const m = hd3();
    rows=[['I','線電流 I = S/(√3·Vr)', f1(m.I,1)+' A'],
          ['Q','無効電力 P·tanθ − Qc', f1(m.Q/1e3,0)+' kvar'+(m.Q < 0 ? '（進み。コンデンサの入れすぎ）' : '')],
          ['pf','改善後の力率', f1(m.pf,3)+(m.Q < 0 ? '（進み）' : m.Q > 0 ? '（遅れ）' : '')],
          ['v','電圧降下 √3·I(R cosθ + X sinθ)', f1(m.v,1)+' V'+(m.v < 0 ? '（負＝受電端のほうが高い）' : '')],
          ['rate','電圧降下率 v/Vr（受電端基準）', f1(m.rate,2)+' %'],
          ['Vs','送電端電圧 Vr + v', f1(m.Vs,0)+' V'],
          ['loss','線路損失 3I²R', f1(m.loss/1e3,1)+' kW（負荷の '+f1(m.lossP,2)+' %）']];
    note='※ v = (P·R + Q·X)/Vr と同じ式（P・Q は三相分）。コンデンサは無効電力だけを減らすので、有効電力が同じまま電流・電圧降下・損失が減る。損失は 1/cos²θ に比例';
  } else if (id==='haiden'){
    const m = hdSolve(), R1 = 1e4/state.hP1, R2 = 1e4/state.hP2;
    rows=[['V1','負荷1 の電圧（a–n）', f1(m.V[0])+' V'],
          ['V2','負荷2 の電圧（n–b）', f1(m.V[1])+' V'],
          ['Ia','外線 a の電流', f1(Math.abs(m.Ia))+' A'],
          ['Ib','外線 b の電流', f1(Math.abs(m.Ib))+' A'],
          ['In','中性線の電流', state.hBreak ? '0 A（断線）' : f1(Math.abs(m.In))+' A（外線の電流の差）'],
          ['loss','線路損失', f1(m.loss)+' W'],
          ['R','負荷の抵抗（定格 100 V）', f1(R1,1)+' Ω ／ '+f1(R2,1)+' Ω']];
    note='※ 負荷は抵抗とみなした。中性線が切れると 2 つの負荷が 200 V に直列になり、抵抗の比（＝容量の逆比）で電圧を分ける。軽い負荷のほうが高い電圧を受ける';
  }
  /* 強調表示。いま見るべき行を明るく、ほかを薄くする（機械の3D工場と同じ規則） */
  const sig = id+'|'+rows.map(r=>r[0]).join(',');
  if (rdState.tourText !== null){
    const t = rdState.tourText;
    rdState.hot = rows.filter(([k,l]) => { const name = String(l).replace(/<[^>]*>/g,'').split(/[（(]/)[0].trim();
      const tok = name.split(/[\s=:：]+/).filter(x => x.length >= 2);
      return name && (t.includes(name) || tok.some(x => t.includes(x))) || (rdState.tourKeys || []).includes(k); }).map(r=>r[0]);
  } else if (rdState.sig !== sig){ rdState.hot = [];
  } else {
    const ch = rows.filter(([k,,v]) => rdState.vals[k] !== undefined && rdState.vals[k] !== String(v)).map(r=>r[0]);
    if (ch.length) rdState.hot = ch;
  }
  rdState.sig = sig; rdState.tourText = null;
  rdState.vals = Object.fromEntries(rows.map(([k,,v]) => [k, String(v)]));
  const hot = new Set(rdState.hot);
  readoutEl.classList.toggle('has-hot', hot.size > 0);
  readoutEl.innerHTML = rows.map(([k,l,v])=>{ const c = hot.has(k) ? ' class="hot"' : ''; return '<dt data-k="'+k+'"'+c+'>'+l+'</dt><dd data-k="'+k+'"'+c+'>'+v+'</dd>'; }).join('')
    + (note? '<div class="rnote">'+note+'</div>' : '');
  drawMini(); syncCards();
}

/* ---------- 右パネルの小さな図 ---------- */
function drawMini(){
  const c = document.getElementById('mini'); if (!c) return;
  const ctx = c.getContext('2d'), W = c.width, H = c.height; ctx.clearRect(0,0,W,H);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim(), ink3 = css.getPropertyValue('--ink-3').trim(), acc = css.getPropertyValue('--accent').trim(),
        line = css.getPropertyValue('--line').trim(), steel = css.getPropertyValue('--steel').trim();
  ctx.font = '21px "JetBrains Mono", monospace'; ctx.lineWidth = 2.5;
  const L=60, R=W-20, T=24, B=H-44;
  const cap = document.getElementById('miniCap');
  const bars = (items, unit) => {        // 横に並べた棒。items: [ラベル, 値, 色]
    const mx = Math.max(...items.map(x=>x[1]), 1e-9), bw = (R-L)/items.length*.6;
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.stroke();
    items.forEach(([lab, v, col], i) => { const x = L + (R-L)/items.length*(i+.2), h = v/mx*(B-T-24);
      ctx.fillStyle = col; ctx.fillRect(x, B-h, bw, h);
      ctx.fillStyle = ink; ctx.fillText(f1(v, v < 10 ? 1 : 0)+unit, x, B-h-8);
      ctx.fillStyle = ink3; ctx.fillText(lab, x, B+28); });
  };
  const id = state.current;
  if (id==='suiryoku'){
    const m = suModel();
    if (state.sMode==='gen'){
      bars([['9.8QHg', 9.8*state.sQ*state.sHg/1000, steel], ['9.8QH', m.Pth/1000, steel], ['水車', m.Pt/1000, steel], ['発電機', m.P/1000, acc]], ' MW');
      cap.textContent = '左から、総落差での理論値 → 損失落差を引いた有効落差での理論値 → 水車効率をかけた水車出力 → 発電機効率をかけた出力。一段ずつ減る。';
    } else {
      bars([['9.8QHg', 9.8*state.sQ*state.sHg/1000, steel], ['9.8Q(Hg+hl)', 9.8*state.sQ*m.Hp/1000, steel], ['所要電力', m.Pin/1000, acc]], ' MW');
      cap.textContent = '揚水は逆向き。総落差に損失落差を足した全揚程で水を上げ、ポンプ効率と電動機効率で割った電力が要る。発電で取り出せるのはこれより小さい。';
    }
  } else if (id==='karyoku'){
    const m = kaModel();
    bars([['燃料の入熱', m.Pin, steel], ['発電端', state.kP, acc], ['送電端', state.kP*(1-state.kL/100), acc]], ' MW');
    cap.textContent = '燃料の入熱のうち電気になるのは 4 割前後。残りの大半は復水器で冷却水に捨てる熱（汽力発電で最大の損失）。所内で使う分を引いたものが送電端。';
  } else if (id==='genshiryoku'){
    /* 制御棒の挿入と中性子の増減の向き（模式） */
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,(T+B)/2); ctx.lineTo(R,(T+B)/2); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
    ctx.strokeStyle=acc; ctx.beginPath(); for (let i=0;i<=100;i++){ const k=i/100, y=(T+B)/2 - (.5-k)*(B-T)*.8; i? ctx.lineTo(L+k*(R-L), y) : ctx.moveTo(L, y); } ctx.stroke();
    const k = state.gRod; ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(L+k*(R-L), (T+B)/2 - (.5-k)*(B-T)*.8, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=ink3; ctx.fillText('挿入 0 %', L, B+28); ctx.fillText('100 %', R-70, B+28); ctx.fillText('増える', L+8, T+18); ctx.fillText('減る', L+8, B-8);
    cap.textContent = '縦軸は中性子が世代ごとに増えるか減るか（反応度の符号）の模式。制御棒は中性子を吸収するので、入れるほど減る側へ動く。0 の線が臨界。位置は模式で、実機の値ではない。';
  } else if (id==='kaihei-hogo'){
    const m = hdModel();
    bars([['系統 %Zs', state.bZs, steel], ['変圧器 %Zt′', m.Zt, steel], ['合成 %Z', m.Z, acc]], ' %');
    cap.textContent = '10 MVA 基準にそろえた %Z を直列に足す。合成 %Z が小さいほど短絡容量・短絡電流は大きく、強い遮断器が要る。';
  } else if (id==='kakuu-souden'){
    if (state.tView==='sag'){
      const m = tdSag(), sc = (B-T)/Math.max(1, m.D*1.6, m.Dt*1.6);
      ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(R,T); ctx.stroke();
      const curve = (D, col, dash) => { ctx.strokeStyle=col; ctx.setLineDash(dash); ctx.beginPath(); for (let i=0;i<=60;i++){ const f=i/60, y=T + 4*D*f*(1-f)*sc; i? ctx.lineTo(L+f*(R-L), y) : ctx.moveTo(L, y); } ctx.stroke(); ctx.setLineDash([]); };
      curve(m.D, steel, [6,6]); curve(m.Dt, acc, []);
      ctx.fillStyle=ink; ctx.fillText('D = '+f1(m.D,2)+' m', (L+R)/2-80, T+m.D*sc+28);
      ctx.fillStyle=ink3; ctx.fillText('S = '+state.tS+' m', R-150, T-4);
      cap.textContent = '破線が基準温度のたるみ、実線が温度変化後。縦は横より大きく描いてある（形を見るため）。D は S の 2 乗に比例し T に反比例する。';
    } else {
      const xs = []; for (let V=66; V<=500; V+=4) xs.push([V, tdElec(V).lossP]);
      const mx = Math.max(...xs.map(p=>p[1])), xOf = V => L + (V-66)/(500-66)*(R-L), yOf = p => B - p/mx*(B-T);
      ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
      ctx.strokeStyle=acc; ctx.beginPath(); xs.forEach(([V,p],i)=> i? ctx.lineTo(xOf(V),yOf(p)) : ctx.moveTo(xOf(V),yOf(p))); ctx.stroke();
      const m = tdElec(); ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(xOf(state.tV), yOf(m.lossP), 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle=ink3; ctx.fillText('66 kV', L, B+28); ctx.fillText('500 kV', R-80, B+28); ctx.fillText('損失率', L+8, T+16);

  const dg = Math.abs(r - 1) < .01 ? 3 : 2;   // 1 % 未満の変化は 3 桁で出す（「1.00 倍 ↓」では向きしか読めない）

  if (r > 1){ const k = near(r, true); return (k ? k : f1(r, dg)) + ' 倍'; }
  const k = near(1/r, false); return k ? '1/' + k + ' 倍' : f1(r, dg) + ' 倍';   // 1/2.5 のような分母は書かない
}
function renderCausal(){
  const id = state.current;
  if (!causalEl){
    causalEl = document.createElement('div'); causalEl.className = 'causal'; causalEl.setAttribute('aria-live', 'polite');
  }
  if (causalEl.parentNode !== ctrlbar) ctrlbar.prepend(causalEl);   // buildCtrl が操作帯を作り直すたびに外れるので付け直す
  const c = CAUSAL[id];
  if (!c){ causalEl.hidden = true; return; }
  causalEl.hidden = false;
  const ctxSig = () => (c.ctx || []).map(k => state[k]).join('|');
  if (!causalBase || causalBase.id !== id || causalBase.ctx !== ctxSig()) causalReset();
  if (causalHidden){
    causalEl.innerHTML = '<button class="cz-show">比べる表示を出す</button>';
    causalEl.querySelector('.cz-show').onclick = () => { causalHidden = false; renderCausal(); };
    return;
  }
  const base = causalBase, nowIn = causalLive(id), now = c.outs();
  /* 原因に数えるのは、今の操作帯に出ているつまみだけ（見る対象と関係の無いつまみを原因に挙げない） */
  const live = new Set([...ctrlbar.querySelectorAll('[data-key]')].map(e => e.dataset.key));
  const changed = c.inputs.filter(([k]) => live.has(k) && nowIn[k] !== base.inputs[k]);
  const cause = changed.map(([k, lab, fmt, num]) => {
    const a = base.inputs[k], b = nowIn[k];
    return `<b>${lab}</b> ${fmt(a)} → ${fmt(b)}` + (num && a && b && Math.sign(a) === Math.sign(b) ? `（${ratioText(b/a)}）` : '');   // 0 や符号の変わる変化には倍率を付けない
  }).join('、');
  const rows = [], same = [];
  const baseOf = (k, alts) => { for (const key of [k, ...(alts || [])]){ const r = base.outs.find(x => x[0] === key); if (r) return r[2]; } return null; };
  /* 5 番目が同じ行どうし（上の層・下の層の電界）は、基準でも今でも値が等しければ1行にまとめる */
  const eqv = (a, b) => a == null ? b == null : b != null && Math.abs(a - b) <= 1e-9*Math.abs(a);
  const merged = new Set();
  for (const g of new Set(now.map(x => x[4]).filter(Boolean))){
    const ns = now.filter(x => x[4] === g), bs = base.outs.filter(x => x[4] === g);
    if (ns.length > 1 && ns.every(x => eqv(x[2], ns[0][2])) && bs.every(x => eqv(x[2], bs[0][2]))) merged.add(g);
  }
  const shown = [];
  for (const x of now){
    if (x[4] && merged.has(x[4])){ if (!shown.some(y => y[0] === x[4])) shown.push([x[4], '電界 E', x[2], [x[0]]]); }
    else shown.push(x);
  }
  shown.forEach(([k, lab, v, alts, , eps]) => {
    const b0 = baseOf(k, alts);
    if (v == null && b0 == null) return;
    /* eps: 計算誤差で 0 にならない量（平衡の電流など）の絶対の許容。行の 6 番目に書く */
    const fin = x => isFinite(x) ? Math.abs(x || 0) : 0;   // ∞ は棒の物差しに入れない（今の棒は全幅で描く）
    const mx = Math.max(fin(b0), fin(v)) || 1, zero = x => Math.abs(x) <= Math.max(1e-9*mx, eps || 0);
    let txt, dir;
    if (b0 === Infinity || v === Infinity){ if (b0 === v){ same.push(lab); return; } txt = v === Infinity ? '∞ に ↑' : '∞ から ↓'; dir = v === Infinity ? 'up' : 'down'; }
    else if (b0 == null || v == null){ if (v == null){ txt = 'なくなる'; dir = 'down'; } else { txt = '新たに'; dir = 'up'; } }
    else if (zero(b0) && zero(v)){ same.push(lab); return; }
    else if (zero(b0)){ txt = '0 から ↑'; dir = 'up'; }
    else if (zero(v)){ txt = '0 になる ↓'; dir = 'down'; }
    else if (Math.sign(v) !== Math.sign(b0)){ const r = Math.abs(v/b0); txt = '向きが逆' + (Math.abs(r - 1) < .001 ? '' : '・' + ratioText(r)); dir = r >= 1 ? 'up' : 'down'; }
    /* 0.1 % 以内だけを「変わらない」と言う */
    else { const r = v/b0; if (Math.abs(r - 1) < .001){ same.push(lab); return; } dir = r > 1 ? 'up' : 'down'; txt = ratioText(r) + (dir === 'up' ? ' ↑' : ' ↓'); }
    rows.push(`<div class="cz-row"><span class="cz-lab">${lab}</span>`
      + `<span class="cz-bar"><i class="cz-was" style="width:${b0 === Infinity ? 100 : (fin(b0)/mx*100).toFixed(1)}%"></i><i class="cz-now ${dir}" style="width:${v === Infinity ? 100 : (fin(v)/mx*100).toFixed(1)}%"></i></span>`
      + `<span class="cz-r ${dir}">${txt}</span></div>`);
  });
  causalEl.innerHTML = `<div class="cz-head"><span>基準と比べる</span><button class="cz-reset" title="いまの状態を新しい基準にする">いまを基準に</button><button class="cz-hide" aria-label="比べる表示を隠す">×</button></div>`
    + (changed.length
      ? `<p class="cz-cause">${cause}</p><div class="cz-rows">${rows.join('')}</div>`
        + (same.length ? `<p class="cz-same">変わらない: ${same.join('・')}</p>` : '')
      : `<p class="cz-cause">つまみを動かすと、ここに「基準 → 今」で何が何倍になったかが並ぶ。</p>`)
    + `<p class="cz-note"><span class="cz-key">灰の棒＝基準、色の棒＝今（橙は増、青は減）。</span>${typeof c.note === 'function' ? c.note() : c.note}</p>`;
  causalEl.querySelector('.cz-reset').onclick = () => { causalReset(); renderCausal(); };
  causalEl.querySelector('.cz-hide').onclick = () => { causalHidden = true; renderCausal(); };
}

function mark(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--ink)">$1</b>'); }

/* ---------- 予想クイズの記録（学習ループにつなぐ） ----------
   答えをこの端末に残す。間違えた問題は、Wiki の「間違いノート」（denken-hoki-wiki.html#chokuzen-machigai）に
   自動で入る。間違いノートは同じサイトの denken_check:: で始まる記録をすべて集めるので、キーと中身をその形に合わせる。
   ・キー: denken_check::<科目>_3d-<単元>::predict::<問題文のハッシュ>（問題を並べ替えても記録がずれない）
   ・status: 一発で正解＝understood（◎）／間違い＝wrong（×）／前に間違えた問題を正解・うろ覚え＝vague（△ 要復習。後日また出す）。
     間違えた日と同じ日に解き直して正解しても △ のまま（答えを見た直後の正解は、思い出したことにならない） */
const REC_SUBJ = 'denryoku', REC_NAME = '電力';
function recHash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function recKey(id, item){ return `denken_check::${REC_SUBJ}_3d-${id}::predict::${recHash(item.q)}`; }
function recRead(key){
  try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return (v && typeof v === 'object' && v.status) ? v : null; }
  catch (e) { return null; }
}
const recDay = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
/* 記録の共通部。res は 'good'（正解・言えた）／'vague'（うろ覚え）／'bad'（間違い・言えなかった）。
   前に間違えた問題は、別の日に正解して初めて ◎ に戻す */
function recSave(id, key, res, fields){
  const prev = recRead(key), now = new Date().toISOString(), m = MACHINES[id];
  const weak = prev && (prev.status === 'wrong' || prev.status === 'vague');
  const status = res === 'bad' ? 'wrong' : res === 'vague' ? 'vague'
    : !weak ? 'understood'
    : (prev.status === 'wrong' || recDay(prev.updatedAt) === recDay(now)) ? 'vague' : 'understood';
  const rec = Object.assign({
    status,
    articleTitle: `${REC_NAME}3D工場 — ${m.num} ${m.title}`,
    articleUrl: `denken3-${REC_SUBJ}-3d.html#${id}`,
    updatedAt: now, firstSeenAt: (prev && prev.firstSeenAt) || now, reviewCount: ((prev && prev.reviewCount) || 0) + 1,
  }, fields);
  try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) { return null; }   // 保存できない環境（シークレット等）でもクイズは動かす
  return rec;
}
function recWrite(id, item, ok){
  const K = 'アイウエオ';
  return recSave(id, recKey(id, item), ok ? 'good' : 'bad', {
    itemType: '3d-predict', lastAnswerCorrect: ok,
    itemTitle: `${item.q}（${item.opts.map((o, k) => K[k] + ' ' + o).join('／')}）`,
    memo: `A: ${K[item.ans]} ${item.opts[item.ans]}\n${item.why}`,
  });
}
/* 即答チェック: 開く前に答えを言ってみて、開いたら「言えたか」を自分で押す（自己評価なので lastAnswerCorrect は持たない）。
   △ うろ覚えは vague として記録する（後日また出す） */
function recCheckKey(id, q){ return `denken_check::${REC_SUBJ}_3d-${id}::check::${recHash(q)}`; }
function recCheck(id, q, a, s){
  const res = s === 'understood' ? 'good' : s === 'vague' ? 'vague' : 'bad';
  return recSave(id, recCheckKey(id, q), res, { itemType: '3d-check', itemTitle: q, memo: `A: ${a}` });
}
const REC_MARK = { understood: '◎ 一発で正解', vague: '△ 要復習', review: '△ 要確認', wrong: '× 間違えた' };
function recLine(rec){
  if (!rec) return '';
  const d = new Date(rec.updatedAt);
  return `前回 ${REC_MARK[rec.status] || ''}${isNaN(d) ? '' : `（${d.getMonth()+1}/${d.getDate()}）`}`;
}

/* 即答チェックの自己評価（記録は recCheck） */
function bindCheck(st){
  const box = document.getElementById('check'); if (!box) return;
  box.querySelectorAll('li[data-c]').forEach(li=>{
    const [q, a] = st.check[+li.dataset.c];
    const prevEl = li.querySelector('.ckprev');
    const line = recLine(recRead(recCheckKey(state.current, q)));
    prevEl.textContent = line ? '　' + line : '';
    li.querySelectorAll('.ckbtn button').forEach(b=>b.onclick = ()=>{
      const rec = recCheck(state.current, q, a, b.dataset.s);
      li.querySelectorAll('.ckbtn button').forEach(x=>x.classList.toggle('on', x === b));
      if (rec) prevEl.textContent = '　今回 ' + REC_MARK[rec.status].split(' ')[0] + ' を記録した';
    });
  });
}

/* ---------- 予想 → 操作 → 確認 ----------
   選ぶ前に答えを見せない。選んだ瞬間に 3D と操作帯を実際にその状態へ動かし、
   どの読み値の話かを光らせる。式の暗記を「見た動き」に結び直すのが狙い。 */
function bindQuiz(st){
  const box = document.getElementById('quiz'); if (!box) return;
  box.querySelectorAll('li[data-q]').forEach(li=>{
    const qi = +li.dataset.q, item = st.predict[qi];
    const fb = li.querySelector('.qfb');
    const btns = [...li.querySelectorAll('.qopts button')];
    const prevEl = li.querySelector('.qprev');
    prevEl.textContent = recLine(recRead(recKey(state.current, item)));
    const answer = (k)=>{
      const ok = k === item.ans;
      btns.forEach((b,bi)=>{ b.disabled = true;
        if (bi === item.ans) b.classList.add('ok');
        else if (bi === k) b.classList.add('ng');
        else b.classList.add('dim'); });
      li.classList.add('done');
      const rec = recWrite(state.current, item, ok);
      if (rec) prevEl.textContent = '今回 ' + REC_MARK[rec.status].split(' ')[0] + ' を記録した（間違いノートに反映）';
      fb.hidden = false;
      fb.innerHTML = '<span class="verdict '+(ok?'ok':'ng')+'">'+(ok?'正解':'惜しい')+'</span>'+esc(item.why)
        + '<br><button class="again">もう一度やる</button>';
      fb.querySelector('.again').onclick = ()=>{
        btns.forEach(b=>{ b.disabled=false; b.classList.remove('ok','ng','dim'); });
        li.classList.remove('done'); fb.hidden = true; fb.innerHTML='';
      };
      if (item.set){ Object.assign(state, item.set); onSetApplied(item.set, true); }   // クイズは初期状態からの変化として書いてあるので、初期状態を基準にする
      refreshCtrl(); openMoreFor(item.set, item.q);
      litReadout(item.hi);
    };
    btns.forEach((b,k)=>b.onclick = ()=>answer(k));
  });
}

let tourStep = 0;
function renderTour(apply=true){
  const box = document.getElementById('tour'); if (!box || !state.current) return;
  const steps = STUDY[state.current].tour; const i = tourStep; const stp = steps[i];
  const qs = (stp.q || []).map(k => QID.get(k)).filter(Boolean);
  box.innerHTML = `<div class="step">${i+1} / ${steps.length}</div><h4>${esc(stp.t)}</h4>
    <dl class="tsteps">
      <div><dt>操作</dt><dd>${esc(stp.op)}</dd></div>
      <div><dt>画面</dt><dd>${esc(stp.see)}</dd></div>
      <div><dt>だから</dt><dd>${esc(stp.so)}</dd></div>
    </dl>
    ${qs.length ? `<div class="tq"><span class="cap">ここが問われた過去問</span>${qs.map(q=>`<a href="${secUrl(q.p,q.sec)}" target="_blank" rel="noopener"><span class="id">${q.s} 問${q.c}${q.v===0 ? '・未照合' : ''}</span><span>${esc(q.t)}</span></a>`).join('')}</div>` : ''}
    <div class="nav"><button id="tPrev" ${i===0?'disabled':''}>← 前</button><button id="tNext" ${i===steps.length-1?'disabled':''}>次 →</button><button id="tApply">この状態にする</button><div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div></div>`;
  box.querySelector('#tPrev').onclick=()=>{ tourStep=Math.max(0,tourStep-1); renderTour(); };
  box.querySelector('#tNext').onclick=()=>{ tourStep=Math.min(steps.length-1,tourStep+1); renderTour(); };
  box.querySelector('#tApply').onclick=()=>applyStep(stp);
  if (apply) applyStep(stp);
}
function applyStep(stp){
  Object.assign(state, stp.set || {}); onSetApplied(stp.set);   // ツアーの歩の出発状態を、比べる表示の基準にする
  rdState.tourText = [stp.op, stp.see, stp.so].join(' ');
  rdState.tourKeys = stp.hi || [];
  /* 先に操作帯と凡例を作り直してから指す。逆順だと、回路や見る対象を切り替える歩で
     rebuildLabels が指した行を消してしまい、focus が黙って外れる */
  refreshCtrl(); openMoreFor(stp.set, stp.op);
  focusByName(stp.focus || null);
}

/* ---------- ミニ図（右パネルの曲線。形だけの模式図） ---------- */
const backBtn = document.getElementById('backbtn');
backBtn.onclick = ()=>select(null);
function select(id){
  state.current = id; causalReset();
  backBtn.classList.toggle('hidden', !id);
  if (reduced){ const v = VIEWS[id||'overview']; cam.target.set(...v.target); cam.dist=v.dist; cam.theta=v.theta; cam.phi=v.phi; cam.want=null; camShot = null; }
  else flyTo(VIEWS[id||'overview']);
  focusReq = undefined; frameWait = null; camPart = null;
  _lastSig = id ? ctrlSig() : null;
  renderChips(); buildCtrl(); renderPanel(); rebuildLabels();
  panel.scrollTop = 0;
  try { history.replaceState(null, '', id ? '#'+id : location.pathname); } catch (e) {}
}

/* ---------- ループ ---------- */
/* 描画する画素数に上限を置く。高DPIの大画面では w*h*dpr² が1千万画素を超え、
   操作に対する反応が目に見えて鈍る（実測: 2560x1300 で 2fps、負荷を落とすと 21fps）。
   スマホのように面積が小さいときは上限に当たらないので画質はそのまま。 */
const PIXEL_CAP = 2.6e6;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const pr = Math.max(0.75, Math.min(devicePixelRatio || 1, 2, Math.sqrt(PIXEL_CAP / (w * h))));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  /* 画面の形が変われば入る距離も変わる。全景を見ているときだけ組み直す
     （機器に寄っているときに引ったくらない） */
  fitOverview();
  if (!state.current) flyTo(VIEWS.overview);
}
/* resize は連続で飛んでくるので1フレームにまとめる */
let rzPending=false;
addEventListener('resize', ()=>{ if(rzPending) return; rzPending=true; requestAnimationFrame(()=>{ rzPending=false; resize(); }); });
resize();
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; const t = now/1000;
  if (cam.want){ const k = 1 - Math.pow(.001, dt); cam.target.lerp(cam.want.target, k); cam.dist += (cam.want.dist-cam.dist)*k; cam.theta += (cam.want.theta-cam.theta)*k; cam.phi += (cam.want.phi-cam.phi)*k; if (cam.target.distanceTo(cam.want.target)<.01 && Math.abs(cam.dist-cam.want.dist)<.01 && Math.abs(cam.theta-cam.want.theta)<.01 && Math.abs(cam.phi-cam.want.phi)<.01) cam.want=null; }
  applyCam();
  /* 1つの設備に寄っているあいだ、ほかの設備は動かさない（見えないものを毎フレーム計算しない）。
     カメラが移動中は全景が見えうるので全機動かす。 */
  const only = (!cam.want && state.current) ? state.current : null;
  for (const id of ORDER) if (!only || id === only) animators[id](groups[id], t, state, dt);
  if (focusReq !== undefined && state.current) resolveFocus();
  else if (frameWait && state.current) frameTick();
  hlMat.opacity = .62 + .3*Math.sin(t*4.5);
  renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(loop);
}
const initial = location.hash.replace('#','');
select(MACHINES[initial] ? initial : null);
requestAnimationFrame(loop);
</script>
