<meta charset="utf-8">
<title>電力科目 3D工場</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="電験三種 電力科目の7つの設備（水力・火力・原子力・変電所・架空送電・地中送電・配電）を3Dに並べ、電力Wikiと過去20年の過去問台帳に結びつけて眺めるビューア">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF0EC; --panel:#F8F9F6; --ink:#1E2328; --ink-2:#4B555E; --ink-3:#7C8790;
  --line:#D6DAD3; --line-2:#E4E7E1;
  --accent:#B5601F; --accent-ink:#8C4612; --accent-soft:#F4E5D7;
  --steel:#3B5A73; --steel-soft:#DDE6EE;
  --canvas:#1A2028;
  --font-sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
    --line:#2E353C; --line-2:#262C33;
    --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
    --steel:#8FB0CC; --steel-soft:#22313D;
    --canvas:#0F1419;
  }
}
:root[data-theme="dark"]{
  --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
  --line:#2E353C; --line-2:#262C33;
  --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
  --steel:#8FB0CC; --steel-soft:#22313D;
  --canvas:#0F1419;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--font-serif);font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-family:var(--font-sans);font-weight:400;color:var(--ink-3);font-size:12px;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--steel);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:inherit;opacity:.7;margin-right:4px}
.wikilink{margin-left:auto;font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.wikilink:hover{color:var(--accent-ink)}
.stage{display:flex;flex-direction:column;background:var(--canvas);min-height:0}
.view{position:relative;flex:1;min-height:0}
.view canvas{display:block;width:100%;height:100%}
/* PC で高さが低い画面: 操作帯が高くなると 3D が潰れた（901×600 で実測。機械3D工場 #1862 と同じ直し方）。
   3D に表示領域の半分を最低保証し、入りきらない操作帯はその中で縦にスクロールさせる */
@media (min-width:901px){
  .view{min-height:50%}
  .ctrlbar{min-height:0;overflow-y:auto}
}
.ctrlbar{background:#141920;color:#E6E9E4;border-top:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-end;font-size:12.5px}
.ctrlbar .title{font-size:11.5px;letter-spacing:.08em;color:#AEB6BD;align-self:center;white-space:nowrap}
.ctrlbar details.more{flex-basis:100%;order:1;border-top:1px dashed rgba(255,255,255,.14);padding-top:4px}
.ctrlbar details.more>summary{cursor:pointer;color:#C5CCD3;font-size:12px;letter-spacing:.04em;padding:4px 0;list-style-position:inside}
.ctrlbar details.more[open]>summary{color:#F0B57E}
.ctrlbar .moregrid{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.cg{display:grid;gap:3px;min-width:150px}
.cg>label{font-size:11.5px;color:#AEB6BD;white-space:nowrap;display:flex;justify-content:space-between;gap:8px}
.cg .val{font-family:var(--font-mono);color:#F0B57E;font-variant-numeric:tabular-nums}
.cg input[type=range]{width:100%;accent-color:#D9853F;margin:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6E9E4;border-radius:4px;padding:2px 9px;font-size:12px}
.seg button[aria-pressed="true"]{background:#D9853F;border-color:#D9853F;color:#1A2028}
.readout{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:12px;margin:0 0 0 auto;align-self:center}
.readout dt{color:#AEB6BD;margin:0;text-align:right}
.readout dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.readout.has-hot dt:not(.hot),.readout.has-hot dd:not(.hot){opacity:.7}   /* 薄くしても 4.5:1 以上（項目名 4.85・値 7.6）*/
.readout dt.hot{color:#E6E9E4}
.readout dd.hot{color:#F0B57E;font-weight:600}
.readout dt,.readout dd{transition:opacity .2s}
.labels svg{position:absolute;inset:0;width:100%;height:100%}
.labels svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* 凡例。順序固定で動かない。行に触れた1件だけ引き出し線が出る */
/* 凡例は3Dの枠の高さまでに収め、収まらない行は凡例の中でスクロールさせる（部品の多い水力・火力・原子力で、枠の下の「基準と比べる」欄にかぶっていた） */
.legend{position:absolute;left:10px;top:10px;max-width:min(46%,300px);max-height:calc(100% - 20px);overflow-y:auto;background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px;backdrop-filter:blur(3px);pointer-events:auto}
.legend.hidden{display:none}
.lgrow{display:grid;grid-template-columns:11px 1fr;gap:8px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:4px 8px;color:#C5CCD3;font-size:12px;line-height:1.5}
.lgrow i{width:11px;height:11px;border-radius:2px;margin-top:4px;display:block}
.lgrow:hover,.lgrow.on{background:rgba(217,133,63,.92);color:#1A2028}
.lgcap{font-size:10.5px;letter-spacing:.06em;color:#7B858E;padding:2px 8px 4px;display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:-4px;z-index:1;background:rgb(18,23,29)}   /* 凡例をスクロールしても見出しと「隠す」を上端に残す（top は凡例の内側の余白 4px ぶん） */
.lgcap button{background:transparent;border:0;color:#7B858E;font-size:10.5px;padding:0 2px;text-decoration:underline}
.lgcap button:hover{color:#D9853F}
.lgshow{position:absolute;left:10px;top:10px;background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);color:#AEB6BD;border-radius:6px;padding:4px 12px;font-size:11.5px}
.lgshow.hidden{display:none}
.points{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;align-items:start}
.points .k{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600;margin-top:2px}
.points b{font-weight:500}
.points span{color:var(--ink-2)}
.tour{border:1px solid var(--accent);border-radius:6px;padding:12px 14px;background:var(--accent-soft)}
.tour .step{font-family:var(--font-mono);font-size:11.5px;color:var(--accent-ink);letter-spacing:.06em}
.tour h4{margin:2px 0 4px;font-size:15px;font-weight:700;font-family:var(--font-serif)}
.tour p{margin:0 0 10px;font-size:13px;color:var(--ink)}
.tsteps{display:grid;gap:6px;margin:0 0 10px}
.tsteps>div{display:grid;grid-template-columns:3.6em 1fr;gap:9px;align-items:baseline}
.tsteps dt{margin:0;font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:1px 0;text-align:center}
.tsteps dd{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.tq{border-top:1px dashed var(--accent);padding-top:8px;margin:0 0 10px;display:grid;gap:5px}
.tq .cap{font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink)}
.tq a{display:grid;grid-template-columns:5.6em 1fr;gap:8px;text-decoration:none;color:var(--ink);font-size:12.5px;line-height:1.5}
.tq a:hover{color:var(--accent-ink);text-decoration:underline}
.tq .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tour .nav{display:flex;gap:6px;align-items:center}
.tour .nav button{border:1px solid var(--accent);background:var(--panel);color:var(--accent-ink);border-radius:4px;padding:3px 12px;font-size:12.5px}
.tour .nav button:disabled{opacity:.4;cursor:default}
.tour .nav .dots{margin-left:auto;display:flex;gap:4px}
.tour .nav .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.tour .nav .dots i.on{background:var(--accent)}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check details{border:1px solid var(--line-2);border-radius:4px;padding:8px 12px}
.check summary{cursor:pointer;font-size:13px;font-weight:500}
.check summary::marker{color:var(--accent)}
.check p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.check .ckprev{font-size:11.5px;font-weight:400;color:var(--ink-3)}
.ckbtn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.ckbtn button{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.ckbtn button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;color:#E9EDF0;background:rgba(16,20,26,.72);padding:2px 8px;border-radius:3px;white-space:nowrap;letter-spacing:.02em;border-left:2px solid var(--lc,#B5601F)}
.lbl.big{font-size:13px;font-weight:500;padding:4px 10px;pointer-events:auto;cursor:pointer}
.hint{position:absolute;right:12px;top:10px;font-size:11.5px;color:#8E98A2;text-align:right;line-height:1.5}
.hint kbd{font-family:var(--font-mono);color:#C5CCD3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 40px}
aside h2{font-family:var(--font-serif);font-size:22px;margin:0 0 4px;line-height:1.35;text-wrap:balance}
aside h2 .num{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);font-weight:400;margin-right:8px}
.kicker{font-size:11.5px;letter-spacing:.1em;color:var(--accent-ink);font-weight:500;margin-bottom:6px}
.lead{color:var(--ink-2);margin:0 0 8px}
.viewnote{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--steel);padding:2px 0 2px 10px;margin:0 0 14px}
.viewnote:empty{display:none}
.realphoto{margin:0 0 14px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.realphoto img{display:block;width:100%;height:auto}
.realphoto figcaption{font-size:12.5px;color:var(--ink-2);padding:8px 10px;line-height:1.6}
.realphoto small{display:block;color:var(--ink-3);font-size:11px;margin-top:4px}
aside h3{font-size:12.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
aside h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.parts li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;font-size:13px}
.parts .sw{width:12px;height:12px;border-radius:2px;margin-top:7px;border:1px solid rgba(0,0,0,.15)}
.parts b{font-weight:500}
.parts span{color:var(--ink-2)}
.secs{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.secs a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;padding:7px 10px;border:1px solid var(--line-2);border-radius:4px;text-decoration:none;color:var(--ink);background:transparent}
.secs a:hover{border-color:var(--accent);background:var(--accent-soft)}
.secs .why{grid-column:1/-1;font-size:12px;color:var(--ink-2);line-height:1.55}
.secs .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kak{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.kak li{display:grid;grid-template-columns:5.6em 1fr;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line-2)}
.kak .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kak a{color:var(--ink);text-decoration:none}
.kak a:hover{color:var(--accent-ink);text-decoration:underline}
.kak .d{color:var(--accent);letter-spacing:-.1em;margin-left:4px;font-size:11px}
.kak .k3d{border:1px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:3px;padding:0 6px;font-size:10.5px;line-height:1.5;margin-left:6px;vertical-align:1px}
.kak .k3d:hover{background:var(--accent-soft)}
.secgroup{font-size:12px;color:var(--ink-2);margin:10px 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.secgroup button{background:transparent;border:1px solid var(--accent);color:var(--accent-ink);border-radius:3px;padding:1px 9px;font-size:11.5px;white-space:nowrap}
.secgroup button:hover{background:var(--accent-soft)}
.cg.off{opacity:.35}
.cg.off input,.cg.off button{pointer-events:none}
.flow{display:grid;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{position:relative;padding:8px 0 8px 34px;counter-increment:f;border-left:2px solid var(--line);margin-left:11px}
.flow li::before{content:counter(f);position:absolute;left:-13px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--steel);color:var(--steel);font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600}
.flow li.here{border-left-color:var(--accent)}
.flow li.here::before{background:var(--accent);border-color:var(--accent);color:#fff}
.flow b{display:block;font-weight:500}
.flow span{color:var(--ink-2);font-size:12.5px}
.flow a{text-decoration:none}
.note{background:var(--steel-soft);border-radius:4px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.note b{color:var(--ink);font-weight:500}
canvas.mini{width:100%;height:150px;display:block;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.mini-cap{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}
.overview-grid{display:grid;gap:8px}
.overview-grid button{text-align:left;border:1px solid var(--line-2);background:transparent;border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
.overview-grid button:hover{border-color:var(--accent);background:var(--accent-soft)}
.overview-grid .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.overview-grid .t{font-weight:500}
.overview-grid .c{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.overview-grid .s{grid-column:2/-1;font-size:12px;color:var(--ink-2)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .view{flex:none;height:46vh;min-height:260px}
  /* チップが縦に折り返すとヘッダだけで画面を食う。横1列の横スクロールにする。
     flex だと flex-basis:100% が本質サイズ計算で中身の幅に落ちてページごと横に伸びるため、
     minmax(0,1fr) で潰せるグリッドにする。 */
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:7px 10px;align-items:center}
  header h1{grid-column:1;grid-row:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wikilink{grid-column:2;grid-row:1;margin-left:0}
  .chips{grid-column:1/-1;grid-row:2;min-width:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;min-height:34px;display:flex;align-items:center}
  .legend{max-width:calc(100% - 20px)}
  .ctrlbar{gap:8px 16px}
  aside{border-left:0;border-top:1px solid var(--line)}
  /* スマホ: 高さを画面に固定すると、3D と操作帯で埋まってパネルが潰れ（390×844 で 61px）、操作帯の読み値が上に重なる。
     ページごと縦にスクロールさせる（3D の大きさは .view の 46vh で決まるので変わらない。機械3D工場 #1856 と同じ直し方） */
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  aside{overflow:visible}
  .hint{display:none}
  header h1 small{display:none}
}

/* ---- 30秒理解 ---- */
.oneliner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 5px 5px 0;font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink);margin:0 0 12px}
.oneliner small{display:block;font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:3px}
/* ---- 狙われるポイント ---- */
.exam{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.exam li{border:1px solid var(--line-2);border-radius:5px;padding:8px 11px;display:grid;gap:3px}
.exam .en{font-size:11.5px;letter-spacing:.04em;color:var(--ink-3)}
.exam .ef{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--accent-ink);word-break:break-word}
.exam .ew{font-size:12px;color:var(--ink-2);line-height:1.55}
/* ---- 予想クイズ ---- */
.quiz{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:q}
.quiz>li{border:1px solid var(--line);border-radius:6px;padding:11px 13px;background:var(--panel);counter-increment:q}
.quiz>li.done{border-color:var(--line-2)}
.qprev{font-size:12px;color:var(--ink-3);margin:2px 0 4px}.qprev:empty{display:none}
.qnote{font-size:12px;color:var(--ink-3);margin:-2px 0 8px}.qnote a{color:var(--accent)}
.qq{font-size:13.5px;font-weight:500;line-height:1.6;margin-bottom:9px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.qn{font-family:var(--font-mono);font-size:11px;background:var(--steel);color:var(--panel);border-radius:3px;padding:1px 6px;margin-top:3px}
.qopts{display:grid;gap:5px}
.qopts button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 12px;font-size:13px;min-height:38px;line-height:1.4;display:flex;align-items:center;gap:8px}
.qopts button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qopts button:disabled{cursor:default}
.qopts button .mk{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);flex:none}
.qopts button.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.qopts button.ng{border-color:var(--danger);background:var(--danger-soft)}
.qopts button.dim{opacity:.45}
.qfb{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.qfb b{color:var(--ink)}

/* ---------- 計算モデル（読み値・図・3D はすべてここを見る） ---------- */
/* 水力。有効落差 H = 総落差 − 損失落差。出力 P = 9.8·Q·H·ηt·ηg［kW］。
   揚水は全揚程 Hp = 総落差 + 損失落差、所要電力 = 9.8·Q·Hp/(ηp·ηm)。
   比速度 Ns = N·√Pt / H^(5/4)（Pt は水車出力 kW、H は m） */
function suModel(){
  const st = state, H = Math.max(.1, st.sHg - st.sHl), Hp = st.sHg + st.sHl;
  const Pth = 9.8*st.sQ*H, Pt = Pth*st.sEt, P = Pt*st.sEg, Pin = 9.8*st.sQ*Hp/(st.sEp*st.sEm);
  return {H, Hp, Pth, Pt, P, Pin, ns: st.sN*Math.sqrt(Pt)/Math.pow(H, 1.25), v: Math.sqrt(2*9.8*H),
    total: st.sEt*st.sEg*st.sEp*st.sEm*(st.sHg - st.sHl)/(st.sHg + st.sHl)};
}
/* 火力。発電端熱効率 η = 3600·P[kW] / (B[kg/h]·H[kJ/kg]) = 3.6·P[MW] / (B[t/h]·H[MJ/kg])。
   送電端は所内率の分だけ減る。CO2 は燃料中の炭素 c が全部燃えるとして B·c·44/12 */
function kaModel(){
  const st = state, eta = 3.6*st.kP/(st.kB*st.kH);
  return {eta, etaS: eta*(1 - st.kL/100), co2: st.kB*st.kC*44/12, Pin: st.kB*st.kH/3.6};
}
/* 原子力。質量欠損 Δm のエネルギー E = Δm·c²。核分裂は 1 回 200 MeV で数える */
const C0 = 3e8, NA = 6.022e23, MEV = 1.602e-13;
function geModel(){
  const st = state;
  const E = st.gCalc==='dm' ? st.gDm/1000*C0*C0 : st.gU/235*NA*200*MEV;      // J
  return {E, kWh: E/3.6e6, coal: E/(st.gHc*1e6)/1000, elec: E*st.gEta/3.6e6};   // coal は t
}
/* 変電所。%Z は 10 MVA 基準にそろえてから足す（%Z' = %Z × 10/自己容量）。
   短絡容量 Ps = 100·Pb/%Z、短絡電流 Is = Ps/(√3·V)。遮断器は Is 以上の定格から最小のもの */
const CB_RATE = [8, 12.5, 16, 20, 25, 31.5, 40, 50, 63];
function hdModel(){
  const st = state, Zt = st.bZt*10/st.bSt, Z = st.bZs + Zt, Ps = 100*10/Z, Is = Ps/(Math.sqrt(3)*st.bV);
  return {Zt, Z, Ps, Is, In: st.bSt/(Math.sqrt(3)*st.bV), cb: CB_RATE.find(r => r >= Is) || null};
}
/* 架空送電のたるみ。D = W·S²/(8T)、実長 L = S + 8D²/(3S)。温度が Δt 変わると L' = L(1 + αΔt)、
   そこから D' = √(3S(L'−S)/8)（張力の変化は無視する標準の扱い） */
function tdSag(){
  const st = state, T = st.tT*1000, D = st.tW*st.tS*st.tS/(8*T), L = st.tS + 8*D*D/(3*st.tS);
  const Lt = L*(1 + st.tAl*1e-6*st.tDt), Dt = Math.sqrt(Math.max(0, 3*st.tS*(Lt - st.tS)/8));
  return {D, L, Lt, Dt};
}
/* 三相3線式の送電。I = P/(√3·V·cosθ)、電圧降下 ≒ √3·I(R cosθ + X sinθ)、損失 3I²R */
function tdElec(V = state.tV){
  const st = state, sn = Math.sqrt(1 - st.tPf*st.tPf), I = st.tP*1e6/(Math.sqrt(3)*V*1e3*st.tPf);
  const dV = Math.sqrt(3)*I*(st.tR*st.tPf + st.tX*sn), loss = 3*I*I*st.tR;
  return {I, dV, dVp: dV/(V*1e3)*100, loss, lossP: loss/(st.tP*1e6)*100};
}
/* 単相3線式（抵抗負荷）を節点方程式で解く。電源側 a=+100・n=0・b=−100 V。
   負荷は定格 100 V で P[W] の抵抗 R = 100²/P。外線の抵抗 r、中性線の抵抗 rn。
   中性線が切れたら rn を無限大に。バランサ（1:1 の単巻）は負荷端で V_an = V_nb にし、
   a と b から同じ電流 x を吸い込んで n へ 2x を返す */
function hdSolve(){
  const st = state, R1 = 1e4/st.hP1, R2 = 1e4/st.hP2, r = Math.max(1e-3, st.hR), gn = st.hBreak ? 0 : 1/Math.max(1e-3, st.hRn);
  const bal = !!st.hBal;
  /* 未知数 [VA, VN, VB, x] */
  const A = [
    [1/r + 1/R1, -1/R1, 0, bal ? 1 : 0],
    [-1/R1, gn + 1/R1 + 1/R2, -1/R2, bal ? -2 : 0],
    [0, -1/R2, 1/r + 1/R2, bal ? 1 : 0],
    bal ? [1, -2, 1, 0] : [0, 0, 0, 1],
  ], b = [100/r, 0, -100/r, 0];
  const n = 4;
  for (let i=0;i<n;i++){                       // ガウスの消去法（部分ピボット）
    let p = i; for (let k=i+1;k<n;k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    for (let k=i+1;k<n;k++){ const f = A[k][i]/A[i][i]; for (let j=i;j<n;j++) A[k][j] -= f*A[i][j]; b[k] -= f*b[i]; }
  }
  const x = Array(n).fill(0);
  for (let i=n-1;i>=0;i--){ let t = b[i]; for (let j=i+1;j<n;j++) t -= A[i][j]*x[j]; x[i] = t/A[i][i]; }
  const [VA, VN, VB] = x, Ia = (100 - VA)/r, Ib = (VB + 100)/r, In = VN*gn;
  return {V:[VA - VN, VN - VB], Ia, Ib: -Ib, In, loss: Ia*Ia*r + Ib*Ib*r + (gn ? In*In/gn : 0)};
}

/* 三相3線式の高圧配電線。受電端電圧 Vr・負荷 P・遅れ力率から無効電力 Q を出し、コンデンサ Qc だけ減らす。
   電圧降下 v ≒ √3·I(R cosθ + X sinθ) = (P·R + Q·X)/Vr、電圧降下率は受電端電圧 Vr に対する割合 */
function hd3(){
  const st = state, P = st.h3P*1e3, Q = P*Math.tan(Math.acos(st.h3Pf)) - st.h3Qc*1e3, S = Math.hypot(P, Q), V = st.h3Vr*1e3;
  const I = S/(Math.sqrt(3)*V), v = (P*st.h3R + Q*st.h3X)/V, loss = 3*I*I*st.h3R;
  return {P, Q, S, I, pf: P/S, v, rate: v/V*100, Vs: V + v, loss, lossP: loss/P*100};
}

/* 地中ケーブル（三相・電力Wiki 3.2 の公式）。E は相電圧（対地電圧）= V/√3。
   充電電流 Ic = ωCE、三相の充電容量 Qc = 3·E·Ic = ωCV²、三相の誘電体損 Pd = 3ωCE²tanδ = ωCV²tanδ。
   C は 1相の静電容量（μF/km）× 線路長。抵抗損は 3I²R（負荷電流 I が流れたときだけ出る）。
   同軸の電界 E(r) = E/(r·ln(D/d)) は導体表面 r = d/2 で最大 Emax = 2E/(d·ln(D/d)) */
const CC_TAN = {cv:.0005, of:.003};          // 誘電正接の目安（Wiki 3.2 の表: CV 0.0003〜0.001、OF 0.002〜0.004）
function ccModel(){
  const st = state, w = 2*Math.PI*st.cF, V = st.cV*1e3, E = V/Math.sqrt(3), C = st.cC*1e-6*st.cLen, tan = CC_TAN[st.cType];
  const Ic = w*C*E, Qc = w*C*V*V, Pd = w*C*V*V*tan, Pr = 3*st.cI*st.cI*st.cR*st.cLen;
  const Emax = 2*E/(st.cd*Math.log(st.cDs/st.cd));          // V/mm（d, D は mm）
  return {w, E, C, tan, Ic, Qc, Pd, Pr, Emax};
}
/* マーレーループ法。故障線と健全線を遠端で短絡してループ（往復 2L）にし、比例辺 P（故障線側）・Q（健全線側）で
   ブリッジを組む。電源は P・Q の接続点と故障点（大地）のあいだ。平衡条件 P·(2L − x) = Q·x → x = 2L·P/(P + Q)。
   検流計の振れは 2L·r − x（r = P/(P + Q)）に比例するとして描く */
function mlModel(){
  const st = state, est = 2*st.mL*st.mR, x = Math.min(st.mX, st.mL);   // 故障点は故障線の上（遠端まで）に限る
  return {est, x, g: (est - x)/(2*st.mL)};
}

/* 2次元の輪郭 pts（[x,y] の並び）を z 方向に厚み d だけ押し出す（中心 z=z0） */
function prism(pts, d, mat, parent, z0=0){
  const sh = new THREE.Shape(); sh.moveTo(pts[0][0], pts[0][1]); for (const [x,y] of pts.slice(1)) sh.lineTo(x, y);
  const geo = new THREE.ExtrudeGeometry(sh, {depth:d, bevelEnabled:false}); geo.translate(0, 0, z0 - d/2);
  /* 凡例の引き出し線は部品の position を指すので、形の中心を position に移す（原点のままだと地面を指した） */
  geo.computeBoundingBox(); const c = geo.boundingBox.getCenter(new THREE.Vector3()); geo.translate(-c.x, -c.y, -c.z);
  return mesh(geo, mat, parent, c.x, c.y, c.z);
}
/* 子の座標で組んだ Group の position を、子の外接箱の中心へ移す（見た目は変えない）。凡例の引き出し線が部品を指すように */
function centerGroup(grp){
  /* 子に Group が入れ子でも測れるよう、子孫のメッシュを grp の座標系で集める（親の行列は使わない。build 中は親の matrixWorld が未更新） */
  const b = new THREE.Box3();
  const walk = (o, m) => { o.updateMatrix(); const mm = m.clone().multiply(o.matrix);
    if (o.geometry){ if (!o.geometry.boundingBox) o.geometry.computeBoundingBox(); b.union(o.geometry.boundingBox.clone().applyMatrix4(mm)); }
    for (const ch of o.children) walk(ch, mm); };
  for (const ch of grp.children) walk(ch, new THREE.Matrix4());
  if (b.isEmpty()) return grp;
  const c = b.getCenter(new THREE.Vector3());
  for (const ch of grp.children) ch.position.sub(c);
  grp.position.add(c); return grp;
}

function smokeAt(parent, x, y, z, n=7){

    const o = new THREE.Mesh(new THREE.SphereGeometry(.2,12,10), m); parent.add(o); puffs.push(o); }

}
function smokeRun(sm, T){
  sm.puffs.forEach((o, i) => { const f = ((T*.25 + i/sm.puffs.length) % 1);
    o.position.set(sm.x + f*.9, sm.y + f*1.6, sm.z - f*.3); o.scale.setScalar(.6 + f*2.2); o.material.opacity = .45*(1 - f); });

/* 電流・水・蒸気の流れを光点で描く閉路（または開路）。pts の順が流れる向き */
function dkPath(parent, pts, n, mat, closed){
  if (closed) pts = pts.concat([pts[0]]);
  const cum = [0]; for (let i=1;i<pts.length;i++) cum.push(cum[i-1] + pts[i].distanceTo(pts[i-1]));
  const dots = []; for (let i=0;i<n;i++){ const d = mesh(new THREE.SphereGeometry(.07,10,10), mat, parent); d.castShadow = false; dots.push(d); }
  return {pts, cum, total:cum[cum.length-1], dots};
}
const _dkp = new THREE.Vector3();
function dkPathAt(p, s){
  s = ((s % p.total) + p.total) % p.total;
  let i = 1; while (i < p.cum.length-1 && p.cum[i] < s) i++;
  const a = p.pts[i-1], b = p.pts[i], f = (s - p.cum[i-1]) / Math.max(1e-6, p.cum[i] - p.cum[i-1]);
  return _dkp.copy(a).lerp(b, f);
}
/* 光点・粒の大きさを量に比例させる（初期状態の量で 1 倍、0.35〜3 倍に収める） */
function dkScale(p, ratio){ const k = Math.max(.35, Math.min(3, ratio)); p.dots.forEach(d => d.scale.setScalar(k)); }
function dkRun(p, T, on, dir=1){
  p.dots.forEach((d, i) => { d.visible = on; if (!on) return;
    d.position.copy(dkPathAt(p, dir*T + i/p.dots.length*p.total)); });
}

    const nose = mesh(new THREE.ConeGeometry(.16,.22,24), M.steelLight, t, 0, 0, .24); nose.rotation.x = Math.PI/2;   // 下流へすぼまる先端
    for (let i=0;i<5;i++){ const a=i/5*Math.PI*2;
      const b = mesh(new THREE.BoxGeometry(.21,.2,.02), M.brass, t, Math.cos(a)*.265, Math.sin(a)*.265, 0);   // 先端の半径 < 案内羽根の内縁 0.409
      b.rotation.z = a; b.rotation.x = .55; } }
  /* 反動水車の渦巻きケーシングと吸出し管（回らない）。水圧管の端（x=1.2, z=0.64）から +x の向きに、ケーシングの太い端へ接線で入る */
  const reaction = new THREE.Group(); g.add(reaction);
  /* 渦巻ケーシング: 入口（手前 z=+0.64 の側）が太く、水の回る向きに進むほど細くなる。8つの弧で太さを段々に変える。
     水は入口から +x の向きに入り、右→奥→左と回る（ランナの回る向きと同じ）。世界の xz 面で角度は π/2 から減る向き。
     回りながら全周で案内羽根へ水を配るので、残る流量が減る分だけ断面を細くする（以前は入口が中心向きにつながり、
     水が入口から中心へ一直線に進んで見えた。2026-11-06 実物照合） */
  const casingR = ph => .48 + .14 - .012*Math.min(7, ph/(Math.PI/4));   // 入口から φ 回った所の中心線の半径（太さ .14→.056）
  const casing = new THREE.Group(); reaction.add(casing); casing.position.set(2.0, .95, 0);
  /* 中心線の半径は、内側の縁が案内羽根のすぐ外（半径 0.48）にそろうよう、太さと一緒に小さくする（渦の形。
     一定にすると、細い側で内縁と案内羽根のあいだに壁の無い隙間ができ、水が外へ出て見えた。2026-11-06 監査） */
  for (let k=0;k<8;k++){ const arc = Math.PI*2/8, start = Math.PI/2 - (k+1)*arc, tube = .14 - k*.012;
    const geo = new THREE.TorusGeometry(.48 + tube, tube, 10, 8, arc); geo.rotateZ(start); geo.rotateX(Math.PI/2);
    mesh(geo, std({color:0x3b5a73, metalness:.3, roughness:.5, transparent:true, opacity:.6, depthWrite:false}), casing); }
  centerGroup(casing);
  pipe(V3(1.2,.95,.62), V3(2.0,.95,.62), pipeSee, reaction, .13);   // 入口（ケーシングの太い端の接線）
  /* 案内羽根（ガイドベーン）: ケーシングとランナのあいだの輪。開き具合で流量を変える（回らない） */
  const guide = new THREE.Group(); reaction.add(guide);
  for (let i=0;i<18;i++){ const a=i/18*Math.PI*2;
    const v = mesh(new THREE.BoxGeometry(.11,.2,.02), M.v, guide, 2.0+Math.cos(a)*.44, .95, Math.sin(a)*.44); v.rotation.y = -a - 1.1; }   // 内へ入る水の旋回を、ランナの回る向き（＝ケーシングの流れ）にそろえる
  centerGroup(guide);
  const draft = new THREE.Group(); reaction.add(draft);
  const draftF = mesh(new THREE.CylinderGeometry(.18,.24,.5,18), pipeSee, draft, 2.0, .62, 0);      // フランシス: ランナの真下で下へ広がる
  /* プロペラ: ランナは案内羽根より下の筒（吸出し管の上の端）の中で回る。筒からそのまま下へ広げて曲がりにつなぐ */
  const draftK = new THREE.Group(); draft.add(draftK);
  mesh(new THREE.CylinderGeometry(.4,.4,.3,24,1,true), pipeSee, draftK, 2.0, .68, 0);
  mesh(new THREE.CylinderGeometry(.4,.26,.23,24,1,true), pipeSee, draftK, 2.0, .415, 0);
  pipe(V3(2.0,.4), V3(2.85,.4), pipeSee, draft, .2);                                  // 曲がって放水面の下へ出る
  centerGroup(draft);
  /* ペルトンの導水: 水圧管の端から脇へ回り、ノズルの噴流がバケットに接線方向から当たる */
  const pfeed = new THREE.Group(); g.add(pfeed);
  /* 導水管もほかの管と同じ半透明にし、中を流れる水の光点を見せる（不透明だと光点が管の中に隠れた。2026-11-07） */
  pipe(V3(1.2,.95,.62), V3(1.2,.95,-.7), pipeSee, pfeed, .1);
  pipe(V3(1.2,.95,-.7), V3(1.58,.95,-.7), pipeSee, pfeed, .1);
  /* ノズルは外周のバケットの真ん中（ピッチ円 x=1.58）を接線の向きに狙う。ニードル弁が噴流の太さ＝流量を変え、
     デフレクタは急いで止めるときに噴流をバケットからそらす（ニードルはゆっくり閉じて水撃を避ける） */
  /* ノズル・ニードル・デフレクタは、バケットが回って通る輪（ランナ中心から半径 0.36〜0.51）の外に置く */
  const nozzle = mesh(new THREE.CylinderGeometry(.035,.1,.3,12,1,true), M.steel, pfeed, 1.58, .95, -.55); nozzle.rotation.x = Math.PI/2;   // 先端に口（半径 .035）
  const needle = mesh(new THREE.ConeGeometry(.03,.1,10), M.black, pfeed, 1.58, .95, -.40); needle.rotation.x = Math.PI/2;   // 口の中に座り、先だけ出る
  const deflector = mesh(new THREE.BoxGeometry(.02,.14,.16), M.steelDark, pfeed, 1.45, .95, -.25); deflector.rotation.y = .5;   // 噴流の外側（軸から .13）
  const jet = mesh(new THREE.CylinderGeometry(1,1,.36,12), std({color:0x7fc4ff, transparent:true, opacity:.75, emissive:0x2f7fd0, emissiveIntensity:.5}), pfeed, 1.58, .95, -.18);
  jet.rotation.x = Math.PI/2; jet.castShadow = false;
  mesh(new THREE.BoxGeometry(1.2,.3,1.1), DK.water, pfeed, 2.1, .475, 0);   // ランナの下の放水の溜まり（水面は放水路と同じ y=0.625。ランナはその上）
  const gen = mesh(new THREE.CylinderGeometry(.45,.45,.6,24), M.steelDark, g, 2.0, 1.95, 0);
  const shaftV = pipe(V3(2.0,1.0), V3(2.0,1.7), M.steelLight, g, .05);
  /* 総落差 Hg: 貯水池の水面と放水路の水面（y=0.625）の高さの差。寸法線は放水路の手前に立てる
     （放水路の右端に立てると、幅 390 の画面で枠の外に出た。2026-11-01 実描画）。
     上の水面の高さは anim で総落差 Hg から決める（hgY）。部品は y=0 を基準に作り、anim で伸ばす・動かす */
  const hgMark = new THREE.Group(); g.add(hgMark); hgMark.position.set(3.3, 1.5, 1.25);
  const hgRod = mesh(new THREE.CylinderGeometry(.025,.025,1,8), M.arrow, hgMark);
  const hgUp = mesh(new THREE.ConeGeometry(.07,.16,10), M.arrow, hgMark);
  const hgDn = mesh(new THREE.ConeGeometry(.07,.16,10), M.arrow, hgMark); hgDn.rotation.x = Math.PI;
  const hgLineU = pipe(V3(-5.1,0,0), V3(.15,0,0), M.arrow, hgMark, .012);   // 上の水面の高さ（ダムの下流側 x=-1.8 から寸法線まで）
  const hgLineL = pipe(V3(0,0,-.15), V3(0,0,.1), M.arrow, hgMark, .012);    // 下の水面の高さ（放水路の手前の縁から）
  hgMark.traverse(o => { o.castShadow = false; });
  Object.assign(hgMark.userData, {hgRod, hgUp, hgDn, hgLineU, hgLineL, yL:.625});
  /* 水の道は、どこでも上へ戻らない（y は増えない）。貯水池 → 導水路 → サージタンクの底 → 水圧管路 → 水車 */
  const P0 = [V3(-2.6,2.0), V3(-1.35,2.0), V3(0,2.0), V3(.45,2.0,.23), V3(1.2,.95,.62)];
  /* ランナの中心 (2.0, ·, 0) のまわりを、角度 π/2 から減る向き（ランナの回る向き）に回る。sw(φ, r, y): 入口から φ だけ回った点 */
  const sw = (ph, r, y=.95) => V3(2.0 + r*Math.cos(Math.PI/2 - ph), y, r*Math.sin(Math.PI/2 - ph));
  const spiral = (ph0, ph1, r0, r1, n, y0=.95, y1=.95) => Array.from({length:n}, (_, i) => { const f = (i+1)/n; return sw(ph0 + (ph1-ph0)*f, r0 + (r1-r0)*f, y0 + (y1-y0)*f); });
  /* ケーシングの中心線（casingR）に沿って φ まで回り、案内羽根を回りながら通ってランナの外周（半径 0.30）へ */
  const toRunner = (ph, n) => [V3(2.0,.95,.62)].concat(Array.from({length:n}, (_, i) => { const q = ph*(i+1)/n; return sw(q, casingR(q)); }),
    spiral(ph, ph + .5*Math.PI, casingR(ph), .3, 4));
  /* 枝の筋は、主流から分かれる点（ケーシングの中心線の φ）から始める（入口から3筋を重ねると、ケーシングの中だけ光点が3倍に増えて見えた。2026-11-06 監査） */
  const branch = (ph) => [sw(ph, casingR(ph))].concat(spiral(ph, ph + .5*Math.PI, casingR(ph), .3, 4));
  /* 光点の間隔を gap にそろえる（枝は主流より疎にして、全体の一部が入ることを見せる） */
  const nDots = (pts, gap) => { let L = 0; for (let i = 1; i < pts.length; i++) L += pts[i].distanceTo(pts[i-1]); return Math.max(3, Math.round(L/gap)); };
  const mkFlow = (pts, gap) => dkPath(g, pts, nDots(pts, gap), DK.dotW);
  /* フランシス: ランナの中で向きを変え、中心から吸出し管へ下る */
  const outF = ph => [sw(ph + .75*Math.PI, .12, .82), V3(2.0,.62), V3(2.0,.4), V3(2.85,.38), V3(3.6,.36)];
  /* プロペラ（カプラン）: ランナの上で下へ向きを変え、羽根の間（半径 0.27）を回りながら軸に沿って下る。
     ボスの先（下へすぼまる円錐）の外側を回って吸出し管の曲がりへ出る（軸の上を通ると円錐を突き抜けた。2026-11-06 監査）。
     「Water is directed tangentially through the wicket gate and spirals on to a propeller shaped runner」（Wikipedia "Kaplan turbine"） */
  /* ランナは水の旋回を取り去るので、羽根の間では旋回を弱め、ランナの下ではほぼ真下へ下ろす。ボスの先の円錐（y 0.30〜0.52）の
     下端より下（y 0.28）で軸を横切り、吸出し管の曲がりへ出る（旋回を続けて回り込むと、吸出し管の中で渦を巻いて見えた。2026-11-06 監査） */
  const outK = ph => { const a = ph + .5*Math.PI;
    return [sw(a + .1*Math.PI, .27, .85), sw(a + .25*Math.PI, .27, .74), sw(a + .35*Math.PI, .27, .6), sw(a + .4*Math.PI, .22, .48), sw(a + .4*Math.PI, .22, .28),
      V3(2.5,.28), V3(2.85,.28), V3(3.6,.28)]; };
  /* 1筋（主流）は水圧管路から 3/4 周してから入る。ほかの2筋は入口から 1/4 周・1/2 周で入る。全周から入ることを見せる */
  const flowR = mkFlow(P0.concat(toRunner(1.5*Math.PI, 12), outF(1.5*Math.PI)), .42);
  const flowR2 = mkFlow(branch(.5*Math.PI).concat(outF(.5*Math.PI)), .7);
  const flowR3 = mkFlow(branch(Math.PI).concat(outF(Math.PI)), .7);
  const flowK = mkFlow(P0.concat(toRunner(1.5*Math.PI, 12), outK(1.5*Math.PI)), .42);
  const flowK2 = mkFlow(branch(.5*Math.PI).concat(outK(.5*Math.PI)), .7);
  const flowK3 = mkFlow(branch(Math.PI).concat(outK(Math.PI)), .7);
  const flowP = dkPath(g, P0.concat([V3(1.2,.95,-.7), V3(1.58,.95,-.7), V3(1.58,.95,0), V3(1.7,.5,.05), V3(2.85,.5), V3(3.6,.5)]), 18, DK.dotW);
  /* サージタンクの中の水: 止まっているときの水位は貯水池の水面とほぼ同じ高さ。水撃の圧力を、この水位の上下で吸収する（電力Wiki 1.1） */
  const surgeW = mesh(new THREE.CylinderGeometry(.26,.26,1,20), DK.water, g, 0, 2.4, 0);
  Object.assign(g.userData, {runner, types, reaction, pfeed, draftF, draftK, flowR, flowR2, flowR3, flowK, flowK2, flowK3, flowP, res, surgeW, hgMark, jet, T:0});
  g.userData.flowsR = [flowR, flowR2, flowR3]; g.userData.flowsK = [flowK, flowK2, flowK3];
  g.userData.labels = (st) => [
    {obj:res, t:'貯水池（総落差の上の水面）', c:'#3572D6'},
    {obj:dam, t:'ダム', c:'#9AA1A6'},
    {obj:head, t:'導水路', c:'#6B7580'},
    {obj:surge, t:'サージタンク（水撃作用を、中の水位の上下でやわらげる）', c:'#8E9AA6'},
    {obj:pen, t:'水圧管路（ここで損失落差が出る）', c:'#6B7580'},
    {obj:runner, t:({pelton:'ペルトン水車（衝動水車。噴流は横から当たり、水は下へ落ちる）', francis:'フランシス水車（反動水車。水は外周から横に入り、中心から軸の向き（この図は立軸なので真下）へ抜ける）', propeller:'プロペラ水車（反動水車。水は羽根の間を軸に沿って（この図は立軸なので真下へ）抜ける）'})[st.sType], c:'#D9C7A0'},
    ...(st.sType==='pelton' ? [{obj:nozzle, t:'ノズル（水を噴流にしてバケットに当てる）', c:'#6B7580'},
                               {obj:needle, t:'ニードル弁（噴流の太さ＝流量を変える）', c:'#2B2B2B'},
                               {obj:deflector, t:'デフレクタ（急いで止めるとき噴流をそらす）', c:'#3B5A73'}]
                           : [{obj:casing, t:'渦巻ケーシング（水は接線の向きに入り、回りながら全周で案内羽根へ配られる。入口が太く、回るほど細くなる）', c:'#3B5A73'},
                              {obj:guide, t:'案内羽根（ガイドベーン。開き具合で流量を変える）', c:'#C9A227'},
                              {obj:draft, t:'吸出し管（反動水車だけにある。ランナ出口の速度エネルギーを圧力として回収する）', c:'#6B7580'}]),
    {obj:gen, t: st.sMode==='pump' ? '発電電動機（いまは電動機）' : '発電機', c:'#3B5A73'},
    {obj:tail, t:'放水路（総落差の下の水面）', c:'#3572D6'},
    {obj:hgMark, t:'総落差 Hg（上下の水面の高さの差。有効落差 H = Hg − hl とは別。図の高さは Hg に比例しない）', c:'#F0B57E'},
  ];
}
/* 総落差 Hg［m］→ 図の上の水面の高さ y。20〜600 m（30倍）をそのまま箱に入れると低い側が潰れるので、対数で y=2.25〜3.0 に割り当てる
   （2.25 は導水路の取水口の上端 2.14 より上、3.0 はダムの天端 3.1 より下）。縮尺どおりではないことは凡例に書く */
function hgY(Hg){ const f = Math.log(Math.max(20, Math.min(600, Hg))/20)/Math.log(30); return 2.25 + .75*f; }
function animSuiryoku(g, t, st, dt){
  const u = g.userData; if (!st.paused) u.T += dt;
  { const yU = hgY(st.sHg), yL = u.hgMark.userData.yL, m = u.hgMark.userData, o = u.hgMark.position.y;
    u.res.scale.y = (yU - .3)/2.2; u.res.position.y = .3 + (yU - .3)/2;          // 貯水池の箱は底 y=0.3 のまま、上面を yU に
    m.hgRod.scale.y = Math.max(.01, (yU - .12) - (yL + .12)); m.hgRod.position.y = (yU + yL)/2 - o;
    m.hgUp.position.y = yU - .08 - o; m.hgDn.position.y = yL + .08 - o;
    m.hgLineU.position.y = yU - o; m.hgLineL.position.y = yL - o;
    u.surgeW.scale.y = yU - 1.92; u.surgeW.position.y = 1.92 + (yU - 1.92)/2; }   // サージタンクの水位 ＝ 貯水池の水面
  for (const k in u.types) u.types[k].visible = (k === st.sType);
  const pel = st.sType === 'pelton';
  u.pfeed.visible = pel; u.reaction.visible = !pel;
  u.draftF.visible = st.sType === 'francis'; u.draftK.visible = st.sType === 'propeller';
  const dir = st.sMode === 'pump' ? -1 : 1;
  /* ペルトン（衝動水車）は水を汲み上げられない。揚水を選んでも、噴流を逆に流して見せない（読み値の表で断る） */
  const still = st.paused || (pel && st.sMode === 'pump');
  /* 鉛直軸で回る（発電機と同じ軸）。噴流（x=1.58 で +z 向き）が当たるバケットが噴流と同じ向きに進む回り方にする
     （rotation.y を増やすと、中心の左 0.47 の点は +z へ動く。逆にすると噴流と正面衝突した。2026-11-01 監査） */
  u.runner.rotation.y += (still ? 0 : dir*dt*3);
  { const r = .025*Math.sqrt(Math.max(.1, st.sQ)/50); u.jet.scale.set(Math.min(.06, r), 1, Math.min(.06, r));   // 噴流の太さ: 断面積 ∝ 流量 Q
    u.jet.visible = pel && st.sMode === 'gen' && !st.paused; }
  const on = pel ? [u.flowP] : st.sType === 'propeller' ? u.flowsK : u.flowsR;
  for (const f of [u.flowP, ...u.flowsR, ...u.flowsK]) if (!on.includes(f)) dkRun(f, 0, false);
  for (const f of on){ dkScale(f, st.sQ/50); dkRun(f, u.T*1.4, !still, dir); }   // 水の粒の大きさ ∝ 流量 Q
}

/* ---------- 1.2 火力（汽力） ----------
   水・蒸気の環: 復水器 → 給水ポンプ → 節炭器 → ボイラ（蒸発管）→ 過熱器 → 高圧タービン → 再熱器 → 低圧タービン → 復水器
   燃焼ガスの道: 火炉 → 過熱器 → 再熱器 → 節炭器 → 脱硝 → 空気予熱器 → 電気集じん器 → 脱硫 → 煙突（空気は押込通風機 → 空気予熱器 → 火炉） */
function buildKaryoku(g){
  const boiler = mesh(new THREE.BoxGeometry(1.4,3.6,1.4), DK.glass, g, -2.4, 2.0, 0);
  const flame = mesh(new THREE.ConeGeometry(.42,1.0,16), DK.flame, g, -2.4, 1.0, 0);
  /* 火炉の壁の水管（奥の壁と左の壁）。下の管寄せから入った水が、炎に熱せられながら上がって蒸気になる */
  const wall = new THREE.Group(); g.add(wall);
  for (let i=0;i<6;i++) mesh(new THREE.CylinderGeometry(.04,.04,2.6,6), DK.cold, wall, -2.95+i*.22, 1.9, -.55);
  for (let i=1;i<5;i++) mesh(new THREE.CylinderGeometry(.04,.04,2.6,6), DK.cold, wall, -2.95, 1.9, -.55+i*.22);
  for (const [y, m] of [[.6, DK.cold], [3.2, DK.hot]]){   // 下の管寄せは水（青）、上の管寄せは蒸発した後（赤）
    pipe(V3(-2.95,y,-.55), V3(-1.85,y,-.55), m, wall, .06); pipe(V3(-2.95,y,-.55), V3(-2.95,y,.33), m, wall, .06); }
  const sh = new THREE.Group(); g.add(sh); sh.position.set(-2.4, 3.45, 0);
  for (let i=0;i<5;i++) mesh(new THREE.TorusGeometry(.3,.04,6,20), DK.hot, sh, 0, 0, -.4+i*.2);
  /* 再熱器: 過熱器の下流側（排ガスが後部煙道へ向かう途中）に置く。高圧タービンを出た蒸気がここへ戻って再び熱せられ、低圧タービンへ行く
     （電力Wiki 1.2「再熱器（リヒータ）: 高圧タービン後の蒸気を再加熱」。過熱器との取り違えは頻出。2026-11-07） */
  /* 過熱器（赤）と見分けるため、輪を小さく（過熱器との管の中心線どうしの x のすき間 0.13、表面どうしで 0.06）し、紫にする（2026-11-07 監査） */
  const rh = new THREE.Group(); g.add(rh); rh.position.set(-1.85, 3.55, 0);
  for (let i=0;i<5;i++) mesh(new THREE.TorusGeometry(.12,.03,6,18), std({color:0x8e5bd6, roughness:.5}), rh, 0, 0, -.4+i*.2);
  centerGroup(rh);
  const back = mesh(new THREE.BoxGeometry(.7,2.8,1.2), DK.glass, g, -1.3, 2.4, 0);

    {obj:seaN, t:'冷却水（海水）', c:'#3572D6'},
    {obj:rpv, t:'原子炉圧力容器', c:'#9FB3C4'},
    {obj:core, t:'燃料（低濃縮ウラン）', c:'#7FB069'},
    {obj:rods, t: st.gType==='pwr' ? '制御棒（上から入れる）' : '制御棒（下から入れる）', c:'#2B2B2B'},
    ...(st.gType==='pwr' ? [{obj:sg, t:'蒸気発生器（一次と二次の境）', c:'#8E9AA6'}, {obj:pzr, t:'加圧器（一次系を沸騰させない）', c:'#8E9AA6'}]
                         : [{obj:recirc, t:'再循環ポンプ（流量で出力を調整）', c:'#3B5A73'}]),
    {obj:tb, t:'蒸気タービン', c:'#8E9AA6'},
    {obj:gen, t:'発電機', c:'#3B5A73'},
    {obj:cond, t:'復水器', c:'#4A5B68'},
    {obj:mtr, t:'主変圧器（発電機の電圧を送電の電圧へ上げる）', c:'#4A5B68'},
    {obj:stack, t:'排気筒（建屋の換気などの排気を、フィルタを通し放射線を監視して高い所から出す。燃焼の煙突ではない）', c:'#8E9AA6'},
  ];
}
function animGenshiryoku(g, t, st, dt){
  const u = g.userData; if (!st.paused) u.T += dt;
  const pwr = st.gType === 'pwr';
  u.sg.visible = u.pzr.visible = u.prim.visible = u.sec2.visible = pwr;
  u.recirc.visible = u.bwrLine.visible = !pwr;
  /* 挿入率 0 で炉心の外、1 で炉心と重なる。PWR は上から、BWR は下から */
  const ins = st.gRod;
  u.rods.position.y = pwr ? 1.2 + (1 - ins)*1.05 : 1.2 - (1 - ins)*1.05;
  dkRun(u.fPwrP, u.T*1.2, pwr && !st.paused);
  dkRun(u.fPwrS, u.T*1.2, pwr && !st.paused);
  dkRun(u.fBwr, u.T*1.2, !pwr && !st.paused);
  for (const o of [u.tb, u.gen]) o.rotation.x -= st.paused ? 0 : dt*4;
}

/* ---------- 2. 変電所 ----------
   受電線 → 避雷器 → 断路器 → 遮断器（＋変流器）→ 主変圧器 → 二次側の母線。
   断路器は電流を切れないので、止めるときは「遮断器 → 断路器」、入れるときは「断路器 → 遮断器」 */
function buildHenden(g){
  /* 情景: 砂利敷きの構内・囲いの柵・制御所の建屋・鉄構へ入ってくる送電線 */
  ground(g, DK.gravel);
  for (const [a, b] of [[V3(-3.9,0,-2.6), V3(3.9,0,-2.6)], [V3(-3.9,0,-2.6), V3(-3.9,0,2.6)], [V3(3.9,0,-2.6), V3(3.9,0,2.6)]]){
    for (const y of [.35,.7]) pipe(V3(a.x,y,a.z), V3(b.x,y,b.z), M.steelLight, g, .015);
    const n = Math.round(a.distanceTo(b)/.8); for (let i=0;i<=n;i++){ const p = a.clone().lerp(b, i/n); pipe(V3(p.x,0,p.z), V3(p.x,.75,p.z), M.steelLight, g, .02); } }
  mesh(new THREE.BoxGeometry(1.4,1.1,.9), DK.bldg, g, 3.0, .55, -1.9);
  mesh(new THREE.BoxGeometry(1.5,.08,1.0), DK.roofG, g, 3.0, 1.14, -1.9);
  pipe(V3(-4.0,2.9,0), V3(-3.2,2.5,0), M.brass, g, .035);   // 送電線（区画の外から鉄構へ）
  const gantry = new THREE.Group(); g.add(gantry);
  for (const s of [-1,1]) mesh(new THREE.BoxGeometry(.12,2.6,.12), DK.tower, gantry, -3.2, 1.3, s*.8);
  mesh(new THREE.BoxGeometry(.12,.12,1.8), DK.tower, gantry, -3.2, 2.6, 0);
  const la = new THREE.Group(); g.add(la); la.position.set(-2.4, 0, -.7);
  for (let k=0;k<6;k++) mesh(new THREE.CylinderGeometry(.13,.13,.18,14), M.ceramic, la, 0, .5+k*.22, 0);
  /* 避雷器は線路から枝分かれして大地との間に入る（直列には入らない）。線路から頭へ短い引き込みを描き、足元は大地に立てる */
  pipe(V3(0,1.62,0), V3(0,1.85,.7), M.brass, la, .025);
  const ds = new THREE.Group(); g.add(ds); ds.position.set(-1.5, 0, 0);
  for (const s of [-.35,.35]) mesh(new THREE.CylinderGeometry(.07,.07,1.3,10), M.ceramic, ds, s, .9, 0);
  const blade = mesh(new THREE.BoxGeometry(.75,.05,.05), M.brass, ds, 0, 1.6, 0);
  const cb = mesh(new THREE.BoxGeometry(.7,1.1,.7), M.tank, g, -.4, .75, 0);
  const ct = mesh(new THREE.TorusGeometry(.14,.05,8,18), M.steelDark, g, -.4, 1.5, 0); ct.rotation.x = Math.PI/2;
  for (const s of [-.15,.15]) mesh(new THREE.CylinderGeometry(.06,.06,.6,10), M.ceramic, g, -.4+s, 1.55, 0);
  const tr = mesh(new THREE.BoxGeometry(1.2,1.2,1.0), M.tank, g, 1.0, .8, 0);
  for (let i=0;i<5;i++) mesh(new THREE.BoxGeometry(.05,.9,.8), M.steel, g, 1.66, .8, -.4+i*.2);
  for (const s of [-.3,0,.3]) mesh(new THREE.CylinderGeometry(.06,.07,.6,10), M.ceramic, g, 1.0+s, 1.7, -.2);
  const vt = mesh(new THREE.CylinderGeometry(.12,.15,.6,12), M.ceramic, g, 2.3, .8, .7);
  const bus = new THREE.Group(); g.add(bus);
  pipe(V3(1.0,2.0,-.2), V3(3.2,2.0,-.2), M.brass, bus, .05);
  for (const z of [-.6,.2]) pipe(V3(3.2,2.0,-.2), V3(3.2,.4,z), M.brass, bus, .04);
  const line = new THREE.Group(); g.add(line);
  pipe(V3(-3.2,2.5), V3(-2.4,1.85), M.brass, line, .035); pipe(V3(-2.4,1.85), V3(-1.85,1.6), M.brass, line, .035);
  pipe(V3(-1.15,1.6), V3(-.55,1.85), M.brass, line, .035); pipe(V3(-.25,1.85), V3(1.0,1.95), M.brass, line, .035);
  const fl = dkPath(g, [V3(-3.2,2.5), V3(-2.4,1.85), V3(-1.85,1.6), V3(-1.15,1.6), V3(-.55,1.85), V3(-.25,1.85), V3(1.0,1.95), V3(1.0,2.0,-.2), V3(3.2,2.0,-.2), V3(3.2,.4,-.6)], 16, M.curr);
  for (const o of [gantry, la, ds, bus]) centerGroup(o);   // 凡例の引き出し線が部品を指すように（原点・足元を指していた）
  Object.assign(g.userData, {blade, cb, fl, T:0});
  g.userData.labels = [
    {obj:gantry, t:'受電用の鉄構（ここへ送電線が入る）', c:'#8E9AA6'},
    {obj:la, t:'避雷器（雷の過電圧を大地へ逃がす）', c:'#E6D3A3'},
    {obj:ds, t:'断路器 DS（電流は切れない。回路を目で見て開くため）', c:'#D9C7A0'},
    {obj:cb, t:'遮断器 CB（負荷電流も事故電流も切る）', c:'#4A5B68'},
    {obj:ct, t:'変流器 CT（二次側を開放してはいけない）', c:'#3B5A73'},
    {obj:tr, t:'主変圧器', c:'#4A5B68'},
    {obj:vt, t:'計器用変圧器 VT（二次側を短絡してはいけない）', c:'#E6D3A3'},
    {obj:bus, t:'二次側の母線と配電線の引出し', c:'#D9C7A0'},
  ];
}
function animHenden(g, t, st, dt){
  const u = g.userData; if (!st.paused) u.T += dt;
  u.blade.rotation.z = st.bDS ? 0 : Math.PI/2.4;      // 開くと刃が持ち上がる
  u.blade.position.x = st.bDS ? 0 : -.2;
  dkRun(u.fl, u.T*1.6, st.bDS && st.bCB && !st.paused);
}

/* ---------- 3.1 架空送電 ----------
   鉄塔3基・2径間。たるみは実寸の比 D/S が小さすぎて見えないので、図では 10 倍に誇張する */
const TW_X = [-3.2, 0, 3.2], TW_H = 3.6, PH_Y = [3.3, 2.75, 2.2];
function buildSouden(g){
  /* 情景: 草地と山・木（木は電線の下を避け、径間の外と手前・奥に置く。たるみを大きくすると電線が地面近くまで下がるため） */
  ground(g, DK.grass);
  mountains(g, [[-2.6,-2.6,3.0,1.1], [.6,-2.7,3.6,1.2], [3.2,-2.6,2.6,1.0]]);
  for (const [x, z] of [[-3.6,1.9], [-1.5,2.1], [1.6,2.0], [3.6,1.8], [-2.0,-1.9], [2.2,-1.9]]) tree(g, x, z);
  for (const x of TW_X){
    const tw = new THREE.Group(); g.add(tw); tw.position.x = x;
    for (const [sx,sz] of [[-1,-1],[-1,1],[1,-1],[1,1]]) pipe(V3(sx*.35,0,sz*.35), V3(sx*.08,TW_H,sz*.08), DK.tower, tw, .03);
    for (const y of PH_Y) pipe(V3(0,y,-.75), V3(0,y,.75), DK.tower, tw, .03);
    for (const y of PH_Y) for (const s of [-1,1]){ for (let k=0;k<4;k++) mesh(new THREE.CylinderGeometry(.06,.06,.03,10), M.ceramic, tw, 0, y-.08-k*.07, s*.65); }
  }
  const towers = g.children.filter(o => o.isGroup);
  const lines = new THREE.Group(); g.add(lines);
  const gw = new THREE.Group(); g.add(gw);
  pipe(V3(TW_X[0],TW_H+.05), V3(TW_X[2],TW_H+.05), DK.wireAl, gw, .02); centerGroup(gw);
  lines.position.y = 2.2;   // 凡例の引き出し線の点（電線の束の中）。animSouden は電線をこの高さ基準で作る
  Object.assign(g.userData, {lines, sagKey:null, towers});
  g.userData.labels = [
    {obj:towers[1], t:'鉄塔', c:'#8E9AA6'},
    {obj:lines, t:'電線（3相×2回線。たるみは10倍に誇張）', c:'#B9C2CA'},
    {obj:gw, t:'架空地線（雷から電線を守る）', c:'#B9C2CA'},
  ];
}
function animSouden(g, t, st, dt){
  const u = g.userData;
  const d = tdSag(), key = d.Dt.toFixed(3);
  if (u.sagKey === key) return;
  u.sagKey = key;
  while (u.lines.children.length){ const c = u.lines.children.pop(); c.geometry.dispose(); }
  const vis = Math.min(1.6, d.Dt*.107);                    // 沈み ∝ 温度変化後のたるみ（初期 5.6 m で 0.6、15 m で頭打ち）。D/S にすると径間 2 倍でも 2 倍にしか見えない
  for (let span=0; span<2; span++){
    const x0 = TW_X[span], x1 = TW_X[span+1];
    for (const y of PH_Y) for (const s of [-1,1]){
      const pts = []; for (let i=0;i<=16;i++){ const f=i/16, x=x0+(x1-x0)*f; pts.push(V3(x, y-.36 - 4*vis*f*(1-f) - u.lines.position.y, s*.65)); }
      const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .018, 6), DK.wireAl);
      u.lines.add(tube);
    }
  }
}

/* ---------- 3.2 地中送電 ----------
   3つの見る対象を持つ。
     cable  … CV ケーブルの段むき断面（内側から 導体・内部半導電層・XLPE・外部半導電層・遮へい・シース）
     fusetsu … 布設方式3つの土の断面（直接埋設・管路・暗きょ）
     murray … マーレーループ法（故障線と健全線を遠端で短絡し、ブリッジで故障点を探す）
   ---------- */
const CC_LAY_X = {direct:-2.1, duct:0, tunnel:2.1};
function buildChichuu(g){
  /* 情景: 道路の下を通るケーブル。ケーブル断面は拡大した見本として路面の上に置く（実寸ではない） */
  const road = ground(g, DK.asphalt);
  mesh(new THREE.BoxGeometry(8,.06,.9), DK.concrete, g, 0, .05, -2.3);                     // 歩道
  for (let i=0;i<6;i++) mesh(new THREE.BoxGeometry(.7,.01,.08), M.meter, g, -3.3+i*1.3, .045, 2.0);   // 車線の白線
  for (const x of [-3.0, -.2, 2.6]) tree(g, x, -2.35, 1.0);
  const ax = (r, x0, x1, mat, parent) => { const o = mesh(new THREE.CylinderGeometry(r, r, x1-x0, 40), mat, parent, (x0+x1)/2, 1.1, 0); o.rotation.z = Math.PI/2; return o; };
  /* ケーブル断面（段むき）。外側の層ほど手前で切ってある */
  const cab = new THREE.Group(); g.add(cab);
  const xlpeMat = std({color:0xe9edf0, transparent:true, opacity:.55, roughness:.3});
  const semiMat = std({color:0x2a2d31, roughness:.7});
  const sheath = ax(.62, -2.6, -.9, M.black, cab);
  const shield = ax(.58, -2.6, -.3, M.copper, cab);
  const osemi = ax(.555, -2.6, .2, semiMat, cab);
  const xlpe = ax(.53, -2.6, 1.2, xlpeMat, cab);
  const isemi = ax(.25, -2.6, 1.6, semiMat, cab);
  const cond = ax(.23, -2.6, 2.4, M.copper, cab);
  /* 充電電流の模式: 導体と遮へいのあいだを半径方向に行き来する点（電圧の向きが変わるたびに充電・放電） */
  const charges = [];
  for (let i=0;i<12;i++){ const a = i/12*Math.PI*2, d = mesh(new THREE.SphereGeometry(.035,8,8), DK.dotS, cab, 1.21, 1.1, 0); d.castShadow = false; d.userData.a = a; charges.push(d); }
  /* 布設方式。土の断面を手前に切って見せる */
  const lay = new THREE.Group(); g.add(lay);
  const soilMat = std({color:0x8a6a48, transparent:true, opacity:.35, roughness:.95});
  mesh(new THREE.BoxGeometry(6.6, 1.8, 2.2), soilMat, lay, 0, .9, 0);
  mesh(new THREE.BoxGeometry(6.6, .06, 2.2), std({color:0x4a5058, transparent:true, opacity:.35}), lay, 0, 1.83, 0);   // 舗装面（中が見えるよう半透明）
  const cableBlk = std({color:0x1f2226, roughness:.6});
  const trio = (parent, x, y, r=.07) => { for (const dx of [-r*1.1, r*1.1]) mesh(new THREE.CylinderGeometry(r,r,2.2,14), cableBlk, parent, x+dx, y, 0).rotation.x = Math.PI/2;
    mesh(new THREE.CylinderGeometry(r,r,2.2,14), cableBlk, parent, x, y+r*1.9, 0).rotation.x = Math.PI/2; };
  const direct = new THREE.Group(); lay.add(direct);
  trio(direct, CC_LAY_X.direct, 1.1);
  for (const [w,h,dx,dy] of [[.7,.06,0,.95],[.06,.4,-.33,1.15],[.06,.4,.33,1.15],[.7,.06,0,1.38]]) mesh(new THREE.BoxGeometry(w,h,2.2), M.ceramic, direct, CC_LAY_X.direct+dx, dy, 0);
  const duct = new THREE.Group(); lay.add(duct);
  const pipeMat = std({color:0xb9c2ca, transparent:true, opacity:.6, roughness:.4});
  for (const [i,j] of [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]){
    const x = CC_LAY_X.duct - .4 + i*.4, y = .95 + j*.4;
    mesh(new THREE.CylinderGeometry(.16,.16,2.2,18,1,true), pipeMat, duct, x, y, 0).rotation.x = Math.PI/2;
    if (j===0) mesh(new THREE.CylinderGeometry(.08,.08,2.2,14), cableBlk, duct, x, y-.06, 0).rotation.x = Math.PI/2;   // 下段だけ使用中、上段は予備管
  }
  const tunnel = new THREE.Group(); lay.add(tunnel);
  for (const [w,h,dx,dy] of [[1.6,.08,0,.2],[1.6,.08,0,1.45],[.08,1.3,-.78,.82],[.08,1.3,.78,.82]]) mesh(new THREE.BoxGeometry(w,h,2.2), DK.concrete, tunnel, CC_LAY_X.tunnel+dx, dy, 0);
  for (const y of [.55,.85,1.15]){ mesh(new THREE.BoxGeometry(.35,.03,2.2), M.steel, tunnel, CC_LAY_X.tunnel-.5, y, 0); trio(tunnel, CC_LAY_X.tunnel-.5, y+.08, .05); }
  const person = new THREE.Group(); tunnel.add(person);
  mesh(new THREE.CylinderGeometry(.09,.09,.55,10), M.u, person, CC_LAY_X.tunnel+.3, .55, .3);
  mesh(new THREE.SphereGeometry(.09,10,10), DK.house, person, CC_LAY_X.tunnel+.3, .92, .3);
  for (const o of [direct, duct, tunnel]) centerGroup(o);
  const hl = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.75, 2.3), new THREE.MeshBasicMaterial({color:0xf0b57e, wireframe:true}));
  hl.position.set(0, .9, 0); lay.add(hl);
  /* マーレーループ法 */
  const mur = new THREE.Group(); g.add(mur);
  const MX0 = -2.4, MX1 = 2.8;
  const c1 = pipe(V3(MX0,1.0,-.35), V3(MX1,1.0,-.35), cableBlk, mur, .06);
  const c2 = pipe(V3(MX0,1.0,.35), V3(MX1,1.0,.35), cableBlk, mur, .06);
  const jump = pipe(V3(MX1,1.0,-.35), V3(MX1,1.0,.35), M.copper, mur, .04);
  const fault = new THREE.Group(); mur.add(fault);
  mesh(new THREE.SphereGeometry(.11,14,14), std({color:0xd24a43, emissive:0xd24a43, emissiveIntensity:1.2}), fault, 0, 1.0, -.35);
  pipe(V3(0,1.0,-.35), V3(0,.05,-.35), M.u, fault, .015); centerGroup(fault);   // 中心の x は 0 のままなので、anim が x を決めても位置はずれない
  const bridge = mesh(new THREE.BoxGeometry(.8,1.0,1.1), M.tank, mur, -3.0, .8, 0);
  for (const z of [-.35,.35]) pipe(V3(-2.6,1.0,z), V3(MX0,1.0,z), M.copper, mur, .03);
  const dial = mesh(new THREE.CylinderGeometry(.28,.28,.04,24), M.ceramic, mur, -3.0, 1.0, .56); dial.rotation.x = Math.PI/2;
  const needle = new THREE.Group(); needle.position.set(-3.0, 1.0, .6); mur.add(needle);
  mesh(new THREE.BoxGeometry(.03,.24,.02), M.u, needle, 0, .12, 0);
  Object.assign(g.userData, {cab, lay, mur, charges, hl, fault, needle, MX0, MX1, direct, duct, tunnel, T:0});
  g.userData.labels = (st) => st.cView==='fusetsu' ? [
    {obj:direct, t:'直接埋設式（トラフに入れて土に埋める）', c:'#E6D3A3'},
    {obj:duct, t:'管路式（管に引き入れる。上段は予備管）', c:'#B9C2CA'},
    {obj:tunnel, t:'暗きょ式（洞道。人が入って保守できる）', c:'#9AA1A6'},
  ] : st.cView==='murray' ? [
    {obj:c1, t:'故障した線（故障点まで x）', c:'#D24A43'},
    {obj:c2, t:'健全な線（遠端で故障線と短絡）', c:'#B9C2CA'},
    {obj:jump, t:'遠端の短絡（ループ往復 2L）', c:'#C07A3A'},
    {obj:fault, t:'故障点（地絡）', c:'#D24A43'},
    {obj:bridge, t:'ブリッジ（比例辺 P・Q と検流計）', c:'#4A5B68'},
  ] : [
    {obj:cond, t:'① 導体（銅）', c:'#C07A3A'},
    {obj:isemi, t:'② 内部半導電層（導体表面の電界を均一化）', c:'#2A2D31'},
    {obj:xlpe, t:'③ 絶縁体 XLPE（架橋ポリエチレン）', c:'#E9EDF0'},
    {obj:osemi, t:'④ 外部半導電層', c:'#2A2D31'},
    {obj:shield, t:'⑤ 遮へい銅テープ（接地する）', c:'#C07A3A'},
    {obj:sheath, t:'⑥ シース（ビニル防食層）', c:'#1F2226'},
    {obj:road, t:'道路（ケーブルは拡大した見本。実際は路面の下に布設する）', c:'#3D4247'},
  ];
}
function animChichuu(g, t, st, dt){
  const u = g.userData; if (!st.paused) u.T += dt;
  u.cab.visible = st.cView==='cable'; u.lay.visible = st.cView==='fusetsu'; u.mur.visible = st.cView==='murray';
  if (st.cView==='cable'){
    const m = ccModel(), amp = Math.min(1, m.Ic/30);           // 充電電流が大きいほど大きく揺れる（模式）
    u.charges.forEach(d => { const r = .26 + .26*(.5 - .5*Math.cos(u.T*3))*(.3 + .7*amp); d.position.set(1.21, 1.1 + r*Math.sin(d.userData.a), r*Math.cos(d.userData.a)); });
  } else if (st.cView==='fusetsu'){
    u.hl.position.x = CC_LAY_X[st.cLay];
  } else {
    u.fault.position.x = u.MX0 + (u.MX1 - u.MX0)*mlModel().x/st.mL;
    u.needle.rotation.z = -Math.max(-1.2, Math.min(1.2, mlModel().g*1.2));   // 振れ ∝ g（g は −0.6〜1。初期 0.2 で張り付かない）
  }
}

/* ---------- 3.2 配電（単相3線式） ----------
   柱上変圧器の低圧側は 外線a・中性線n・外線b の3本。a–n と n–b に 100 V、a–b に 200 V */
function buildHaiden(g){
  /* 情景: 住宅地。電柱は道路の脇、家と工場は道路の手前の敷地 */
  ground(g, DK.grass);
  mesh(new THREE.BoxGeometry(8,.03,1.1), DK.asphalt, g, 0, .05, -.9);
  for (let i=0;i<6;i++) mesh(new THREE.BoxGeometry(.6,.01,.06), M.meter, g, -3.3+i*1.3, .07, -.9);
  for (const [x, z] of [[-3.3,1.8], [-.6,2.2], [3.4,2.0], [-3.4,-2.2], [1.0,-2.2], [3.3,-2.1]]) tree(g, x, z, .9);
  const pole = mesh(new THREE.CylinderGeometry(.09,.13,4.2,12), DK.pole, g, -2.4, 2.1, 0);
  pipe(V3(-2.4,4.0,-.7), V3(-2.4,4.0,.7), M.steel, g, .04);
  const hv = new THREE.Group(); g.add(hv);
  for (const z of [-.6,0,.6]) pipe(V3(-3.4,4.05,z), V3(3.6,4.05,z), DK.wireAl, hv, .018);
  /* 単相3線式（低圧）の部品。三相3線式を見るときは隠す */
  const sp = new THREE.Group(); g.add(sp);
  const ptr = mesh(new THREE.CylinderGeometry(.28,.28,.7,16), M.tank, sp, -2.05, 3.2, 0);
  const lvA = pipe(V3(-2.05,2.9,-.3), V3(2.6,2.9,-.3), M.u, sp, .02);
  const lvN = new THREE.Group(); sp.add(lvN);
  pipe(V3(-2.05,2.7,0), V3(.15,2.7,0), DK.wireAl, lvN, .022);
  pipe(V3(.45,2.7,0), V3(2.6,2.7,0), DK.wireAl, lvN, .022);
  const gap = pipe(V3(.15,2.7,0), V3(.45,2.7,0), DK.wireAl, lvN, .022);
  const lvB = pipe(V3(-2.05,2.5,.3), V3(2.6,2.5,.3), M.w, sp, .02);
  const houses = [], bulbs = [];
  for (const [i,x] of [[0,.6],[1,2.2]]){
    const h = mesh(new THREE.BoxGeometry(1.0,.8,.9), DK.house, sp, x, .4, 1.2);
    const r = mesh(new THREE.ConeGeometry(.78,.5,4), DK.roof, sp, x, 1.05, 1.2); r.rotation.y = Math.PI/4;
    const b = mesh(new THREE.SphereGeometry(.13,14,14), DK.bulb.clone(), sp, x, .45, 1.7); b.castShadow = false;
    houses.push(h); bulbs.push(b);
    pipe(V3(x, i===0 ? 2.9 : 2.5, i===0 ? -.3 : .3), V3(x, .8, 1.2), i===0 ? M.u : M.w, sp, .015);
    pipe(V3(x+.15, 2.7, 0), V3(x+.15, .8, 1.2), DK.wireAl, sp, .015);
  }
  const bal = mesh(new THREE.BoxGeometry(.4,.4,.4), M.steelDark, sp, 3.0, 2.7, 0);
  /* 三相3線式（高圧）の部品。6.6 kV の3本から工場（三相負荷）へ引き込み、手前に力率改善用コンデンサ */
  const tp = new THREE.Group(); g.add(tp);
  const fac = mesh(new THREE.BoxGeometry(1.8,1.1,1.2), DK.house, tp, 1.6, .55, 1.0);
  for (let i=0;i<3;i++){ const r = mesh(new THREE.BoxGeometry(.6,.3,1.2), DK.roof, tp, 1.0+i*.6, 1.25, 1.0); r.rotation.z = .5; }
  for (const z of [-.6,0,.6]) pipe(V3(2.6,4.05,z), V3(2.2,1.2,.8+z*.3), DK.wireAl, tp, .015);
  const cap = new THREE.Group(); tp.add(cap); cap.position.set(-.2, 0, 1.2);
  for (let i=0;i<3;i++) mesh(new THREE.CylinderGeometry(.14,.14,.6,14), M.steelLight, cap, i*.34, .3, 0);
  pipe(V3(.5,.55,1.2), V3(.7,.55,1.0), DK.wireAl, tp, .015);
  const fl3 = dkPath(g, [V3(-3.4,4.05,0), V3(2.6,4.05,0), V3(2.2,1.2,.8)], 14, M.curr);
  centerGroup(hv); centerGroup(lvN);
  Object.assign(g.userData, {gap, bulbs, bal, sp, tp, cap, fl3, T:0});
  g.userData.labels = (st) => st.hView==='tp' ? [
    {obj:hv, t:'高圧配電線（三相3線式・6.6 kV など）', c:'#B9C2CA'},
    {obj:fac, t:'工場（三相負荷・遅れ力率）', c:'#D9C7A0'},
    {obj:cap, t:'力率改善用コンデンサ（Qc を入れると働く）', c:'#B9C2CA'},
  ] : [
    {obj:hv, t:'高圧配電線（6.6 kV）', c:'#B9C2CA'},
    {obj:ptr, t:'柱上変圧器', c:'#4A5B68'},
    {obj:lvA, t:'外線 a', c:'#D24A43'},
    {obj:lvN, t:'中性線 n（切れると電圧が偏る）', c:'#B9C2CA'},
    {obj:lvB, t:'外線 b', c:'#3572D6'},
    {obj:houses[0], t:'負荷1（a–n 間・100 V 機器）', c:'#D9C7A0'},
    {obj:houses[1], t:'負荷2（n–b 間・100 V 機器）', c:'#D9C7A0'},
    {obj:bal, t:'バランサ（巻数比1:1の単巻変圧器）', c:'#3B5A73'},
  ];
}
function animHaiden(g, t, st, dt){
  const u = g.userData, three = st.hView==='tp';
  u.sp.visible = !three; u.tp.visible = three;
  if (!st.paused) u.T += dt;
  if (three){
    const m = hd3();
    u.cap.scale.setScalar(.4 + .6*st.h3Qc/1500);   // 大きさ ∝ Qc（Qc = 0 でも置き場所は見せる。3000 kvar で 1.6）
    dkScale(u.fl3, m.I/218.7);                               // 光点の大きさ ∝ 線電流（初期 2000 kW・力率 0.8・6.6 kV で約 219 A）
    dkRun(u.fl3, u.T*1.5, !st.paused);
    return;
  }
  dkRun(u.fl3, 0, false);
  const r = hdSolve();
  u.gap.visible = st.hBreak !== true;
  u.bal.visible = !!st.hBal;
  r.V.forEach((v, i) => { const k = Math.max(0, Math.min(2.2, (v/100)**2)); u.bulbs[i].material.emissiveIntensity = k*1.1; });
}

for (const id of ORDER){ const g = new THREE.Group(); g.position.set(MACHINES[id].x, .3, 0); builders[id](g); g.userData.id = id; scene.add(g); groups[id] = g; }

function flyTo(v){ cam.want = {target:new THREE.Vector3(...v.target), dist:v.dist, theta:v.theta, phi:v.phi}; camShot = null; }
/* 工場全景は「並んだ機器が全部入る距離」を実寸から計算する。
   手で決めると機器を足すたびに外す——実測で、5台の時点ですでに幅の狭い画面では
   パワエレが枠外に出ていた（気づかないまま公開していた）。
   camera.aspect は resize() の直後だけ信用できるので、そこから呼ぶ。 */
function fitOverview(){
  if (!groups[ORDER[0]]) return;
  const box = new THREE.Box3();
  for (const id of ORDER) box.expandByObject(groups[id]);
  const sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const half = Math.tan(camera.fov*Math.PI/360);
  const a = Math.max(.4, camera.aspect || 1);
  const d = Math.max(sz.y/(2*half), sz.x/(2*half*a)) * 1.18;   // 1.18 は周囲の余白
  VIEWS.overview.target = [c.x, 2, 0];
  VIEWS.overview.dist = Math.min(130, Math.max(22, d));
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let drag=null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; cam.theta -= dx*.006; cam.phi = Math.min(1.5, Math.max(.25, cam.phi - dy*.006)); drag.x=e.clientX; drag.y=e.clientY; cam.want=null; });
cv.addEventListener('pointerup', e=>{ if (drag && !drag.moved) pick(e); drag=null; });
cv.addEventListener('wheel', e=>{ e.preventDefault(); cam.dist = Math.min(60, Math.max(4, cam.dist * (1 + Math.sign(e.deltaY)*.08))); cam.want=null; }, {passive:false});
const ray = new THREE.Raycaster();
function pick(e){
  const r = cv.getBoundingClientRect(); const m = new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m, camera);
  const hits = ray.intersectObjects(Object.values(groups), true);
  if (!hits.length) return;
  let o = hits[0].object; while (o && !o.userData.id) o = o.parent;
  if (o && o.userData.id !== state.current) select(o.userData.id);
}

/* ---------- 凡例と引き出し線 ----------
   3D上に文字を常駐させない。凡例（左上・順序固定）の行に触れた1件だけ、
   その部品へ線を引く。回しても凡例の並びは変わらないので、
   「どれが何を指しているか」が分からなくなることがない。 */
const labelsEl = document.getElementById('labels');

const legendEl = document.getElementById('legend');
const lgshow = document.getElementById('lgshow');
const labelNodes = [];   // 全景の機器名ラベル

let pinIdx = null;       // クリック固定・ツアー指定の行

function rebuildLabels(){
  for (const n of labelNodes) if (n.el) n.el.remove();
  labelNodes.length = 0; legendRows = []; hoverIdx = pinIdx = null;
  leaders.innerHTML = ''; legendEl.innerHTML = '';
  legendEl.classList.add('hidden'); lgshow.classList.add('hidden');
  if (!state.current){
    const narrow = window.innerWidth < 600;   // 狭い画面では短い名前にし、高さを互い違いにして重なりを避ける
    for (const [i, id] of ORDER.entries()){ const m = MACHINES[id];
      const el = document.createElement('div'); el.className = 'lbl big';
      el.style.setProperty('--lc', '#F0B57E');
      el.textContent = m.num + ' ' + (narrow ? m.short : m.title); el.title = m.title; el.onclick = ()=>select(id);
      labelsEl.appendChild(el);
      labelNodes.push({el, pos:new THREE.Vector3(m.x, (m.ly || 5.6) + (narrow && i % 2 ? 6 : 0), 0), hw:el.offsetWidth/2});
    }
    return;
  }
  /* 同じ名前のアンカー（直流機の界磁磁極Nなど）は1行にまとめ、線を複数本出す */
  const g = groups[state.current];
  const byName = new Map();
  const labs = (typeof g.userData.labels === 'function') ? g.userData.labels(state) : g.userData.labels;
  for (const l of labs){
    if (!l.obj) continue;
    if (!byName.has(l.t)) byName.set(l.t, {name:l.t, color:l.c, nodes:[]});
    byName.get(l.t).nodes.push({obj:l.obj});
  }
  /* 狭い画面では畳んで開く。3Dの上に凡例が覆いかぶさるのを避ける */
  const narrow = window.innerWidth < 900;
  legendEl.classList.toggle('hidden', narrow);
  lgshow.classList.toggle('hidden', !narrow);
  const cap = document.createElement('div'); cap.className = 'lgcap';
  const capT = document.createElement('span'); capT.textContent = '部品（行に触れると指す）';
  const hide = document.createElement('button'); hide.textContent = '隠す';
  hide.onclick = ()=>{ legendEl.classList.add('hidden'); lgshow.classList.remove('hidden'); };
  cap.append(capT, hide); legendEl.appendChild(cap);
  for (const row of byName.values()){
    const b = document.createElement('button'); b.className = 'lgrow';
    const chip = document.createElement('i'); chip.style.background = row.color;
    const tx = document.createElement('span'); tx.textContent = row.name;
    b.append(chip, tx); legendEl.appendChild(b);
    const i = legendRows.length; row.el = b; legendRows.push(row);
    b.onmouseenter = ()=>{ hoverIdx = i; paintLegend(); };
    b.onmouseleave = ()=>{ hoverIdx = null; paintLegend(); };
    b.onfocus = ()=>{ hoverIdx = i; paintLegend(); };
    b.onblur = ()=>{ hoverIdx = null; paintLegend(); };
    b.onclick = ()=>{ pinIdx = (pinIdx === i ? null : i); paintLegend(); };
    row.lines = row.nodes.map(()=>{
      const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('stroke', row.color); ln.setAttribute('stroke-width','1.5');
      leaders.appendChild(ln);
      const dt = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dt.setAttribute('r','3.5'); dt.setAttribute('fill', row.color);
      leaders.appendChild(dt);
      return {ln, dt};
    });
  }
  paintLegend();
}
const _wp = new THREE.Vector3();
/* 指している部品の示し方。全部を □ で囲うと「何を指しているか」がぼやけるので、
   ・単体の部品 → その部品の稜線を破線でなぞる（円筒なら円、板なら板の輪郭）
   ・複数部品のまとまり → 外接箱の四隅だけを「かぎ括弧」で示す
   どちらも明滅させ、部品自身の線と見分けがつくようにする。
   手前の部品に隠れないよう depthTest は切る。 */
const hlMat = new THREE.LineDashedMaterial({color:0xffffff, dashSize:.13, gapSize:.085,
  transparent:true, opacity:.9, depthTest:false});
const hl = new THREE.LineSegments(new THREE.BufferGeometry(), hlMat);
hl.renderOrder = 999; hl.frustumCulled = false; hl.matrixAutoUpdate = false; hl.visible = false; scene.add(hl);
const _edgeCache = new Map();
const _box = new THREE.Box3();
let hlKey = null, hlOwn = null, hlTarget = null;
/* 外接箱の四隅から辺の方向へ短く伸ばした「かぎ」 */
function cornerGeo(box){
  const mn = box.min, mx = box.max, pts = [];
  const L = [Math.min((mx.x-mn.x)*.3, .55), Math.min((mx.y-mn.y)*.3, .55), Math.min((mx.z-mn.z)*.3, .55)];
  for (const ix of [0,1]) for (const iy of [0,1]) for (const iz of [0,1]){
    const P = [ix?mx.x:mn.x, iy?mx.y:mn.y, iz?mx.z:mn.z], sg = [ix?-1:1, iy?-1:1, iz?-1:1];
    for (let ax=0; ax<3; ax++){ const Q = P.slice(); Q[ax] += sg[ax]*L[ax]; pts.push(P[0],P[1],P[2], Q[0],Q[1],Q[2]); }
  }
  const gm = new THREE.BufferGeometry();
  gm.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return gm;
}
function setHighlight(obj){
  if (!obj){ hl.visible = false; hlKey = null; return; }
  const single = obj.isMesh && obj.geometry;
  const key = obj.uuid + (single ? '|e' : '|c');
  if (key !== hlKey){
    hlKey = key;
    if (hlOwn){ hlOwn.dispose(); hlOwn = null; }
    if (single){
      let e = _edgeCache.get(obj.geometry.uuid);
      if (!e){ e = new THREE.EdgesGeometry(obj.geometry, 24); _edgeCache.set(obj.geometry.uuid, e); }
      hl.geometry = e;
    } else {
      hl.geometry = hlOwn = cornerGeo(_box.setFromObject(obj));
    }
    hl.computeLineDistances();
  } else if (!single){
    /* まとまりは中身が動くので、箱だけ毎フレーム取り直す */
    if (hlOwn) hlOwn.dispose();
    hl.geometry = hlOwn = cornerGeo(_box.setFromObject(obj));
    hl.computeLineDistances();
  }
  if (single) hl.matrix.copy(obj.matrixWorld); else hl.matrix.identity();
  hl.visible = true;
}
/* 祖先まで visible をたどる。途中で false なら画面に出ていない */
function visibleInScene(o){ for (let n=o; n; n=n.parent){ if (!n.visible) return false; } return true; }
function activeRow(){ return hoverIdx !== null ? hoverIdx : pinIdx; }
function paintLegend(){ const a = activeRow(); legendRows.forEach((r,i)=>r.el.classList.toggle('on', i===a)); }
/* ツアーが「この部品を見て」と言ったら、その行を固定し、カメラをその部品に合わせる。
   どちらも描画ループで animators の後に解決する。部品の表示/非表示は animators が
   毎フレーム決めるので、applyStep の時点では1つ前の歩のまま——
   そこで引くと「回転子」が非表示の突極形を掴み、円筒形の歩で指し示しが黙って外れる
   （2026-10-11 実測: 同期機ツアー 5・7・8 歩目） */
let focusReq;            // undefined = 要求なし／null = 固定を外す
function focusByName(name){ focusReq = name || null; }
/* 行の選び方: 名前そのもの、または「名前（…）」の行を先に探し、無ければ名前を含む行に落とす
   （誘導機の「回転子」が先に並ぶ「回転子の目印（白）」を掴まないように）。
   候補が複数あれば、いま見えている行を採る（回転子（突極形）／回転子（円筒形）） */
function focusRow(name){
  if (!name) return null;
  let rows = legendRows.filter(r=>r.name === name || r.name.startsWith(name + '（'));
  if (!rows.length) rows = legendRows.filter(r=>r.name.includes(name));
  return rows.find(r=>r.nodes.some(n=>visibleInScene(n.obj))) || rows[0] || null;
}
function resolveFocus(){
  const row = focusRow(focusReq); focusReq = undefined;
  pinIdx = row ? legendRows.indexOf(row) : null;
  paintLegend();
  const nodes = row ? row.nodes.filter(n=>visibleInScene(n.obj)) : [];
  /* 同じ部品の歩が続くなら、動いているかを判定する前に画角を固定する。判定を先にすると、
     一時停止の歩（直流機8歩目「始動の瞬間は E = 0」）で回る電機子が「静止」と出て、
     比較の歩なのに寄ってしまう（2026-10-11 measure_3d_tour_camera.py で検出） */
  const part = nodes.length ? viewKey() + '|' + row.name + '|' + nodes.map(n=>n.obj.uuid).join(',') : null;
  if (part && part === camPart){ frameWait = null; return; }
  camPart = part;
  /* 動いているかは数フレーム後の姿勢と比べて決める（frameTick） */
  frameWait = nodes.length ? {row, nodes, m0:nodes.map(n=>n.obj.matrixWorld.clone()), left:3} : null;
  if (!nodes.length) shoot(null);       // 指すものが無い・見えない歩は機器の基本視点へ
}
/* カメラの寄り方（カメラワークの「ドリーイン」と「ジャンプカット」）
   ・小さい部品ほど寄る（VIEWS の wide 視点を除く）。部品が画面の高さの FRAME_FILL を占める距離が目安で、
     それより大きい部品では機器の基本視点のまま動かない。
     寄っても基本視点の FRAME_MIN 倍の距離まで——それより近いと、電流の通り道や
     周りの部品との位置関係が枠から外れる（パワエレの素子は画面の 0.2〜0.5 % しかない）。
   ・動いている部品（回転磁界・回転子・はずみ車・昇降する荷）には寄らない。見せたいのは動きそのもので、
     寄るとその瞬間の位置に合わせた画角から部品が出ていく（回転磁界は 120 フレーム中 47〜114 が枠外）。
   ・同じ部品の歩が続くあいだは画角を変えない（分巻→直巻、R→RL 負荷のような比較の歩）。
     カメラまで動くと、条件を変えた結果と視点の移動が混ざって見分けられない。
     「同じ部品」は 3D の物体そのもので判定する。外接箱で判定すると、回る部品や
     負荷で傾く電気的中性軸で箱が毎回変わり、比較の歩でもカメラが動く。
     手で回した画角も、指す部品が変わるまでは奪わない。 */
const FRAME_FILL = .35, FRAME_MIN = .6;
let camShot = null;      // いまのカメラが合わせている画（視点キー＋行名＋物体）。null = 未定
let frameWait = null;    // 動いているかの判定待ち
let camPart = null;      // 直前の歩が指した部品（視点キー＋行名＋物体）。同じなら画角を変えない
const viewKey = () => state.current;
const _vb = new THREE.Box3();
/* 見えているメッシュだけの外接箱（Box3.expandByObject は非表示の子も数える） */
function visibleBox(nodes){
  const box = new THREE.Box3();
  for (const n of nodes) n.obj.traverseVisible(m=>{
    if (!m.geometry) return;
    if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    box.union(_vb.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld));
  });
  return box;
}
function frameTick(){
  if (!frameWait || --frameWait.left > 0) return;
  const {row, nodes, m0} = frameWait; frameWait = null;
  const moving = nodes.some((n,i)=>!n.obj.matrixWorld.equals(m0[i]));
  shoot(moving ? null : {row, nodes});
}
/* part = null なら機器の基本視点、{row, nodes} ならその部品に合わせた画 */
function shoot(part){
  const key = viewKey() + '|' + (part ? part.row.name + '|' + part.nodes.map(n=>n.obj.uuid).join(',') : '');
  if (key === camShot) return;
  const base = VIEWS[viewKey()];
  let v = base;
  if (part && !base.wide){
    const box = visibleBox(part.nodes);
    if (box.isEmpty()) return;
    const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const half = Math.tan(camera.fov*Math.PI/360), a = Math.max(.4, camera.aspect || 1);
    const need = Math.max(sz.y/(2*half), Math.max(sz.x, sz.z)/(2*half*a)) / FRAME_FILL;
    const dist = Math.min(base.dist, Math.max(base.dist*FRAME_MIN, need));
    const k = (base.dist - dist) / (base.dist*(1 - FRAME_MIN));   // 0 = 寄らない … 1 = 最大まで寄る
    v = {target:new THREE.Vector3(...base.target).lerp(c, k).toArray(), dist, theta:base.theta, phi:base.phi};
  }
  if (reduced){ cam.target.set(...v.target); cam.dist=v.dist; cam.theta=v.theta; cam.phi=v.phi; cam.want=null; }
  else flyTo(v);
  camShot = key;
}

function updateLabels(){
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!state.current){
    /* 隣り合う機器のラベルが横に重なると、どちらも読めなかった（2026-11-01 実測: 幅 1400 で2組・1024 で6組・390 で3組）。
       左から順に置き、先に置いたラベルと重なるものは、重ならなくなるまで上へずらす（x は機器の真上のまま） */
    const placed = [];
    for (const n of labelNodes){
      const v = n.pos.clone().project(camera);
      const show = v.z <= 1;
      n.el.style.display = show ? '' : 'none';
      if (show){
        /* 端の機器はラベルが枠外へはみ出して読めなくなる。中身の幅ぶんだけ内側に留める
           （.lbl は translate(-50%) で中央合わせなので、左右に半分ずつ出る） */
        const hw = n.hw || (n.hw = n.el.offsetWidth/2), lh = n.lh || (n.lh = n.el.offsetHeight);
        const x = Math.min(Math.max((v.x+1)/2*w, hw + 4), w - hw - 4);
        let y = (1-v.y)/2*h - 6;                       // ラベルの下端（translate(-100%) なので上へ伸びる）
        for (let k = 0; k < placed.length; k++){
          const q = placed[k];
          if (x - hw < q.x + q.hw + 4 && q.x - q.hw < x + hw + 4 && y - lh < q.y + 2 && q.y - q.lh < y + 2){ y = q.y - q.lh - 4; k = -1; }
        }
        placed.push({x, y, hw, lh});
        n.el.style.left = x+'px'; n.el.style.top = y+'px';
      }
    }
    return;
  }
  const a = activeRow(), open = !legendEl.classList.contains('hidden');
  const vb = cv.getBoundingClientRect();
  hlTarget = null;
  legendRows.forEach((row, i)=>{
    /* 今そこに無い部品（かご形/巻線形・突極/円筒・反作用）は凡例からも消す。
       state を見に行かず、オブジェクト自身が表示されているかで判定する。 */
    const avail = row.nodes.some(n=>visibleInScene(n.obj));
    row.el.style.display = avail ? '' : 'none';
    const lit = avail && open && i === a;
    let ex = 0, ey = 0;
    if (lit){ const r = row.el.getBoundingClientRect(); ex = r.right - vb.left; ey = r.top - vb.top + r.height/2; }
    row.nodes.forEach((n, k)=>{
      const {ln, dt} = row.lines[k];
      const v = (lit && visibleInScene(n.obj)) ? n.obj.getWorldPosition(_wp).project(camera) : null;
      const on = !!v && v.z <= 1;
      ln.style.display = on ? '' : 'none'; dt.style.display = on ? '' : 'none';
      if (!on) return;
      const ax = (v.x+1)/2*w, ay = (1-v.y)/2*h;
      ln.setAttribute('x1', ex); ln.setAttribute('y1', ey);
      ln.setAttribute('x2', ax); ln.setAttribute('y2', ay);
      dt.setAttribute('cx', ax); dt.setAttribute('cy', ay);
      if (!hlTarget) hlTarget = {obj:n.obj, color:row.color};
    });
  });
  setHighlight(hlTarget && hlTarget.obj);
}

  }
  if (id==='karyoku'){

                                  : '空気: 押込通風機 → 空気予熱器 → 火炉 ／ 燃焼ガス: 火炉 → 過熱器 → 再熱器 → 節炭器 → 脱硝 → 空気予熱器 → 電気集じん器 → 脱硫 → 煙突']];
    if (m.eta > .6) rows.splice(2, 0, ['warn','注意','熱効率が 60 % を超える組み合わせは汽力発電では現実的でない']);
    note='※ P は MW、B は t/h、H は MJ/kg のとき η = 3.6·P/(B·H)（3600 kJ = 1 kWh から）。給水加熱器・T-s 線図は「汽力発電所ラボ」で扱う';
  }
  if (id==='genshiryoku'){
    const m = geModel(), pwr = state.gType==='pwr', k = state.gRod;
    rows=[['type','炉型', pwr ? 'PWR：一次冷却材を加圧して沸騰させず、蒸気発生器で二次側に蒸気をつくる' : 'BWR：炉心で直接沸騰させ、その蒸気でタービンを回す'],
          ['mod','減速材・冷却材', '軽水（ふつうの水）'],
          ['ctl','出力の調整', pwr ? '制御棒と一次冷却材中のほう素濃度' : '制御棒と再循環ポンプの流量'],
          ['rod','制御棒（模式）', (k*100).toFixed(0)+' % 挿入 → '+(k < .45 ? '中性子が増える側（出力上昇）' : k > .55 ? '中性子が減る側（出力低下）' : '増減なし（臨界の目安）')],
          ['E', state.gCalc==='dm' ? 'E = Δm·c²' : 'E = 個数 × 200 MeV', sci(m.E)+' J = '+sci(m.kWh)+' kWh'],
          ['coal','同じ熱量の石炭', f1(m.coal, m.coal < 10 ? 2 : 0)+' t'],
          ['elec','熱効率をかけた電気', sci(m.elec)+' kWh']];
    note='※ c = 3×10⁸ m/s、1 MeV = 1.602×10⁻¹³ J、アボガドロ数 6.022×10²³。制御棒の臨界の位置は模式で、実機では燃焼度などで変わる';
  }
  if (id==='kaihei-hogo'){
    const m = hdModel(), on = state.bDS && state.bCB;
    rows=[['st','いまの状態', on ? '送電中' : '停止中'],
          ['seq','正しい順序', '止める: 遮断器 → 断路器 ／ 入れる: 断路器 → 遮断器'],
          ...(state.bWarn ? [['warn','注意', state.bWarn]] : []),
          ['Zt','変圧器の %Z（10 MVA 基準）', f1(state.bZt)+' × 10/'+state.bSt+' = '+f1(m.Zt,2)+' %'],
          ['Z','短絡点までの合成 %Z', f1(m.Z,2)+' %'],
          ['Ps','短絡容量 Ps = 100·Pb/%Z', f1(m.Ps)+' MVA'],
          ['Is','短絡電流 Is = Ps/(√3·V)', f1(m.Is,2)+' kA（定格電流 '+f1(m.In*1000,0)+' A の '+f1(m.Is/m.In,1)+' 倍）'],
