<meta charset="utf-8">
<title>機械科目 3D工場</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="電験三種 機械科目の主要4機器を3D工場に配置し、機械Wikiと過去問台帳に結びつけて眺めるビューア">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF0EC; --panel:#F8F9F6; --ink:#1E2328; --ink-2:#4B555E; --ink-3:#7C8790;
  --line:#D6DAD3; --line-2:#E4E7E1;
  --accent:#B5601F; --accent-ink:#8C4612; --accent-soft:#F4E5D7;
  --steel:#3B5A73; --steel-soft:#DDE6EE;
  --canvas:#1A2028;
  --font-sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
    --line:#2E353C; --line-2:#262C33;
    --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
    --steel:#8FB0CC; --steel-soft:#22313D;
    --canvas:#0F1419;
  }
}
:root[data-theme="dark"]{
  --bg:#15191E; --panel:#1C2127; --ink:#E6E9E4; --ink-2:#AEB6BD; --ink-3:#7B858E;
  --line:#2E353C; --line-2:#262C33;
  --accent:#D9853F; --accent-ink:#F0B57E; --accent-soft:#3A2A1B;
  --steel:#8FB0CC; --steel-soft:#22313D;
  --canvas:#0F1419;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--font-serif);font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-family:var(--font-sans);font-weight:400;color:var(--ink-3);font-size:12px;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--steel);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:inherit;opacity:.7;margin-right:4px}
.wikilink{margin-left:auto;font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.wikilink:hover{color:var(--accent-ink)}
.stage{display:flex;flex-direction:column;background:var(--canvas);min-height:0}
.view{position:relative;flex:1;min-height:0}
.view canvas{display:block;width:100%;height:100%}
.ctrlbar{background:#141920;color:#E6E9E4;border-top:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-end;font-size:12.5px}
.ctrlbar .title{font-size:11.5px;letter-spacing:.08em;color:#AEB6BD;align-self:center;white-space:nowrap}
.cg{display:grid;gap:3px;min-width:150px}
.cg>label{font-size:11.5px;color:#AEB6BD;white-space:nowrap;display:flex;justify-content:space-between;gap:8px}
.cg .val{font-family:var(--font-mono);color:#F0B57E;font-variant-numeric:tabular-nums}
.cg input[type=range]{width:100%;accent-color:#D9853F;margin:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6E9E4;border-radius:4px;padding:2px 9px;font-size:12px}
.seg button[aria-pressed="true"]{background:#D9853F;border-color:#D9853F;color:#1A2028}
.readout{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:12px;margin:0 0 0 auto;align-self:center}
.readout dt{color:#AEB6BD;margin:0;text-align:right}
.readout dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.labels svg{position:absolute;inset:0;width:100%;height:100%}
.labels svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* 凡例。順序固定で動かない。行に触れた1件だけ引き出し線が出る */
.legend{position:absolute;left:10px;top:10px;max-width:min(46%,300px);background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px;backdrop-filter:blur(3px);pointer-events:auto}
.legend.hidden{display:none}
.lgrow{display:grid;grid-template-columns:11px 1fr;gap:8px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:4px 8px;color:#C5CCD3;font-size:12px;line-height:1.5}
.lgrow i{width:11px;height:11px;border-radius:2px;margin-top:4px;display:block}
.lgrow:hover,.lgrow.on{background:rgba(217,133,63,.92);color:#1A2028}
.lgcap{font-size:10.5px;letter-spacing:.06em;color:#7B858E;padding:2px 8px 4px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lgcap button{background:transparent;border:0;color:#7B858E;font-size:10.5px;padding:0 2px;text-decoration:underline}
.lgcap button:hover{color:#D9853F}
.lgshow{position:absolute;left:10px;top:10px;background:rgba(18,23,29,.82);border:1px solid rgba(255,255,255,.1);color:#AEB6BD;border-radius:6px;padding:4px 12px;font-size:11.5px}
.lgshow.hidden{display:none}
.points{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;align-items:start}
.points .k{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600;margin-top:2px}
.points b{font-weight:500}
.points span{color:var(--ink-2)}
.tour{border:1px solid var(--accent);border-radius:6px;padding:12px 14px;background:var(--accent-soft)}
.tour .step{font-family:var(--font-mono);font-size:11.5px;color:var(--accent-ink);letter-spacing:.06em}
.tour h4{margin:2px 0 4px;font-size:15px;font-weight:700;font-family:var(--font-serif)}
.tour p{margin:0 0 10px;font-size:13px;color:var(--ink)}
.tsteps{display:grid;gap:6px;margin:0 0 10px}
.tsteps>div{display:grid;grid-template-columns:3.6em 1fr;gap:9px;align-items:baseline}
.tsteps dt{margin:0;font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:1px 0;text-align:center}
.tsteps dd{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.tq{border-top:1px dashed var(--accent);padding-top:8px;margin:0 0 10px;display:grid;gap:5px}
.tq .cap{font-size:10.5px;letter-spacing:.08em;color:var(--accent-ink)}
.tq a{display:grid;grid-template-columns:5.6em 1fr;gap:8px;text-decoration:none;color:var(--ink);font-size:12.5px;line-height:1.5}
.tq a:hover{color:var(--accent-ink);text-decoration:underline}
.tq .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tour .nav{display:flex;gap:6px;align-items:center}
.tour .nav button{border:1px solid var(--accent);background:var(--panel);color:var(--accent-ink);border-radius:4px;padding:3px 12px;font-size:12.5px}
.tour .nav button:disabled{opacity:.4;cursor:default}
.tour .nav .dots{margin-left:auto;display:flex;gap:4px}
.tour .nav .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.tour .nav .dots i.on{background:var(--accent)}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check details{border:1px solid var(--line-2);border-radius:4px;padding:8px 12px}
.check summary{cursor:pointer;font-size:13px;font-weight:500}
.check summary::marker{color:var(--accent)}
.check p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;color:#E9EDF0;background:rgba(16,20,26,.72);padding:2px 8px;border-radius:3px;white-space:nowrap;letter-spacing:.02em;border-left:2px solid var(--lc,#B5601F)}
.lbl.big{font-size:13px;font-weight:500;padding:4px 10px;pointer-events:auto;cursor:pointer}
.hint{position:absolute;right:12px;top:10px;font-size:11.5px;color:#8E98A2;text-align:right;line-height:1.5}
.hint kbd{font-family:var(--font-mono);color:#C5CCD3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 40px}
aside h2{font-family:var(--font-serif);font-size:22px;margin:0 0 4px;line-height:1.35;text-wrap:balance}
aside h2 .num{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);font-weight:400;margin-right:8px}
.kicker{font-size:11.5px;letter-spacing:.1em;color:var(--accent-ink);font-weight:500;margin-bottom:6px}
.lead{color:var(--ink-2);margin:0 0 8px}
.viewnote{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--steel);padding:2px 0 2px 10px;margin:0 0 14px}
.viewnote:empty{display:none}
aside h3{font-size:12.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
aside h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.parts li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;font-size:13px}
.parts .sw{width:12px;height:12px;border-radius:2px;margin-top:7px;border:1px solid rgba(0,0,0,.15)}
.parts b{font-weight:500}
.parts span{color:var(--ink-2)}
.secs{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.secs a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;padding:7px 10px;border:1px solid var(--line-2);border-radius:4px;text-decoration:none;color:var(--ink);background:transparent}
.secs a:hover{border-color:var(--accent);background:var(--accent-soft)}
.secs .why{grid-column:1/-1;font-size:12px;color:var(--ink-2);line-height:1.55}
.secs .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kak{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.kak li{display:grid;grid-template-columns:5.6em 1fr;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line-2)}
.kak .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kak a{color:var(--ink);text-decoration:none}
.kak a:hover{color:var(--accent-ink);text-decoration:underline}
.kak .d{color:var(--accent);letter-spacing:-.1em;margin-left:4px;font-size:11px}
.kak .k3d{border:1px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:3px;padding:0 6px;font-size:10.5px;line-height:1.5;margin-left:6px;vertical-align:1px}
.kak .k3d:hover{background:var(--accent-soft)}
.secgroup{font-size:12px;color:var(--ink-2);margin:10px 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.secgroup button{background:transparent;border:1px solid var(--accent);color:var(--accent-ink);border-radius:3px;padding:1px 9px;font-size:11.5px;white-space:nowrap}
.secgroup button:hover{background:var(--accent-soft)}
.cg.off{opacity:.35}
.cg.off input,.cg.off button{pointer-events:none}
.flow{display:grid;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{position:relative;padding:8px 0 8px 34px;counter-increment:f;border-left:2px solid var(--line);margin-left:11px}
.flow li::before{content:counter(f);position:absolute;left:-13px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--steel);color:var(--steel);font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;font-weight:600}
.flow li.here{border-left-color:var(--accent)}
.flow li.here::before{background:var(--accent);border-color:var(--accent);color:#fff}
.flow b{display:block;font-weight:500}
.flow span{color:var(--ink-2);font-size:12.5px}
.flow a{text-decoration:none}
.note{background:var(--steel-soft);border-radius:4px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.note b{color:var(--ink);font-weight:500}
canvas.mini{width:100%;height:150px;display:block;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.mini-cap{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}
.overview-grid{display:grid;gap:8px}
.overview-grid button{text-align:left;border:1px solid var(--line-2);background:transparent;border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
.overview-grid button:hover{border-color:var(--accent);background:var(--accent-soft)}
.overview-grid .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.overview-grid .t{font-weight:500}
.overview-grid .c{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.overview-grid .s{grid-column:2/-1;font-size:12px;color:var(--ink-2)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .view{flex:none;height:46vh;min-height:260px}
  /* チップが縦に折り返すとヘッダだけで画面を食う。横1列の横スクロールにする。
     flex だと flex-basis:100% が本質サイズ計算で中身の幅に落ちてページごと横に伸びるため、
     minmax(0,1fr) で潰せるグリッドにする。 */
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:7px 10px;align-items:center}
  header h1{grid-column:1;grid-row:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wikilink{grid-column:2;grid-row:1;margin-left:0}
  .chips{grid-column:1/-1;grid-row:2;min-width:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;min-height:34px;display:flex;align-items:center}
  .legend{max-width:calc(100% - 20px)}
  .ctrlbar{gap:8px 16px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  header h1 small{display:none}
}

/* ---- 30秒理解 ---- */
.oneliner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 5px 5px 0;font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink);margin:0 0 12px}
.oneliner small{display:block;font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:3px}
/* ---- 狙われるポイント ---- */
.exam{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.exam li{border:1px solid var(--line-2);border-radius:5px;padding:8px 11px;display:grid;gap:3px}
.exam .en{font-size:11.5px;letter-spacing:.04em;color:var(--ink-3)}
.exam .ef{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--accent-ink);word-break:break-word}
.exam .ew{font-size:12px;color:var(--ink-2);line-height:1.55}
/* ---- 予想クイズ ---- */
.quiz{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:q}
.quiz>li{border:1px solid var(--line);border-radius:6px;padding:11px 13px;background:var(--panel);counter-increment:q}
.quiz>li.done{border-color:var(--line-2)}
.qq{font-size:13.5px;font-weight:500;line-height:1.6;margin-bottom:9px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.qn{font-family:var(--font-mono);font-size:11px;background:var(--steel);color:var(--panel);border-radius:3px;padding:1px 6px;margin-top:3px}
.qopts{display:grid;gap:5px}
.qopts button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 12px;font-size:13px;min-height:38px;line-height:1.4;display:flex;align-items:center;gap:8px}
.qopts button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qopts button:disabled{cursor:default}
.qopts button .mk{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);flex:none}
.qopts button.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.qopts button.ng{border-color:var(--danger);background:var(--danger-soft)}
.qopts button.dim{opacity:.45}
.qfb{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.qfb b{color:var(--ink)}
.qfb .verdict{display:block;font-weight:700;margin-bottom:3px}
.qfb .verdict.ok{color:var(--ok)}
.qfb .verdict.ng{color:var(--danger)}
.qfb .again{background:none;border:0;color:var(--accent-ink);font-size:12px;text-decoration:underline;padding:4px 0 0;min-height:32px}
/* ---- もう一歩カード ---- */
.cards{display:grid;gap:8px}
.cards details{border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.cards summary{cursor:pointer;font-size:13px;font-weight:500;padding:9px 12px;min-height:38px;display:flex;align-items:center}
.cards summary::marker{color:var(--accent)}
.cards .cbody{padding:2px 12px 12px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.cards .cbody b{color:var(--ink)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
.tbl table{border-collapse:collapse;width:100%;min-width:min(100%,340px);font-size:12px}
.tbl th,.tbl td{border:1px solid var(--line-2);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg-sunken,var(--accent-soft));font-weight:600;color:var(--ink);white-space:nowrap}
.tbl td{color:var(--ink-2)}
.chain{list-style:none;padding:0;margin:8px 0;display:grid;gap:0}
.chain li{position:relative;padding:5px 0 5px 20px;font-size:12.5px;color:var(--ink-2)}
.chain li::before{content:"↓";position:absolute;left:4px;top:4px;color:var(--accent);font-size:11px}
.chain li:first-child::before{content:"●";font-size:8px;top:9px}
.chain li b{color:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
.segsm{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.segsm button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 11px;font-size:12px;min-height:34px;color:var(--ink-2)}
.segsm button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.convwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
.convfig{display:block;width:100%;min-width:430px;height:auto}
/* ---- 次にやること ---- */
.steps{display:grid;gap:6px;margin:0}
.steps a,.steps div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:5px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:13px;min-height:40px}
.steps a:hover{border-color:var(--accent);background:var(--accent-soft)}
.steps .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--line-2);color:var(--ink-3)}
.steps .here{background:var(--accent-soft);border-color:var(--accent)}
.steps .here .sn{background:var(--accent);color:#fff}
.steps small{display:block;font-size:11.5px;color:var(--ink-3);grid-column:2}
/* ---- 操作帯の読み値ハイライト ---- */
.readout dt.lit,.readout dd.lit{background:var(--accent);color:#1A2028;border-radius:3px;padding:0 4px}

  const dir = _wb.copy(b).sub(a), len = dir.length();

/* ---------- 変圧器 ----------
   3つの見る対象を持つ。
     core … 三相内鉄形1台。鉄心・巻線・磁束・損失
     bank … 単相変圧器3台のバンク。Δ-Δ と V-V を切り替えると1台が消える
     auto … 単巻変圧器。1つの巻線の途中から取り出していることを見せる
   ---------- */
function buildTransformer(g){
  /* === core: 三相内鉄形 === */
  const core = new THREE.Group(); g.add(core);
  const legX = [-1.5, 0, 1.5];
  /* 鉄損・銅損で光らせるので、この機器専用のマテリアルを持つ */
  const coreMat = M.steel.clone(), lvMat = M.copper.clone(), hvMat = M.copperDark.clone(), hvCutMat = M.copperCut.clone();
  mesh(new THREE.BoxGeometry(4.2, .6, .8), coreMat, core, 0, .45, 0);
  const yokeTop = mesh(new THREE.BoxGeometry(4.2, .6, .8), coreMat, core, 0, 3.75, 0);
  let hvL, lvR, bushHV, midLeg;
  const currDots = [], midWind = [];
  for (const x of legX){
    const leg = mesh(new THREE.BoxGeometry(.6, 2.7, .8), coreMat, core, x, 2.1, 0);
    if (x === 0) midLeg = leg;
    const lv = mesh(new THREE.CylinderGeometry(.62,.62,2.1,32), lvMat, core, x, 2.1, 0);
    if (x === 0) midWind.push(lv);
    /* 低圧4回。数えられる間隔にする（高圧の8回と見比べて巻数比2を目で確かめる） */
    for (let i=0;i<4;i++){ const tr = mesh(new THREE.TorusGeometry(.665,.055,8,40), lvMat, core, x, 1.35+i*.5, 0);
      tr.rotation.x=Math.PI/2; if (x === 0) midWind.push(tr); }
    let hv;
    if (x === 1.5){ // 右脚は高圧巻線を手前側で切り欠き、内側の低圧巻線を見せる
      hv = mesh(new THREE.CylinderGeometry(.85,.85,2.3,32,1,false, Math.PI*.35, Math.PI*1.3), hvCutMat, core, x, 2.1, 0);
      /* 切り欠きと同じ弧で8回ぶんの輪を出す。これが無いと、内側の低圧が見える唯一の脚で
         外側の巻数を数えられず、「同じ脚で内外を数え比べる」が成立しない。
         Cylinder は x=r·sinθ / z=r·cosθ、Torus は u=0 が +x なので u = π/2 − θ。
         材料は θ∈[.35π, 1.65π] ＝ u∈[−1.15π, .15π] なので、弧の開始を −1.15π に置く。
         +.15π にすると弧が切り欠きの開口部ちょうどを塞ぐ（実際に一度そうなった） */
      for (let i=0;i<8;i++){ const tr = mesh(new THREE.TorusGeometry(.885,.038,8,40, Math.PI*1.3), hvCutMat, core, x, 1.12+i*.28, 0);
        tr.rotation.set(Math.PI/2, 0, -Math.PI*1.15); }
      lvR = lv;
    } else {
      hv = mesh(new THREE.CylinderGeometry(.85,.85,2.3,32), hvMat, core, x, 2.1, 0);
      /* 高圧8回。低圧の2倍あることを数えて確かめられる＝これが巻数比 */
      for (let i=0;i<8;i++){ const tr = mesh(new THREE.TorusGeometry(.885,.038,8,40), hvMat, core, x, 1.12+i*.28, 0); tr.rotation.x=Math.PI/2; if (x === 0) midWind.push(tr); }
    }
    if (x === -1.5) hvL = hv;
    if (x === 0) midWind.push(hv);
    const b = mesh(new THREE.CylinderGeometry(.13,.16,1.6,16), M.ceramic, core, x, 4.85, -.25);
    if (x === 0) bushHV = b;
    for (let i=0;i<5;i++) mesh(new THREE.TorusGeometry(.2,.04,6,24), M.ceramic, core, x, 4.3+i*.28, -.25).rotation.x=Math.PI/2;
    mesh(new THREE.CylinderGeometry(.1,.12,.7,16), M.ceramic, core, x, 4.4, .3);   // 二次（低圧）側ブッシング
    mesh(new THREE.CylinderGeometry(.035,.035,.75,8), lvMat, core, x, 5.1, .3);     // 二次リード
    /* 巻線を回る電流。点の速さ・数・大きさが電流の大きさ */
    for (let k=0;k<6;k++){
      const d = mesh(new THREE.SphereGeometry(.062, 8, 8), M.curr, core);
      d.castShadow = false;
      d.userData = {x, n:k, r:.95, y:1.35 + k*.3, t:k/6};
      currDots.push(d);
    }
  }
  /* 二次側の3つの状態。通常運転＝負荷、無負荷試験＝開放、短絡試験＝銅バー */
  const loadBox = new THREE.Group(); core.add(loadBox); loadBox.position.set(0, 5.5, 1.7);
  mesh(new THREE.BoxGeometry(1.6,.7,.7), M.steelDark, loadBox);
  for (const x of legX){ const w = mesh(new THREE.CylinderGeometry(.03,.03,1.5,6), lvMat, loadBox, x*.55, .05, -.85); w.rotation.x = Math.PI/2*.92; }
  const gapG = new THREE.Group(); core.add(gapG); gapG.position.set(0, 5.55, .3);
  for (const x of legX){ mesh(new THREE.SphereGeometry(.075,10,10), M.copper, gapG, x, -.05, 0);
    mesh(new THREE.SphereGeometry(.075,10,10), std({color:0xd24a43, emissive:0x8a1f1a, emissiveIntensity:.7}), gapG, x, .35, 0); }
  const secBar = mesh(new THREE.BoxGeometry(3.4,.13,.13), lvMat, core, 0, 5.5, .3);
  /* 電力計。針の振れがそのまま「その試験で測っている損失」 */
  const meterG = new THREE.Group(); core.add(meterG); meterG.position.set(-3.4, .95, 1.4);
  mesh(new THREE.BoxGeometry(.22,1.9,.22), M.steel, meterG, 0, -.95, 0);
  mesh(new THREE.BoxGeometry(1.15,.95,.32), M.steelDark, meterG);
  const meterFace = mesh(new THREE.CircleGeometry(.33, 28), M.meter.clone(), meterG, 0, .04, .17);
  const needleGeo = new THREE.BoxGeometry(.035,.3,.02); needleGeo.translate(0,.15,0);
  const needle = mesh(needleGeo, M.black, meterG, 0, .04, .19);
  /* ヒステリシス：中央脚の磁区。半周期ごとに一斉に反転する */
  const domains = new THREE.Group(); core.add(domains); domains.position.set(0, 2.1, .42); domains.visible = false;
  for (let r=-2;r<=2;r++) for (const c of [-.13,.13]){
    const a = new THREE.Group(); domains.add(a); a.position.set(c, r*.5, 0);
    mesh(new THREE.CylinderGeometry(.018,.018,.24,6), M.domain, a, 0, -.04, 0).castShadow=false;
    mesh(new THREE.ConeGeometry(.052,.13,10), M.domain, a, 0, .14, 0).castShadow=false;
  }
  /* 渦電流：塊鉄心は断面いっぱいの太い1本、積層は細い9本 */
  const lam = new THREE.Group(); core.add(lam); lam.visible = false;
  for (let i=0;i<9;i++) mesh(new THREE.BoxGeometry(.052,2.7,.8), coreMat, lam, -.267+i*.0667, 2.1, 0);
  const loop = (hx,hz)=>{ const bg = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-hx,0,-hz), new THREE.Vector3(hx,0,-hz), new THREE.Vector3(hx,0,hz), new THREE.Vector3(-hx,0,hz)]);
    const l = new THREE.LineLoop(bg, eddyMat); l.renderOrder = 998; return l; };
  const eddyS = new THREE.Group(); core.add(eddyS); eddyS.position.set(0,2.1,0); eddyS.visible = false;
  for (let k=-1;k<=1;k++){ const l = loop(.25,.36); l.position.y = k*.9; eddyS.add(l); }
  const eddyL = new THREE.Group(); core.add(eddyL); eddyL.position.set(0,2.1,0); eddyL.visible = false;
  for (let k=-1;k<=1;k++) for (let i=0;i<9;i++){ const l = loop(.021,.36); l.position.set(-.267+i*.0667, k*.9, 0); eddyL.add(l); }
  /* 磁束の点。鉄心の中を通す（z=0）と巻線に完全に隠れるので、
     同じ道筋のまま巻線の手前（z=1.05）に出して軌跡として見せる */
  const fluxDots = [];
  for (let w=0; w<2; w++) for (let i=0;i<12;i++){ const d = mesh(new THREE.SphereGeometry(.085, 10, 10), M.flux, core); d.castShadow=false; d.userData = {w, t:i/12}; fluxDots.push(d); }
  Object.assign(g.userData, {currDots, midWind, coreMat, lvMat, hvMat, hvCutMat, loadBox, gapG, secBar,
    meterFace, needle, domains, lam, midLeg, eddyS, eddyL, ph:0});

  /* === bank: 単相変圧器3台 === */
  const bank = new THREE.Group(); g.add(bank); bank.visible = false;
  const tanks = [], term = [];
  for (let i=0;i<3;i++){
    const t = new THREE.Group(); bank.add(t); t.position.x = (i-1)*2.2;
    mesh(new THREE.BoxGeometry(1.7, 2.2, 1.5), M.tank, t, 0, 1.35, 0);
    mesh(new THREE.BoxGeometry(1.86, .16, 1.66), M.steel, t, 0, 2.5, 0);
    for (const sgn of [-1,1]) for (let k=0;k<3;k++)
      mesh(new THREE.BoxGeometry(.07,1.5,.42), M.steel, t, sgn*.93, 1.35, (k-1)*.46);
    const pair = [];
    for (const sgn of [-1,1]){
      mesh(new THREE.CylinderGeometry(.1,.13,.95,14), M.ceramic, t, sgn*.5, 3.0, 0);
      for (let k=0;k<3;k++) mesh(new THREE.TorusGeometry(.155,.033,6,18), M.ceramic, t, sgn*.5, 2.72+k*.26, 0).rotation.x=Math.PI/2;
      pair.push(new THREE.Vector3(sgn*.5 + (i-1)*2.2, 3.5, 0));
    }
    tanks.push(t); term.push(pair);   // [左端子, 右端子]
  }
  /* 結線の電線。Δ-Δ（3台で三角を閉じる）と V-V（2台で開いたまま）を差し替える */
  const wiresD = new THREE.Group(); bank.add(wiresD);
  const wiresV = new THREE.Group(); bank.add(wiresV); wiresV.visible = false;
  const ph = [M.u, M.v, M.w];
  const up = (v, h) => new THREE.Vector3(v.x, v.y + h, v.z);
  /* Δ-Δ: 0右-1左、1右-2左、2右-0左（奥を回して閉じる） */
  {
    const j01 = [term[0][1], term[1][0]], j12 = [term[1][1], term[2][0]];
    wire3(j01[0], j01[1], M.brass, wiresD); wire3(j12[0], j12[1], M.brass, wiresD);
    const back = -1.6;
    const a = term[2][1], b = term[0][0];
    const a2 = new THREE.Vector3(a.x, a.y+.5, back), b2 = new THREE.Vector3(b.x, b.y+.5, back);
    wire3(a, a2, M.brass, wiresD); wire3(a2, b2, M.brass, wiresD); wire3(b2, b, M.brass, wiresD);
    /* 各頂点から線路へ引き出す3本（U・V・W） */
    const corner = [
      new THREE.Vector3((term[0][1].x+term[1][0].x)/2, 3.5, 0),
      new THREE.Vector3((term[1][1].x+term[2][0].x)/2, 3.5, 0),
      new THREE.Vector3(term[0][0].x, 3.5, 0),
    ];
    corner.forEach((c,k)=>wire3(c, up(c, 1.5), ph[k], wiresD, .06));
  }
  /* V-V: 3台目を外す。0右-1左だけ結び、両端と中点の3本が線路へ出る */
  {
    const j01 = [term[0][1], term[1][0]];
    wire3(j01[0], j01[1], M.brass, wiresV);
    const mid = new THREE.Vector3((j01[0].x+j01[1].x)/2, 3.5, 0);
    [term[0][0], mid, term[1][1]].forEach((c,k)=>wire3(c, up(c, 1.5), ph[k], wiresV, .06));
  }

  /* === auto: 単巻変圧器 === */
  const auto = new THREE.Group(); g.add(auto); auto.visible = false;
  mesh(new THREE.BoxGeometry(.7, 4.0, .8), M.steel, auto, -1.5, 2.2, 0);
  mesh(new THREE.BoxGeometry(.7, 4.0, .8), M.steel, auto,  1.2, 2.2, 0);
  mesh(new THREE.BoxGeometry(3.4, .7, .8), M.steel, auto, -.15, 4.55, 0);
  mesh(new THREE.BoxGeometry(3.4, .7, .8), M.steel, auto, -.15, -.15, 0);
  const shunt  = mesh(new THREE.CylinderGeometry(.82,.82,2.0,32), M.shunt,  auto, 1.2, 1.25, 0);
  const series = mesh(new THREE.CylinderGeometry(.82,.82,1.2,32), M.series, auto, 1.2, 2.85, 0);
  for (let i=0;i<6;i++) mesh(new THREE.TorusGeometry(.84,.028,6,36), M.copperDark, auto, 1.2, .4+i*.33, 0).rotation.x=Math.PI/2;
  for (let i=0;i<4;i++) mesh(new THREE.TorusGeometry(.84,.028,6,36), M.copper,     auto, 1.2, 2.4+i*.3, 0).rotation.x=Math.PI/2;
  /* 端子3つ。下端＝共通、境目＝一次の高い側、上端＝二次の高い側 */
  const tap = [];
  [[.25,'a'],[2.25,'b'],[3.45,'c']].forEach(([y])=>{
    const t = mesh(new THREE.CylinderGeometry(.09,.11,.5,12), M.ceramic, auto, 2.35, y, 0);
    wire3(new THREE.Vector3(1.2, y, .9), new THREE.Vector3(2.35, y, 0), M.brass, auto, .04);
    tap.push(t);
  });

  Object.assign(g.userData, {core, bank, auto, fluxDots, tanks, wiresD, wiresV, shunt, series, tap});
  /* 見る対象ごとにラベルを差し替える */
  g.userData.labels = (st) => st.tfView === 'bank' ? [
    {obj:tanks[0], t:'単相変圧器 1台目', c:'#4A5B68'},
    {obj:tanks[2], t:'3台目（V結線では外す）', c:'#7E8C99'},
    {obj:(st.bankV?wiresV:wiresD).children[0], t:'渡り線（変圧器どうしを結ぶ）', c:'#D9C7A0'},
    {obj:(st.bankV?wiresV:wiresD).children[st.bankV?1:5], t:'線路への引き出し（U相）', c:'#D24A43'},
  ] : st.tfView === 'auto' ? [
    {obj:shunt,  t:'分路巻線（一次と二次の共通部分）', c:'#C07A3A'},
    {obj:series, t:'直列巻線（この分だけ電圧を足す）', c:'#7FB069'},
    {obj:tap[0], t:'端子a（共通の端）', c:'#E6D3A3'},
    {obj:tap[1], t:'端子b（一次の高い側＝タップ）', c:'#E6D3A3'},
    {obj:tap[2], t:'端子c（二次の高い側）', c:'#E6D3A3'},
  ] : [
    {obj:yokeTop, t:'鉄心（ヨーク）', c:'#6B7580'},
    {obj:hvL, t:'高圧巻線（外側・8回）', c:'#A05A25'},
    {obj:lvR, t:'低圧巻線（内側・切り欠き部・4回）', c:'#C07A3A'},
    {obj:bushHV, t:'ブッシング（高圧側）', c:'#E6D3A3'},
    {obj:loadBox, t:'二次側の負荷', c:'#7E8C99'},
    {obj:gapG, t:'二次開放（ここが切れている）', c:'#D24A43'},
    {obj:secBar, t:'二次を短絡する銅バー', c:'#C07A3A'},
    {obj:meterFace, t:'電力計 W（試験時の読み＝損失）', c:'#E9EDF0'},
    {obj:domains, t:'磁区（半周期ごとに反転）', c:'#F0B57E'},
    {obj:eddyS, t:'渦電流（塊鉄心・太い1本）', c:'#FFC27A'},
    {obj:eddyL, t:'渦電流（積層・細い9本）', c:'#FFC27A'},
  ];
}
/* B-H ループの形。右パネルの図と 3D の発熱・磁区が同じ式を見る（2か所に書かない）。
   Hc は保磁力、k は立ち上がりの鋭さ、Hm は磁界の振幅。すべて模式値 */
const BH = {Hc:.45, k:2.2, Hm:1.55, heatMax:1.7};
const bhPhase = (phi) => ({h: BH.Hm*Math.sin(phi), rising: Math.cos(phi) > 0});
const bhB = (h, rising) => Math.tanh(BH.k*(h - (rising ? BH.Hc : -BH.Hc)));
/* 1サイクルのどこで熱くなるか。入力仕事率 H·dB/dt の絶対値を 0..1 に正規化した重み。
   H=0（＝残留磁束密度の点）では 0 になる。ここを最大にすると因果が逆になる */
function bhHeat(phi){
  const {h, rising} = bhPhase(phi);
  const sech2 = 1 - Math.pow(bhB(h, rising), 2);
  return Math.min(1, Math.abs(h * BH.k * BH.Hm * Math.cos(phi) * sech2) / BH.heatMax);
}

/* 電圧＝磁束の大きさ、電流＝巻線の発熱。試験モードはこの2つを別々に動かす装置 */
function tfDuty(st){
  if (st.tfTest === 'oc') return {V:1,   I:.03};            // 定格電圧・二次開放
  if (st.tfTest === 'sc') return {V:.06, I:1};              // 数%の電圧・定格電流
  return {V:1, I:st.tfLoad};                                 // 通常運転
}
function animTransformer(g, t, st, dt){
  const u = g.userData;
  u.core.visible = st.tfView === 'core';
  u.bank.visible = st.tfView === 'bank';
  u.auto.visible = st.tfView === 'auto';
  if (st.tfView === 'bank'){
    u.tanks[2].visible = !st.bankV;        // V結線は3台目を外した姿
    u.wiresD.visible = !st.bankV; u.wiresV.visible = st.bankV;
  }
  if (st.tfView !== 'core') return;        // 見えていないものは動かさない
  u.ph += st.paused ? 0 : (dt || 0);
  const ph = u.ph, {V, I} = tfDuty(st);
  /* 磁束。短絡試験では電圧が数%しかないので、ほとんど細る */
  for (const d of u.fluxDots){
    const dir = d.userData.w ? -1 : 1;
    const sN = (((d.userData.t + ph*.35*dir) % 1) + 1) % 1;
    const x0 = d.userData.w ? .75 : -.75, W=.75, H=1.5; const q = sN*4; let x,y;
    if (q<1){ x=x0-W + q*2*W; y=2.1+H; }
    else if (q<2){ x=x0+W; y=2.1+H - (q-1)*2*H; }
    else if (q<3){ x=x0+W - (q-2)*2*W; y=2.1-H; }
    else { x=x0-W; y=2.1-H + (q-3)*2*H; }
    d.position.set(x, y, 1.05);
    d.scale.setScalar(.22 + .78*V);
  }
  /* 巻線を回る電流。無負荷でも励磁電流だけは流れているので下限を置く */
  const Id = Math.max(I, .04), nOn = Math.max(1, Math.round(Id*6));
  for (const d of u.currDots){
    const k = d.userData;
    d.visible = k.n < nOn;
    const a = k.t*Math.PI*2 + ph*(1.1 + Id*4.2);
    d.position.set(k.x + k.r*Math.cos(a), k.y, k.r*Math.sin(a));
    d.scale.setScalar(.45 + .65*Id);
  }
  /* 発熱。鉄損は電圧の2乗（＝磁束の2乗）、銅損は電流の2乗 */
  const hys = st.tfIron === 'hys', eddy = st.tfIron === 'eddy';
  const phi = ph*2.2;                                // 右パネルの B-H 図と同じ位相
  /* 発熱は H·dB/dt。H=0（残留磁束密度）では熱は出ないので、そこを明るくしてはいけない */
  const flip = hys ? bhHeat(phi) : 0;
  const pi = V*V, pc = I*I;
  u.coreMat.emissive.setHex(0xff6a28); u.coreMat.emissiveIntensity = pi*(.34 + flip*1.0);
  for (const m of [u.lvMat, u.hvMat, u.hvCutMat]){ m.emissive.setHex(0xff5324); m.emissiveIntensity = pc*.52; }
  /* 二次側の状態 */
  u.loadBox.visible = st.tfTest === 'run';
  u.gapG.visible    = st.tfTest === 'oc';
  u.secBar.visible  = st.tfTest === 'sc';
  /* 電力計。目盛は「定格銅損＝1」。鉄損はその1/4として描いている（下の曲線と同じ比） */
  const read = pi*.25 + pc;
  u.needle.rotation.z = (.5 - Math.min(read/1.25, 1)) * 1.8;
  u.meterFace.material.emissive.setHex(st.tfTest==='oc' ? 0xb5601f : st.tfTest==='sc' ? 0xa05a25 : 0x000000);
  u.meterFace.material.emissiveIntensity = st.tfTest==='run' ? 0 : .55;
  /* 鉄損の中身。中央脚の巻線を外して鉄心そのものを見せる */
  for (const o of u.midWind) o.visible = st.tfIron === 'off';
  u.domains.visible = hys;
  /* 磁区は磁化（≒B）に従う。H の一価関数にすると遅れが消え、ヒステリシスの本体が
     見えなくなる。B はループの式から取るので、右パネルの点と同じタイミングで反転する */
  if (hys){ const {h, rising} = bhPhase(phi), Bnow = bhB(h, rising);
    for (const a of u.domains.children) a.rotation.z = Math.PI*(.5 - .5*Bnow); }
  u.lam.visible    = eddy && st.tfLam;
  u.midLeg.visible = !(eddy && st.tfLam);
  u.eddyS.visible  = eddy && !st.tfLam;
  u.eddyL.visible  = eddy && st.tfLam;
  if (eddy) eddyMat.opacity = .35 + .6*Math.abs(Math.cos(ph*2.2));   // 渦は dB/dt が最大のとき最大
}

/* ---------- 回転機共通：固定子（手前を切り欠いて内部を見せる） ---------- */
function buildStator(g, r, len){
  const frame = mesh(new THREE.CylinderGeometry(r+.35, r+.35, len, 48, 1, true, Math.PI*.15, Math.PI*1.7), M.frame, g); frame.rotation.z = Math.PI/2; g.userData.frame = frame;
  for (let i=0;i<12;i++){ const a=i/12*Math.PI*2; if (a>Math.PI*1.1 && a<Math.PI*1.9) continue; const f = mesh(new THREE.BoxGeometry(len*.9,.08,.35), M.steelDark, g); f.position.set(0, Math.sin(a)*(r+.5), Math.cos(a)*(r+.5)); f.rotation.x = -a; }
  const core = mesh(new THREE.CylinderGeometry(r+.05, r+.05, len*.9, 48, 1, true, Math.PI*.15, Math.PI*1.7), M.coreRing, g); core.rotation.z = Math.PI/2;
  const seq = [M.u, M.w, M.v, M.u, M.w, M.v];
  for (let i=0;i<6;i++){ const a = i/6*Math.PI*2 + Math.PI/6; const c = mesh(new THREE.BoxGeometry(len*.95, .22, .28), seq[i], g); c.position.set(0, Math.sin(a)*(r-.12), Math.cos(a)*(r-.12)); c.rotation.x = -a;
    for (const s of [-1,1]){ const e = mesh(new THREE.TorusGeometry(.32,.06,6,16,Math.PI), seq[i], g); e.position.set(s*len*.5, Math.sin(a)*(r-.12), Math.cos(a)*(r-.12)); e.rotation.set(-a, Math.PI/2, 0); } }
  mesh(new THREE.BoxGeometry(len*.7, .3, r*1.9), M.steelDark, g, 0, -r-.35, 0);
  for (const s of [-1,1]) mesh(new THREE.CylinderGeometry(.45,.45,.25,24), M.steel, g, s*(len/2+.12), 0, 0).rotation.z = Math.PI/2;
}
function makeFieldArrow(len, mat){
  const a = new THREE.Group(); mat = mat || M.arrow;
  mesh(new THREE.CylinderGeometry(.05,.05,len*2,10), mat, a, 0, 0, 0).castShadow=false;
  a.userData.tip = mesh(new THREE.ConeGeometry(.16,.4,12), mat, a, 0, len+.15, 0); a.userData.tip.castShadow=false;
  return a;
}
const shaft = (parent, len) => { const s = mesh(new THREE.CylinderGeometry(.2,.2,len,16), M.steelLight, parent); s.rotation.z = Math.PI/2; return s; };

/* ---------- 三相誘導電動機 ---------- */
function buildIM(g){
  buildStator(g, 1.6, 2.4);
  const rotor = new THREE.Group(); g.add(rotor); shaft(rotor, 4.4);
  const cage = new THREE.Group(); rotor.add(cage);
  mesh(new THREE.CylinderGeometry(1.0,1.0,2.0,32), M.rotorIron, cage).rotation.z = Math.PI/2;
  for (let i=0;i<16;i++){ const a=i/16*Math.PI*2; const b = mesh(new THREE.CylinderGeometry(.07,.07,2.4,8), M.copper, cage); b.position.set(0, Math.sin(a)*1.05, Math.cos(a)*1.05); b.rotation.z = Math.PI/2; }
  for (const s of [-1,1]) mesh(new THREE.TorusGeometry(1.05,.11,10,40), M.copper, cage, s*1.2, 0, 0).rotation.y = Math.PI/2;
  const wound = new THREE.Group(); rotor.add(wound); wound.visible = false;
  mesh(new THREE.CylinderGeometry(1.0,1.0,2.0,32), M.rotorIron, wound).rotation.z = Math.PI/2;
  const seq = [M.u, M.w, M.v, M.u, M.w, M.v];
  for (let i=0;i<6;i++){ const a=i/6*Math.PI*2; const c = mesh(new THREE.BoxGeometry(2.1,.2,.26), seq[i], wound); c.position.set(0, Math.sin(a)*1.02, Math.cos(a)*1.02); c.rotation.x=-a; }
  const rings = new THREE.Group(); wound.add(rings);
  for (let i=0;i<3;i++) mesh(new THREE.CylinderGeometry(.34,.34,.12,24), M.brass, rings, 1.5+i*.22, 0, 0).rotation.z=Math.PI/2;
  const ext = new THREE.Group(); g.add(ext); ext.visible=false;
  for (let i=0;i<3;i++){ mesh(new THREE.BoxGeometry(.1,.25,.18), M.black, ext, 1.5+i*.22, .45, 0); const wire = mesh(new THREE.CylinderGeometry(.02,.02,1.9,6), M.copper, ext, 1.5+i*.22, -.15, .5); wire.rotation.x = Math.PI/2*.62; wire.rotation.z = 0; }
  const resBox = mesh(new THREE.BoxGeometry(1.0,.9,.7), M.steelDark, ext, 2.9, -1.2, 1.2);
  for (let i=0;i<3;i++) mesh(new THREE.CylinderGeometry(.06,.06,.6,8), M.brass, ext, 2.7+i*.2, -.45, 1.2);
  const arrow = makeFieldArrow(1.25); g.add(arrow);
  /* 滑りを目で見るための一対の目印。橙＝回転磁界、白＝回転子。
     橙が白を追い越していく割合がそのまま滑り。s=0 では重なったまま動かない。 */
  const fieldDot = mesh(new THREE.SphereGeometry(.14, 12, 12), M.markField, arrow, 0, 1.33, 0);
  fieldDot.castShadow = false;
  const rotorMark = mesh(new THREE.BoxGeometry(2.15, .07, .18), M.markRotor, rotor, 0, 1.09, 0);
  rotorMark.castShadow = false;
  Object.assign(g.userData, {rotor, cage, wound, ext, arrow});
  g.userData.labels = [
    {obj:g.userData.frame, t:'固定子（三相巻線）', c:'#D24A43'},
    {obj:fieldDot, t:'磁界の目印（橙）', c:'#F0B57E'},
    {obj:rotorMark, t:'回転子の目印（白）', c:'#E9EDF0'},
    {obj:cage, t:'回転子（かご形）', c:'#C07A3A', key:'cage'},
    {obj:wound, t:'回転子（巻線形）', c:'#C07A3A', key:'wound'},
    {obj:arrow.userData.tip, t:'回転磁界（同期速度で回る）', c:'#F0B57E'},
    {obj:rings, t:'スリップリング', c:'#D9C7A0', key:'wound'},
    {obj:resBox, t:'外部抵抗（二次抵抗）', c:'#7E8C99', key:'wound'},
  ];
}
function animIM(g, t, st, dt){

/* ---------- 直流機 ---------- */
function buildDC(g){
  const r=1.55, len=2.2;
  const yoke = mesh(new THREE.CylinderGeometry(r+.4, r+.4, len, 48, 1, true, Math.PI*.2, Math.PI*1.6), M.frame, g); yoke.rotation.z = Math.PI/2;
  const poleMat = [M.north, M.south, M.north, M.south]; const poles = [];
  for (let i=0;i<4;i++){ const a = i*Math.PI/2; const p = new THREE.Group(); g.add(p); poles.push(p);
    mesh(new THREE.BoxGeometry(len*.85,.45,.9), poleMat[i], p, 0, r-.22, 0);
    mesh(new THREE.BoxGeometry(len*.85,.6,.55), M.steel, p, 0, r+.15, 0);
    mesh(new THREE.BoxGeometry(len*.95,.5,.85), M.copperDark, p, 0, r+.15, 0);
    p.rotation.x = -a;
    if (i===1) p.traverse(o=>{ if(o.isMesh){ o.material = o.material.clone(); o.material.transparent=true; o.material.opacity=.25; o.castShadow=false; } });
  }
  mesh(new THREE.BoxGeometry(len*.7, .3, r*1.9), M.steelDark, g, 0, -r-.55, 0);
  const arm = new THREE.Group(); g.add(arm); shaft(arm, 4.6);
  mesh(new THREE.CylinderGeometry(.95,.95,1.9,36), M.rotorIron, arm).rotation.z = Math.PI/2;
  const coils = new THREE.Group(); arm.add(coils);
  for (let i=0;i<20;i++){ const a=i/20*Math.PI*2; const c = mesh(new THREE.BoxGeometry(2.0,.14,.16), M.copper, coils); c.position.set(0, Math.sin(a)*1.0, Math.cos(a)*1.0); c.rotation.x=-a; }
  const comm = new THREE.Group(); arm.add(comm);
  for (let i=0;i<20;i++){ const a=i/20*Math.PI*2; const s = mesh(new THREE.BoxGeometry(.7,.11,.14), (i%2? M.brass: M.copper), comm); s.position.set(1.55, Math.sin(a)*.45, Math.cos(a)*.45); s.rotation.x=-a; }
  const brushes = new THREE.Group(); g.add(brushes);
  for (const a of [Math.PI/4, Math.PI/4+Math.PI]){ const b = mesh(new THREE.BoxGeometry(.4,.35,.18), M.black, brushes); b.position.set(1.55, Math.sin(a)*.62, Math.cos(a)*.62); b.rotation.x=-a; const h = mesh(new THREE.CylinderGeometry(.03,.03,.5,6), M.brass, brushes); h.position.set(1.55, Math.sin(a)*.95, Math.cos(a)*.95); h.rotation.x=-a; }
  /* 電機子反作用：界磁起磁力（縦・橙）＋電機子起磁力（横・赤）＝合成（白）。中性軸は合成に直角 */
  const react = new THREE.Group(); g.add(react); react.visible=false; react.position.x = -.3;
  react.add(makeFieldArrow(1.9));
  /* +π/2 で先端を +z へ向ける。合成矢印 res は rotation.x=+ang で +z 側へ傾くので、
     ここを -π/2 にすると電機子矢印だけが逆を向き、平行四辺形が閉じない */
  const armF = makeFieldArrow(1.2, M.u); armF.rotation.x = Math.PI/2; react.add(armF);
  const res = makeFieldArrow(2.1, std({color:0xffffff, emissive:0xffffff, emissiveIntensity:.3})); react.add(res);
  const gn = mesh(new THREE.PlaneGeometry(2.4, 2.8), M.ghostGrey, react); gn.castShadow=false;
  const en = mesh(new THREE.PlaneGeometry(2.4, 2.8), M.ghost, react); en.castShadow=false;
  Object.assign(g.userData, {arm, react, gn, en, armF, res});
  g.userData.labels = [
    {obj:poles[0], t:'界磁磁極 N（上）', c:'#C94A44'},
    {obj:poles[3], t:'界磁磁極 S（奥）', c:'#3572D6'},
    {obj:poles[2], t:'界磁磁極 N（下）', c:'#C94A44'},
    {obj:coils, t:'電機子巻線', c:'#C07A3A'},
    {obj:comm, t:'整流子', c:'#D9C7A0'},
    {obj:brushes, t:'ブラシ（幾何学的中性軸）', c:'#2B2B2B'},
    {obj:en, t:'電気的中性軸のずれ', c:'#D24A43', key:'react'},
  ];
}
function animDC(g, t, st, dt){
  const u = g.userData;
  u.arm.rotation.x -= (st.paused?0:st.ws)*dt*.9;
  u.react.visible = st.react;
  /* 矢印が見えなくならないための表示下限と、角度そのものは分ける。
     下限を角度にも効かせると Ia=0 でも中性軸が 5°ずれたままになり、
     「電流が小さければ反作用も小さい」の歩と食い違う */
  u.armF.scale.set(1, .15 + st.load, 1);
  u.armF.visible = st.load > .02;      // 電流ゼロで矢印だけ残ると「起磁力があるのにずれない」と読める
  const ang = reactAng(st.load);                // 合成起磁力の傾き。右パネルの図と同じ式
  u.res.rotation.x = ang; u.res.scale.set(1, Math.hypot(1.9, 1.2*st.load)/2.1, 1);

  u.gn.rotation.set(Math.PI/2, 0, 0);

  mesh(new THREE.BoxGeometry(2.6,.06,.5), M.north, cyl, 0, 1.08, 0); mesh(new THREE.BoxGeometry(2.6,.06,.5), M.south, cyl, 0, -1.08, 0);

}
function animSync(g, t, st, dt){

let drag=null;

cv.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; cam.theta -= dx*.006; cam.phi = Math.min(1.5, Math.max(.25, cam.phi - dy*.006)); drag.x=e.clientX; drag.y=e.clientY; cam.want=null; });

  const r = cv.getBoundingClientRect(); const m = new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m, camera);

/* ---------- 凡例と引き出し線 ----------
   3D上に文字を常駐させない。凡例（左上・順序固定）の行に触れた1件だけ、
   その部品へ線を引く。回しても凡例の並びは変わらないので、
   「どれが何を指しているか」が分からなくなることがない。 */
const labelsEl = document.getElementById('labels');
const leaders = document.getElementById('leaders');
const legendEl = document.getElementById('legend');
const lgshow = document.getElementById('lgshow');
const labelNodes = [];   // 全景の機器名ラベル

lgshow.onclick = ()=>{ legendEl.classList.remove('hidden'); lgshow.classList.add('hidden'); };

function rebuildLabels(){
  for (const n of labelNodes) if (n.el) n.el.remove();
  labelNodes.length = 0; legendRows = []; hoverIdx = pinIdx = null;
  leaders.innerHTML = ''; legendEl.innerHTML = '';
  legendEl.classList.add('hidden'); lgshow.classList.add('hidden');
  if (!state.current){
    for (const id of ORDER){ const m = MACHINES[id];
      const el = document.createElement('div'); el.className = 'lbl big';
      el.style.setProperty('--lc', '#F0B57E');
      el.textContent = m.num + ' ' + m.title; el.onclick = ()=>select(id);
      labelsEl.appendChild(el);
      labelNodes.push({el, pos:new THREE.Vector3(m.x, id==='transformer'? 6.6 : 5.4, 0)});
    }
    return;
  }
  /* 同じ名前のアンカー（直流機の界磁磁極Nなど）は1行にまとめ、線を複数本出す */
  const g = groups[state.current];
  const byName = new Map();
  const labs = (typeof g.userData.labels === 'function') ? g.userData.labels(state) : g.userData.labels;
  for (const l of labs){
    if (!l.obj) continue;
    if (!byName.has(l.t)) byName.set(l.t, {name:l.t, color:l.c, nodes:[]});
    byName.get(l.t).nodes.push({obj:l.obj});
  }
  /* 狭い画面では畳んで開く。3Dの上に凡例が覆いかぶさるのを避ける */
  const narrow = window.innerWidth < 900;
  legendEl.classList.toggle('hidden', narrow);
  lgshow.classList.toggle('hidden', !narrow);
  const cap = document.createElement('div'); cap.className = 'lgcap';
  const capT = document.createElement('span'); capT.textContent = '部品（行に触れると指す）';
  const hide = document.createElement('button'); hide.textContent = '隠す';
  hide.onclick = ()=>{ legendEl.classList.add('hidden'); lgshow.classList.remove('hidden'); };
  cap.append(capT, hide); legendEl.appendChild(cap);
  for (const row of byName.values()){
    const b = document.createElement('button'); b.className = 'lgrow';
    const chip = document.createElement('i'); chip.style.background = row.color;
    const tx = document.createElement('span'); tx.textContent = row.name;
    b.append(chip, tx); legendEl.appendChild(b);
    const i = legendRows.length; row.el = b; legendRows.push(row);
    b.onmouseenter = ()=>{ hoverIdx = i; paintLegend(); };
    b.onmouseleave = ()=>{ hoverIdx = null; paintLegend(); };
    b.onfocus = ()=>{ hoverIdx = i; paintLegend(); };
    b.onblur = ()=>{ hoverIdx = null; paintLegend(); };
    b.onclick = ()=>{ pinIdx = (pinIdx === i ? null : i); paintLegend(); };
    row.lines = row.nodes.map(()=>{
      const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('stroke', row.color); ln.setAttribute('stroke-width','1.5');

      dt.setAttribute('r','3.5'); dt.setAttribute('fill', row.color);

      return {ln, dt};
    });

  paintLegend();
}
const _wp = new THREE.Vector3();
/* 指している部品の示し方。全部を □ で囲うと「何を指しているか」がぼやけるので、
   ・単体の部品 → その部品の稜線を破線でなぞる（円筒なら円、板なら板の輪郭）
   ・複数部品のまとまり → 外接箱の四隅だけを「かぎ括弧」で示す
   どちらも明滅させ、部品自身の線と見分けがつくようにする。
   手前の部品に隠れないよう depthTest は切る。 */
const hlMat = new THREE.LineDashedMaterial({color:0xffffff, dashSize:.13, gapSize:.085,
  transparent:true, opacity:.9, depthTest:false});
const hl = new THREE.LineSegments(new THREE.BufferGeometry(), hlMat);
hl.renderOrder = 999; hl.frustumCulled = false; hl.matrixAutoUpdate = false; hl.visible = false; scene.add(hl);
const _edgeCache = new Map();
const _box = new THREE.Box3();
let hlKey = null, hlOwn = null, hlTarget = null;
/* 外接箱の四隅から辺の方向へ短く伸ばした「かぎ」 */
function cornerGeo(box){
  const mn = box.min, mx = box.max, pts = [];
  const L = [Math.min((mx.x-mn.x)*.3, .55), Math.min((mx.y-mn.y)*.3, .55), Math.min((mx.z-mn.z)*.3, .55)];
  for (const ix of [0,1]) for (const iy of [0,1]) for (const iz of [0,1]){
    const P = [ix?mx.x:mn.x, iy?mx.y:mn.y, iz?mx.z:mn.z], sg = [ix?-1:1, iy?-1:1, iz?-1:1];
    for (let ax=0; ax<3; ax++){ const Q = P.slice(); Q[ax] += sg[ax]*L[ax]; pts.push(P[0],P[1],P[2], Q[0],Q[1],Q[2]); }
  }
  const gm = new THREE.BufferGeometry();
  gm.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return gm;
}
function setHighlight(obj){
  if (!obj){ hl.visible = false; hlKey = null; return; }
  const single = obj.isMesh && obj.geometry;
  const key = obj.uuid + (single ? '|e' : '|c');
  if (key !== hlKey){
    hlKey = key;
    if (hlOwn){ hlOwn.dispose(); hlOwn = null; }
    if (single){
      let e = _edgeCache.get(obj.geometry.uuid);
      if (!e){ e = new THREE.EdgesGeometry(obj.geometry, 24); _edgeCache.set(obj.geometry.uuid, e); }
      hl.geometry = e;
    } else {
      hl.geometry = hlOwn = cornerGeo(_box.setFromObject(obj));
    }
    hl.computeLineDistances();
  } else if (!single){
    /* まとまりは中身が動くので、箱だけ毎フレーム取り直す */
    if (hlOwn) hlOwn.dispose();
    hl.geometry = hlOwn = cornerGeo(_box.setFromObject(obj));
    hl.computeLineDistances();
  }
  if (single) hl.matrix.copy(obj.matrixWorld); else hl.matrix.identity();
  hl.visible = true;
}
/* 祖先まで visible をたどる。途中で false なら画面に出ていない */
function visibleInScene(o){ for (let n=o; n; n=n.parent){ if (!n.visible) return false; } return true; }
function activeRow(){ return hoverIdx !== null ? hoverIdx : pinIdx; }
function paintLegend(){ const a = activeRow(); legendRows.forEach((r,i)=>r.el.classList.toggle('on', i===a)); }
/* ツアーが「この部品を見て」と言ったら、その行を固定する */
function focusByName(name){
  pinIdx = null;
  if (name){ const i = legendRows.findIndex(r=>r.name.includes(name)); if (i>=0) pinIdx = i; }
  paintLegend();
}

function updateLabels(){
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!state.current){
    for (const n of labelNodes){
      const v = n.pos.clone().project(camera);
      const show = v.z <= 1;
      n.el.style.display = show ? '' : 'none';
      if (show){ n.el.style.left = ((v.x+1)/2*w)+'px'; n.el.style.top = ((1-v.y)/2*h - 6)+'px'; }
    }
    return;
  }
  const a = activeRow(), open = !legendEl.classList.contains('hidden');
  const vb = cv.getBoundingClientRect();
  hlTarget = null;
  legendRows.forEach((row, i)=>{
    /* 今そこに無い部品（かご形/巻線形・突極/円筒・反作用）は凡例からも消す。
       state を見に行かず、オブジェクト自身が表示されているかで判定する。 */
    const avail = row.nodes.some(n=>visibleInScene(n.obj));
    row.el.style.display = avail ? '' : 'none';
    const lit = avail && open && i === a;
    let ex = 0, ey = 0;
    if (lit){ const r = row.el.getBoundingClientRect(); ex = r.right - vb.left; ey = r.top - vb.top + r.height/2; }
    row.nodes.forEach((n, k)=>{
      const {ln, dt} = row.lines[k];
      const v = (lit && visibleInScene(n.obj)) ? n.obj.getWorldPosition(_wp).project(camera) : null;
      const on = !!v && v.z <= 1;
      ln.style.display = on ? '' : 'none'; dt.style.display = on ? '' : 'none';
      if (!on) return;
      const ax = (v.x+1)/2*w, ay = (1-v.y)/2*h;
      ln.setAttribute('x1', ex); ln.setAttribute('y1', ey);
      ln.setAttribute('x2', ax); ln.setAttribute('y2', ay);
      dt.setAttribute('cx', ax); dt.setAttribute('cy', ay);
      if (!hlTarget) hlTarget = {obj:n.obj, color:row.color};
    });
  });
  setHighlight(hlTarget && hlTarget.obj);
}

function range(label, min, max, step, key, fmt){ const g=document.createElement('div'); g.className='cg'; const l=document.createElement('label'); l.innerHTML=label+' <span class="val"></span>'; const i=document.createElement('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=state[key]; i.setAttribute('aria-label', label); i.oninput=()=>{ state[key]=+i.value; refreshCtrl(); }; g.append(l,i); g.dataset.key=key; g.dataset.fmt=''; g._fmt=fmt; g._input=i; return g; }

let readoutEl=null;

/* state → 操作帯の表示を同期（ツアーが state を書き換えたときにも使う） */
function syncCtrl(){
  ctrlbar.querySelectorAll('.cg[data-key]').forEach(g=>{ if(g._input){ g._input.value = state[g.dataset.key]; g.querySelector('.val').textContent = g._fmt(state[g.dataset.key]); } });
  ctrlbar.querySelectorAll('.seg[data-key]').forEach(d=>{ [...d.children].forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===String(state[d.dataset.key])))); });
}
let _lastTfSig = null;
const tfSig = () => state.tfView + '/' + state.bankV;
function refreshCtrl(){
  /* 試験中の負荷率は試験のほうが決める（開放＝0、短絡＝定格）。
     ツアーや予想クイズが state を書き換えたときも表示が食い違わないよう、ここで揃える */
  if (state.current==='transformer' && state.tfView==='core' && state.tfTest!=='run')
    state.tfLoad = state.tfTest==='oc' ? 0 : 1;
  syncCtrl();
  if (state.current === 'transformer' && tfSig() !== _lastTfSig){
    const viewChanged = !_lastTfSig || _lastTfSig.split('/')[0] !== state.tfView;
    _lastTfSig = tfSig();
    if (!viewChanged){ rebuildLabels(); }      // 結線だけ変わったら凡例を張り直す
    else {
      buildCtrl();               // 見る対象でスライダーの中身が変わる
      rebuildLabels(); flyTo(VIEWS[tfViewKey()]);
      return;                    // buildCtrl から refreshCtrl が呼び直される
    }
  }
  if (!readoutEl) return; const id=state.current; let rows=[], note='';
  if (id==='induction-machine'){
    const Ns=120*state.im_f/state.im_p, N=Ns*(1-state.slip);
    rows=[['Ns','Ns = 120f/p', Ns.toFixed(0)+' min⁻¹'],
          ['N','N = (1−s)Ns', N.toFixed(0)+' min⁻¹'],
          ['f2','f₂ = s·f', (state.slip*state.im_f).toFixed(2)+' Hz'],
          ['ratio','P₂ : Pc₂ : Po', '1 : '+state.slip.toFixed(2)+' : '+(1-state.slip).toFixed(2)]];
    note='※ Po は内部機械出力。軸出力はここから機械損を引く';
  }
  if (id==='synchronous'){
    const sd = Math.sin(state.delta*Math.PI/180);
    /* 力率は「Vカーブの谷より右か左か」で決まる。谷は負荷で右へ動くので、
       固定しきい値で判定するとグラフと読み値が逆転する（全負荷で実際に逆転していた）。
       谷の位置 IF0 は drawMini のVカーブと同じ式を使う。 */
    const d = state.If - IF0();
    rows=[['slip0','滑り','0（磁界と同じ速さ）'],
          ['delta','負荷角 δ', state.delta+'°'],
          ['P','出力 ∝ sinδ', sd.toFixed(2)+(state.delta>=90?'（限界）':'')],
          ['pf','力率', d<-.05?'遅れ（不足励磁）':d>.05?'進み（過励磁）':'1 付近']];
    note='※ P は1相あたり。円筒形・抵抗無視の基本モデル';
  }
  if (id==='dc-machine'){
    rows=[['ia','電機子電流', state.load.toFixed(2)+' pu'],
          ['shift','中性軸のずれ', state.react? '表示中（電流に比例）':'非表示']];
    note='※ 3D のずれ角は模式表示。実機の値ではない';
  }
  if (id==='transformer' && state.tfView==='core'){
    const a=state.tfLoad, T=state.tfTest;
    if (T==='oc'){
      rows=[['v','加える電圧','定格（二次は開放）'],
            ['i','一次電流','励磁電流だけ'],
            ['fe','電力計の読み','≒ 鉄損 Pi'],
            ['cu','銅損','≒ 0（励磁電流の2乗ぶんだけ）']];
      note='※ 光っているのは鉄心だけ。磁束は定格のまま回っている';
    } else if (T==='sc'){
      rows=[['v','加える電圧','定格の数%'],
            ['i','一次電流','定格'],
            ['cu','電力計の読み','≒ 負荷損（ほぼ銅損）'],
            ['fe','鉄損','ほぼ 0（磁束が小さい）']];
      note='※ 光っているのは巻線だけ。ここから %Z も求まる';
    } else {
      rows=[['fe','鉄損 Pi','ほぼ一定'],
            ['cu','銅損 α²·Pc', (a*a).toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+' × Pc'],
            ['eta','効率 η', a<=0 ? '—（無負荷は出力0）' : (eta(a)*100).toFixed(1)+' %'],
            ['eff','最大効率','Pi = α²·Pc']];
      note='※ 効率は「全負荷出力＝全負荷銅損の10倍・力率1」とした例。鉄損一定は電源電圧と周波数が一定のとき。'
        + '3Dの電力計は損失だけを指す模式で、実機の一次側電力計は出力＋損失を読む';
    }
    if (state.tfIron==='hys')  rows.push(['fe','ヒステリシス損','Ph ∝ f·Bm^n（n=1.6〜2）']);
    if (state.tfIron==='eddy') rows.push(['fe','渦電流損','Pe ∝ t²·f²·Bm²（t＝板厚）']);
  }
  if (id==='transformer' && state.tfView==='bank'){
    const V = state.bankV;
    rows=[['conn','結線', V?'V-V（2台）':'Δ-Δ（3台）'],
          ['out','三相出力', V?'√3·P ≒ 1.73 P':'3 P'],
          ['use','利用率（台数の定格に対して）', V?'√3/2 ≒ 86.6 %':'100 %'],
          ['vsd','Δ結線3台に対して', V?'1/√3 ≒ 57.7 %':'100 %']];
    note='※ P は変圧器1台の定格容量。分母が「2台の合計」か「Δ3台」かで数字が変わる';
  }
  if (id==='transformer' && state.tfView==='auto'){
    const a = state.autoA;
    rows=[['a','電圧比 V₂/V₁', a.toFixed(2)],
          ['self','自己容量 ÷ 線路容量', ((a-1)/a*100).toFixed(1)+' %'],
          ['formula','式', '(V₂−V₁)/V₂']];
    note='※ 昇圧の場合。電圧比が1に近いほど小さい容量の変圧器で足りる';
  }
  readoutEl.innerHTML = rows.map(([k,l,v])=>'<dt data-k="'+k+'">'+l+'</dt><dd data-k="'+k+'">'+v+'</dd>').join('')
    + (note? '<div class="rnote">'+note+'</div>' : '');
  if (id==='transformer'){
    /* 試験中の α と、渦電流以外での「鉄心」は意味を持たないので触らせない */
    const cg = ctrlbar.querySelector('.cg[data-key="tfLoad"]');
    if (cg && cg._input){ const off = state.tfTest!=='run'; cg.classList.toggle('off', off); cg._input.disabled = off; }
    const lam = ctrlbar.querySelector('.seg[data-key="tfLam"]');
    if (lam) lam.parentElement.classList.toggle('off', state.tfIron!=='eddy');
  }
  drawMini(); drawMini2(); drawComm(); drawReact(); syncCards();
}
/* 予想クイズが当てた読み値を数秒だけ光らせる。どの数字の話かを取り違えないため。 */
let litTimer = null;
function litReadout(key){
  if (!key || !readoutEl) return;
  readoutEl.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
  readoutEl.querySelectorAll('[data-k="'+key+'"]').forEach(e=>e.classList.add('lit'));
  clearTimeout(litTimer);
  litTimer = setTimeout(()=>readoutEl && readoutEl.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit')), 4000);
}

/* 見えているものの説明だけ **強調** を許す（本文の意味は変えず、条件語を目立たせるため） */
function mark(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--ink)">$1</b>'); }

/* ---------- 予想 → 操作 → 確認 ----------
   選ぶ前に答えを見せない。選んだ瞬間に 3D と操作帯を実際にその状態へ動かし、
   どの読み値の話かを光らせる。式の暗記を「見た動き」に結び直すのが狙い。 */
function bindQuiz(st){
  const box = document.getElementById('quiz'); if (!box) return;
  box.querySelectorAll('li[data-q]').forEach(li=>{
    const qi = +li.dataset.q, item = st.predict[qi];
    const fb = li.querySelector('.qfb');
    const btns = [...li.querySelectorAll('.qopts button')];
    const answer = (k)=>{
      const ok = k === item.ans;
      btns.forEach((b,bi)=>{ b.disabled = true;
        if (bi === item.ans) b.classList.add('ok');
        else if (bi === k) b.classList.add('ng');
        else b.classList.add('dim'); });
      li.classList.add('done');
      fb.hidden = false;
      fb.innerHTML = '<span class="verdict '+(ok?'ok':'ng')+'">'+(ok?'正解':'惜しい')+'</span>'+esc(item.why)
        + '<br><button class="again">もう一度やる</button>';
      fb.querySelector('.again').onclick = ()=>{
        btns.forEach(b=>{ b.disabled=false; b.classList.remove('ok','ng','dim'); });
        li.classList.remove('done'); fb.hidden = true; fb.innerHTML='';
      };
      if (item.set) Object.assign(state, item.set);
      refreshCtrl();
      litReadout(item.hi);
    };
    btns.forEach((b,k)=>b.onclick = ()=>answer(k));
  });
}

    <p><b>単巻変圧器は「1つの巻線の途中から取り出す」。</b>一次と二次が巻線を共有するので、
    変圧器が自分で受け持つ容量（自己容量）は、電圧を足す直列巻線の分だけで済む。</p>
    <div class="tbl"><table>
      <tr><th>量</th><th>式</th></tr>
      <tr><td>線路容量（負荷に送る容量）</td><td>Vh · I</td></tr>
      <tr><td>自己容量（変圧器の大きさ）</td><td>(Vh − Vl) · I</td></tr>
      <tr><td>比</td><td>(Vh − Vl) / Vh</td></tr>
      <tr><td><b>直列巻線を流れる電流</b></td><td>二次電流 I₂ がそのまま</td></tr>
      <tr><td><b>分路巻線を流れる電流</b></td><td>I₁ − I₂（一次と二次の差）</td></tr>
    </table></div>
    <p>分母は<b>高い方の電圧 Vh</b>。低い方で割る誤りが多い。電圧比が1に近いほど比は小さくなり、
    小さな変圧器で大きな容量を送れる。逆に電圧比が大きいと利点が薄れ、
    一次と二次が電気的につながっているので<b>低圧側にも高圧が現れる危険</b>がある点も出題される。</p>`;
  if (k==='cmp') return `
    <div class="tbl"><table>
      <tr><th>項目</th><th>誘導機</th><th>同期機</th></tr>
      <tr><td>回転速度</td><td>Ns より少し遅い（電動機運転のとき。s&lt;0 の発電運転では Ns より速い）</td><td>Ns と同じ</td></tr>
      <tr><td>滑り</td><td>s &gt; 0</td><td>s = 0</td></tr>
      <tr><td>回転子の励磁</td><td>電磁誘導（自分で誘導される）</td><td>直流励磁・永久磁石</td></tr>
      <tr><td>負荷が増えると</td><td>速度が落ちる（s が増える）</td><td>負荷角 δ が増える</td></tr>
      <tr><td>力率の調整</td><td>原則できない（遅れ）</td><td>界磁電流でできる</td></tr>
      <tr><td>始動</td><td>自力で始動できる</td><td>そのままでは始動しない（制動巻線などが要る）</td></tr>
    </table></div>
    <p>試験では<b>「速度が変わるか、角度が変わるか」</b>で切り分けると迷わない。
    誘導機は負荷が増えると遅くなり、同期機は遅くならずに角度がつく。
    力率を調整できるのは同期機だけで、これが同期調相機の役割。</p>`;
  return '';
}

/* ---------- ミニ図（右パネルの曲線。形だけの模式図） ---------- */
function drawMini(){
  const c = document.getElementById('mini'); if (!c) return;
  const ctx = c.getContext('2d'); const W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim(), ink3 = css.getPropertyValue('--ink-3').trim(), acc = css.getPropertyValue('--accent').trim(), line = css.getPropertyValue('--line').trim(), steel = css.getPropertyValue('--steel').trim();
  ctx.font = '22px "JetBrains Mono", monospace'; ctx.lineWidth = 2.5;
  const L=60, R=W-20, T=24, B=H-44;
  const cap = document.getElementById('miniCap');
  const axes = () => { ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke(); };
  if (state.current==='induction-machine'){
    const r1=.08, x=.5, r2 = .08 * (state.wound? 3 : 1);
    const Tn = (rr, s) => { const R_=rr/Math.max(s,.003); return R_/((r1+R_)**2 + x*x); };
    let mx=0; for (let s=.005;s<=1;s+=.005) mx=Math.max(mx,Tn(.08,s));
    axes(); ctx.fillStyle=ink3; ctx.fillText('s=1', R-40, B+30); ctx.fillText('s=0', L-8, B+30); ctx.fillText('T', L-40, T+10);
    const draw = (rr, col, dash) => { ctx.setLineDash(dash); ctx.strokeStyle=col; ctx.beginPath(); for (let i=0;i<=200;i++){ const s=1 - i/200; const px = L + (1-s)*(R-L), py = B - Tn(rr,s)/mx*(B-T); i? ctx.lineTo(px,py): ctx.moveTo(px,py);} ctx.stroke(); ctx.setLineDash([]); };
    draw(.08, steel, [6,6]); if (state.wound) draw(r2, acc, []);
    const s=state.slip; ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(L+(1-s)*(R-L), B-Tn(r2,s)/mx*(B-T), 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=ink; ctx.fillText('動作点 s='+s.toFixed(2), L+12, T+12);
    cap.textContent = state.wound? '実線: 二次抵抗を足した曲線。最大トルクの高さは変わらず、滑りの大きい側へ移る（比例推移）。' : '破線: かご形のトルク-滑り曲線。横軸は左が s=0（同期速度）、右が s=1（停止）。';
  } else if (state.current==='synchronous'){
    axes(); ctx.fillStyle=ink3; ctx.fillText('If →', R-60, B+30); ctx.fillText('Ia', L-40, T+10); ctx.fillText('遅れ', L+20, B+30); ctx.fillText('進み', R-140, B+30);
    const xOf = If => L + (If-.3)/1.4*(R-L);
    const Ia = (If,P) => Math.hypot(P*.7, 1.6*(If - IF0(P)));
    for (const P of [0,.5,1]){ const sel = P===state.syncP; ctx.strokeStyle = sel? acc : ink3; ctx.setLineDash(sel?[]:[4,6]); ctx.beginPath(); for (let i=0;i<=140;i++){ const If=.3+i/100; const y=B - Ia(If,P)/1.6*(B-T); i? ctx.lineTo(xOf(If),y): ctx.moveTo(xOf(If),y);} ctx.stroke(); }
    ctx.setLineDash([2,4]); ctx.strokeStyle=steel; ctx.beginPath(); ctx.moveTo(xOf(.85), B); ctx.lineTo(xOf(1.15), B-0.7/1.6*(B-T)); ctx.stroke(); ctx.setLineDash([]);
    const y = B - Ia(state.If, state.syncP)/1.6*(B-T); ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(xOf(state.If), y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=ink; ctx.fillText(['無負荷','半負荷','全負荷'][state.syncP*2], R-110, T+12);
    cap.textContent = '同期電動機のVカーブ（形だけの模式図）。谷が力率1。谷より左は不足励磁で遅れ、右は過励磁で進み。負荷が増えると谷が右上へ動く。';
  } else if (state.current==='transformer' && state.tfView==='core' && state.tfIron==='hys'){
    /* B-H ループ。1周で囲む面積が、その1サイクルで熱になる分 */
    const ph = groups.transformer.userData.ph*2.2;
    const cx=(L+R)/2, cy=(T+B)/2, hw=(R-L)/2*.86, hh=(B-T)/2*.86;
    const {Hc, k, Hm} = BH;
    const px = h => cx + h/Hm*hw, py = bb => cy - bb*hh;
    const up = h => bhB(h, true), dn = h => bhB(h, false);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,cy); ctx.lineTo(R,cy); ctx.moveTo(cx,T); ctx.lineTo(cx,B); ctx.stroke();
    ctx.beginPath();
    for (let i=0;i<=120;i++){ const h=-Hm+i/120*2*Hm; i? ctx.lineTo(px(h),py(up(h))): ctx.moveTo(px(h),py(up(h))); }
    for (let i=0;i<=120;i++){ const h=Hm-i/120*2*Hm; ctx.lineTo(px(h),py(dn(h))); }
    ctx.closePath();
    ctx.fillStyle=acc; ctx.globalAlpha=.18; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=acc; ctx.stroke();
    const {h:hNow, rising} = bhPhase(ph), bNow = bhB(hNow, rising);
    /* 点の大きさ＝いまの発熱。3Dの鉄心の明るさと同じ式なので、両方が同時に強くなる */
    ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(px(hNow), py(bNow), 6 + 7*bhHeat(ph), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=ink3; ctx.fillText('H', R-4, cy+30); ctx.fillText('B', cx+10, T+46);
    ctx.fillStyle=ink; ctx.fillText('この面積 = 1サイクル分の損失', L+6, T+18);
    cap.textContent = '1周で囲む面積が1サイクル分の損失で、1秒間に f 回まわるから Ph ∝ f·Bm^n（n=1.6〜2）。けい素鋼板はこの面積が狭い材料。点が大きいほどその瞬間に熱が出ていて、3Dの鉄心の明るさと同じ式で動く。横軸を横切る（H=0＝残留磁束密度）ところでは熱は出ない。';
  } else if (state.current==='transformer' && state.tfView==='core' && state.tfIron==='eddy'){
    /* 鉄心の断面を上から見た図。渦の通り道の幅が板厚で決まる */
    const bw=(R-L)/2-26, bh=B-T-30, y0=T+14;
    const panelBox = (x0, n, ttl) => {
      ctx.strokeStyle=line; ctx.lineWidth=1; ctx.strokeRect(x0, y0, bw, bh);
      ctx.fillStyle=ink3; ctx.fillText(ttl, x0, y0-6);
      const pitch = bw/n;
      if (n>1){ ctx.strokeStyle=line; for (let i=1;i<n;i++){ const xi=x0+pitch*i; ctx.beginPath(); ctx.moveTo(xi,y0); ctx.lineTo(xi,y0+bh); ctx.stroke(); } }
      ctx.strokeStyle=acc; ctx.lineWidth=2.5;
      for (let i=0;i<n;i++){ const w = pitch*(n===1?.72:.5), cxi = x0 + pitch*(i+.5);
        ctx.beginPath(); ctx.rect(cxi-w/2, y0+bh*.14, w, bh*.72); ctx.stroke(); }
    };
    panelBox(L, 1, '塊鉄心');
    panelBox(L+bw+52, 9, '積層（9枚）');
    ctx.fillStyle=ink; ctx.fillText('→', L+bw+14, y0+bh*.55);
    cap.textContent = '鉄心の断面を上から見た図。橙の輪が渦電流の通り道。板厚を 1/9 にすると輪の幅も 1/9 になり、渦電流損は板厚の2乗で効くので約 1/81 になる（Pe ∝ t²f²Bm²）。板が互いに絶縁され、板厚が表皮深さより十分薄いときの話。';
  } else if (state.current==='transformer'){
    const Pi=.25, Pc=1, a0=state.tfLoad;
    axes(); ctx.fillStyle=ink3; ctx.fillText('α=0', L-8, B+30); ctx.fillText('α=1', L+(1/1.2)*(R-L)-30, B+30); ctx.fillText('損失', L-52, T+10);
    const xOf = a => L + a/1.2*(R-L), yOf = p => B - p/1.6*(B-T);
    ctx.strokeStyle=ink3; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(xOf(0), yOf(Pi)); ctx.lineTo(xOf(1.2), yOf(Pi)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=acc; ctx.beginPath(); for (let i=0;i<=120;i++){ const a=i/100; const y=yOf(Pc*a*a); i? ctx.lineTo(xOf(a),y): ctx.moveTo(xOf(a),y);} ctx.stroke();
    const am = Math.sqrt(Pi/Pc); ctx.strokeStyle=steel; ctx.setLineDash([2,4]); ctx.beginPath(); ctx.moveTo(xOf(am), B); ctx.lineTo(xOf(am), yOf(Pi)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(xOf(a0), yOf(Pc*a0*a0), 8, 0, Math.PI*2); ctx.fill();
    /* 効率曲線（右目盛 80〜95%）。損失の交点と効率の山が同じ負荷率に来ることを重ねて見せる */
    const eOf = v => B - (v-.80)/.15*(B-T);
    ctx.strokeStyle=steel; ctx.lineWidth=2; ctx.beginPath();
    for (let i=1;i<=120;i++){ const a=i/100; const y=eOf(Math.min(.95, Math.max(.80, eta(a)))); i===1? ctx.moveTo(xOf(a),y): ctx.lineTo(xOf(a),y); }
    ctx.stroke(); ctx.lineWidth=2.5;
    if (a0>0){ ctx.fillStyle=steel; ctx.beginPath(); ctx.arc(xOf(a0), eOf(Math.min(.95,Math.max(.80,eta(a0)))), 7, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle=ink; ctx.fillText('鉄損 Pi（一定）', xOf(.02), yOf(Pi)-8); ctx.fillText('銅損 α²Pc', xOf(.8), yOf(Pc*.8*.8)-16);
    ctx.fillStyle=steel; ctx.fillText('Pi=α²Pc', xOf(am)-40, B-6); ctx.fillText('効率 η', xOf(.06), eOf(.93));
    ctx.fillStyle=ink3; ctx.fillText('95%', R-58, T+22); ctx.fillText('80%', R-58, B-6);
    cap.textContent = '橙が損失（鉄損は一定・銅損は負荷率の2乗）、青が効率（右目盛 80〜95%）。'
      + '損失の2本が交わる負荷率で効率が山になる。比率は例示で、実値はWikiの例題を見る。';
  }
}

/* Vカーブの谷（力率1になる界磁電流）。負荷が増えると右上へ動く。
   グラフと読み値の両方がこの1か所を見る。 */
function IF0(P){ return .85 + (P===undefined? state.syncP : P)*.3; }

/* 変圧器の効率。図と読み値が同じ式を見るように1か所に置く。
   Pi・Pc は図の比率（0.25 / 1）に合わせ、全負荷出力は全負荷銅損の10倍・力率1とした例。
   絶対値ではなく「負荷率で効率がどう動くか」を見るための模式。 */
const TF_PI = .25, TF_PC = 1, TF_S = 10;
function eta(a){ const out = a*TF_S; return out <= 0 ? 0 : out/(out + TF_PI + a*a*TF_PC); }

/* ---------- 同期機の P-δ 曲線 ---------- */
function drawMini2(){
  const c = document.getElementById('mini2'); if (!c || state.current!=='synchronous') return;
  const ctx = c.getContext('2d'), W=c.width, H=c.height; ctx.clearRect(0,0,W,H);

        steel=css.getPropertyValue('--steel').trim();

  /* δ>90° は運転を保てない領域。薄く塗って境界を示す */
  ctx.fillStyle=line; ctx.globalAlpha=.35; ctx.fillRect(xOf(90),T,xOf(180)-xOf(90),B-T); ctx.globalAlpha=1;
  ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
  ctx.strokeStyle=acc; ctx.beginPath();
  for (let i=0;i<=180;i++){ const y=yOf(Math.sin(i*Math.PI/180)); i? ctx.lineTo(xOf(i),y): ctx.moveTo(xOf(i),y); }
  ctx.stroke();
  ctx.setLineDash([3,5]); ctx.strokeStyle=steel;
  ctx.beginPath(); ctx.moveTo(xOf(90),B); ctx.lineTo(xOf(90),yOf(1)); ctx.stroke(); ctx.setLineDash([]);
  const d=state.delta, sd=Math.sin(d*Math.PI/180);
  ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(xOf(d), yOf(sd), 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle=ink3;
  ctx.fillText('0°', L-10, B+30); ctx.fillText('90°', xOf(90)-24, B+30); ctx.fillText('180°', R-46, B+30);
  ctx.fillText('P', L-42, T+10); ctx.fillText('δ', R-16, B+30);
  ctx.fillText('保てない', xOf(96), T+22);
  ctx.fillStyle=ink; ctx.fillText('δ='+d+'°  sinδ='+sd.toFixed(2), L+14, T+12);
  const cap=document.getElementById('mini2Cap');
  if (cap) cap.textContent='出力と負荷角：P =(E·V/Xs)·sinδ。δ=90°で最大で、そこを超えると引き戻す力が減り同期を保てない（網掛けの領域。スライダーは90°までで、ここへは入れない）。'
    + '※円筒形（非突極）で電機子抵抗を無視した基本モデル。突極機はリラクタンストルクの項が加わるので同じ式にはならない。';
}

/* ---------- 変圧器：一次側換算の3段階（SVG） ---------- */
const CONV_CAP = [
  '実物。一次と二次は巻数が違うので、電圧も電流も桁が違う。このままでは1本の回路として足せない。',
  '二次側の r₂・x₂ を a² 倍して一次側の目盛りにそろえる。部品が動くのではなく、見る目線を一次側に統一している。',
  '換算後は変圧器を理想変圧器とみなせるので、1本の直列回路として一度に計算できる。これが一次側換算の目的。',
];
function drawConv(stage){
  const host = document.getElementById('convfig'); if (!host) return;
  const cap = document.getElementById('convcap'); if (cap) cap.textContent = CONV_CAP[stage];
  const A='var(--accent)', I='var(--ink)', M2='var(--ink-3)', L='var(--line)';
  const box=(x,y,w,h,t,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${fill||'none'}" stroke="${I}" stroke-width="1.5"/>`
    + `<text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="14" fill="${I}">${t}</text>`;
  const wire=(x1,y1,x2,y2,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||I}" stroke-width="1.4"/>`;
  const lab=(x,y,t,col,anchor)=>`<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-size="13" fill="${col||M2}">${t}</text>`;
  const coil=(x,y,t)=>`<rect x="${x}" y="${y}" width="10" height="46" rx="5" fill="none" stroke="${I}" stroke-width="1.6"/>`
    + `<text x="${x+5}" y="${y-7}" text-anchor="middle" font-size="13" fill="${M2}">${t}</text>`;
  let g='';
  if (stage===0){
    g = wire(20,40,60,40)+box(60,28,44,24,'r₁')+wire(104,40,120,40)+box(120,28,44,24,'x₁')+wire(164,40,196,40)
      + coil(196,17,'N₁') + `<line x1="214" y1="12" x2="214" y2="68" stroke="${M2}" stroke-width="3"/><line x1="220" y1="12" x2="220" y2="68" stroke="${M2}" stroke-width="3"/>`
      + coil(228,17,'N₂')
      + wire(238,40,268,40)+box(268,28,44,24,'x₂')+wire(312,40,328,40)+box(328,28,44,24,'r₂')+wire(372,40,404,40)
      + box(404,22,52,36,'負荷')
      + wire(20,40,20,96)+wire(20,96,196,96)+wire(238,96,404,96)+wire(404,96,404,58)+wire(196,96,196,52)+wire(238,96,238,52)
      + lab(217,86,'巻数比 a = N₁/N₂',A) + lab(20,26,'V₁',M2) + lab(456,44,'V₂',M2,'start');
  } else if (stage===1){
    g = wire(20,40,60,40)+box(60,28,44,24,'r₁')+wire(104,40,120,40)+box(120,28,44,24,'x₁')+wire(164,40,192,40)
      + box(192,28,50,24,'x₂′',"var(--accent-soft)")+wire(242,40,248,40)+box(248,28,50,24,'r₂′',"var(--accent-soft)")
      + wire(298,40,330,40)
      + coil(330,17,'N₁') + `<line x1="348" y1="12" x2="348" y2="68" stroke="${M2}" stroke-width="3"/><line x1="354" y1="12" x2="354" y2="68" stroke="${M2}" stroke-width="3"/>`
      + coil(362,17,'N₂')
      + wire(372,40,408,40)+box(408,22,52,36,'負荷′',"var(--accent-soft)")
      + wire(20,40,20,96)+wire(20,96,330,96)+wire(372,96,408,96)+wire(408,96,408,58)+wire(330,96,330,52)+wire(372,96,372,52)
      + `<path d="M300 74 C280 92 250 92 230 74" stroke="${A}" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>`
      + lab(265,104,'二次側の r₂・x₂ を a² 倍して一次側へ',A)
      + lab(351,86,'理想変圧器（a:1）',M2);
  } else {
    g = wire(20,40,56,40)+box(56,28,40,24,'r₁')+wire(96,40,110,40)+box(110,28,40,24,'x₁')+wire(150,40,196,40)
      + wire(196,40,196,70)+box(172,70,48,26,'励磁')+wire(196,96,196,110)
      + wire(196,40,248,40)+box(248,28,46,24,'x₂′',"var(--accent-soft)")+wire(294,40,300,40)+box(300,28,46,24,'r₂′',"var(--accent-soft)")
      + wire(346,40,392,40)+box(392,22,56,36,'負荷′',"var(--accent-soft)")
      + wire(20,40,20,110)+wire(20,110,448,110)+wire(448,110,448,58)
      + lab(234,16,'一次側から見た1本の回路',A)
      + lab(20,26,'V₁',M2);
  }
  host.innerHTML = `<svg class="convfig" viewBox="0 0 480 124" role="img" aria-label="一次側換算の段階図">`
    + `<defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">`
    + `<path d="M0 0 L7 3.5 L0 7 z" fill="${A}"/></marker></defs>${g}</svg>`;
}

/* ---------- 直流機：電機子反作用の合成磁束（3Dの矢印と同じ式） ----------
   3D の animDC が使う k と ang をそのまま使う。図と立体で角度が食い違わないように、
   式を2か所に書かない。極性（N・S がどちら）は主張せず、直交関係と角度だけを示す。 */
function reactAng(load){ return Math.atan2(1.2*load, 1.9); }
function drawReact(){
  const c = document.getElementById('reactfig'); if (!c || state.current!=='dc-machine') return;
  const ctx=c.getContext('2d'), W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const ink=css.getPropertyValue('--ink').trim(), ink3=css.getPropertyValue('--ink-3').trim(),
        acc=css.getPropertyValue('--accent').trim(), line=css.getPropertyValue('--line').trim();
  const RED='#D24A43';
  const th = reactAng(state.load);
  const Ox=176, Oy=246, Lf=150, La=Lf*(1.2*state.load)/1.9;   // 3D と同じ長さ比
  const fyT=Oy-Lf, axT=Ox+La;
  const arrow=(x1,y1,x2,y2,col)=>{
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a=Math.atan2(y2-y1,x2-x1), h=11;
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-h*Math.cos(a-.4), y2-h*Math.sin(a-.4));
    ctx.lineTo(x2-h*Math.cos(a+.4), y2-h*Math.sin(a+.4));
    ctx.closePath(); ctx.fill();
  };
  /* 中性軸2本。幾何学的＝界磁の磁束に直角（水平）、電気的＝合成磁束に直角（θ回る） */
  ctx.setLineDash([6,6]); ctx.lineWidth=2;
  ctx.strokeStyle=line;
  ctx.beginPath(); ctx.moveTo(Ox-142, Oy); ctx.lineTo(Ox+196, Oy); ctx.stroke();
  ctx.strokeStyle=RED;
  ctx.beginPath();
  ctx.moveTo(Ox-142*Math.cos(th), Oy-142*Math.sin(th));
  ctx.lineTo(Ox+196*Math.cos(th), Oy+196*Math.sin(th));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle=RED; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(Ox, Oy, 104, 0, th); ctx.stroke();
  /* 3本の矢印。色は 3D の橙・赤・合成に合わせる（合成だけは白だと明色テーマで消えるので ink） */
  arrow(Ox, Oy, Ox, fyT, acc);
  if (La > 2) arrow(Ox, fyT, axT, fyT, RED);   // Ia=0 では矢頭だけが残らないようにする
  arrow(Ox, Oy, axT, fyT, ink);
  ctx.strokeStyle=line; ctx.lineWidth=1; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(axT, fyT); ctx.lineTo(axT, Oy); ctx.stroke(); ctx.setLineDash([]);
  ctx.font='19px "JetBrains Mono", monospace';
  ctx.fillStyle=acc; ctx.textAlign='right'; ctx.fillText('Ff', Ox-10, Oy-Lf/2+7); ctx.textAlign='left';
  ctx.fillStyle=RED; ctx.fillText('Fa', Ox+La/2-16, fyT-12);
  ctx.fillStyle=ink; ctx.fillText('Fr', Ox+La/2+14, Oy-Lf/2+22);
  ctx.fillStyle=ink; ctx.fillText('θ='+(th*180/Math.PI).toFixed(0)+'°', Ox+112, Oy-12);
  ctx.font='15px "JetBrains Mono", monospace';
  ctx.fillStyle=ink3; ctx.fillText('幾何学的中性軸', Ox-140, Oy+22);
  ctx.fillStyle=RED;  ctx.fillText('電気的中性軸', Ox-134*Math.cos(th), Oy-134*Math.sin(th)-26);
  /* 右側の読み */
  const X=432;
  ctx.font='17px "JetBrains Mono", monospace';
  ctx.fillStyle=ink;  ctx.fillText('θ = arctan(Fa/Ff)', X, 52);
  ctx.font='15px "JetBrains Mono", monospace';
  ctx.fillStyle=ink3; ctx.fillText('Fa は Ia に比例するので、', X, 84);
  ctx.fillText('負荷が増えるほど θ が大きい。', X, 108);
  ctx.font='17px "JetBrains Mono", monospace';
  ctx.fillStyle=ink;  ctx.fillText('ずれる向き', X, 156);
  ctx.font='15px "JetBrains Mono", monospace';
  ctx.fillStyle=ink3; ctx.fillText('発電機：回転方向と同じ', X, 188);
  ctx.fillText('電動機：回転方向と逆', X, 212);
  ctx.fillStyle=ink3; ctx.fillText('この3Dは電動機の向き', X, 236);
  ctx.fillText('（発電機は赤が逆向き）', X, 258);
  ctx.fillText('Ia = '+state.load.toFixed(2)+' pu', X, 284);
}

/* ---------- 直流機：整流子の波形（3Dの回転と同期） ---------- */
let commPhase = 0;
function drawComm(){
  const c = document.getElementById('commfig'); if (!c || state.current!=='dc-machine') return;
  const ctx=c.getContext('2d'), W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const ink=css.getPropertyValue('--ink').trim(), ink3=css.getPropertyValue('--ink-3').trim(),
        acc=css.getPropertyValue('--accent').trim(), line=css.getPropertyValue('--line').trim(),
        steel=css.getPropertyValue('--steel').trim();
  ctx.font='20px "JetBrains Mono", monospace'; ctx.lineWidth=2.4;
  const L=70,R=W-16, A1=78, A2=214, amp=46;
  const xOf = u => L + u*(R-L);
  const trace=(yc, f, col)=>{ ctx.strokeStyle=col; ctx.beginPath();
    for (let i=0;i<=240;i++){ const u=i/240, y=yc - f(u)*amp; i? ctx.lineTo(xOf(u),y): ctx.moveTo(xOf(u),y); } ctx.stroke(); };
  for (const [yc,t] of [[A1,'導体の起電力'],[A2,'ブラシ間の電圧']]){
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(L,yc); ctx.lineTo(R,yc); ctx.stroke();
    ctx.fillStyle=ink3; ctx.fillText(t, L, yc-amp-14);
  }
  trace(A1, u=>Math.sin(u*4*Math.PI), steel);
  trace(A2, u=>Math.abs(Math.sin(u*4*Math.PI)), acc);
  const u = ((commPhase/(2*Math.PI))*2) % 1;
  for (const [yc,f,col] of [[A1,x=>Math.sin(x*4*Math.PI),steel],[A2,x=>Math.abs(Math.sin(x*4*Math.PI)),acc]]){
    ctx.fillStyle='#D24A43'; ctx.beginPath(); ctx.arc(xOf(u), yc - f(u)*amp, 7, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle=ink3; ctx.fillText('0', L-24, A1+7); ctx.fillText('0', L-24, A2+7);
  ctx.fillStyle=ink; ctx.fillText('整流子が向きを反転', xOf(.52), A2+amp+28);
}

/* ---------- 選択 ---------- */
const backBtn = document.getElementById('backbtn');
backBtn.onclick = ()=>select(null);
function select(id){
  state.current = id;
  backBtn.classList.toggle('hidden', !id);
  if (reduced){ const v = VIEWS[id||'overview']; cam.target.set(...v.target); cam.dist=v.dist; cam.theta=v.theta; cam.phi=v.phi; cam.want=null; }
  else flyTo(VIEWS[(id==='transformer') ? tfViewKey() : (id||'overview')]);
  _lastTfSig = (id==='transformer') ? tfSig() : null;
  renderChips(); buildCtrl(); renderPanel(); rebuildLabels();
  panel.scrollTop = 0;
  try { history.replaceState(null, '', id ? '#'+id : location.pathname); } catch (e) {}
}

/* ---------- ループ ---------- */
/* 描画する画素数に上限を置く。高DPIの大画面では w*h*dpr² が1千万画素を超え、
   操作に対する反応が目に見えて鈍る（実測: 2560x1300 で 2fps、負荷を落とすと 21fps）。
   スマホのように面積が小さいときは上限に当たらないので画質はそのまま。 */
const PIXEL_CAP = 2.6e6;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const pr = Math.max(0.75, Math.min(devicePixelRatio || 1, 2, Math.sqrt(PIXEL_CAP / (w * h))));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
/* resize は連続で飛んでくるので1フレームにまとめる */
let rzPending=false;
addEventListener('resize', ()=>{ if(rzPending) return; rzPending=true; requestAnimationFrame(()=>{ rzPending=false; resize(); }); });
resize();
let last = performance.now(), lastComm = 0, lastIron = 0;
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; const t = now/1000;
  if (cam.want){ const k = 1 - Math.pow(.001, dt); cam.target.lerp(cam.want.target, k); cam.dist += (cam.want.dist-cam.dist)*k; cam.theta += (cam.want.theta-cam.theta)*k; cam.phi += (cam.want.phi-cam.phi)*k; if (cam.target.distanceTo(cam.want.target)<.01 && Math.abs(cam.dist-cam.want.dist)<.01) cam.want=null; }
  applyCam();
  /* 1機に寄っているあいだ、画面外の3機は動かさない（見えないものを毎フレーム計算しない）。
     カメラが移動中は全景が見えうるので全機動かす。 */
  const only = (!cam.want && state.current) ? state.current : null;
  for (const id of ORDER) if (!only || id === only) animators[id](groups[id], t, state, dt);
  hlMat.opacity = .62 + .3*Math.sin(t*4.5);
  renderer.render(scene, camera); updateLabels();
  /* B-Hループ・渦電流の図は動くので、右パネルの図だけ約20fpsで描き直す */
  if (state.current === 'transformer' && state.tfView === 'core' && state.tfIron !== 'off' && now - lastIron > 50){
    lastIron = now; drawMini();
  }
  /* 整流子の波形は3Dの電機子と位相をそろえる。毎フレームは要らないので約20fpsに間引く */
  if (state.current === 'dc-machine'){
    commPhase = -groups['dc-machine'].userData.arm.rotation.x;
    if (now - lastComm > 50){ lastComm = now; drawComm(); }
  }
  requestAnimationFrame(loop);
}
const initial = location.hash.replace('#','');
select(MACHINES[initial] ? initial : null);
requestAnimationFrame(loop);
</script>
