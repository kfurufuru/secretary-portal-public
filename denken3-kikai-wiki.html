<!DOCTYPE html>
<html lang="ja" data-theme="light" data-accent="indigo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電験3種 機械Wiki — 受験対策・要点まとめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
/* ============================================================
   電験3種 機械Wiki — Stylesheet
   ============================================================ */

@font-face{
  /* Noto Sans JP は太字(700)でギリシャ文字 U+0370-03FF のグリフ解決が破綻し、
     Ω(オーム)が別字形（キリル文字）で描画される。抵抗値の Ω / MΩ は全 wiki で頻出するため、
     ギリシャ文字ブロックだけをローカルフォントへ退避させる（和文・欧文の字形には影響しない）。
     典拠: playwright での実描画検証。weight 400 は正常・700 のみ破綻。5 wiki 全てで再現。 */
  font-family: 'GreekGlyphFallback';
  src: local('Segoe UI'), local('Arial'), local('Helvetica Neue'), local('DejaVu Sans');
  unicode-range: U+0370-03FF, U+1F00-1FFF;
}
:root {
  --bg: oklch(0.985 0.005 85);
  --bg-elev: oklch(0.995 0.003 85);
  --bg-sunken: oklch(0.96 0.006 85);
  --ink: oklch(0.22 0.02 260);
  --ink-soft: oklch(0.42 0.018 260);
  --ink-mute: oklch(0.49 0.014 260);
  --rule: oklch(0.88 0.008 260);
  --rule-soft: oklch(0.93 0.006 260);
  --accent: oklch(0.45 0.12 260);
  --accent-soft: oklch(0.92 0.04 260);
  --accent-ink: oklch(0.32 0.13 260);
  --warn: oklch(0.50 0.13 50);
  --warn-soft: oklch(0.95 0.04 70);
  --ok: oklch(0.48 0.10 155);
  --ok-soft: oklch(0.94 0.04 155);
  --danger: oklch(0.51 0.16 25);
  --info: oklch(0.50 0.13 255);   /* 情報・参照系の青。生の #3b82f6/#1d4ed8 を置き換える（light worst 4.55 以上・dark は下で明色化） */
  --danger-soft: oklch(0.95 0.03 25);

  --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-sans: "GreekGlyphFallback", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Menlo", monospace;

  --fs-base: 15px;
  --lh-base: 1.85;

  --sidebar-w: 280px;
  --toc-w: 220px;
  --content-max: 760px;
}

[data-theme="dark"] {
  --bg: oklch(0.18 0.012 260);
  --bg-elev: oklch(0.22 0.012 260);
  --bg-sunken: oklch(0.14 0.012 260);
  --ink: oklch(0.94 0.008 85);
  --ink-soft: oklch(0.78 0.012 260);
  --ink-mute: oklch(0.69 0.014 260);
  --rule: oklch(0.32 0.014 260);
  --rule-soft: oklch(0.26 0.012 260);
  --accent: oklch(0.72 0.12 260);
  --accent-soft: oklch(0.30 0.06 260);
  --accent-ink: oklch(0.85 0.070 260);
  --warn: oklch(0.78 0.14 70);
  --warn-soft: oklch(0.32 0.05 70);
  --ok: oklch(0.78 0.12 155);
  --ok-soft: oklch(0.28 0.05 155);
  --danger: oklch(0.78 0.125 25);
  --info: oklch(0.67 0.13 255);
  --danger-soft: oklch(0.32 0.05 25);
}

[data-accent="indigo"]  { --accent: oklch(0.45 0.12 260); --accent-soft: oklch(0.92 0.04 260); --accent-ink: oklch(0.32 0.13 260); }
[data-accent="forest"]  { --accent: oklch(0.45 0.10 155); --accent-soft: oklch(0.92 0.04 155); --accent-ink: oklch(0.32 0.075 155); }
[data-accent="rust"]    { --accent: oklch(0.50 0.13 35);  --accent-soft: oklch(0.93 0.04 50);  --accent-ink: oklch(0.38 0.130 35);  }
[data-accent="aubergine"] { --accent: oklch(0.40 0.10 320); --accent-soft: oklch(0.92 0.04 320); --accent-ink: oklch(0.30 0.11 320); }

[data-theme="dark"][data-accent="indigo"]  { --accent: oklch(0.74 0.12 260); --accent-soft: oklch(0.30 0.06 260); --accent-ink: oklch(0.85 0.070 260); }
[data-theme="dark"][data-accent="forest"]  { --accent: oklch(0.78 0.12 155); --accent-soft: oklch(0.28 0.05 155); --accent-ink: oklch(0.86 0.10 155); }
[data-theme="dark"][data-accent="rust"]    { --accent: oklch(0.78 0.13 50);  --accent-soft: oklch(0.30 0.06 50);  --accent-ink: oklch(0.85 0.090 50);  }
[data-theme="dark"][data-accent="aubergine"] { --accent: oklch(0.74 0.10 320); --accent-soft: oklch(0.28 0.05 320); --accent-ink: oklch(0.85 0.10 320); }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ============================================================ Layout */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--toc-w);
  min-height: 100vh;
}

@media (max-width: 1100px) {
  .app { grid-template-columns: var(--sidebar-w) 1fr; }
  .toc { display: none; }
}

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* ============================================================ Sidebar */

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--rule);
  background: var(--bg-sunken);
  overflow-y: auto;
  padding: 22px 18px 60px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 4px 18px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 16px;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 0.01em;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.search {
  position: relative;
  margin-bottom: 18px;
}
.search input {
  width: 100%;
  padding: 8px 10px 8px 32px;
  border: 1px solid var(--rule);
  background: var(--bg-elev);
  border-radius: 5px;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
}
.search input::placeholder { color: var(--ink-mute); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-mute);
  pointer-events: none;
}

.search-kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  border: 1px solid var(--rule);
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg);
}

.search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: 6px;
  max-height: 360px;
  overflow-y: auto;
  z-index: 30;
  box-shadow: 0 12px 32px -12px oklch(0.2 0.02 260 / 0.25);
}
.search-result {
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  font-size: 13px;
}
.search-result:last-child { border-bottom: 0; }
.search-result:hover, .search-result.active { background: var(--accent-soft); }
.search-result-title { font-weight: 600; color: var(--ink); }
.search-result-meta { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }
.search-result mark { background: var(--accent-soft); color: var(--accent-ink); padding: 0 2px; border-radius: 2px; }

.nav-group {
  margin-bottom: 4px;
}

.nav-chapter {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  background: transparent;
  border: 0;
  padding: 6px 4px;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.nav-chapter:hover { color: var(--ink); }
.nav-chapter-caret {
  width: 10px;
  height: 10px;
  transition: transform 0.15s;
}
.nav-chapter[data-open="false"] .nav-chapter-caret { transform: rotate(-90deg); }
.nav-chapter-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  margin-left: auto;
}

.nav-items {
  list-style: none;
  padding: 0;
  margin: 0 0 6px;
  border-left: 1px solid var(--rule);
  margin-left: 8px;
}
.nav-items[data-open="false"] { display: none; }

.nav-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 10px 4px 14px;
  margin-left: -1px;
  border-left: 2px solid transparent;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.12s;
  line-height: 1.4;
}
.nav-item:hover { color: var(--ink); background: var(--rule-soft); }
.nav-item.active {
  color: var(--accent-ink);
  border-left-color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}
.nav-item-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  flex-shrink: 0;
  font-weight: 400;
}
.nav-item.active .nav-item-num { color: var(--accent); }

.nav-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--warn-soft);
  color: var(--warn);
}

.sidebar-footer {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  font-size: 11px;
  color: var(--ink-mute);
  line-height: 1.6;
}

/* ============================================================ Main Content */

.main {
  padding: 36px 48px 120px;
  min-width: 0;
}

@media (max-width: 760px) { .main { padding: 24px 18px 80px; } }

.crumbs {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.crumbs a { color: var(--ink-mute); }
.crumbs a:hover { color: var(--ink); }
.crumbs .sep { color: var(--rule); }

.page-header {
  border-bottom: 2px solid var(--rule);
  padding-bottom: 18px;
  margin-bottom: 32px;
}
.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin: 0 0 10px;
  color: var(--ink);
}
.page-deck {
  font-size: 15px;
  color: var(--ink-soft);
  line-height: 1.75;
  max-width: 640px;
}

.page-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--ink-mute);
}
.page-meta-item { display: flex; align-items: center; gap: 6px; }
.page-meta-item strong { color: var(--ink-soft); font-weight: 600; }

.content { max-width: var(--content-max); }

.content h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.005em;
  line-height: 1.35;
  margin: 48px 0 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 24px;
}
.content h2 .h-num {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  margin-right: 10px;
  letter-spacing: 0.05em;
}
.content h3 {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  margin: 32px 0 10px;
  scroll-margin-top: 24px;
}
.content h4 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin: 22px 0 8px;
  color: var(--ink);
}
.content p {
  margin: 0 0 14px;
  text-wrap: pretty;
}
.content p strong { color: var(--ink); font-weight: 700; }

/* 論述で問われるポイント — 黄色マーカー */
.marker {
  background: linear-gradient(transparent 55%, oklch(0.92 0.18 95) 55%);
  padding: 0 2px;
  font-weight: 600;
  color: var(--ink);
}
[data-theme="dark"] .marker {
  background: linear-gradient(transparent 55%, oklch(0.55 0.16 95 / 0.55) 55%);
  color: var(--ink);
}
.content ul, .content ol { padding-left: 22px; margin: 6px 0 16px; }
.content li { margin-bottom: 6px; line-height: 1.75; }
.content code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--bg-sunken);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--rule-soft);
}

/* ============================================================ Callouts / boxes */

.box {
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 16px 18px;
  margin: 18px 0;
  background: var(--bg-elev);
}
.box-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.box-label::before {
  content: "";
  width: 14px;
  height: 1px;
  background: currentColor;
}

.box-formula  { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 30%, transparent); }
.box-formula .box-label { color: var(--accent-ink); }
.box-warn     { background: var(--warn-soft); border-color: color-mix(in oklab, var(--warn) 30%, transparent); }
.box-warn .box-label { color: var(--warn); }
.box-tip      { background: var(--ok-soft); border-color: color-mix(in oklab, var(--ok) 30%, transparent); }
.box-tip .box-label { color: var(--ok); }
.box-mistake  { background: var(--danger-soft); border-color: color-mix(in oklab, var(--danger) 30%, transparent); }
.box-mistake .box-label { color: var(--danger); }
.box-example  { background: var(--bg-sunken); }
.box-example .box-label { color: var(--ink-soft); }

.box .katex { font-size: 1.05em; }
.box p:last-child { margin-bottom: 0; }

/* ============================================================ Formula card */

.formula-card {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 18px;
  align-items: center;
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  background: var(--bg-elev);
  padding: 16px 20px;
  margin: 16px 0;
  border-radius: 0 5px 5px 0;
}
.formula-card .num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
}
.formula-card .body { font-size: 14px; color: var(--ink-soft); line-height: 1.6; min-width: 0; }
.formula-card .body strong { color: var(--ink); display: block; font-size: 13px; margin-bottom: 4px; font-family: var(--font-sans); }
.formula-card .eq { font-size: 1.15em; margin: 6px 0; }
/* 長い数式がスマホ幅で切れず、枠内で横スクロールするようにする。
   text-align:center のままだと溢れた左側がスクロールで到達できないので、
   狭幅のときだけ左寄せにする（PC幅の中央寄せの見た目は変えない）。 */
@media (max-width: 760px) {
  .formula-card .eq .katex-display,
  .content .katex-display-wrap .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    text-align: left;
  }
}

/* ============================================================ Tables */

.table-wrap { overflow-x: auto; margin: 16px 0; }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data th, table.data td {
  border: 1px solid var(--rule);
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
}
table.data th {
  background: var(--bg-sunken);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
}
table.data td.num, table.data th.num { font-family: var(--font-mono); text-align: right; }
table.data tr:nth-child(even) td { background: color-mix(in oklab, var(--bg-sunken) 50%, transparent); }
table.data caption {
  caption-side: top;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink-soft);
}
/* data-table は data の別名（JSX側で className="data-table" を統一使用） */
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data-table th, table.data-table td {
  border: 1px solid var(--rule);
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
}
table.data-table th {
  background: var(--bg-sunken);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
}
table.data-table td.num, table.data-table th.num { font-family: var(--font-mono); text-align: right; }
table.data-table tr:nth-child(even) td { background: color-mix(in oklab, var(--bg-sunken) 50%, transparent); }

/* ============================================================ TOC (right rail) */

.toc {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 36px 22px 36px 8px;
  border-left: 1px solid var(--rule);
  font-size: 12px;
  overflow-y: auto;
}
.toc-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 10px;
  font-weight: 700;
}
.toc ul { list-style: none; padding: 0; margin: 0; }
.toc li { margin: 0; }
.toc a {
  display: block;
  padding: 4px 10px;
  border-left: 2px solid var(--rule-soft);
  color: var(--ink-mute);
  font-size: 12px;
  line-height: 1.5;
  transition: all 0.12s;
}
.toc a:hover { color: var(--ink); border-color: var(--ink-mute); text-decoration: none; }
.toc a.active { color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.toc li.h3 a { padding-left: 22px; font-size: 11px; }

/* ============================================================ Cards on home */

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin: 22px 0 32px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  min-height: 120px;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px -10px color-mix(in oklab, var(--accent) 60%, transparent);
}
.card-num {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.card-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.3;
}
.card-deck { font-size: 12px; color: var(--ink-soft); line-height: 1.55; flex-grow: 1; }
.card-foot {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--rule-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.05em;
}
.card-freq { color: var(--accent); font-weight: 700; }

/* ============================================================ Stat strip (home) */

.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--bg-elev);
  margin: 18px 0 28px;
  overflow: hidden;
}
@media (max-width: 720px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
.stat {
  padding: 14px 18px;
  border-right: 1px solid var(--rule);
}
.stat:last-child { border-right: 0; }
.stat-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.stat-value {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
}
.stat-sub { font-size: 11px; color: var(--ink-mute); margin-top: 4px; }

/* ============================================================ Frequency chart */

.freq-chart {
  display: grid;
  grid-template-columns: 100px 1fr 60px;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  margin: 4px 0;
}
.freq-chart .label { color: var(--ink-soft); font-weight: 500; }
.freq-chart .bar { background: var(--bg-sunken); height: 18px; border-radius: 2px; overflow: hidden; }
.freq-chart .bar-fill {
  height: 100%;
  background: var(--accent);
  display: flex;
  align-items: center;
  padding: 0 6px;
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
}
.freq-chart .pct { font-family: var(--font-mono); color: var(--ink-mute); font-size: 11px; text-align: right; }

/* ============================================================ Diagrams */

.diagram {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 18px;
  margin: 18px 0;
  text-align: center;
}
.diagram svg { max-width: 100%; height: auto; }
.diagram-caption {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 10px;
  letter-spacing: 0.04em;
}

.diagram-stroke    { stroke: var(--ink); }
.diagram-fill      { fill: var(--ink); }
.diagram-stroke-soft { stroke: var(--ink-mute); }
.diagram-fill-soft { fill: var(--ink-mute); }
.diagram-fill-bg   { fill: var(--bg-elev); }
.diagram-accent    { stroke: var(--accent); fill: var(--accent); }
.diagram-warn      { stroke: var(--warn); fill: var(--warn); }
.diagram-text      { fill: var(--ink); font-family: var(--font-sans); font-size: 11px; }
.diagram-text-mono { fill: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; }

/* ============================================================ Past-question rows */

.past-q-row {
  display: grid;
  grid-template-columns: 70px 1fr 90px;
  gap: 14px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
  align-items: baseline;
}
.past-q-row:last-child { border-bottom: 0; }
.past-q-row:hover { background: var(--bg-sunken); }
.past-q-year {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
}
.past-q-topic { color: var(--ink); }
.past-q-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-soft);
  text-align: right;
  letter-spacing: 0.04em;
}

/* ============================================================ Pagination footer */

.page-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
}
.page-nav-link {
  display: block;
  padding: 14px 18px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  background: var(--bg-elev);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none !important;
}
.page-nav-link:hover { border-color: var(--accent); }
.page-nav-link.next { text-align: right; }
.page-nav-dir {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.page-nav-title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}

/* ============================================================ Glossary */

.glossary-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}
.glossary-toolbar button {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 10px;
  border: 1px solid var(--rule);
  background: var(--bg-elev);
  color: var(--ink-soft);
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.05em;
}
.glossary-toolbar button:hover { color: var(--ink); border-color: var(--ink-mute); }
.glossary-toolbar button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.glossary-section { margin-bottom: 24px; }
.glossary-section h3 {
  font-family: var(--font-mono);
  font-size: 14px;
  letter-spacing: 0.1em;
  color: var(--accent);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 4px;
  margin: 16px 0 10px;
}
.glossary-entry {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 16px;
  padding: 8px 4px;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
  line-height: 1.6;
}
.glossary-term { font-weight: 600; color: var(--ink); }
.glossary-reading { font-size: 11px; color: var(--ink-mute); font-family: var(--font-mono); margin-top: 2px; }
.glossary-def { color: var(--ink-soft); }
@media (max-width: 720px) {
  .glossary-entry { grid-template-columns: 1fr; gap: 4px; }
}

/* ============================================================ KaTeX overrides */

.katex { font-size: 1em; }
.katex-display-wrap { display: block; }
.katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }

/* ============================================================ Mobile toggle */

.mobile-menu-btn {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  border: 0;
  z-index: 50;
  cursor: pointer;
  box-shadow: 0 4px 14px -2px oklch(0.2 0.02 260 / 0.4);
}
@media (max-width: 760px) {
  .mobile-menu-btn { display: grid; place-items: center; }
  .sidebar.mobile-open {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 100;
    width: 100%;
    height: 100%;
  }
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

    { term: "V結線",           reading: "V KESSEN",          letter: "は",

    { term: "全日効率",        reading: "ZENJITSU KOURITSU", letter: "さ",
      def: "配電用変圧器のように負荷が時間変化する場合に、1日（24時間）の電力量[kWh]で評価した効率。ηd = 出力電力量 /（出力電力量＋鉄損電力量＋銅損電力量）×100。出力電力量は日負荷曲線の各時間帯について kVA×力率×時間 を合計、鉄損電力量は 鉄損×通電時間（負荷ゼロでも無負荷通電中なら発生。電源切離し中は発生しない）、銅損電力量は 全負荷銅損×負荷率²×時間 で求める。負荷率は kVA÷定格容量[kVA] で取り、力率は掛けない（銅損は巻線電流＝kVA で決まるため）。複数時間帯を1つにまとめるときは等価負荷率 xe = √(Σxk²tk / T) を使う。通常効率が kW（ある負荷状態）で評価するのに対し、全日効率は kWh（1日全体）で評価する点が最大の違い。" },

    { term: "かご形回転子",    reading: "KAGOGATA",          letter: "か",

    { term: "界磁制御",        reading: "KAIJI SEIGYO",      letter: "か",

    { term: "輝度",            reading: "KIDO",              letter: "か",

    { term: "慣性モーメント",  reading: "KANSEI MOMENT",     letter: "か",

    { term: "コンデンサ始動",  reading: "CONDENSER START",   letter: "か",

    { term: "サイクロコンバータ", reading: "CYCLOCONVERTER", letter: "さ",

    { term: "循環電流",        reading: "JUNKAN DENRYU",     letter: "さ",

    { term: "水平面照度",      reading: "SUIHEIMEN SHOUDO",  letter: "さ",

    { term: "整流子",          reading: "SEIRYUSHI",         letter: "さ",

    { term: "制動巻線",        reading: "SEIDOU MAKISEN",    letter: "さ",

    { term: "COP",             reading: "SEISEKI KEISUU",    letter: "さ",

    { term: "全波整流",        reading: "ZENPA SEIRYU",      letter: "さ",

    { term: "他励",            reading: "TAREI",             letter: "た",

    { term: "直巻電動機",      reading: "CHOKUMAKI",         letter: "た",

    { term: "短絡試験",        reading: "TANRAKU SHIKEN",    letter: "た",

    { term: "定常偏差",        reading: "TEIJOU HENSA",      letter: "た",

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}

}

function TweakRow({ label, value, children, inline = false }) {
  return (

      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

      ref.current.textContent = tex;

};

const SectionCheck = ({ pageId, sectionId, compact = false }) => {
  const key = `denken_check::kikai_${pageId}::section::${sectionId}`;
  const [status, setStatus] = React.useState(() => {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  });
  const update = (newStatus) => {
    const next = newStatus === status ? '' : newStatus;
    setStatus(next);
    try {
      if (next) localStorage.setItem(key, next);
      else localStorage.removeItem(key);
      window.dispatchEvent(new CustomEvent('section-check-changed', { detail: { key, status: next } }));
    } catch (e) { /* noop */ }
  };
  const buttons = [
    { mark: '◎', label: '完璧', color: 'var(--ok)' },
    { mark: '○', label: 'OK',   color: 'var(--info)' },
    { mark: '△', label: '微妙', color: 'var(--warn)' },
    { mark: '×', label: '未',   color: 'var(--danger)' },
  ];
  return (
    <div style={{
      margin: compact ? '4px 0 12px' : '6px 0 18px',
      padding: '8px 12px',
      background: 'var(--bg-elev)',
      border: '1px solid var(--rule)',
      borderRadius: 6,
      display: 'flex',
      alignItems: 'center',
      gap: 8,
      flexWrap: 'wrap',
    }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ink-soft)' }}>📊 このセクションの理解度:</span>
      {buttons.map(b => (
        <button
          key={b.mark}
          onClick={() => update(b.mark)}
          aria-label={`理解度 ${b.label}`}
          style={{
            padding: '4px 10px',
            minWidth: 36,
            background: status === b.mark ? b.color : 'transparent',
            color: status === b.mark ? 'var(--bg)' : 'var(--ink)',
            border: status === b.mark ? `1px solid ${b.color}` : '1px solid var(--rule)',
            borderRadius: 4,
            cursor: 'pointer',
            fontWeight: 700,
            fontSize: 14,
            transition: 'all 0.1s',
          }}
        >{b.mark}</button>
      ))}
      {status && (
        <span style={{ fontSize: 11, color: 'var(--ink-soft)' }}>前回: <strong style={{ color: 'var(--ink)' }}>{status}</strong></span>
      )}
    </div>
  );
};

/* ---- SectionCheckSummary: ページ末尾の理解度サマリ＝弱点セクションへの再読リンク（Act） ---- */
const SectionCheckSummary = ({ pageId, sections, onJump }) => {
  const [scores, setScores] = React.useState({});
  React.useEffect(() => {
    const refresh = () => {
      const result = {};
      sections.forEach(s => {
        const k = `denken_check::kikai_${pageId}::section::${s.id}`;
        try { result[s.id] = localStorage.getItem(k) || ''; } catch (e) { result[s.id] = ''; }
      });
      setScores(result);
    };
    refresh();
    window.addEventListener('section-check-changed', refresh);
    return () => window.removeEventListener('section-check-changed', refresh);
  }, [pageId, sections]);

  const total = sections.length;
  const counts = { '◎': 0, '○': 0, '△': 0, '×': 0, '未': 0 };
  sections.forEach(s => {
    const v = scores[s.id];
    if (v && counts[v] !== undefined) counts[v]++; else counts['未']++;
  });
  const weak = sections.filter(s => ['△', '×'].includes(scores[s.id]) || !scores[s.id]);

  return (
    <div style={{
      background: 'var(--bg-elev)',
      border: '1px solid var(--rule)',
      borderRadius: 6,
      padding: '14px 18px',
      marginBottom: 16,
    }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink)', marginBottom: 10 }}>
        📊 理解度サマリ（{total} セクション中）
      </div>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginBottom: 12, fontSize: 12 }}>
        <span><strong style={{ color: 'var(--ok)' }}>◎ {counts['◎']}</strong></span>
        <span><strong style={{ color: 'var(--info)' }}>○ {counts['○']}</strong></span>
        <span><strong style={{ color: 'var(--warn)' }}>△ {counts['△']}</strong></span>
        <span><strong style={{ color: 'var(--danger)' }}>× {counts['×']}</strong></span>
        <span><strong style={{ color: 'var(--ink-soft)' }}>未 {counts['未']}</strong></span>
      </div>
      {weak.length > 0 ? (
        <>
          <div style={{ fontSize: 12, color: 'var(--warn)', marginBottom: 6, fontWeight: 600 }}>
            🔁 弱点セクション（△・×・未） — 再読推奨
          </div>
          <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, lineHeight: 1.8 }}>
            {weak.map(s => (
              <li key={s.id}>
                <a
                  href={`#${pageId}/${s.id}`}
                  onClick={(e) => { e.preventDefault(); if (onJump) onJump(s.id); else { location.hash = `${pageId}/${s.id}`; } }}
                  style={{ color: 'var(--accent-ink)', textDecoration: 'underline' }}
                >{s.label} →</a>
                {scores[s.id] && <span style={{ marginLeft: 8, color: 'var(--ink-soft)' }}>（{scores[s.id]}）</span>}
              </li>
            ))}
          </ul>
        </>
      ) : (
        <div style={{ fontSize: 12, color: 'var(--ok)', fontWeight: 600 }}>
          ✨ すべてのセクションが ◎ または ○ です。お疲れさまでした！
        </div>
      )}
    </div>
  );
};

/* ---- ConceptQuizItem: 1問分の確認問題（正誤判定 → localStorage → 間違いノート集約） ---- */
const ConceptQuizItem = ({ q, pageId, pageTitle, required }) => {
  const key = `denken_check::kikai_${pageId}::quiz::${q.id}`;
  const [selected, setSelected] = React.useState(null);
  const [revealed, setRevealed] = React.useState(false);
  const [prev, setPrev] = React.useState(null);
  const [confidence, setConfidence] = React.useState(null); // 'sure' | 'unsure' | null(スキップ可・自信度較正)
  const [missed, setMissed] = React.useState(false); // 同一セッションで一度でも不正解したか（即時再正解を克服扱いしない）
  const [recallNote, setRecallNote] = React.useState(''); // 不正解時「正しい考えを自分の言葉で1行」＝再生(retrieval)で丸暗記を矯正
  const [errorTag, setErrorTag] = React.useState(null); // 不正解の原因タグ（公式忘れ/条件読み違い/計算ミス/概念不理解）=弱点類型の可視化
  React.useEffect(() => {
    try { const raw = localStorage.getItem(key); if (raw) setPrev(JSON.parse(raw)); } catch (e) {}
  }, [key]);
  const correctKey = (q.choices.find(c => c.correct) || {}).key;
  const ERR_LABELS = { formula: '公式忘れ', condition: '条件読み違い', calc: '計算ミス', concept: '概念不理解' };
  const fmtMemo = (b) => (b.memoBase || '') + (b.recallNote ? '・正答メモ:' + b.recallNote : '') + (ERR_LABELS[b.error_tag] ? '・原因:' + ERR_LABELS[b.error_tag] : '');
  const choose = (k) => {
    if (revealed) return;
    setSelected(k);
    setRevealed(true);
    const isCorrect = k === correctKey;
    const rescued = isCorrect && missed; // 同一セッションで不正解→再回答正解＝丸暗記の疑い・克服にしない
    if (!isCorrect) setMissed(true);
    // 遅延再生の原則: 即時リベンジ正解は understood にせず review(後日再提示)止まり。別の日に初回正解で初めて克服。
    const status = isCorrect ? (missed ? 'review' : 'understood') : 'wrong';
    const overconfident = confidence === 'sure' && !isCorrect; // 自信あり×不正解=過信
    const memoBase = (required ? '必須' : '任意') + (overconfident ? '・⚠過信' : '') + (rescued ? '・⚠即時再正解(丸暗記疑い)' : '');
    try {
      const raw = localStorage.getItem(key);
      const base = raw ? (JSON.parse(raw) || {}) : {};
      const now = new Date().toISOString();
      const rec = Object.assign({}, base, {
        status: status,
        updatedAt: now,
        firstSeenAt: base.firstSeenAt || now,
        reviewCount: (base.reviewCount || 0) + 1,
        source: 'kikai-concept',
        itemType: 'concept-quiz',
        articleTitle: '機械 確認問題 — ' + pageTitle,
        itemTitle: (q.q.length > 44 ? q.q.slice(0, 44) + '…' : q.q),
        articleUrl: 'denken3-kikai-wiki.html#' + pageId,
        confidence: confidence || 'skip',
        overconfident: overconfident,
        rescued: rescued,
        memoBase: memoBase,
        recallNote: base.recallNote || '',
        error_tag: base.error_tag || null,
        memo: fmtMemo({ memoBase: memoBase, recallNote: base.recallNote, error_tag: base.error_tag }),
      });
      localStorage.setItem(key, JSON.stringify(rec));
      window.dispatchEvent(new CustomEvent('section-check-changed', { detail: { key, status } }));
    } catch (e) {}
  };
  const saveRecall = (text) => {
    const t = (text || '').replace(/\n+/g, ' ').trim().slice(0, 200);
    try {
      const raw = localStorage.getItem(key);
      const base = raw ? (JSON.parse(raw) || {}) : {};
      const rec = Object.assign({}, base, { recallNote: t, updatedAt: new Date().toISOString() });
      rec.memo = fmtMemo(rec);
      localStorage.setItem(key, JSON.stringify(rec));
      window.dispatchEvent(new CustomEvent('section-check-changed', { detail: { key, status: base.status } }));
    } catch (e) {}
  };
  const saveErrorTag = (tag) => {
    try {
      const raw = localStorage.getItem(key);
      const base = raw ? (JSON.parse(raw) || {}) : {};
      const rec = Object.assign({}, base, { error_tag: tag, updatedAt: new Date().toISOString() });
      rec.memo = fmtMemo(rec);
      localStorage.setItem(key, JSON.stringify(rec));
      window.dispatchEvent(new CustomEvent('section-check-changed', { detail: { key, status: base.status } }));
    } catch (e) {}
  };
  const retry = () => { setSelected(null); setRevealed(false); };
  const isCorrect = revealed && selected === correctKey;
  const rescuedView = isCorrect && missed; // 同一セッション再回答での正解＝克服ではない（表示用）
  return (
    <div style={{ border: '1px solid var(--rule)', borderRadius: 8, padding: '14px 16px', margin: '10px 0', background: 'var(--bg-elev)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 4, color: 'var(--bg)', background: required ? 'var(--danger)' : 'var(--info)' }}>{required ? '必須' : '任意'}</span>
        {(q.tags || []).map(t => (<span key={t} style={{ fontSize: 11, color: 'var(--ink-soft)' }}>{t}</span>))}
        {prev && prev.status && (<span style={{ fontSize: 11, color: 'var(--ink-mute)' }}>· 前回: {prev.status === 'understood' ? '◎正解' : prev.status === 'review' ? '△要復習' : '×不正解'}{prev.reviewCount > 1 ? `（${prev.reviewCount}回目）` : ''}</span>)}
      </div>
      <p style={{ margin: '0 0 10px', lineHeight: 1.7 }}><strong>Q.</strong> {q.q}</p>
      {!revealed && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 11, color: 'var(--ink-mute)' }}>答える前に（任意）:</span>
          {[['sure', '💪 自信あり'], ['unsure', '🤔 自信なし']].map(([v, label]) => (
            <button key={v} onClick={() => setConfidence(confidence === v ? null : v)}
              style={{ padding: '2px 10px', fontSize: 11, borderRadius: 4, cursor: 'pointer',
                background: confidence === v ? 'var(--accent)' : 'transparent',
                color: confidence === v ? 'var(--bg)' : 'var(--ink-soft)',
                border: confidence === v ? '1px solid var(--accent)' : '1px solid var(--rule)' }}>{label}</button>
          ))}
        </div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {q.choices.map(c => {
          let bg = 'transparent', bd = '1px solid var(--rule)';
          if (revealed) {
            if (c.correct) { bg = 'rgba(22,163,74,0.12)'; bd = '1px solid #16a34a'; }
            else if (c.key === selected) { bg = 'rgba(220,38,38,0.12)'; bd = '1px solid #dc2626'; }
          }
          return (
            <button key={c.key} onClick={() => choose(c.key)} disabled={revealed}
              style={{ textAlign: 'left', padding: '8px 12px', background: bg, border: bd, color: 'var(--ink)', borderRadius: 6, cursor: revealed ? 'default' : 'pointer', fontSize: 14 }}>
              <strong>{c.key}.</strong> {c.label}
              {revealed && c.correct && <span style={{ color: 'var(--ok)', fontWeight: 700 }}> ← 正解</span>}
            </button>
          );
        })}
      </div>
      {revealed && (
        <div style={{ marginTop: 10, padding: '10px 12px', borderRadius: 6, background: 'var(--bg-sunken)', fontSize: 13, lineHeight: 1.7 }}>
          <strong style={{ color: isCorrect ? (rescuedView ? '#d97706' : '#16a34a') : '#dc2626' }}>{isCorrect ? (rescuedView ? '△ 再回答で正解' : '◎ 正解') : '× 不正解'}</strong>
          {!isCorrect && <span style={{ color: 'var(--ink-soft)' }}> → 間違いノートに記録しました</span>}
          {rescuedView && <span style={{ color: 'var(--warn)', fontWeight: 700 }}> → 初回不正解のため「要復習」。後日また出題します（その場の正解＝丸暗記の可能性）</span>}
          {confidence === 'sure' && !isCorrect && <span style={{ color: 'var(--danger)', fontWeight: 700 }}> ⚠ 過信注意（自信ありで不正解）</span>}
          {confidence === 'unsure' && isCorrect && !rescuedView && <span style={{ color: 'var(--ok)' }}> 💡 自信なしで正解＝実力は足りている</span>}
          <p style={{ margin: '6px 0 0' }}>{q.explanation}</p>
          {!isCorrect && (
            <div style={{ marginTop: 10 }}>
              <label style={{ fontSize: 12, color: 'var(--ink-soft)', display: 'block', marginBottom: 4 }}>✍ 正しい考えを自分の言葉で1行（任意・書くと定着が上がる＝丸暗記対策）</label>
              <input type="text" defaultValue={recallNote} maxLength={120}
                onBlur={(e) => { setRecallNote(e.target.value); saveRecall(e.target.value); }}
                placeholder="例: 銅損は電流の2乗。負荷半分なら銅損は1/4"
                style={{ width: '100%', padding: '6px 8px', border: '1px solid var(--rule)', borderRadius: 4, fontSize: 12, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            </div>
          )}
          {!isCorrect && (
            <div style={{ marginTop: 8 }}>
              <span style={{ fontSize: 12, color: 'var(--ink-soft)', marginRight: 6 }}>原因（任意・1タップ）:</span>
              {[['formula', '公式忘れ'], ['condition', '条件読み違い'], ['calc', '計算ミス'], ['concept', '概念不理解']].map(([k, label]) => (
                <button key={k} onClick={() => { setErrorTag(k); saveErrorTag(k); }}
                  style={{ padding: '3px 10px', fontSize: 11, borderRadius: 4, cursor: 'pointer', marginRight: 6, marginTop: 4,
                    background: errorTag === k ? '#dc2626' : 'transparent',
                    color: errorTag === k ? '#fff' : 'var(--ink-soft)',
                    border: errorTag === k ? '1px solid #dc2626' : '1px solid var(--rule)' }}>{label}</button>
              ))}
            </div>
          )}
          <button onClick={retry} style={{ marginTop: 8, padding: '4px 10px', background: 'transparent', border: '1px solid var(--rule)', borderRadius: 4, cursor: 'pointer', fontSize: 12, color: 'var(--ink-soft)' }}>もう一度</button>
        </div>
      )}
    </div>
  );
};

/* ConceptQuizScore: 確認問題の回答結果を localStorage から集計して常時表示する。
   これが無いと「答えた記録が残らない」＝解いた本人が Check できない（柱5 PDCA の D 層が欠ける）。
   ConceptQuizItem が書込時に飛ばす 'section-check-changed' を購読して即時再集計する。
   ※ pool は親の filter で毎 render 新配列になるため、依存配列には id 文字列を置く（配列を直接置くと無限ループ）。
   riron 側 ConceptQuizScore（PR #1080）の水平展開。キー prefix だけ kikai_。 */
const ConceptQuizScore = ({ pageId, pool }) => {
  const ids = pool.map(q => q.id).join(',');
  const [recs, setRecs] = React.useState({});
  React.useEffect(() => {
    const refresh = () => {
      const r = {};
      ids.split(',').filter(Boolean).forEach(id => {
        try {
          const raw = localStorage.getItem(`denken_check::kikai_${pageId}::quiz::${id}`);
          r[id] = raw ? (JSON.parse(raw) || {}) : null;
        } catch (e) { r[id] = null; }
      });
      setRecs(r);
    };
    refresh();
    window.addEventListener('section-check-changed', refresh);
    return () => window.removeEventListener('section-check-changed', refresh);
  }, [pageId, ids]);
  const total = pool.length;
  let ok = 0, review = 0, ng = 0, over = 0, latest = '';
  Object.keys(recs).forEach(id => {
    const r = recs[id];
    if (!r || !r.status) return;
    if (r.status === 'understood') ok++;
    else if (r.status === 'review') review++;
    else ng++;
    if (r.overconfident) over++;
    if (r.updatedAt && r.updatedAt > latest) latest = r.updatedAt;
  });
  const answered = ok + review + ng;
  const rate = answered ? Math.round((ok / answered) * 100) : 0;
  const fmtDate = (iso) => { try { const d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate(); } catch (e) { return ''; } };
  return (
    <div style={{ border: '1px solid var(--rule)', borderRadius: 8, padding: '10px 12px', margin: '0 0 12px', background: 'var(--bg-elev)' }}>
      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>
        📈 あなたの記録 — 全 {total} 問中 {answered} 問 回答済み
      </div>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', fontSize: 12, marginBottom: 6 }}>
        <span><strong style={{ color: 'var(--ok)' }}>◎ 正解 {ok}</strong></span>
        <span><strong style={{ color: 'var(--warn)' }}>△ 要復習 {review}</strong></span>
        <span><strong style={{ color: 'var(--danger)' }}>× 不正解 {ng}</strong></span>
        <span><strong style={{ color: 'var(--ink-soft)' }}>未回答 {total - answered}</strong></span>
        {answered > 0 && <span style={{ color: 'var(--ink-soft)' }}>正解率 {rate}%（{ok}/{answered}）</span>}
        {over > 0 && <span style={{ color: 'var(--danger)', fontWeight: 700 }}>⚠ 過信 {over}</span>}
      </div>
      <div style={{ fontSize: 11, color: 'var(--ink-mute)', lineHeight: 1.6 }}>
        ◎＝一発で正解 ／ △＝間違えた後に正解（丸暗記の疑いがあるので後日また出す） ／ ×＝不正解。
        {latest && `　最終回答: ${fmtDate(latest)}。`}
        記録はこの端末（ブラウザ）に保存され、別の端末・シークレットウィンドウには引き継がれない。
      </div>
    </div>
  );
};

/* ---- ConceptQuiz: ページ冒頭の「まず腕試し」ブロック（テスト効果＝先に思い出す） ---- */
const ConceptQuiz = ({ pageId, pageTitle }) => {
  const pool = (KIKAI_DAILY_POOL || []).filter(q => q.wikiPageId === pageId);
  if (!pool.length) return null;
  const required = pool.filter(q => q.rank === 'S' || q.rank === 'A');
  const optional = pool.filter(q => q.rank !== 'S' && q.rank !== 'A');
  return (
    <div style={{ border: '2px solid var(--accent)', borderRadius: 12, padding: '16px 18px', margin: '0 0 24px', background: 'var(--bg)' }}>
      <h3 style={{ margin: '0 0 4px', fontSize: 16 }}>🎯 確認問題（まず腕試し）</h3>
      <p style={{ fontSize: 12, color: 'var(--ink-soft)', margin: '0 0 12px' }}>
        <strong style={{ color: 'var(--danger)' }}>必須</strong>＝落とすと失点する頻出ポイント・<strong style={{ color: 'var(--info)' }}>任意</strong>＝解くと理解が深まる発展。間違えると<strong>間違いノート</strong>に自動集約され、後で弱点だけ復習できる。
      </p>
      <ConceptQuizScore pageId={pageId} pool={pool} />
      <p style={{ fontSize: 12, margin: '0 0 14px' }}>
        <a href="denken-hoki-wiki.html#chokuzen-machigai" style={{ color: 'var(--accent)', fontWeight: 600, textDecoration: 'none' }}>
          📕 間違えた問題・⚠過信した問題を「間違いノート」でまとめて復習 →
        </a>
      </p>
      {required.map(q => (<ConceptQuizItem key={q.id} q={q} pageId={pageId} pageTitle={pageTitle} required={true} />))}
      {optional.length > 0 && (
        <details style={{ marginTop: 8 }}>
          <summary style={{ cursor: 'pointer', fontSize: 13, fontWeight: 600, color: 'var(--ink-soft)' }}>＋ 任意問題（理解を深める {optional.length}問）</summary>
          <div style={{ marginTop: 8 }}>
            {optional.map(q => (<ConceptQuizItem key={q.id} q={q} pageId={pageId} pageTitle={pageTitle} required={false} />))}
          </div>
        </details>
      )}
    </div>
  );
};


/* ---- KakomonProgress: 過去問題集（年度回 x 問番号）の進捗グリッド ----
   電気書院「20年間の過去問」を解いた進捗を localStorage に残す。記録するのは
   「年度回・問番号・自己評価」だけで、問題文は一切載せない（書籍は著作物のため）。
   「なぜ間違えたか」という質の記録は repo 側 learning-log/kikai/<page>.md が SoT
   （localStorage は端末に閉じるため、端末をまたぐ分析には使わない）。
   収録年度は監修者さんの蔵書（H18〜R7）に合わせた。違う版を使うときはこの配列を増減する。 */
const KAKOMON_SESSIONS = [
  { id: 'H18', year: 2006 },
  { id: 'H19', year: 2007 },
  { id: 'H20', year: 2008 },
  { id: 'H21', year: 2009 },
  { id: 'H22', year: 2010 },
  { id: 'H23', year: 2011 },
  { id: 'H24', year: 2012 },

const KAKOMON_QMAX = 18;              // 問番号の上限
// 機械は A問題 14問（各5点）＋ B問題 3問完答（各10点）。B問題は問15〜18 に置かれ、
// 1問が (a)(b) の2小問に分かれる（問17・18 は選択）。(a) は解けたが (b) で落ちた、が
// 典型なので、B問題は (a)(b) を別マスにしないと「どこで落ちたか」が残らない。
const KAKOMON_B_FROM = 15;
/* 再挑戦の間隔は忘却曲線から算出する（固定日数ではない）。
   計算は scripts/fsrs_engine.py（py-fsrs から逐語移植した FSRS-6）の JS 移植で、
   records.json 側のスケジューラと同じ式・同じ定数を使う。別式にすると
   「同じ問題に2つの再挑戦日が出る」ため。数値一致は機械照合している。
   判定 → FSRS rating: × = Again(1) / △ = Hard(2) / ○ = Good(3) / ◎ = Easy(4)
   ◎○ も対象にする（「試験直前に、○ だが半年触っていない」を拾うため）。 */
const FSRS_W = [
  0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722,
  0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425,
  0.0912, 0.0658, 0.1542,
];
const FSRS_DECAY = -FSRS_W[20];
const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;
const FSRS_RETENTION = 0.9;
const FSRS_MAX_INTERVAL = 365;
const FSRS_RATING = { '×': 1, '△': 2, '○': 3, '◎': 4 };
const fsrsClampD = (d) => Math.min(Math.max(d, 1.0), 10.0);
const fsrsClampS = (s) => Math.max(s, 0.001);
const fsrsInitS = (rating) => fsrsClampS(FSRS_W[rating - 1]);

  const d = FSRS_W[4] - Math.pow(Math.E, FSRS_W[5] * (rating - 1)) + 1;
  return clamp === false ? d : fsrsClampD(d);
};
const fsrsRetrievability = (elapsed, s) =>
  Math.pow(1 + FSRS_FACTOR * Math.max(0, elapsed) / s, FSRS_DECAY);
const fsrsNextD = (difficulty, rating) => {
  const arg1 = fsrsInitD(4, false);
  const delta = -(FSRS_W[6] * (rating - 3));
  const arg2 = difficulty + (10.0 - difficulty) * delta / 9.0;
  return fsrsClampD(FSRS_W[7] * arg1 + (1 - FSRS_W[7]) * arg2);

  1 + Math.pow(Math.E, FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9])
    * (Math.pow(Math.E, (1 - r) * FSRS_W[10]) - 1)
    * (rating === 2 ? FSRS_W[15] : 1) * (rating === 4 ? FSRS_W[16] : 1));

  FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1)
    * Math.pow(Math.E, (1 - r) * FSRS_W[14]),
  s / Math.pow(Math.E, FSRS_W[17] * FSRS_W[18]));

  let inc = Math.pow(Math.E, FSRS_W[17] * (rating - 3 + FSRS_W[18])) * Math.pow(s, -FSRS_W[19]);

// 1回の復習で (stability, difficulty) を更新する。s/d が null なら新規カード
const fsrsReview = (s, d, rating, elapsed) => {
  if (s === null || s === undefined || d === null || d === undefined) {
    return { s: fsrsInitS(rating), d: fsrsInitD(rating) };
  }
  if (elapsed < 1) return { s: fsrsShortS(s, rating), d: fsrsNextD(d, rating) };
  const r = fsrsRetrievability(elapsed, s);
  const ns = rating === 1 ? fsrsForgetS(d, s, r) : fsrsRecallS(d, s, r, rating);
  return { s: fsrsClampS(ns), d: fsrsNextD(d, rating) };
};
// Python の round() は偶数丸め。Math.round は 0.5 を切り上げるので、ちょうど x.5 の
// stability で1日ずれる（実運用では超越関数の積なので到達しないが、式が同じと言う以上は揃える）
const fsrsRoundHalfEven = (x) => {
  const f = Math.floor(x);
  // 許容誤差を入れてはいけない。Python の round() は実際の double をそのまま丸めるので、
  // 1.4999999 を「ちょうど半分」とみなすと JS だけが 2 を返して食い違う（実測）
  if (x - f !== 0.5) return Math.round(x);
  return (f % 2 === 0) ? f : f + 1;

const fsrsInterval = (s) => Math.min(Math.max(
  fsrsRoundHalfEven((s / FSRS_FACTOR) * (Math.pow(FSRS_RETENTION, 1 / FSRS_DECAY) - 1)), 1), FSRS_MAX_INTERVAL);

/* 試験日で間隔を頭打ちにする。FSRS は「いつまでに」の制約が無い前提の設計なので、
   ◎ を重ねると 365日後＝試験のはるか後ろへ寝かせてしまう。試験までに全マスを
   最低1回は触れる状態にするため、残り日数を上限にする（残り日数が短いほど間隔も縮む）。
   日付の出所: denken3-shimoki-plan.html の cbtStart（令和8年度下期 CBT 初日）。
   二次情報では CBT 2/4〜2/28 と 2/5〜3/1 が混在するため保守側（早い方）を採る。
   一次照合は未実施。試験が過ぎたら頭打ちをやめる（値を変えるのはこの1行）。 */
const KAKOMON_EXAM_DATE = '2027-02-04';
const kakomonDaysToExam = () => {
  const d = -kakomonDaysSince(KAKOMON_EXAM_DATE);
  return (d === null || !isFinite(d)) ? null : d;
};
const kakomonInterval = (s) => {
  const base = fsrsInterval(s);
  const left = kakomonDaysToExam();
  return (left !== null && left > 0) ? Math.min(base, left) : base;
};
const KAKOMON_CYCLE = ['', '◎', '○', '△', '×'];
const KAKOMON_COLOR = { '◎': 'var(--ok)', '○': 'var(--info)', '△': 'var(--warn)', '×': 'var(--danger)' };

// マスの識別子。A問題は "7"、B問題は "15a" / "15b"
const kakomonCells = (q) => (q >= KAKOMON_B_FROM ? [q + 'a', q + 'b'] : [String(q)]);
const KAKOMON_CELL_RE = /^([1-9]|1[0-4])$|^1[5-8][ab]$/;
const kakomonSortKey = (cell) => {
  const m = cell.match(/^(\d+)([ab]?)$/);
  return m ? Number(m[1]) * 2 + (m[2] === 'b' ? 1 : 0) : 999;

const kakomonLabel = (cell) => {

const kakomonToday = () => {

const kakomonAddDays = (iso, n) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;

const kakomonDaysSince = (iso) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
  const [y, m, d] = iso.split('-').map(Number);
  const then = new Date(y, m - 1, d);
  const n = new Date();
  return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - then) / 86400000);

/* 値は { m: 判定, d: 最後にタップした日, s: 安定度, f: 難度, i: 次回までの日数,

   b* を持つのは、◎→○→△→× と回して判定を選び直す操作が「4回復習した」ことに
   ならないようにするため（同じ基準から毎回引き直す）。
   旧版は判定の文字列だけ／{m,d} だけを持つので、どちらも受けて種をまき直す。 */
const kakomonVal = (v) => {
  const seed = (m, d) => {
    const init = fsrsReview(null, null, FSRS_RATING[m], 0);
    return { m, d: d || '', s: init.s, f: init.d, i: kakomonInterval(init.s) };
  };
  if (typeof v === 'string') return KAKOMON_CYCLE.indexOf(v) > 0 ? seed(v, '') : null;
  if (!v || typeof v !== 'object') return null;
  const d = typeof v.d === 'string' ? v.d : '';
  const okNum = (x) => typeof x === 'number' && isFinite(x) && x > 0;
  const carry = (o) => {
    if (okNum(v.bs) && okNum(v.bf)) { o.bs = v.bs; o.bf = v.bf; o.bd = typeof v.bd === 'string' ? v.bd : ''; }

  };

  // 翌日以降は掃除する（本当に記録を消したかった場合を尊重する）。
  if (v.m === '') return (d && d === kakomonToday() && okNum(v.bs)) ? carry({ m: '', d }) : null;

const KakomonProgress = ({ pageId, topicLabel, migrateFrom }) => {
  const key = `denken_check::kikai_${pageId}::kakomon::v1`;
  // グリッドは科目まるごと1枚（R3 問15 は1つの問題で、単元ごとに同じマスを持つと二重管理になる）。
  // 単元ページに置いていた頃の記録は捨てずに引き継ぐ。
  const legacyKeys = (migrateFrom || []).map(x => `denken_check::kikai_${x}::kakomon::v1`);

    try {
      let src = null;
      for (const k of [key].concat(legacyKeys)) {
        try { const s = localStorage.getItem(k); if (s && s !== '{}') { src = s; break; } } catch (e) { /* noop */ }
      }
      const parsed = JSON.parse(src || '{}');
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
      const clean = {};
      Object.keys(parsed).forEach(k => {
        const row = parsed[k];
        if (!row || typeof row !== 'object' || Array.isArray(row)) return;

          const val = kakomonVal(row[q]);

      if (Object.keys(grid).length && !localStorage.getItem(key)) {

      const base = sameDay
        ? { s: prev.bs, f: prev.bf, d: prev.bd }

      .concat(todays.length ? ['', `■ 今日解いた（${todays.length} 件）`].concat(todays.map(line)) : [])
      .concat(dueOnly.length ? ['', `■ 予定日が来た（${dueOnly.length} 件・まだ解いていない）`].concat(dueOnly.map(line)) : [])
      .concat(['', '各問について「理解できなかったところ／公式／考え方・解き方／計算ミス／覚えたいこと」を書きます'])
      .join('\n');

      <h2 id="overview"><span className="h-num">1.</span>動作原理</h2>
      <p>三相交流を巻線に流すと <span className="marker">固定子内に回転磁界が生じる</span>。この磁界が回転子導体を切り、電磁誘導によって回転子に電流が誘起される。電流と磁束の相互作用（フレミング左手の法則）によりトルクが発生し、回転子は磁界と同方向に回転する。</p>

      <p>電動機として運転するとき、回転子の速度は <span className="marker">常に同期速度より小さい</span>（外力で同期速度以上に回すと s &lt; 0 の誘導発電機になる）。同速になると磁束を切らず誘導電流が消えるため、トルクもゼロとなる。この速度差を <span className="marker">滑り</span> といい、誘導機の動作の根幹を成す。</p>

      <Box kind="example" label="理解を深める — トルク発生を理論（電磁誘導＋電磁力）に還元する">
        <p>誘導機のトルクは、理論の二つの原理が連鎖して生まれる。まず <strong>電磁誘導</strong>：同期速度で回る回転磁界が、それより遅い回転子の導体を相対的に切る。導体1本が鎖交する磁束 <Eq tex="\Phi" /> が変化するため、ファラデーの法則 <Eq tex="e=-N\dfrac{d\Phi}{dt}" /> により回転子導体に誘導起電力が生じ、短絡された二次回路に誘導電流 <Eq tex="I_2" /> が流れる。</p>
        <p>次に <strong>電磁力</strong>：その電流 <Eq tex="I_2" /> が磁束密度 <Eq tex="B" /> の回転磁界中に置かれるので、フレミング左手の法則に従う力 <Eq tex="F=B\,I_2\,L" /> を受ける。この力が回転子を磁界と同方向へ引きずり、半径を掛けた <Eq tex="T=F\,r" /> がトルクになる。</p>
        <p><strong>「滑りが無いとトルクが消える」</strong>理由もここに還元できる。回転子が同期速度に達すると相対速度がゼロ、つまり導体が切る磁束が変化しなくなり <Eq tex="\dfrac{d\Phi}{dt}=0" />。電磁誘導が止まって <Eq tex="I_2=0" /> となり、力 <Eq tex="F=B\,I_2\,L=0" />、トルクもゼロになる。だから誘導機は必ず滑り <Eq tex="s>0" /> で運転する。回転子周波数 <Eq tex="f_2=s f_1" /> が <Eq tex="d\Phi/dt" /> の速さそのものを表す点に注目すると、滑りが誘導起電力の源だと一気に腑に落ちる。</p>
        <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#inductance" target="_blank" rel="noopener">→ 理論Wiki「電磁誘導（ファラデー・レンツの法則）」で e=-dΦ/dt の原理と、フレミング左手の電磁力 F=BIL を深掘り</a></p>
      </Box>

      <h2 id="circuit"><span className="h-num">2.</span>等価回路と電力の流れ</h2>
      <p>一相分の T 形等価回路は次の通り。一次側に <Eq tex="r_1, jx_1" />、励磁回路に <Eq tex="r_0, jx_0" />、二次側に <Eq tex="jx_2'" /> と <Eq tex="r_2'/s" /> を持つ。<strong>滑り s が分母にある二次抵抗が誘導機の本質</strong> であり、機械的出力は <Eq tex="r_2'(1-s)/s" /> で表される負荷抵抗が消費する電力に相当する。</p>

      <EquivalentCircuit />

      <Box kind="formula" label="重要な比率（覚えよう）">

        note={<>二次入力 <Eq tex="P_2" /> を<strong>同期</strong>角速度 <Eq tex="\omega_s" /> で割るとトルクになる。これが <Eq tex="P_2" /> を <strong>同期ワット</strong>と呼ぶ理由。機械的出力 <Eq tex="P_m" /> を<strong>実際の</strong>回転角速度 <Eq tex="\omega" /> で割っても同じ値になる（<Eq tex="P_m=(1-s)P_2" /> と <Eq tex="\omega=(1-s)\omega_s" /> の <Eq tex="(1-s)" /> が相殺するため）。角速度は <Eq tex="\omega_s = 2\pi N_s/60" />・<Eq tex="\omega = 2\pi N/60" />（<Eq tex="N" /> の単位は min⁻¹）。</>}

      <Box kind="example" label="例題 — トルク換算を2通りで出して一致を確かめる">
        <p><strong>問:</strong> 4 極・50 Hz の三相誘導電動機で、二次入力 <Eq tex="P_2 = 22.0\;\mathrm{kW}" />、滑り <Eq tex="s = 4.0\,\%" />（セクション6の例題 1.2.2 と同じ <Eq tex="P_2" />・<Eq tex="s" /> の機に、極数と周波数を与えたもの）。発生トルク <Eq tex="T" /> を求めよ。</p>
        <p><strong>同期側から:</strong> 同期速度は <Eq tex="N_s = \dfrac{120 \times 50}{4} = 1500\;\mathrm{min^{-1}}" />、同期角速度は</p>

        <Eq display tex="T = \dfrac{P_2}{\omega_s} = \dfrac{22000}{50\pi} \approx 140\;[\mathrm{N\cdot m}]" />
        <p><strong>機械側から検算:</strong> 回転速度 <Eq tex="N = (1-s)N_s = 0.96 \times 1500 = 1440\;\mathrm{min^{-1}}" />、<Eq tex="\omega = \dfrac{2\pi \times 1440}{60} = 48\pi \approx 150.8\;\mathrm{rad/s}" />、機械的出力 <Eq tex="P_m = (1-s)P_2 = 0.96 \times 22000 = 21120\;\mathrm{W}" />。</p>
        <Eq display tex="T = \dfrac{P_m}{\omega} = \dfrac{21120}{48\pi} \approx 140\;[\mathrm{N\cdot m}]" />
        <p style={{margin:"8px 0 0"}}>両者は<strong>厳密に一致</strong>する（丸めの都合で近い値になっているのではない）。<Eq tex="P_m" /> と <Eq tex="\omega" /> の両方に同じ <Eq tex="(1-s)" /> が掛かって約分されるためで、<span className="marker">トルクは滑りが変わっても「二次入力 ÷ 同期角速度」で求まる</span>。だから <Eq tex="P_2" /> をワット単位のまま「トルクの代用量」として扱える＝同期ワット。</p>

      <h3 id="hireisuii">比例推移（巻線形のみ）</h3>
      <p>巻線形誘導機において <span className="marker">二次抵抗を k 倍にすると、同一トルクを生じる滑りも k 倍</span> になる。これを比例推移という。停動滑り <Eq tex="s_m" /> も k 倍になるため、二次抵抗を増やせば <span className="marker">始動トルクを大きく</span> できる一方、運転時の効率は低下する。</p>

        <p><strong>③ 比例推移が成り立つ量は限られる。</strong>トルクと電流（一次電流・二次電流）・力率には成り立つが、<span className="marker">出力・効率・二次銅損には成り立たない</span>。同じトルクを高い滑りで出す分だけ二次銅損 <Eq tex="P_{c2}=sP_2" /> が増え、効率は下がる（だから運転中は抵抗を短絡する）。</p>
      </Box>

      </ol>
    </div>

    </p>
  </>
);

      <h2 id="start-hunting"><span className="h-num">5.</span>始動法・乱調・自己励磁（頻出理論論点）</h2>
      <ul>
        <li><strong>始動法</strong> — 同期電動機は<span className="marker">始動トルクがない</span>（回転磁界に静止した回転子が追従できない）。<strong>自己始動法</strong>（制動巻線をかご形導体として利用。始動中は界磁巻線を抵抗経由で短絡し高電圧誘起を防ぐ）／始動電動機法／低周波（インバータ）始動。</li>
        <li><strong>乱調</strong> — 負荷急変で内部相差角 δ が振動する現象。<strong>制動巻線</strong>が滑りに応じた誘導トルクで振動を<strong>減衰</strong>させる。はずみ車は慣性を増して急変を緩やかにする補助で、それ自体は減衰要素ではない。</li>
        <li><strong>自己励磁現象</strong> — 無負荷の長距離送電線など<strong>容量性負荷</strong>を接続すると、残留磁気と進み電流の増磁作用で電圧が異常上昇する現象。同じ線路条件で比較すれば、<strong>短絡比が大きい</strong>（同期リアクタンスが小さい）発電機ほど起こりにくい。</li>
      </ul>

      <h2 id="example"><span className="h-num">6.</span>例題</h2>
      <Box kind="example" label="例題 1.3.1（短絡比と短絡電流）">
        <p><strong>問:</strong> 定格容量 5000 kVA、定格電圧 6.6 kV の三相同期発電機の短絡比が 1.25 のとき、同期リアクタンス <Eq tex="x_s" />［p.u.］と三相短絡時の持続短絡電流を求めよ。</p>
        <Eq display tex="x_s = \dfrac{1}{K_s} = \dfrac{1}{1.25} = 0.8\;[\mathrm{p.u.}]" />
        <Eq display tex="I_n = \dfrac{5000{\times}10^3}{\sqrt{3}\times 6600} \approx 437\;[\mathrm{A}] \quad\Rightarrow\quad I_s = K_s \times I_n = 1.25 \times 437 \approx 547\;[\mathrm{A}]" />
        <p style={{margin:"8px 0 0"}}>💡 短絡比は「短絡電流が定格電流の何倍か」そのもの（<Eq tex="I_s = K_s I_n" />）。<Eq tex="x_s = 1/K_s" /> の逆数関係とセットで覚える。この値は界磁電流を無負荷定格電圧相当に保ったときの<strong>定常（持続）短絡電流</strong>で、突発短絡直後の電流はこれより大きい。</p>

      <h2 id="start"><span className="h-num">1.</span>始動方式</h2>
      <ul>
        <li><strong>分相始動形</strong> — 主巻線と抵抗の大きい補助巻線で位相差を作る</li>
        <li><strong>コンデンサ始動形</strong> — 補助巻線に直列コンデンサ。始動トルク大</li>
        <li><strong>コンデンサ始動・運転形</strong> — 大容量の始動用と小容量の運転用を使い分け、始動後に始動用を切り離して運転用を残す。力率・運転特性（振動・騒音）を改善</li>

      <Box kind="example" label="理解を深める — コンデンサ始動は補助巻線の電流を進ませて回転磁界を作る">
        <p>単相交流を1つの巻線に流しても、磁束は同じ軸上で大きさが脈動する<strong>交番磁界</strong>にしかならず、向きが回り続ける<strong>回転磁界</strong>はできない（だから単相機は自力で始動トルクを生まない）。回転磁界を作るには、空間的にずれた2つの巻線に<strong>時間的に位相のずれた電流</strong>を流して擬似的な二相を作る必要がある。<strong>コンデンサ始動形</strong>は、補助巻線に直列にコンデンサを入れてこの位相差を作る。</p>
        <p>鍵になるのは、理論で学ぶ<strong>コンデンサでは電流が電圧より位相が進む</strong>性質。容量性リアクタンス <Eq tex="X_C=\dfrac{1}{\omega C}" /> だけの理想回路では、電流は電圧より <Eq tex="90^\circ" /> 進む（コイルは逆に <Eq tex="90^\circ" /> 遅れる）。主巻線（誘導性で電流が遅れ気味）に対し、コンデンサを直列にした補助巻線は電流が進む側へ寄るので、両巻線電流の間に大きな位相差 <Eq tex="\Delta\varphi" /> が生まれる。これが空間的にずれた2巻線と組み合わさって回転磁界となり、<strong>始動トルク</strong>を生む。位相差が <Eq tex="90^\circ" /> に近いほど二相が対称に近づき始動トルクが大きくなる——分相始動（抵抗差でわずかな位相差）よりコンデンサ始動の始動トルクが大きいのはこのため。</p>

      </Box>
