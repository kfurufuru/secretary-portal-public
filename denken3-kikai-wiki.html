/* ============================================================
   全日効率シミュレータ（変圧器ページ セクション4）
   入力はすべて文字列で保持し、空欄・非数値でも落ちないようにする。
   計算不能（入力電力量ゼロ）は NaN を出さず「算出不可」を表示する。
   ============================================================ */

const TDE_INIT_TF = { sn: "100", pi: "0.6", pc: "1.5", ton: "24" };
const TDE_INIT_ROWS = [
  { key: "A", s: "80", pf: "0.8", t: "8" },
  { key: "B", s: "40", pf: "0.9", t: "8" },
  { key: "C", s: "0",  pf: "1.0", t: "8" },
];

const tdeFmt = (v, d) => (Number.isFinite(v) ? v.toFixed(d) : "—");

const TdeNum = ({ label, unit, value, onChange, width }) => (
  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--ink-soft)", margin: "0 0 6px" }}>
    <span style={{ minWidth: 104 }}>{label}</span>
    <input type="number" inputMode="decimal" step="any" min="0" value={value}
      onChange={(e) => onChange(e.target.value)}
      style={{ width: width || 76, padding: "4px 6px", border: "1px solid var(--rule)", borderRadius: 5,
               background: "var(--bg)", color: "var(--ink)", fontFamily: "inherit", fontSize: 13, textAlign: "right" }} />
    <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>{unit}</span>
  </label>
);

const TransformerDailyEfficiencySimulator = () => {
  const [tf, setTf] = React.useState(TDE_INIT_TF);
  const [rows, setRows] = React.useState(TDE_INIT_ROWS);

  const setRow = (i, k, v) => setRows((prev) => prev.map((r, j) => (j === i ? { ...r, [k]: v } : r)));
  const reset = () => { setTf(TDE_INIT_TF); setRows(TDE_INIT_ROWS); };

  const calc = React.useMemo(() => {
    const n = (v) => { const x = parseFloat(v); return Number.isFinite(x) ? x : NaN; };
    const sn = n(tf.sn), pi = n(tf.pi), pc = n(tf.pc), ton = n(tf.ton);
    const errs = [];
    if ([sn, pi, pc, ton].some((v) => !Number.isFinite(v))) {
      errs.push("変圧器条件に、未入力または数値でない欄があります。");
    } else {
      if (!(sn > 0)) errs.push("定格容量は 0 より大きい値を入力してください（負荷率が計算できません）。");
      if (pi < 0) errs.push("鉄損は 0 以上で入力してください。");
      if (pc < 0) errs.push("全負荷銅損は 0 以上で入力してください。");
      if (ton < 0 || ton > 24) errs.push("通電時間は 0 〜 24 時間の範囲で入力してください（1日で評価するため）。");
    }
    const parsed = rows.map((r) => ({ key: r.key, s: n(r.s), pf: n(r.pf), t: n(r.t) }));
    parsed.forEach((r) => {
      if ([r.s, r.pf, r.t].some((v) => !Number.isFinite(v))) {
        errs.push("時間帯 " + r.key + " に、未入力または数値でない欄があります。");
        return;
      }
      if (r.s < 0) errs.push("時間帯 " + r.key + "：負荷は 0 以上で入力してください。");
      if (r.t < 0 || r.t > 24) errs.push("時間帯 " + r.key + "：時間は 0 〜 24 時間の範囲で入力してください。");
      if (!(r.pf > 0 && r.pf <= 1)) errs.push("時間帯 " + r.key + "：力率は 0 より大きく 1 以下で入力してください。");
    });
    // 時間の整合は「警告のまま誤った効率を出し続けない」ためエラー扱いにする（結果は非表示）。
    const tSumAll = parsed.reduce((a, r) => a + (Number.isFinite(r.t) ? r.t : 0), 0);
    if (!errs.length) {
      if (tSumAll > 24) errs.push("負荷時間の合計 " + tdeFmt(tSumAll, 1) + " h が 24 時間を超えています。1日に収まる時間配分にしてください。");
      else if (tSumAll > ton) errs.push("負荷時間の合計 " + tdeFmt(tSumAll, 1) + " h が通電時間 " + tdeFmt(ton, 1) + " h を上回っています。電圧が加わっていない時間に負荷は載せられません（通電時間を延ばすか、負荷時間を減らしてください）。");
    }
    if (errs.length) return { ok: false, errs, warns: [] };

    const warns = [];
    const over = parsed.filter((r) => r.s > sn).map((r) => r.key);
    if (over.length) warns.push("過負荷：時間帯 " + over.join("・") + " の負荷が定格容量 " + tdeFmt(sn, 1) + " kV·A を超えています。計算は続けますが、実機では継続運転できません。");

    const detail = parsed.map((r) => {
      const x = r.s / sn;
      return { key: r.key, s: r.s, pf: r.pf, t: r.t, x, x2: x * x, wout: r.s * r.pf * r.t, wc: pc * x * x * r.t };
    });
    const wout = detail.reduce((a, r) => a + r.wout, 0);
    const wi = pi * ton;
    const wc = detail.reduce((a, r) => a + r.wc, 0);
    const win = wout + wi + wc;
    const eta = win > 0 && Number.isFinite(win) ? (wout / win) * 100 : null;
    return { ok: true, errs: [], warns, detail, wout, wi, wc, win, eta };
  }, [tf, rows]);

  const cell = { padding: "5px 6px", textAlign: "right" };
  const inp = { width: 62, padding: "3px 5px", border: "1px solid var(--rule)", borderRadius: 5,
                background: "var(--bg)", color: "var(--ink)", fontFamily: "inherit", fontSize: 13, textAlign: "right" };
  const bandLabel = { fontSize: 11, color: "var(--ink-mute)", letterSpacing: "0.04em", margin: "0 0 2px" };
  const bandValue = { fontFamily: "var(--font-mono)", fontSize: 17, fontWeight: 700, color: "var(--ink)" };
  const arrow = <div style={{ textAlign: "center", color: "var(--ink-mute)", fontSize: 15, lineHeight: 1, margin: "6px 0" }}>↓</div>;

  const seg = (label, value, color) => {
    if (!calc.ok || !(calc.win > 0)) return null;
    const pct = (value / calc.win) * 100;
    return (
      <div key={label} title={label + " " + tdeFmt(value, 1) + " kWh"}
        style={{ width: pct + "%", minWidth: value > 0 ? 4 : 0, background: color, height: "100%" }} />
    );
  };

  const legend = (label, value, color) => (
    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
      <span style={{ width: 11, height: 11, borderRadius: 2, background: color, flexShrink: 0 }} />
      <span style={{ color: "var(--ink-soft)" }}>{label}</span>
      <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)", fontWeight: 600 }}>
        {calc.ok ? tdeFmt(value, 1) : "—"} kWh
      </span>
      <span style={{ color: "var(--ink-mute)" }}>
        {calc.ok && calc.win > 0 ? "(" + tdeFmt((value / calc.win) * 100, 1) + "%)" : ""}
      </span>
    </div>
  );

  return (
    <div style={{ border: "1px solid var(--rule)", borderRadius: 8, background: "var(--bg-elev)", padding: "14px 16px", margin: "14px 0 18px" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
        <strong style={{ fontSize: 13.5, color: "var(--accent-ink)" }}>全日効率シミュレータ</strong>
        <button type="button" onClick={reset}
          style={{ fontFamily: "inherit", fontSize: 12, padding: "3px 10px", borderRadius: 5, cursor: "pointer",
                   border: "1px solid var(--rule)", background: "var(--bg)", color: "var(--ink-soft)" }}>
          初期値（典型例題）に戻す
        </button>
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", margin: "0 0 6px" }}>① 変圧器の条件</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
        <TdeNum label={<>定格容量 <Eq tex="S_N" /></>}            unit="kV·A" value={tf.sn}  onChange={(v) => setTf({ ...tf, sn: v })} />
        <TdeNum label={<>鉄損 <Eq tex="P_i" /></>}                unit="kW"   value={tf.pi}  onChange={(v) => setTf({ ...tf, pi: v })} />
        <TdeNum label={<>全負荷銅損 <Eq tex="P_{cN}" /></>}       unit="kW"   value={tf.pc}  onChange={(v) => setTf({ ...tf, pc: v })} />
        <TdeNum label={<>通電時間 <Eq tex="T_{\mathrm{on}}" /></>} unit="h"   value={tf.ton} onChange={(v) => setTf({ ...tf, ton: v })} />
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", margin: "12px 0 4px" }}>② 負荷時間帯（日負荷曲線）</div>
      <p style={{ fontSize: 11.5, color: "var(--ink-mute)", margin: "0 0 4px" }}>
        負荷率は原則 <Eq tex="x = \dfrac{\text{負荷皮相電力}\;[\mathrm{kV\cdot A}]}{\text{定格容量}\;[\mathrm{kV\cdot A}]}" /> で扱う（力率は掛けない）。負荷時間の合計は通電時間以下かつ 24 時間以内。
      </p>
      <div className="table-wrap" style={{ margin: "0 0 10px" }}>
        <table className="data-table" style={{ fontSize: 12.5, minWidth: 560 }}>
          <thead>
            <tr>
              <th scope="col" style={{ textAlign: "left" }}>時間帯</th>
              <th scope="col" style={{ textAlign: "right" }}>負荷 [kV·A]</th>
              <th scope="col" style={{ textAlign: "right" }}>力率 cosφ</th>
              <th scope="col" style={{ textAlign: "right" }}>時間 [h]</th>
              <th scope="col" style={{ textAlign: "right" }}>負荷率 x</th>
              <th scope="col" style={{ textAlign: "right" }}>銅損倍率 x²</th>
              <th scope="col" style={{ textAlign: "right" }}>出力 [kWh]</th>
              <th scope="col" style={{ textAlign: "right" }}>銅損 [kWh]</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const d = calc.ok ? calc.detail[i] : null;
              return (
                <tr key={r.key}>
                  <td><strong>{r.key}</strong></td>
                  <td style={cell}><input type="number" inputMode="decimal" step="any" min="0" style={inp}
                    aria-label={"時間帯 " + r.key + " の負荷 [kV·A]"} value={r.s} onChange={(e) => setRow(i, "s", e.target.value)} /></td>
                  <td style={cell}><input type="number" inputMode="decimal" step="any" min="0" max="1" style={inp}
                    aria-label={"時間帯 " + r.key + " の力率"} value={r.pf} onChange={(e) => setRow(i, "pf", e.target.value)} /></td>
                  <td style={cell}><input type="number" inputMode="decimal" step="any" min="0" style={inp}
                    aria-label={"時間帯 " + r.key + " の時間 [h]"} value={r.t} onChange={(e) => setRow(i, "t", e.target.value)} /></td>
                  <td style={cell}>{d ? tdeFmt(d.x * 100, 1) + " %" : "—"}</td>
                  <td style={cell}>{d ? tdeFmt(d.x2, 3) : "—"}</td>
                  <td style={cell}>{d ? tdeFmt(d.wout, 1) : "—"}</td>
                  <td style={cell}>{d ? tdeFmt(d.wc, 2) : "—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {!calc.ok && (
        <div role="status" style={{ background: "var(--danger-soft)", border: "1px solid var(--danger)", borderRadius: 6, padding: "9px 12px", fontSize: 12.5, color: "var(--ink)" }}>
          <strong style={{ color: "var(--danger)" }}>計算できません</strong>
          <ul style={{ margin: "4px 0 0", paddingLeft: 20 }}>
            {calc.errs.map((m, i) => <li key={i}>{m}</li>)}
          </ul>
        </div>
      )}

      {calc.ok && calc.warns.map((m, i) => (
        <div key={i} role="status" style={{ background: "var(--warn-soft)", border: "1px solid var(--warn)", borderRadius: 6, padding: "8px 12px", fontSize: 12.5, color: "var(--ink)", margin: "0 0 8px" }}>
          <strong style={{ color: "var(--warn)" }}>注意</strong>　{m}
        </div>
      ))}

      {calc.ok && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 8 }}>
            <div style={{ background: "var(--bg-sunken)", borderRadius: 6, padding: "8px 10px" }}>
              <div style={bandLabel}>③ 出力電力量 <Eq tex="W_{\mathrm{out}}" /></div>
              <div style={bandValue}>{tdeFmt(calc.wout, 1)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-mute)" }}>kWh</span></div>
              <div style={{ fontSize: 11, color: "var(--ink-mute)" }}>Σ（kV·A × 力率 × 時間）</div>
            </div>
            <div style={{ background: "var(--bg-sunken)", borderRadius: 6, padding: "8px 10px" }}>
              <div style={bandLabel}>③ 鉄損電力量 <Eq tex="W_i" /></div>
              <div style={bandValue}>{tdeFmt(calc.wi, 1)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-mute)" }}>kWh</span></div>
              <div style={{ fontSize: 11, color: "var(--ink-mute)" }}>鉄損 × 通電時間</div>
            </div>
            <div style={{ background: "var(--bg-sunken)", borderRadius: 6, padding: "8px 10px" }}>
              <div style={bandLabel}>③ 銅損電力量 <Eq tex="W_c" /></div>
              <div style={bandValue}>{tdeFmt(calc.wc, 1)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-mute)" }}>kWh</span></div>
              <div style={{ fontSize: 11, color: "var(--ink-mute)" }}>Σ（全負荷銅損 × x² × 時間）</div>
            </div>
          </div>

          {arrow}

          <div style={{ background: "var(--bg-sunken)", borderRadius: 6, padding: "8px 10px" }}>
            <div style={bandLabel}>④ 総損失電力量 <Eq tex="W_i + W_c" /> ／ 入力電力量 <Eq tex="W_{\mathrm{in}} = W_{\mathrm{out}} + W_i + W_c" /></div>
            <div style={bandValue}>
              {tdeFmt(calc.wi + calc.wc, 1)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-mute)" }}>kWh（総損失）</span>
              <span style={{ color: "var(--ink-mute)", fontWeight: 400, margin: "0 8px" }}>→</span>
              {tdeFmt(calc.win, 1)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-mute)" }}>kWh（入力）</span>
            </div>
          </div>

          {arrow}

          <div style={{ background: "var(--accent-soft)", border: "1px solid var(--accent)", borderRadius: 6, padding: "10px 12px" }}>
            <div style={bandLabel}>⑤ 全日効率 <Eq tex="\eta_d" /></div>
            {calc.eta === null ? (
              <>
                <div style={{ ...bandValue, color: "var(--ink-mute)" }}>算出不可（—）</div>
                <div style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>入力電力量が 0 kWh のため効率を定義できません（出力・鉄損・銅損がすべて 0）。</div>
              </>
            ) : (
              <>
                <div style={{ ...bandValue, fontSize: 22, color: "var(--accent-ink)" }}>
                  {tdeFmt(calc.eta, 1)} <span style={{ fontSize: 13, fontWeight: 400 }}>%</span>
                </div>
                <div style={{ fontSize: 11.5, color: "var(--ink-mute)", fontFamily: "var(--font-mono)" }}>
                  = {tdeFmt(calc.wout, 1)} / {tdeFmt(calc.win, 1)} × 100
                </div>
              </>
            )}
          </div>

          <div style={{ margin: "12px 0 0" }}>
            <div style={{ ...bandLabel, marginBottom: 4 }}>損失内訳（1日の入力電力量の内わけ）</div>
            <div style={{ display: "flex", height: 16, borderRadius: 4, overflow: "hidden", background: "var(--bg-sunken)", border: "1px solid var(--rule)" }}>
              {seg("出力", calc.wout, "var(--accent)")}
              {seg("鉄損", calc.wi, "var(--warn)")}
              {seg("銅損", calc.wc, "var(--danger)")}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 18px", marginTop: 6 }}>
              {legend("出力", calc.wout, "var(--accent)")}
              {legend("鉄損", calc.wi, "var(--warn)")}
              {legend("銅損", calc.wc, "var(--danger)")}
            </div>
            <p style={{ fontSize: 11.5, color: "var(--ink-mute)", margin: "6px 0 0" }}>
              帯は面積比なので、効率の高い変圧器では損失の帯がごく細くなる。細くて見えないときは上の数値で読むこと。
            </p>
          </div>
        </div>
      )}
    </div>
  );
};

        <p>この回路の正体は、理論で学ぶ <strong>2つの結合コイルのT形等価回路</strong>（<Eq tex="L_1-M,\ L_2-M,\ M" /> の3インダクタ）そのもの。対応は次の通り：</p>

        </ul>

      <h2 id="oc-test"><span className="h-num">5.</span>無負荷試験（開放試験）</h2>
      <Box kind="tip" label="何を測って何を得るか">
        <p style={{ margin: 0 }}><strong>二次側を開放し、一次側に定格電圧を加える</strong>。負荷電流が流れないので直列の <Eq tex="r_1,x_1" /> による降下はごくわずかで、測るのは実質<strong>励磁回路だけ</strong>。得られるのは <span className="marker">鉄損 <Eq tex="P_i" /> と励磁枝 <Eq tex="r_0,\ x_0" /></span>。</p>
      </Box>
      <TransformerTestCircuit mode="open" />
      <ul>
        <li>測定量：<strong>無負荷電流 <Eq tex="I_0" /></strong>、<strong>入力電力 <Eq tex="P_0" /></strong>、印加電圧 <Eq tex="V_1" />（＝定格電圧）</li>
        <li><strong>鉄損はおおむね <Eq tex="P_0" /> とみなせる</strong>。無負荷時に流れるのは励磁電流だけで、その一次銅損 <Eq tex="I_0^2 r_1" /> は <Eq tex="P_0" /> に比べて小さいため無視する（<span className="marker">これは近似</span>）</li>
      </ul>
      <p>励磁電流 <Eq tex="I_0" /> は、鉄損を負担する<strong>有効分</strong> <Eq tex="I_w" /> と、磁束をつくる<strong>磁化分</strong> <Eq tex="I_\mu" /> の直角合成になる。</p>
      <FormulaCard num="04 / 15" name="無負荷試験 — 励磁電流の分解と励磁枝" eq="I_0^2 = I_w^2 + I_\mu^2,\qquad I_w = \dfrac{P_0}{V_1},\qquad I_\mu = \sqrt{I_0^2 - I_w^2}"
        note={<>ここから <Eq tex="r_0 = V_1/I_w = V_1^{\,2}/P_0" />、<Eq tex="x_0 = V_1/I_\mu" />。<Eq tex="I_w" /> は電圧と同相の成分なので <Eq tex="P_0 = V_1 I_w" /> から出る。</>} />

      <figure style={{ margin: "10px 0 14px", background: "var(--bg-elev)", borderRadius: "8px", padding: "12px 8px 8px" }}>

      <Box kind="warn" label="単相と三相で式をそのまま使わない">
        <p style={{ margin: 0 }}>上の式は<strong>単相、または三相の1相分</strong>に対するもの。三相変圧器で三相電力 <Eq tex="P_{0,3\phi}" /> と線間電圧・線電流を測った場合は、<span className="marker">1相分に直してから</span>当てはめる（Y結線なら相電圧は <Eq tex="V_{\ell}/\sqrt3" />、相電流は線電流。Δ結線なら相電圧は線間電圧、相電流は <Eq tex="I_{\ell}/\sqrt3" />）。結線が示されていない問題では、<strong>1相分の値が与えられているのか三相合計なのかを必ず確認する</strong>。</p>
      </Box>

      <Box kind="example" label="解法例 2.1.3（無負荷試験から励磁枝を求める）">
        <p><strong>与えられた値:</strong> 単相変圧器の無負荷試験で、一次に定格電圧 <Eq tex="V_1 = 200\;\mathrm{V}" /> を加えたところ、無負荷電流 <Eq tex="I_0 = 2.5\;\mathrm{A}" />、入力電力 <Eq tex="P_0 = 150\;\mathrm{W}" /> であった。</p>
        <p><strong>何を求めるか:</strong> 鉄損電流 <Eq tex="I_w" />、磁化電流 <Eq tex="I_\mu" />、鉄損抵抗 <Eq tex="r_0" />、励磁リアクタンス <Eq tex="x_0" />。</p>

        <p style={{ marginBottom: 4 }}><strong>① 鉄損電流</strong>（電圧と同相の成分なので <Eq tex="P_0 = V_1 I_w" /> から）</p>
        <Eq display tex="I_w = \frac{P_0}{V_1} = \frac{150}{200} = 0.75\;[\mathrm{A}]" />

        <p style={{ marginBottom: 4 }}><strong>② 磁化電流</strong>（直角三角形 <Eq tex="I_0^2 = I_w^2 + I_\mu^2" /> から）</p>
        <Eq display tex="I_\mu = \sqrt{I_0^2 - I_w^2} = \sqrt{2.5^2 - 0.75^2} = \sqrt{5.6875} \approx 2.38\;[\mathrm{A}]" />

        <p style={{ marginBottom: 4 }}><strong>③ 鉄損抵抗</strong></p>
        <Eq display tex="r_0 = \frac{V_1}{I_w} = \frac{200}{0.75} \approx 267\;[\Omega] \quad\left(= \frac{V_1^{\,2}}{P_0} = \frac{200^2}{150} \approx 267\right)" />

        <p style={{ marginBottom: 4 }}><strong>④ 励磁リアクタンス</strong></p>
        <Eq display tex="x_0 = \frac{V_1}{I_\mu} = \frac{200}{2.38} \approx 84\;[\Omega]" />

        <p><strong>単位確認:</strong> V ÷ A ＝ Ω ✓　<strong>検算:</strong> 無負荷力率 <Eq tex="\cos\theta_0 = I_w/I_0 = 0.75/2.5 = 0.30" />。無負荷では磁化分が主なので力率が非常に低い、という実態と合う。<strong>ただしこの力率チェックは <Eq tex="r_0" /> を検証していない</strong>——<Eq tex="r_0" /> は ③ の2ルート（<Eq tex="V_1/I_w" /> と <Eq tex="V_1^{\,2}/P_0" />）が一致するかで確かめる（分母を <Eq tex="I_0" /> にすると 80 Ω となり 267 Ω と食い違うので気づける）。</p>
        <p style={{ margin: "8px 0 0" }}><strong>ひっかけ注意:</strong> <span className="marker"><Eq tex="r_0" /> の分母は <Eq tex="I_0" /> ではなく <Eq tex="I_w" /></span>。<Eq tex="V_1/I_0 = 200/2.5 = 80\,\Omega" /> としてしまうのが典型的な誤り（それは励磁インピーダンスの大きさであって鉄損抵抗ではない）。また <Eq tex="P_0" /> は<strong>鉄損</strong>であって銅損ではない。</p>
      </Box>

      <SectionCheck pageId="transformer" sectionId="oc-test" />

      <h2 id="sc-test"><span className="h-num">6.</span>短絡試験（インピーダンス試験）</h2>
      <Box kind="tip" label="何を測って何を得るか">
        <p style={{ margin: 0 }}><strong>二次側を短絡し、一次側に低い電圧を加えて定格電流を流す</strong>。印加電圧が定格の数 % と低いので<span className="marker">磁束が小さく鉄損は無視できる</span>。測るのは実質<strong>直列インピーダンスだけ</strong>。得られるのは <span className="marker">全負荷銅損 <Eq tex="P_{cN}" /> と <Eq tex="Z_e,\ R_e,\ X_e" />、そして %Z</span>。</p>
      </Box>
      <TransformerTestCircuit mode="short" />
      <ul>
        <li>測定量：<strong>短絡時の印加電圧 <Eq tex="V_s" /></strong>（＝インピーダンス電圧）、<strong>電流 <Eq tex="I_s" /></strong>（定格電流まで上げる）、<strong>入力電力 <Eq tex="P_s" /></strong></li>
        <li><strong>入力電力は定格電流時の銅損とみなせる</strong>（鉄損が無視できるため）</li>
      </ul>
      <FormulaCard num="05 / 15" name="短絡試験 — 等価インピーダンス" eq="Z_e = \dfrac{V_s}{I_s},\qquad R_e = \dfrac{P_s}{I_s^{\,2}},\qquad X_e = \sqrt{Z_e^{\,2} - R_e^{\,2}}"
        note={<><Eq tex="R_e = r_1 + r_2'" />、<Eq tex="X_e = x_1 + x_2'" />（基準側に換算した合計）。<Eq tex="R_e" /> は <Eq tex="P_s = I_s^2 R_e" /> から出る。</>} />
      <Box kind="warn" label="三相では線間・線電流・三相電力の関係を確認する">
        <p style={{ margin: 0 }}>上の式も<strong>単相、または三相の1相分</strong>。三相で三相電力 <Eq tex="P_{s,3\phi}" /> を測ったなら1相分は <Eq tex="P_{s,3\phi}/3" />、Y結線の相電圧は <Eq tex="V_{s,\ell}/\sqrt3" />。<span className="marker">単相の式に線間電圧と三相電力を混ぜて代入しない</span>。%Z を経由すれば結線に依らず扱えるので、三相はそちらが安全（セクション9）。</p>
      </Box>
      <Box kind="example" label="2つの試験の対比（取り違え防止）">
        <div className="table-wrap"><table className="data-table">
          <thead><tr><th scope="col"></th><th scope="col">無負荷試験</th><th scope="col">短絡試験</th></tr></thead>
          <tbody>
            <tr><td>二次側</td><td><strong>開放</strong></td><td><strong>短絡</strong></td></tr>
            <tr><td>加える電圧</td><td><strong>定格電圧</strong>（高い）</td><td><strong>低電圧</strong>（定格の数 %）</td></tr>
            <tr><td>流す電流</td><td>励磁電流のみ（小）</td><td><strong>定格電流</strong></td></tr>
            <tr><td>無視するもの</td><td>一次銅損</td><td>鉄損</td></tr>
            <tr><td>得られるもの</td><td>鉄損・<Eq tex="r_0" />・<Eq tex="x_0" /></td><td>全負荷銅損・<Eq tex="Z_e" />・<Eq tex="R_e" />・<Eq tex="X_e" />・%Z</td></tr>
          </tbody>
        </table></div>
        <p style={{ margin: "8px 0 0" }}>覚え方は<strong>「開けて鉄、短くして銅」</strong>。開放（無負荷）で鉄損、短絡で銅損。<span className="marker">測定対象を逆に覚えると全滅する</span>ので、電圧の大小（定格電圧か低電圧か）とセットで押さえる。</p>
      </Box>

      <Box kind="example" label="解法例 2.1.4（短絡試験から等価回路定数・%Z・全負荷銅損まで）">
        <p><strong>与えられた値:</strong> 単相変圧器 <Eq tex="10\;\mathrm{kV\cdot A}" />、一次定格電圧 <Eq tex="1000\;\mathrm{V}" />。短絡試験で <Eq tex="V_s = 50\;\mathrm{V}" />、<Eq tex="I_s = 10\;\mathrm{A}" />、<Eq tex="P_s = 200\;\mathrm{W}" /> を得た（すべて一次側の測定値）。</p>
        <p><strong>何を求めるか:</strong> <Eq tex="Z_e,\ R_e,\ X_e" />、%Z、全負荷銅損、短絡電流。</p>

        <p style={{ marginBottom: 4 }}><strong>① まず定格電流を出す</strong>（短絡試験の電流が定格かを確認するため）</p>
        <Eq display tex="I_n = \frac{S_N}{V_n} = \frac{10 \times 10^3}{1000} = 10\;[\mathrm{A}]" />
        <p style={{ margin: "4px 0 0" }}><Eq tex="I_s = I_n" /> なので、この短絡試験は<strong>定格電流での測定</strong>になっている。</p>

        <p style={{ marginBottom: 4 }}><strong>② 等価インピーダンス・等価抵抗・等価リアクタンス</strong></p>
        <Eq display tex="Z_e = \frac{V_s}{I_s} = \frac{50}{10} = 5\;[\Omega],\qquad R_e = \frac{P_s}{I_s^{\,2}} = \frac{200}{10^2} = 2\;[\Omega]" />
        <Eq display tex="X_e = \sqrt{Z_e^{\,2} - R_e^{\,2}} = \sqrt{5^2 - 2^2} = \sqrt{21} \approx 4.58\;[\Omega]" />

        <p style={{ marginBottom: 4 }}><strong>③ %Z</strong>（定義の2つの式が一致することを確認）</p>
        <Eq display tex="\%Z = \frac{V_s}{V_n}\times 100 = \frac{50}{1000}\times 100 = 5\;[\%] \;\;=\;\; \frac{I_n Z_e}{V_n}\times 100 = \frac{10 \times 5}{1000}\times 100 = 5\;[\%]" />

        <p style={{ marginBottom: 4 }}><strong>④ p・q に分けて検算</strong></p>
        <Eq display tex="p = \frac{I_n R_e}{V_n}\times 100 = 2.0\;[\%],\qquad q = \frac{I_n X_e}{V_n}\times 100 \approx 4.58\;[\%]" />
        <Eq display tex="\sqrt{p^2 + q^2} = \sqrt{2.0^2 + 4.58^2} \approx 5.00\;[\%] \;=\; \%Z \;\checkmark" />

        <p style={{ marginBottom: 4 }}><strong>⑤ 全負荷銅損と短絡電流</strong>（<Eq tex="P_{cN}" /> は定格電流時の銅損）</p>
        <Eq display tex="P_{cN} = P_s = 200\;[\mathrm{W}]" />
        <Eq display tex="I_s' = \frac{100}{\%Z}I_n = \frac{100}{5}\times 10 = 200\;[\mathrm{A}]" />

        <p><strong>単位確認:</strong> V÷A＝Ω ✓／W÷A²＝Ω ✓／%Z は無次元 ✓　<strong>検算:</strong> 短絡電流は定格の <Eq tex="100/5 = 20" /> 倍。</p>
        <p style={{ margin: "8px 0 0" }}><strong>ここから電圧変動率へ直結する:</strong> 力率 0.8 の定格負荷なら、<Eq tex="\varepsilon \approx p\cos\theta + q\sin\theta = 2.0\times0.8 + 4.58\times0.6 \approx 4.35\;[\%]" />（遅れ）。進みなら <Eq tex="2.0\times0.8 - 4.58\times0.6 \approx -1.15\;[\%]" /> で<span className="marker">符号が反転する</span>。<strong>短絡試験1つから %Z・銅損・短絡電流・電圧変動率がすべて出る</strong>のがこの試験の価値。</p>
        <p style={{ margin: "8px 0 0" }}><strong>ひっかけ注意:</strong> <Eq tex="R_e" /> の分母は <Eq tex="I_s^{\,2}" /> であって <Eq tex="I_s" /> ではない（<Eq tex="P = I^2R" /> だから）。また <Eq tex="X_e = Z_e - R_e" /> は誤り（<span className="marker">直角合成なので二乗の差の平方根</span>）。<Eq tex="5-2=3" /> としないこと（正しくは 4.58）。</p>
      </Box>

      <ImpedanceTriangle />

      <Box kind="tip" label="力率経由でもう一度出す（独立2経路で検算する）">
        <p style={{ margin: 0 }}>短絡試験の測定値だけで<strong>力率</strong>が出せる。ここから <Eq tex="R_e" /> と <Eq tex="X_e" /> を三角関数で出すと、<span className="marker">三平方とは別の計算経路で同じ値に着地する</span>。</p>
        <Eq display tex="\cos\theta = \frac{P_s}{V_s I_s} \;\Longrightarrow\; R_e = Z_e\cos\theta,\qquad X_e = Z_e\sin\theta" />
        <p style={{ margin: "4px 0 0" }}>2つの経路（<Eq tex="R_e = P_s/I_s^2" /> と <Eq tex="R_e = Z_e\cos\theta" />）が同じ値になれば、<strong>途中の算術ミスはまず拾える</strong>。<strong>試験本番で30秒で回せる検算</strong>なので、値を出したら必ず通す。</p>
        <p style={{ margin: "4px 0 0", fontSize: 12.5, color: "var(--ink-mute)" }}>ただし <Eq tex="Z_e\cos\theta = \dfrac{V_s}{I_s}\cdot\dfrac{P_s}{V_s I_s} = \dfrac{P_s}{I_s^{\,2}}" /> と、2経路は<strong>代数的には同じ式</strong>。<span className="marker">測定値の取り違えや立式そのものの誤りまでは拾えない</span>ので、計器の読みの対応づけは別途確認する。</p>
      </Box>

      <Box kind="example" label="解法例 2.1.5（定格が与えられない最小形 — Vs・Is・Ps だけから Xe を出す）">
        <p><strong>与えられた値:</strong> 単相変圧器の二次側を短絡し、一次側に<strong>定格一次電流</strong> <Eq tex="40\;\mathrm{A}" /> が流れるよう電圧を調整したところ、電圧計 <Eq tex="80\;\mathrm{V}" />、電力計 <Eq tex="1200\;\mathrm{W}" />。計器はすべて理想的とする。</p>
        <p><strong>何を求めるか:</strong> 一次側に換算した<strong>等価漏れリアクタンス</strong>（本ページの <Eq tex="X_e" />＝等価リアクタンス。<Eq tex="X_e = x_1 + x_2'" />）。</p>

        <p style={{ marginBottom: 4 }}><strong>① 等価インピーダンス（斜辺）</strong></p>
        <Eq display tex="Z_e = \frac{V_s}{I_s} = \frac{80}{40} = 2.00\;[\Omega]" />
        <p style={{ margin: "4px 0 0" }}>ここで出るのは<span className="marker">斜辺であって求める高さではない</span>。この時点で答えると失点する。</p>

        <p style={{ marginBottom: 4 }}><strong>② 等価抵抗（電力計 ≒ 銅損）</strong></p>
        <Eq display tex="R_e = \frac{P_s}{I_s^{\,2}} = \frac{1200}{40^2} = \frac{1200}{1600} = 0.75\;[\Omega]" />
        <p style={{ margin: "4px 0 0" }}>直列回路なので<strong>電流基準</strong>。<Eq tex="P_s/V_s^2" /> や <Eq tex="V_s^2/P_s" /> ではない。</p>

        <p style={{ marginBottom: 4 }}><strong>③ 直角合成から高さを分離</strong></p>
        <Eq display tex="X_e = \sqrt{Z_e^{\,2} - R_e^{\,2}} = \sqrt{2.00^2 - 0.75^2} = \sqrt{3.4375} \approx 1.85\;[\Omega]" />

        <p style={{ marginBottom: 4 }}><strong>④ 力率経由で検算</strong></p>
        <Eq display tex="\cos\theta = \frac{P_s}{V_s I_s} = \frac{1200}{80 \times 40} = 0.375,\qquad \sin\theta = \sqrt{1 - 0.375^2} \approx 0.9270" />
        <Eq display tex="R_e = Z_e\cos\theta = 2.00 \times 0.375 = 0.75\;\checkmark" />
        <Eq display tex="X_e = Z_e\sin\theta = 2.00 \times 0.9270 \approx 1.85\;\checkmark" />

        <p><strong>単位確認:</strong> V÷A＝Ω ✓／W÷A²＝Ω ✓　<strong>検算:</strong> <Eq tex="R_e \le Z_e" /> かつ <Eq tex="X_e \le Z_e" />（斜辺が最長）✓</p>
        <p style={{ margin: "4px 0 0", fontSize: 12.5, color: "var(--ink-mute)" }}>本問は <Eq tex="\cos\theta = 0.375 &lt; 0.707" /> なので <Eq tex="X_e &gt; R_e" /> になるが、<span className="marker">これは常に成り立つ関係ではない</span>。短絡力率が高い機器では <Eq tex="R_e &gt; X_e" /> もあり得るので、大小だけを根拠に正答を棄却しないこと。</p>

        <p style={{ margin: "8px 0 0" }}><strong>この問題では %Z は求められない:</strong> 与件にあるのは <Eq tex="I_n = 40\;\mathrm{A}" /> だけで、<strong>定格電圧</strong> <Eq tex="V_n" /> も<strong>定格容量</strong> <Eq tex="S_N" /> も無い。<Eq tex="\%Z = \dfrac{V_s}{V_n}\times100 = \dfrac{I_n Z_e}{V_n}\times100" /> はどちらの形でも <Eq tex="V_n" /> を要求するので、<span className="marker">%Z・短絡電流・電圧変動率のどれも出せない</span>（電圧変動率はさらに負荷力率も要る）。解法例 2.1.4 との違いはこの1点で、<strong>与件に定格電圧（または定格容量）があるかどうか</strong>が分岐になる。</p>
        <p style={{ margin: "6px 0 0", fontSize: 12.5, color: "var(--ink-mute)" }}>なお <Eq tex="\%Z = V_s/V_n \times 100" /> の形が使えるのは<strong>定格電流を流して測ったとき</strong>だけ。非定格の電流で測った試験値にこの式をそのまま当てると誤答になる。</p>
      </Box>

      <Box kind="mistake" label="この最小形で分かれる誤答（Ze をそのまま答える 2.00 が定番の罠）">
        <div className="table-wrap"><table className="data-table">
          <thead><tr><th scope="col">出る値</th><th scope="col">やってしまう操作</th><th scope="col">なぜ違うか</th></tr></thead>
          <tbody>
            <tr><td><strong>1.85</strong>（正）</td><td><Eq tex="X_e = \sqrt{Z_e^2 - R_e^2}" /></td><td>—</td></tr>
            <tr><td>2.00</td><td><Eq tex="Z_e" /> を求めた時点で答える</td><td><Eq tex="Z_e" /> は<strong>斜辺</strong>。問われているのは高さ <Eq tex="X_e" /></td></tr>
            <tr><td>1.25</td><td><Eq tex="Z_e - R_e = 2.00 - 0.75" /></td><td>直角に交わるベクトルなので<strong>スカラー引き算は不可</strong></td></tr>
            <tr><td>0.75</td><td><Eq tex="R_e" /> を答える</td><td><Eq tex="R_e" /> は<strong>抵抗</strong>。リアクタンスではない</td></tr>
          </tbody>
        </table></div>
        <p style={{ margin: "8px 0 0" }}>計算の最後に<strong>「自分が今どれを求めたか」</strong>を必ず1回確認する。<span className="marker">出した値が選択肢に無いときは立式そのものを疑う</span>（1.25 や 0.75 は選択肢に置かれないことが多い）。</p>
      </Box>

      <SectionCheck pageId="transformer" sectionId="sc-test" />

      <h2 id="loss"><span className="h-num">7.</span>損失・通常効率・全日効率</h2>

      <Box kind="tip" label="まず覚える結論（3つ）">
        <ul style={{ margin: 0, paddingLeft: 22 }}>
          <li><strong>通常効率は電力 [kW] の比、全日効率は電力量 [kWh] の比</strong>（効率そのものは無次元で [%] 表示）。全日効率では出力・鉄損・銅損を <span className="marker">すべて電力量 [kWh] に直してから</span> 分母に入れる。通常効率の答えに時間を掛けても全日効率にはならない。</li>
          <li><strong>出力は「kV·A × 力率 × 時間」、鉄損は「一定 × 通電時間」、銅損は「全負荷銅損 × 負荷率² × 時間」</strong>。この3つを別々に積算してから割り算する。</li>
          <li><strong>力率は出力 kWh に使い、負荷率は kV·A で取る</strong>（銅損を決めるのは巻線電流で、定格電圧ならその電流が kV·A に比例する）。<span className="marker">kV·A で与えられた負荷率に力率を掛けるのは誤り</span>。ただし<strong>負荷が kW で与えられたら先に <Eq tex="S = P/\cos\phi" /> で kV·A へ換算</strong>する（掛けるのでなく割る）。</li>
        </ul>
        <p style={{ margin: "8px 0 0", fontSize: 13 }}>本セクションでは力率角を <Eq tex="\phi" /> と書く（同じ量をセクション2の電圧変動率では <Eq tex="\theta" /> と表記している）。</p>
      </Box>

      <h3 id="loss-iron-copper">鉄損と銅損 — どこで・いつ発生するか</h3>
      <p>変圧器の損失は <strong>無負荷損</strong> と <strong>負荷損</strong> に大別される。全日効率で効くのは大きさより「<span className="marker">いつ発生しているか</span>」の違い。</p>
      <p style={{ fontSize: 13, color: "var(--ink-soft)" }}>
        なお <strong>無負荷損 ＝ 鉄損、負荷損 ＝ 銅損 は厳密には近似</strong>。無負荷損には鉄損のほか誘電体損や励磁電流による巻線抵抗損が、負荷損には抵抗損のほか漂遊負荷損が含まれる。三種の計算では<span className="marker">無負荷損を鉄損 <Eq tex="P_i" />、負荷損を銅損 <Eq tex="P_c" /> で代表させる</span>のが前提。以下この前提で書く。
      </p>

      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">項目</th><th scope="col">鉄損 <Eq tex="P_i" /></th><th scope="col">銅損 <Eq tex="P_c" /></th></tr></thead>
        <tbody>
          <tr><td>主な発生場所</td><td>鉄心</td><td>巻線</td></tr>
          <tr><td>主な内訳</td><td>ヒステリシス損・渦電流損</td><td>巻線抵抗による <Eq tex="I^2R" /> 損</td></tr>
          <tr><td>負荷との関係</td><td><strong>定格電圧・定格周波数ならほぼ一定</strong>（負荷によらない）</td><td><strong>負荷電流の2乗に比例</strong></td></tr>
          <tr><td><strong>無負荷通電中</strong><br/>（電源は入・負荷ゼロ）</td><td><span className="marker">発生する</span></td><td>三種の計算では<strong>ほぼ 0</strong> として扱う</td></tr>
          <tr><td><strong>電源切離し中</strong><br/>（遮断器を開放）</td><td>発生しない</td><td>発生しない</td></tr>
        </tbody>
      </table></div>

      <Box kind="warn" label="主線で使う鉄損の表現">
        <p style={{ margin: 0 }}><strong>鉄損は、定格電圧・定格周波数で運転している間は、負荷にかかわらずほぼ一定と扱う。</strong>「電圧の2乗に比例」は条件（周波数一定・近似）を省くと誤解のもとなので、全日効率の計算では上の表現を使う。</p>
      </Box>

      <Box kind="mistake" label="「無負荷」と「電源切離し」は別物">
        <p style={{ margin: 0 }}>問題文の「無負荷」は<strong>電圧は加わったまま負荷がゼロ</strong>の状態で、<span className="marker">鉄損は発生し続ける</span>。<strong>電源から切り離した（開放した）</strong>ときだけ鉄損もゼロになる。「24時間通電」と書いてあれば <Eq tex="T_{\mathrm{on}}=24" />、「12時間だけ電源に接続」ならその通電時間を使う。</p>
      </Box>

      <Fold label="鉄損の内訳と、電圧・周波数への依存性" sub="主線ではないが論説で問われる（補足を開く）">
        <p>鉄損は主に次の2つからなり、いずれも磁束密度の最大値 <Eq tex="B_m" /> に依存するが、<strong>周波数・材料・鉄心条件（板厚）への依存の仕方は互いに異なる</strong>。<Eq tex="E = 4.44 f N B_m A" /> から <Eq tex="B_m \propto V/f" /> なので、電圧と周波数の効き方も違ってくる。</p>
        <ul>
          <li><strong>ヒステリシス損</strong> <Eq tex="P_h \propto f B_m^{\,n}" />（鉄心の磁化・消磁のたびに履歴面積分のエネルギーが失われる）→ 周波数一定なら <Eq tex="P_h \propto V^{\,n}" />。<strong>Steinmetz 指数 <Eq tex="n" /> は材料・動作範囲による経験値でおおむね 1.6〜2</strong>（普遍の固定値ではない）。<span className="marker">問題文で指数や比例関係が指定されていれば、必ずその指定を優先する</span></li>
          <li><strong>渦電流損</strong> <Eq tex="P_e \propto f^2 B_m^2 t^2" />（<Eq tex="t" />: 鋼板の厚さ）→ 正弦波・鉄心条件一定・<Eq tex="V \simeq E" /> の古典的近似で <Eq tex="B_m \propto V/f" /> を代入し<strong>印加電圧 <Eq tex="V" /> の関数として表すと</strong> <Eq tex="P_e \propto V^2" /> となり、式上の <Eq tex="f" /> が相殺される。<span className="marker">無条件に「周波数に依存しない」のではない</span>（<Eq tex="B_m" /> を一定に保つ条件なら <Eq tex="P_e \propto f^2" />）。成層鉄心（薄い鋼板を積層）で <Eq tex="t" /> を小さくするのはここを減らすため</li>
        </ul>
        <p>したがって「鉄損は電圧の2乗に比例」は、<strong>周波数一定のもとで、ヒステリシス損の指数 <Eq tex="n" /> も 2 とみなした近似</strong>。三種の全日効率問題では電圧・周波数は定格一定なので、結局「一定値」として扱えばよい。</p>
        <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#magnetic-circuit:explain:B-H" target="_blank" rel="noopener">→ 理論Wiki「磁気回路」で Ph の出どころ（ヒステリシスループの面積 Wh=∮H dB → Ph=f·Wh）と、上の Bm 一定条件つきの周波数依存を B-H 曲線の図つきで深掘り（H18問3・R01問3）</a></p>
      </Fold>

      <h4>なぜ銅損は負荷率の2乗になるのか</h4>
      <p>銅損は巻線抵抗の発熱そのもの（<Eq tex="P_c = I^2 R" />）。電圧が一定なら電流は皮相電力に比例（三相では <Eq tex="I = S / (\sqrt{3}V)" />）なので、</p>
      <Eq display tex="\frac{I}{I_N} = \frac{S}{S_N} = x \;\Longrightarrow\; P_c = \left(\frac{I}{I_N}\right)^2 P_{cN} = x^2 P_{cN}" />
      <FormulaCard num="06 / 15" name="銅損は負荷率の2乗に比例" eq="P_c = x^2 P_{cN},\qquad x = \dfrac{S}{S_N}"
        note={<><Eq tex="P_{cN}" />: 全負荷銅損（定格電流時の銅損）、<Eq tex="S_N" />: 定格容量 [kV·A]。<strong>全負荷銅損と実際の銅損を混同しない</strong>。</>} />

      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">負荷率 <Eq tex="x" /></th><th scope="col">100%</th><th scope="col">80%</th><th scope="col">60%</th><th scope="col">50%</th><th scope="col">40%</th><th scope="col">20%</th></tr></thead>
        <tbody>
          <tr><td>銅損倍率 <Eq tex="x^2" /></td><td>1.00</td><td>0.64</td><td>0.36</td><td>0.25</td><td>0.16</td><td>0.04</td></tr>
        </tbody>
      </table></div>
      <Box kind="mistake" label="ここを間違える">
        <p style={{ margin: 0 }}><span className="marker">負荷が半分なら銅損も半分、ではない。50% 負荷では銅損は 25%</span>。軽負荷の時間帯の銅損は、感覚よりずっと小さくなる。</p>
      </Box>

      <h4>負荷率は原則 kV·A 基準（力率を掛けない）</h4>
      <p>負荷率の<strong>本質は電流比</strong> <Eq tex="x = I/I_N" />。定格電圧・平衡負荷という通常の条件では、電流は皮相電力に比例するので kV·A どうしの比で取れる。</p>
      <Eq display tex="x = \frac{I}{I_N} = \frac{\text{負荷の皮相電力}\;[\mathrm{kV\cdot A}]}{\text{定格容量}\;[\mathrm{kV\cdot A}]} = \frac{S}{S_N}" />
      <p style={{ margin: "4px 0 0" }}><Eq tex="x = \tfrac{S\cos\phi}{S_N}" /> と力率を掛けるのは<strong>誤り</strong>。</p>
      <p>巻線の発熱を決めるのは<strong>電流</strong>であり、三相では <Eq tex="I = S/(\sqrt{3}V)" />。電圧が一定なら電流は kV·A に比例するので、負荷率は kV·A どうしの比で取る。<strong>kV·A で与えられた負荷</strong>に力率を掛けてしまうと、同じ電流でも力率が低い時間帯の銅損を過小評価する。</p>

      <Box kind="warn" label="負荷が kW で与えられたときは、先に kV·A へ直す">
        <p style={{ margin: 0 }}>「力率を掛けない」は <strong>負荷が kV·A（皮相電力）で与えられている場合</strong>の話。問題文が <strong>kW（有効電力）</strong> で与えてきたら、まず <Eq tex="S = P/\cos\phi" /> で皮相電力に換算してから <Eq tex="x = S/S_N" /> とする。</p>
        <Eq display tex="x = \frac{S}{S_N} = \frac{P}{S_N \cos\phi}" />
        <p style={{ margin: "4px 0 0" }}>（負荷が <Eq tex="P\;[\mathrm{kW}]" /> で与えられたときの形）</p>
        <p style={{ margin: "6px 0 0" }}>例: 定格 100 kV·A の変圧器に「40 kW・力率 0.8」の負荷 → <Eq tex="S = 40/0.8 = 50" /> kV·A、<Eq tex="x = 0.5" />（<span className="marker"><Eq tex="40/100 = 0.4" /> としない</span>）。<strong>掛けるのではなく割る</strong>のがポイント。</p>
      </Box>

      <Box kind="formula" label="覚え方">
        <p style={{ margin: 0, fontSize: 15 }}><strong>力率は出力 kWh に使う。kV·A 負荷率は銅損に使う。</strong>（kW 与件なら、まず力率で<strong>割って</strong> kV·A にする）</p>
      </Box>

      <h3 id="loss-normal">通常効率 — ある運転点を kW で評価する</h3>
      <p>ある負荷率 <Eq tex="x" />・力率 <Eq tex="\cos\phi" /> の定常的な運転点における効率。<strong>すべて電力 [kW] のまま</strong>扱う。</p>
      <FormulaCard num="07 / 15" name="通常効率（損失から算定する規約効率）" eq="\eta = \dfrac{P_{\mathrm{out}}}{P_{\mathrm{out}} + P_i + x^2 P_{cN}} \times 100\;[\%]"
        note={<>出力 <Eq tex="P_{\mathrm{out}} = x S_N \cos\phi\;[\mathrm{kW}]" />。分母は「出力＋鉄損＋銅損」＝入力。<strong>規約効率</strong>とは入力と出力を直接実測する<strong>実測効率</strong>に対し、別に求めた損失からこの式で算出する効率のこと（<span className="marker">「ある負荷状態の効率」という意味ではなく、算出方法を指す用語</span>）。</>} />

      <h3 id="loss-daily">全日効率とは — 1日を kWh で評価する</h3>
      <p>配電用変圧器のように<strong>負荷が時間帯で大きく変わる</strong>設備では、ある一点の効率では実力を表せない。そこで日負荷曲線をもとに <strong>1日分の電力量 [kWh]</strong> で評価するのが全日効率。</p>
      <FormulaCard num="08 / 15" name="全日効率" eq="\eta_d = \dfrac{W_{\mathrm{out}}}{W_{\mathrm{out}} + W_i + W_c} \times 100\;[\%]"
        note="Wout: 1日の出力電力量、Wi: 1日の鉄損電力量、Wc: 1日の銅損電力量（いずれも kWh）。" />

      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">比較項目</th><th scope="col">通常効率</th><th scope="col">全日効率</th></tr></thead>
        <tbody>
          <tr><td>評価対象</td><td>ある定常運転点</td><td>1日全体</td></tr>
          <tr><td>計算に用いる量</td><td>電力 <strong>[kW]</strong></td><td>電力量 <strong>[kWh]</strong></td></tr>
          <tr><td>鉄損</td><td>その時点の損失 <Eq tex="P_i" /></td><td>通電時間分を積算 <Eq tex="P_i T_{\mathrm{on}}" /></td></tr>
          <tr><td>銅損</td><td>その負荷率での損失 <Eq tex="x^2 P_{cN}" /></td><td>各時間帯を積算 <Eq tex="P_{cN}\sum x_k^2 t_k" /></td></tr>
          <tr><td>主な対象</td><td>電力用変圧器など</td><td><strong>配電用変圧器</strong>など</td></tr>
        </tbody>
      </table></div>

      <Box kind="mistake" label="いちばん多い誤り">
        <p style={{ margin: 0 }}>通常効率を求めてから<strong>時間を適当に掛ける</strong>のは誤り。出力・鉄損・銅損を<span className="marker">それぞれ電力量にしてから</span>分母に入れる。鉄損と銅損では「掛ける時間」が違う（鉄損＝通電時間、銅損＝各負荷時間）ので、一括で時間を掛けることはできない。</p>
      </Box>

      <h4>長い式を一気に覚えない — 3つの箱に分ける</h4>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 10, margin: "10px 0" }}>
        <div style={{ border: "1px solid var(--rule)", borderTop: "3px solid var(--accent)", borderRadius: "0 0 6px 6px", background: "var(--bg-elev)", padding: "10px 12px" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--accent-ink)", marginBottom: 4 }}>① 出力電力量 <Eq tex="W_{\mathrm{out}}" /></div>
          <Eq display tex="W_{\mathrm{out}} = \sum_k S_k \cos\phi_k\, t_k" />
          <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>kV·A は皮相電力なので、<strong>負荷に実際に渡した有効電力量</strong>を出すには力率を掛ける。</div>
        </div>
        <div style={{ border: "1px solid var(--rule)", borderTop: "3px solid var(--warn)", borderRadius: "0 0 6px 6px", background: "var(--bg-elev)", padding: "10px 12px" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--warn)", marginBottom: 4 }}>② 鉄損電力量 <Eq tex="W_i" /></div>
          <Eq display tex="W_i = P_i\, T_{\mathrm{on}}" />
          <div style={{ fontSize: 12, color: "var(--ink-soft)" }}><Eq tex="T_{\mathrm{on}}" /> は<strong>電圧が加わっている時間</strong>。24時間通電のときだけ <Eq tex="P_i \times 24" />。</div>
        </div>
        <div style={{ border: "1px solid var(--rule)", borderTop: "3px solid var(--danger)", borderRadius: "0 0 6px 6px", background: "var(--bg-elev)", padding: "10px 12px" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--danger)", marginBottom: 4 }}>③ 銅損電力量 <Eq tex="W_c" /></div>
          <Eq display tex="W_c = P_{cN} \sum_k x_k^2\, t_k" />
          <div style={{ fontSize: 12, color: "var(--ink-soft)" }}><Eq tex="x_k = S_k / S_N" />（力率は掛けない）。各時間帯ごとに2乗してから足す。</div>
        </div>
      </div>
      <div style={{ textAlign: "center", color: "var(--ink-mute)", fontSize: 16, lineHeight: 1, margin: "2px 0 6px" }}>↓ 最後に全日効率へ代入</div>
      <FormulaCard num="09 / 15" name="全日効率（3つの箱を代入した展開式）"
        eq="\eta_d = \dfrac{\sum_k S_k\cos\phi_k t_k}{\sum_k S_k\cos\phi_k t_k + P_i T_{\mathrm{on}} + P_{cN}\sum_k \left(\frac{S_k}{S_N}\right)^2 t_k} \times 100"

      <h4>24時間タイムライン — 出力・鉄損・銅損はいつ出ているか</h4>

      <h3 id="loss-steps">全日効率の5ステップ解法</h3>
      <ol style={{ paddingLeft: 22 }}>
        <li style={{ marginBottom: 6 }}><strong>各時間帯の出力電力量</strong>を出す — <Eq tex="W_{\mathrm{out},k} = S_k \cos\phi_k\, t_k" />（kV·A に力率を掛ける）</li>
        <li style={{ marginBottom: 6 }}><strong>合計する</strong> — <Eq tex="W_{\mathrm{out}} = \sum_k W_{\mathrm{out},k}" /></li>
        <li style={{ marginBottom: 6 }}><strong>鉄損電力量</strong> — <Eq tex="W_i = P_i T_{\mathrm{on}}" />（<span className="marker">24時間と決めつけず通電時間を確認</span>）</li>
        <li style={{ marginBottom: 6 }}><strong>銅損電力量</strong> — <Eq tex="W_c = P_{cN}\sum_k (S_k/S_N)^2 t_k" />（負荷率は kV·A 基準・2乗してから足す）</li>
        <li><strong>全日効率</strong> — <Eq tex="\eta_d = W_{\mathrm{out}} / (W_{\mathrm{out}} + W_i + W_c) \times 100" />（0〜100% に収まるか検算）</li>
      </ol>

      <h3 id="loss-example">典型例題（途中式をすべて書く）</h3>
      <Box kind="example" label="例題 2.1.2（全日効率）">
        <p><strong>問:</strong> 定格容量 100 kV·A、鉄損 0.6 kW、全負荷銅損 1.5 kW の単相変圧器がある。1日の負荷が「80 kV·A・力率 0.8 で 8 時間」「40 kV·A・力率 0.9 で 8 時間」「残り 8 時間は無負荷」であり、変圧器は<strong>24時間通電</strong>している。全日効率を求めよ。</p>

        <p style={{ marginBottom: 4 }}><strong>Step 1・2　出力電力量</strong>（無負荷の8時間は出力ゼロなので足さない）</p>
        <Eq display tex="W_{\mathrm{out}} = 80 \times 0.8 \times 8 + 40 \times 0.9 \times 8 = 512 + 288 = 800\;[\mathrm{kWh}]" />

        <p style={{ marginBottom: 4 }}><strong>Step 3　鉄損電力量</strong>（無負荷の8時間も通電しているので24時間ぶん）</p>
        <Eq display tex="W_i = 0.6 \times 24 = 14.4\;[\mathrm{kWh}]" />

        <p style={{ marginBottom: 4 }}><strong>Step 4　銅損電力量</strong>（負荷率 <Eq tex="x_1 = 80/100 = 0.8" />、<Eq tex="x_2 = 40/100 = 0.4" />。力率は掛けない）</p>
        <Eq display tex="W_c = 1.5\left[\left(\tfrac{80}{100}\right)^2 \times 8 + \left(\tfrac{40}{100}\right)^2 \times 8\right] = 1.5\,[\,0.64 \times 8 + 0.16 \times 8\,] = 1.5 \times 6.4 = 9.6\;[\mathrm{kWh}]" />

        <p style={{ marginBottom: 4 }}><strong>Step 5　全日効率</strong>（分母＝入力電力量 <Eq tex="800 + 14.4 + 9.6 = 824\;[\mathrm{kWh}]" />）</p>
        <Eq display tex="\eta_d = \frac{800}{800 + 14.4 + 9.6} \times 100 = \frac{800}{824}\times 100 \approx 97.1\;[\%]" />

        <p style={{ margin: "10px 0 0" }}><strong>検算:</strong> 出力 800 ＋ 損失 24.0 ＝ 入力 824.0 kWh。効率は 0〜100% の範囲に収まっている。損失のうち<span className="marker">鉄損が 14.4 kWh と銅損 9.6 kWh を上回る</span>のは、負荷率が低い時間帯が長い配電用変圧器の典型的な姿。<br /><strong>※この等式は分母を足し直しただけなので必ず成立する（転記ミス検出専用）。</strong><Eq tex="W_c" /> 側は「負荷率に力率を掛けない」「負荷率が半分なら銅損は 1/4」を下の頻出ミス表で別途確認する——力率を掛けてしまうと <Eq tex="W_c" /> は 6.47 kWh になるが、この等式も 0〜100% も「鉄損 &gt; 銅損」もすべて通ってしまう。</p>
      </Box>

      <h3 id="loss-sim">全日効率シミュレータ（数字を動かして確かめる）</h3>
      <p>上の例題の条件が初期値。<strong>負荷率を半分にしても銅損は 1/4 にしかならない</strong>こと、<strong>負荷時間帯はそのままで通電時間だけを減らす（無負荷通電の時間を電源切離しに変える）と鉄損電力量だけが減る</strong>ことを、数値で確かめてほしい。負荷のある時間まで削れば、当然そのぶん出力電力量と銅損電力量も減る。</p>
      <TransformerDailyEfficiencySimulator />

      <h3 id="loss-mistakes">頻出ミス</h3>
      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">誤り</th><th scope="col">正しい考え方</th></tr></thead>
        <tbody>
          <tr><td>kW と kWh を混ぜる</td><td>全日効率では<strong>すべて kWh にそろえる</strong></td></tr>
          <tr><td>kV·A × 時間 で出力を求める</td><td><strong>kV·A × 力率 × 時間</strong>（皮相電力のままでは有効電力量にならない）</td></tr>
          <tr><td>銅損を負荷率に比例させる</td><td><strong>負荷率の2乗</strong>に比例（50% 負荷なら 25%）</td></tr>
          <tr><td>無負荷時間の鉄損を 0 にする</td><td>通電しているなら<strong>鉄損は発生</strong>する</td></tr>
          <tr><td>無負荷時間に全負荷銅損を入れる</td><td>三種の計算では<strong>無負荷時の銅損はほぼ 0</strong>（励磁電流による微小な銅損は無視する前提）</td></tr>
          <tr><td>kV·A の負荷率に力率を掛ける</td><td><strong>kV·A ÷ 定格 kV·A</strong>（銅損は電流で決まる）</td></tr>
          <tr><td>kW で与えられた負荷をそのまま定格 kV·A で割る</td><td>先に <Eq tex="S = P/\cos\phi" /> で kV·A へ<strong>換算</strong>してから割る（掛けるのでなく割る）</td></tr>
          <tr><td>全負荷銅損をそのまま使う</td><td>その時間帯の実銅損は <Eq tex="x^2 P_{cN}" /></td></tr>
          <tr><td>通電時間を 24 時間と決めつける</td><td>問題文の<strong>実際の通電時間</strong>を確認する（「12時間だけ接続」なら 12）</td></tr>
        </tbody>
      </table></div>
      <Box kind="formula" label="この一文だけ持ち帰る">
        <p style={{ margin: 0, fontSize: 15 }}>出力は「<strong>kV·A × 力率 × 時間</strong>」、鉄損は「<strong>一定 × 通電時間</strong>」、銅損は「<strong>全負荷銅損 × 負荷率² × 時間</strong>」。</p>
      </Box>

      <Fold label="等価負荷率 — 複数の時間帯を1つにまとめる" sub="主線を理解した後の補足（開く）">
        <p>銅損電力量だけを見れば、変動する負荷を「ある一定の負荷率 <Eq tex="x_e" /> で <Eq tex="T" /> 時間運転した」と置き換えられる。これが<strong>等価負荷率</strong>。</p>
        <Eq display tex="x_e = \sqrt{\frac{\sum_k x_k^2 t_k}{T}}, \quad T = \sum_k t_k \qquad\Longrightarrow\qquad W_c = P_{cN}\, x_e^2\, T" />
        <Box kind="warn" label="T の取り方を必ず分子とそろえる">
          <p style={{ margin: 0 }}><Eq tex="T" /> は<strong>等価化する評価期間</strong>で、<span className="marker">分子の時間区分の合計 <Eq tex="\textstyle\sum_k t_k" /> と必ず一致させる</span>。1日を等価化するなら、無負荷や電源切離しの時間も <Eq tex="x_k = 0" /> の区間として数え、<Eq tex="T = 24" /> h に含める。<strong>含める区間を変えると <Eq tex="x_e" /> の値が変わる</strong>ので、<Eq tex="W_c = P_{cN}x_e^2T" /> が元の <Eq tex="P_{cN}\sum x_k^2 t_k" /> と一致するのは分子と分母をそろえたときだけ。</p>
        </Box>
        <p>定義から分かるとおり、これは<strong>単純平均ではなく二乗平均平方根（RMS）</strong>。銅損が負荷率の2乗で効くので、2乗して平均してから平方根を取る必要がある。</p>
        <p><strong>例:</strong> 100% 負荷で12時間、無負荷で12時間（<Eq tex="T = 24" />）のとき</p>
        <Eq display tex="x_e = \sqrt{\frac{1^2 \times 12 + 0^2 \times 12}{24}} = \sqrt{0.5} \approx 0.707" />
        <p>単純平均の負荷率は 50% だが、<span className="marker">銅損計算上の等価負荷率は約 70.7%</span>。平均で 50% と置いて <Eq tex="0.5^2 = 0.25" /> を使うと、銅損を半分に見誤る（正しくは <Eq tex="0.707^2 = 0.5" />）。</p>
      </Fold>

          <rect x="86" y="252" width="308" height="0.1" fill="none" />

            鉄損＝銅損 となる x ＝ √(Pi/PcN) ＝ √(0.6/1.5) ≒ 0.63 で効率が最大（98.1 %）

        <figcaption style={{ fontSize: "12px", color: "var(--ink-mute)", textAlign: "center", marginTop: "6px", lineHeight: 1.6 }}>
          鉄損は水平（負荷によらない）、銅損は放物線（<Eq tex="x^2" /> に比例）。<strong>2本が交わる負荷率で効率が最大</strong>になる。<span className="marker">最大点の周辺は平ら</span>なので、多少ずれても効率はあまり落ちない。一方<strong>軽負荷側では急激に落ちる</strong>（出力が小さいのに鉄損は同じだけ出続けるため）。
        </figcaption>
      </figure>

      <FormulaCard num="10 / 15" name="最高効率の条件（通常効率）" eq="P_i = P_c = x^2 P_{cN}"
        note={<>鉄損 ＝ 銅損 のときに最高効率。<strong>電圧・周波数・力率 <Eq tex="\cos\phi" />・巻線抵抗を一定として負荷率 <Eq tex="x" /> だけを変えたとき</strong>の条件（力率が <Eq tex="x" /> とともに変わる場合は出力が <Eq tex="x" /> に比例しないので一般には成り立たない）。これを満たす負荷率は <Eq tex="x = \sqrt{P_i / P_{cN}}" />。配電用変圧器は軽負荷の時間が長いので、<strong>全負荷より低い負荷率</strong>で効率が最大になるよう設計されることが多い。</>} />

      <Box kind="warn" label="全日効率にそのまま当てはめない">
        <p style={{ margin: 0 }}>「全日効率が最大 ＝ 鉄損電力量 ＝ 銅損電力量」と<strong>無条件に断定してはいけない</strong>。負荷の形（日負荷曲線）が変われば最適点も変わるからである。限定つきなら次のように言える。</p>
        <p style={{ margin: "8px 0 0" }}><span className="marker">同じ負荷パターンを一定倍率で拡大・縮小して全日効率の最大条件を考える場合には、1日の鉄損電力量と1日の銅損電力量が等しくなる点が対応する。</span></p>
        <p style={{ margin: "8px 0 0", fontSize: 13 }}>ここで固定しているのは <strong>各時間帯の力率・時間区分の長さ・通電時間・電圧と周波数・鉄損と全負荷銅損（巻線抵抗一定）</strong>。動かすのは負荷の大きさの倍率 <Eq tex="m" /> だけ。</p>
      </Box>

      <Fold label="なぜ「一定倍率で拡大・縮小」なら Wi = Wc になるのか" sub="導出を開く">
        <p>負荷パターン全体を <Eq tex="m" /> 倍する（<Eq tex="S_k \to m S_k" />）と、出力電力量は <Eq tex="m" /> に比例、銅損電力量は負荷率の2乗で効くので <Eq tex="m^2" /> に比例し、鉄損電力量は変わらない。<Eq tex="A = \sum S_k\cos\phi_k t_k" />、<Eq tex="B = P_{cN}\sum x_k^2 t_k" /> と置くと</p>
        <Eq display tex="\eta_d(m) = \frac{mA}{mA + W_i + m^2 B}" />
        <p>分子分母を <Eq tex="mA" /> で割ると <Eq tex="\eta_d = 1/\left(1 + \dfrac{W_i}{mA} + \dfrac{mB}{A}\right)" />。分母のうち <Eq tex="m" /> に依存する2項の和は、相加相乗平均から <Eq tex="2\sqrt{W_i B}/A" /> 以上で、等号は <Eq tex="W_i/(mA) = mB/A" /> すなわち <Eq tex="m^2 B = W_i" /> のとき。<Eq tex="m^2 B" /> はそのときの銅損電力量 <Eq tex="W_c" /> なので、<strong><Eq tex="W_i = W_c" /></strong> で最大となる。</p>
        <p style={{ margin: "8px 0 0" }}>通常効率の <Eq tex="P_i = P_c" /> と形は同じだが、<strong>比べているのは電力 [kW] ではなく電力量 [kWh]</strong>。主線では両者を混同しないこと。</p>
      </Fold>

      <SectionCheck pageId="transformer" sectionId="loss" />

      <h2 id="vreg"><span className="h-num">8.</span>電圧変動率</h2>
      <p><strong>何を求めるか</strong>：負荷をかけたときに二次端子電圧がどれだけ下がるか。まず定義から押さえる。</p>
      <FormulaCard num="11 / 15" name="電圧変動率の定義" eq="\varepsilon = \dfrac{V_{20} - V_2}{V_2}\times 100\;[\%]"
        note={<><Eq tex="V_{20}" />: 無負荷時の二次電圧、<Eq tex="V_2" />: 定格負荷時の二次端子電圧。<span className="marker">分母は無負荷電圧ではなく定格負荷時の <Eq tex="V_2" /></span>（電験の定義）。</>} />
      <p>これを等価回路の <Eq tex="p,\ q" /> で近似したのが次の式。<strong>近似式</strong>であることに注意（降下が定格電圧に比べて小さいことを使っている）。</p>
      <FormulaCard num="12 / 15" name="電圧変動率の近似式（遅れ力率／進み力率）" eq="\varepsilon \approx p\cos\theta \pm q\sin\theta"
        note={<>複号は ＋が遅れ力率・−が進み力率。<Eq tex="p" />: 百分率抵抗降下 [%]、<Eq tex="q" />: 百分率リアクタンス降下 [%]、<Eq tex="\theta" />: 力率角。<strong>違いは <Eq tex="q\sin\theta" /> の符号だけ</strong>。</>} />

      <TransformerPhasor />
      <p>図の要点は3つ。<strong>①</strong> <Eq tex="I_2r" /> は <Eq tex="I_2" /> と同方向、<strong>②</strong> <Eq tex="jI_2x" /> は <Eq tex="I_2" /> より 90° 進み、<strong>③</strong> 端子電圧に効くのは降下の<strong>水平成分（<Eq tex="V_2" /> 方向の成分）</strong>だけ。この水平成分を足し合わせると <Eq tex="I_2r\cos\theta + I_2x\sin\theta" /> になり、<Eq tex="V_2" /> で割って百分率にすると <Eq tex="p\cos\theta + q\sin\theta" /> がそのまま出てくる。<span className="marker">近似式は「降下ベクトルの水平成分」を読んでいるだけ</span>である。</p>

      <TransformerPhasorLeading />
      <Box kind="mistake" label="進み力率では ε が負になりうる ＝ 負荷をかけた方が電圧が高い">
        <p><Eq tex="\varepsilon" /> が負とは、定義 <Eq tex="\varepsilon = (V_{20}-V_2)/V_2" /> が負、すなわち <span className="marker"><Eq tex="V_2 > V_{20}" />（負荷時の端子電圧が無負荷時より<strong>高い</strong>）</span>ということ。進み力率（コンデンサ性負荷）では <Eq tex="jI_2x" /> の水平成分が <Eq tex="V_2" /> と逆を向き、電圧を押し上げる側に働くために起こる。</p>
        <p style={{ margin: "8px 0 0" }}>長距離送電線の軽負荷時に受電端電圧が送電端より上がる<strong>フェランチ効果</strong>と同じ機構。「負荷をかければ必ず電圧は下がる」と思い込んでいると、この符号で失点する。</p>
      </Box>

      <Box kind="example" label="数値例 — 同じ変圧器でも力率で符号が変わる">
        <p><strong>問:</strong> <Eq tex="p = 2\;\%" />、<Eq tex="q = 5\;\%" /> の変圧器に力率 0.8 の定格負荷をかけた。(1) 遅れ力率のとき (2) 進み力率のときの電圧変動率を求めよ。</p>
        <p><Eq tex="\cos\theta = 0.8" /> より <Eq tex="\sin\theta = 0.6" />。</p>
        <Eq display tex="(1)\;\; \varepsilon \approx 2 \times 0.8 + 5 \times 0.6 = 1.6 + 3.0 = 4.6\;[\%]" />
        <Eq display tex="(2)\;\; \varepsilon \approx 2 \times 0.8 - 5 \times 0.6 = 1.6 - 3.0 = -1.4\;[\%]" />
        <p style={{ margin: "8px 0 0" }}>(2) は負。<strong>進み力率では端子電圧が無負荷時より上がる</strong>。<span className="marker"><Eq tex="q" /> が <Eq tex="p" /> より大きい変圧器ほど、この符号反転は起こりやすい</span>（実機の変圧器は一般に <Eq tex="q > p" />）。</p>
      </Box>

      <SectionCheck pageId="transformer" sectionId="vreg" />

      <h2 id="pz"><span className="h-num">9.</span>百分率インピーダンスと短絡電流</h2>
      <p><strong>何を求めるか</strong>：変圧器の内部インピーダンスの「大きさの程度」を、容量や電圧が違っても比較できる共通のものさしで表す。</p>
      <FormulaCard num="13 / 15" name="%Z の定義" eq="\%Z = \dfrac{V_s}{V_n}\times 100 = \dfrac{I_n Z_e}{V_n}\times 100\;[\%]"
        note={<><Eq tex="V_s" />: 二次側を短絡して定格電流を流すのに必要な印加電圧（インピーダンス電圧）、<Eq tex="V_n" />: 定格電圧、<Eq tex="I_n" />: 定格電流、<Eq tex="Z_e" />: 基準側に換算した等価インピーダンス。<strong>いずれも同じ側（一次なら一次）でそろえる</strong>。</>} />
      <p>つまり %Z は「<strong>定格電流を流したときの内部電圧降下が、定格電圧の何 % か</strong>」。セクション6の短絡試験で得た <Eq tex="R_e,\ X_e" /> をそれぞれ百分率にしたものが <Eq tex="p,\ q" /> で、%Z はその直角合成になる。</p>
      <Eq display tex="p = \frac{I_n R_e}{V_n}\times 100,\qquad q = \frac{I_n X_e}{V_n}\times 100 \qquad\Longrightarrow\qquad \%Z = \sqrt{p^2 + q^2}" />
      <p>したがって <strong>短絡試験 → <Eq tex="R_e,X_e" /> → <Eq tex="p,q" /> → %Z → 電圧変動率と短絡電流</strong> が1本の線でつながる。<Eq tex="p,q" /> はセクション8の電圧変動率でそのまま使う量である。</p>

      <FormulaCard num="14 / 15" name="短絡電流（簡易式）" eq="I_s = \dfrac{100}{\%Z}\, I_n\;[\mathrm{A}]"
        note={<>%Z = 5 % なら短絡電流は定格の 20 倍。<span className="marker">%Z が小さいほど短絡電流は大きい</span>（電圧変動は小さいが遮断器の負担は重い）。</>} />
      <Box kind="warn" label="この簡易式が前提にしていること（実系統ではそのまま使えない）">
        <ul style={{ margin: 0, paddingLeft: 22 }}>
          <li><strong>変圧器の端子直近で短絡した</strong>場合を想定している</li>
          <li><strong>上位電源・発電機・ケーブル・母線などのインピーダンスをすべて無視</strong>している（電源を無限大母線とみなしている）</li>
          <li>実際の系統短絡電流は、変圧器以外のインピーダンスも共通基準容量に換算して<strong>合成してから</strong>計算する。合成インピーダンスは必ず変圧器単独より大きくなるので、<span className="marker">この簡易式は実際より大きめの（安全側の）短絡電流を与える</span></li>
        </ul>
      </Box>
      <Box kind="example" label="例題 2.1.1（%Z と短絡電流）">
        <p><strong>問:</strong> 三相変圧器、定格容量 500 kV·A、二次定格電圧 6.6 kV、%Z = 4.0 % のとき、二次側短絡電流を求めよ（変圧器端子直近での短絡・上位系統のインピーダンスは無視する）。</p>
        <Eq display tex="I_n = \dfrac{500{\times}10^3}{\sqrt{3}\times 6600} \approx 43.7\;[\mathrm{A}]" />
        <Eq display tex="I_s = \dfrac{100}{4.0}\times 43.7 \approx 1.09\;[\mathrm{kA}]" />
        <p style={{ margin: "8px 0 0" }}>三相の定格電流は <Eq tex="I_n = S_N/(\sqrt3 V_n)" />。<span className="marker">単相の <Eq tex="S_N/V_n" /> と混同しない</span>。</p>
      </Box>

      <h3 id="pz-meaning">%Z から何が分かるか — 3つに分けて覚える</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 10, margin: "10px 0" }}>
        {[
          ["① 短絡電流の大きさ", "var(--danger)", <>%Z が<strong>小さい</strong>ほど短絡電流は<strong>大きい</strong>。<Eq tex="I_s = (100/\%Z)I_n" /> より反比例。遮断器の遮断容量を決める。</>],
          ["② 電圧変動率", "var(--warn)", <>%Z が小さいほど電圧降下は<strong>小さくなりやすい</strong>。ただし <Eq tex="\varepsilon" /> は %Z の大きさだけでは決まらない（次の注意を参照）。</>],
          ["③ 並行運転の負荷分担", "var(--accent)", <>%Z が小さい器ほど<strong>多く負担しやすい</strong>。ただし容量も効くので <Eq tex="S_N/z" /> の比で判断する。</>],
        ].map(([t, c, body], i) => (
          <div key={i} style={{ border: "1px solid var(--rule)", borderTop: `3px solid ${c}`, borderRadius: "0 0 6px 6px", background: "var(--bg-elev)", padding: "10px 12px" }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: c, marginBottom: 4 }}>{t}</div>
            <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>{body}</div>
          </div>
        ))}
      </div>
      <Box kind="mistake" label="②には条件がつく — 電圧変動率は %Z だけでは決まらない">
        <p style={{ margin: 0 }}>電圧変動率は <Eq tex="\varepsilon \approx p\cos\theta \pm q\sin\theta" /> で、<strong>抵抗分 <Eq tex="p" />・リアクタンス分 <Eq tex="q" />・負荷力率</strong>の3つに依存する。<span className="marker">%Z が同じでも、<Eq tex="p" /> と <Eq tex="q" /> の内訳や力率が違えば <Eq tex="\varepsilon" /> は変わる</span>し、進み力率なら負にもなる。「%Z が小さい ＝ 電圧変動率も必ず小さい」と短絡させないこと。</p>
      </Box>

      <Fold label="実務補足 — 実系統の短絡電流はこの式では出ない" sub="試験の主線ではない（開く）">
        <p>変圧器単体の %Z だけで求めた短絡電流は、電源を無限大母線とみなした<strong>上限側の概算</strong>。実際の系統計算では、共通の基準容量に換算したうえで次をすべて合成する。</p>
        <ul>
          <li>電源側（上位系統）のインピーダンス</li>
          <li>発電機のインピーダンス（過渡・次過渡で値が違う）</li>
          <li>ケーブル・架空線のインピーダンス</li>
          <li>母線・変流器などの機器インピーダンス</li>
          <li>変圧器が複数ある場合はその合成、および系統構成（母線連絡の開閉状態）</li>
        </ul>
        <p style={{ margin: "8px 0 0" }}>合成インピーダンスは必ず変圧器単独より大きくなるので、<strong>実際の短絡電流は簡易式の値より小さくなる</strong>。遮断器の選定では簡易式で安全側に見積もったうえで、詳細計算で確認する。</p>
      </Fold>

      <SectionCheck pageId="transformer" sectionId="pz" />

      <h2 id="parallel"><span className="h-num">10.</span>並行運転</h2>
      <p><strong>何を求めるか</strong>：2台以上の変圧器を並列につないだとき、それぞれが何 kV·A を負担するか。</p>

      <h3 id="parallel-cond">並行運転の条件</h3>
      <p style={{ marginBottom: 6 }}><strong>必須条件（満たさないと循環電流・短絡が起き、運転そのものが成立しない）</strong></p>
      <ol style={{ marginTop: 0 }}>
        <li><strong>変圧比（巻数比）が等しい</strong> — 違うと無負荷でも巻線間に循環電流が流れる</li>
        <li><strong>極性が等しい</strong> — 違うと短絡と同じ状態になる（最も危険）</li>
        <li><strong>三相では相順および位相変位（角変位）が等しい</strong> — Y-Y と Y-Δ のように角変位が 30° 違う組は並行運転できない</li>
      </ol>
      <p style={{ margin: "10px 0 6px" }}><strong>分担を適正にする条件（満たさなくても運転はできるが、負担が偏って設備を使い切れない）</strong></p>
      <ul style={{ marginTop: 0 }}>
        <li><strong>%Z（自己容量基準）が等しい</strong> — 等しいと負担が<strong>定格容量に比例</strong>する。違っても運転自体はできるが、%Z の小さい器に負担が偏る（次項の一般式）。<span className="marker">ただし「並行運転の条件」を列挙させる設問では %Z 一致も条件に数えるのが通例</span>なので、条件を問われたら落とさないこと</li>
        <li><strong>抵抗分とリアクタンス分の比（X/R 比＝インピーダンス角）が等しい</strong> — 大きく異なると、分担電流に位相差が生じる。各器の電流の<strong>ベクトル和</strong>が負荷電流なので、位相がずれると合計の皮相電力が各器の和より小さくなり、設備を使い切れない</li>
      </ul>
      <p style={{ margin: "8px 0 0", fontSize: "13px", color: "var(--ink-soft)" }}>※ この 2 層の区別（変圧比 → 無負荷の循環電流／%Z → 負荷時の分担の偏り／X/R → 分担電流の位相差）は、<strong>破ったときに起きる現象が層ごとに違う</strong>という意味であって、条件リストから %Z を外してよいという意味ではない。</p>

      <h3 id="parallel-share">負荷分担 — 「%Z の逆比」だけを覚えてはいけない</h3>
      <p>並列なので<strong>両器にかかる電圧降下は共通</strong>。よって電流は実インピーダンスの逆比で分かれる。これを各器の自己容量基準の %Z で書き直すと、次の一般式になる。</p>
      <FormulaCard num="15 / 15" name="並行運転の負担配分（一般式）" eq="S_A : S_B = \dfrac{S_{NA}}{z_A} : \dfrac{S_{NB}}{z_B}"
        note={<><Eq tex="S_A,S_B" />: 各器の負担容量 [kV·A]、<Eq tex="S_{NA},S_{NB}" />: 各器の定格容量 [kV·A]、<Eq tex="z_A,z_B" />: 各器の %Z [%]（<strong>それぞれ自分の定格容量を基準にした値</strong>）。</>} />
      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">条件</th><th scope="col">一般式の帰結</th><th scope="col">覚え方</th></tr></thead>
        <tbody>
          <tr><td><strong>定格容量が同じ</strong>（<Eq tex="S_{NA}=S_{NB}" />）</td><td><Eq tex="S_A : S_B = 1/z_A : 1/z_B" /></td><td>負担は <strong>%Z に反比例</strong></td></tr>
          <tr><td><strong>%Z が同じ</strong>（<Eq tex="z_A=z_B" />）</td><td><Eq tex="S_A : S_B = S_{NA} : S_{NB}" /></td><td>負担は <strong>定格容量に比例</strong></td></tr>
          <tr><td><strong>両方とも違う</strong></td><td colSpan="2"><span className="marker">一般式 <Eq tex="S_{NA}/z_A : S_{NB}/z_B" /> で計算するしかない</span></td></tr>
        </tbody>
      </table></div>

      <figure style={{ margin: "10px 0 14px", background: "var(--bg-elev)", borderRadius: "8px", padding: "12px 8px 8px" }}>

      <Box kind="mistake" label="「%Z に反比例」だけを暗記した人が落ちる穴">
        <p><strong>問:</strong> A（100 kV·A・%Z = 4 %）と B（300 kV·A・%Z = 6 %）を並行運転し、合計 300 kV·A の負荷を供給する。各器の負担は？</p>
        <p style={{ marginBottom: 4 }}><strong>正しい計算（一般式）</strong></p>
        <Eq display tex="S_A : S_B = \frac{100}{4} : \frac{300}{6} = 25 : 50 = 1 : 2" />
        <p><Eq tex="S_A = 300\times\frac{1}{3} = 100" /> kV·A（負荷率 100 %）、<Eq tex="S_B = 300\times\frac{2}{3} = 200" /> kV·A（負荷率 67 %）。どちらも定格以内。</p>
        <p style={{ margin: "10px 0 4px" }}><strong>誤り（%Z の逆比だけを使った場合）</strong></p>
        <Eq display tex="S_A : S_B = \frac{1}{4} : \frac{1}{6} = 3 : 2 \;\Rightarrow\; S_A = 180,\; S_B = 120" />
        <p style={{ margin: 0 }}>A の負担が 180 kV·A＝<span className="marker">定格 100 kV·A に対して 180 % の過負荷</span>という、現実には焼損する答えになる。<strong>容量が違う組み合わせで「%Z の逆比」を使ってはいけない</strong>。</p>
      </Box>

      <Box kind="example" label="3ケースを同じ式で解く（数値で確認）">
        <p>いずれも一般式 <Eq tex="S_A : S_B = S_{NA}/z_A : S_{NB}/z_B" /> に入れるだけ。<strong>覚える式は1つでよい</strong>。</p>
        <p style={{ marginBottom: 4 }}><strong>例1　定格容量が同じ</strong>（A: 500 kV·A・5 %／B: 500 kV·A・10 %）</p>
        <Eq display tex="S_A : S_B = \frac{500}{5} : \frac{500}{10} = 100 : 50 = 2 : 1" />
        <p>容量が同じなので <strong>%Z の逆比</strong>になる。%Z が小さい A が2倍負担する。</p>

        <p style={{ marginBottom: 4, marginTop: 10 }}><strong>例2　%Z が同じ</strong>（A: 500 kV·A・5 %／B: 1000 kV·A・5 %）</p>
        <Eq display tex="S_A : S_B = \frac{500}{5} : \frac{1000}{5} = 100 : 200 = 1 : 2" />
        <p>%Z が同じなので <strong>定格容量の比</strong>になる。両器とも同じ負荷率になり、設備を無駄なく使える。</p>

        <p style={{ marginBottom: 4, marginTop: 10 }}><strong>例3　容量も %Z も違う</strong>（A: 500 kV·A・5 %／B: 1000 kV·A・10 %）</p>
        <Eq display tex="S_A : S_B = \frac{500}{5} : \frac{1000}{10} = 100 : 100 = 1 : 1" />
        <p style={{ margin: 0 }}><span className="marker">容量が2倍でも %Z が2倍なら、負担容量は同じ</span>になる。ここで「%Z の逆比」だけを使うと <Eq tex="1/5 : 1/10 = 2:1" /> となり、<strong>A が2倍負担するという逆の答え</strong>が出てしまう。容量と %Z の<strong>両方</strong>を見ること。</p>
      </Box>

      <Box kind="example" label="確認 — 2つの特別な場合">
        <p><strong>(1) 同容量・%Z 違い:</strong> A（100 kV·A・4 %）、B（100 kV·A・5 %）、負荷 90 kV·A。</p>
        <Eq display tex="S_A : S_B = \frac{100}{4} : \frac{100}{5} = 25 : 20 = 5 : 4 \;\Rightarrow\; S_A = 50,\; S_B = 40\;[\mathrm{kV\cdot A}]" />
        <p><span className="marker">%Z が小さい A の方が多く負担する</span>（インピーダンスが小さい＝電流が流れやすい）。</p>
        <p style={{ marginTop: 10 }}><strong>(2) 同 %Z・容量違い:</strong> A（200 kV·A・5 %）、B（100 kV·A・5 %）、負荷 150 kV·A。</p>
        <Eq display tex="S_A : S_B = \frac{200}{5} : \frac{100}{5} = 2 : 1 \;\Rightarrow\; S_A = 100,\; S_B = 50\;[\mathrm{kV\cdot A}]" />
        <p style={{ margin: 0 }}>容量比 2:1 そのままで分担し、<strong>両器とも負荷率 50 %</strong> でそろう。これが「%Z をそろえる」ことの実利。</p>
      </Box>

      <SectionCheck pageId="transformer" sectionId="parallel" />

      <h2 id="vconn"><span className="h-num">11.</span>V結線・単巻変圧器（頻出小論点）</h2>
      <ul>
        <li><strong>V結線</strong> — 単相変圧器2台で三相を供給。出力容量は <Eq tex="\sqrt{3}\,S_1" />（<Eq tex="S_1" />: 1台の定格容量 [V·A]）。2台合計 <Eq tex="2S_1" /> に対する<span className="marker">利用率は √3/2 ≈ 86.6%</span>、Δ結線（3台）に対する出力比は <Eq tex="1/\sqrt{3} \approx 57.7\%" />。<strong>単相3台のΔ-Δで1台が故障した場合の応急運転</strong>は次のセクション12で詳説。</li>
        <li><strong>単巻変圧器</strong> — 一次・二次が巻線を共用（分路巻線＋直列巻線）。<span className="marker">自己容量（等価容量）＝ 負荷容量 × (V_h − V_l)/V_h</span> で、変圧比が1に近いほど小さな自己容量で大きな負荷容量を扱える（小型・高効率。ただし一次二次が絶縁されない）。</li>
      </ul>

      <h2 id="v-fault"><span className="h-num">12.</span>単相3台のΔ-Δで1台故障 → V結線運転</h2>
      <Box kind="tip" label="まず覚える結論（3つ）">
        <ul style={{ margin: 0, paddingLeft: 22 }}>
          <li><strong>三相供給は続けられる</strong>。線間電圧は3つとも得られる（これがΔ-Δ結線の代表的な利点）。</li>
          <li><strong>供給できる最大の三相皮相電力（バンク容量 [kV·A]）</strong>が故障前の <span className="marker">1/√3 ≈ 57.7%</span> に制限される（<Eq tex="\sqrt{3}S_n \div 3S_n" />）。制限しているのは巻線電流なので、kW ではなく kV·A で効く。故障前の負荷皮相電力がバンク定格の 57.7% 以下なら落とす必要はない。</li>
          <li>残った2台の合計容量に対する<span className="marker">利用率は √3/2 ≈ 86.6%</span>。<strong>57.7% と 86.6% は分母が違うだけ</strong>（Δ3台基準か、残り2台基準か）。</li>
        </ul>
        <p style={{ margin: "8px 0 0", fontSize: 13 }}>成立条件は <strong>同一定格2台・平衡三相負荷・正しい極性と相順</strong>。不平衡負荷では各器の巻線電流を個別に確認する。</p>
      </Box>

      <h3 id="v-denominator">57.7 % と 86.6 % — 分子は同じ、違うのは分母だけ</h3>
      <p>2つの割合は<strong>まったく同じ出力 <Eq tex="\sqrt3\,VI" /> を、違うものと比べている</strong>だけ。取り違えの原因は分母なので、並べて確認する。</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 12, margin: "10px 0 14px" }}>
        <div style={{ border: "1px solid var(--rule)", borderTop: "3px solid var(--warn)", borderRadius: "0 0 8px 8px", background: "var(--bg-elev)", padding: "12px 14px" }}>
          <div style={{ fontSize: 26, fontWeight: 700, color: "var(--warn)", lineHeight: 1.2 }}>57.7 %</div>
          <Eq display tex="\frac{\sqrt3\,VI}{3VI} = \frac{1}{\sqrt3} \approx 0.577" />
          <div style={{ fontSize: 15, fontWeight: 700, color: "var(--ink)", marginTop: 6 }}>分母＝正常なΔ結線<strong>3台</strong>の合計容量</div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 4 }}>「故障前と比べて何 % 供給できるか」。<strong>故障前のバンク定格が基準</strong>。</div>
        </div>
        <div style={{ border: "1px solid var(--rule)", borderTop: "3px solid var(--accent)", borderRadius: "0 0 8px 8px", background: "var(--bg-elev)", padding: "12px 14px" }}>
          <div style={{ fontSize: 26, fontWeight: 700, color: "var(--accent-ink)", lineHeight: 1.2 }}>86.6 %</div>
          <Eq display tex="\frac{\sqrt3\,VI}{2VI} = \frac{\sqrt3}{2} \approx 0.866" />
          <div style={{ fontSize: 15, fontWeight: 700, color: "var(--ink)", marginTop: 6 }}>分母＝いま使っている<strong>2台</strong>の定格容量合計</div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 4 }}>「残った設備をどれだけ使い切れているか」＝<strong>利用率</strong>。</div>
        </div>
      </div>
      <Box kind="mistake" label="なぜ 2 台なのに 100 % 取り出せないのか">
        <p style={{ margin: 0 }}>2台の定格容量の合計は <Eq tex="2VI" /> なのに、三相として取り出せるのは <Eq tex="\sqrt3\,VI" /> しかない。理由は<strong>1台ずつの中で、巻線電圧と巻線電流の位相が 30° ずれる</strong>ことにある。V結線では各器の巻線電圧が線間電圧そのもの・巻線電流が線電流そのものになるが、この2つは同相にならず、<span className="marker">負荷力率が 1 でも 30° ずれる</span>。だから各器が送れる有効電力は <Eq tex="VI\cos(30^\circ \mp \theta)" /> にとどまり、力率1でも1台あたり <Eq tex="VI\cos 30^\circ = 0.866\,VI" />。2台合計で <Eq tex="2VI\cos 30^\circ = \sqrt3\,VI" />（一般には <Eq tex="\sqrt3\,VI\cos\theta" />）。この <Eq tex="\cos 30^\circ = 0.866" /> が目減り分であり、これが利用率 86.6 % の正体である（各器の分担は下の「2台の負担」で詳述）。</p>
      </Box>

      <Fold label="なぜ 57.7% なのか（√3 の出どころ）" sub="導出を開く">
        <p><strong>Δ-Δ（故障前）</strong>：各変圧器は線間電圧 <Eq tex="V_L" /> を受け、巻線電流は相電流 <Eq tex="I_p = I_L/\sqrt{3}" />。1台の定格を <Eq tex="S_n = V_L I_p" /> とすれば</p>
        <Eq display tex="S_\Delta = 3 S_n = 3 V_L \dfrac{I_L}{\sqrt{3}} = \sqrt{3}\,V_L I_L" />
        <p><strong>V-V（故障後）</strong>：巻線が2辺しかないので、<span className="marker">巻線電流は線電流そのもの</span>（<Eq tex="1/\sqrt{3}" /> に分かれる相手がいない）。定格電流 <Eq tex="I_n" /> を超えられないので <Eq tex="I_L \le I_n" />、したがって</p>
        <Eq display tex="S_V = \sqrt{3}\,V_L I_L \le \sqrt{3}\,V_L I_n = \sqrt{3}\,S_n" />
        <p>よって <Eq tex="\dfrac{S_V}{S_\Delta} = \dfrac{\sqrt{3}S_n}{3S_n} = \dfrac{1}{\sqrt{3}} \approx 0.577" />、<Eq tex="\dfrac{S_V}{2S_n} = \dfrac{\sqrt{3}}{2} \approx 0.866" />。<strong>台数が 3→2 に減ったから 2/3 になる、ではない</strong>のが要点。</p>
      </Fold>

      <Fold label="2台の負担 — kV·A は等しいが、有効電力は偏る" sub="差がつく論点">
        <p><strong>2台の皮相電力と巻線電流は等しい</strong>：どちらも線間電圧 <Eq tex="V_L" /> を受け線電流 <Eq tex="I_L" /> を流すので <Eq tex="V_L I_L" /> で同じ。したがって<span className="marker">同一仕様の器なら銅損（<Eq tex="I^2R" />）もほぼ等しく、発熱・温度上昇に大きな差はつかない</span>（厳密には巻線抵抗の器差・励磁電流・冷却条件があるので完全一致ではない）。</p>
        <p>異なるのは<strong>個別の力率と有効・無効電力の分担</strong>。負荷力率角 <Eq tex="\theta" />（遅れ）のとき、各器の<strong>有効電力係数</strong> <Eq tex="P_i/(V_L I_L)" /> は <Eq tex="\cos(30^\circ-\theta)" /> と <Eq tex="\cos(30^\circ+\theta)" /> に分かれる（力率の大きさはこの絶対値。進み・遅れと電力の向きは別に判定する）。無効電力側は <Eq tex="Q_i = V_L I_L \sin(\theta \mp 30^\circ)" /> で同様に偏る。</p>
        <ul>
          <li><Eq tex="\cos\theta = 1" />（<Eq tex="\theta=0" />）→ 大きさは2台とも <Eq tex="\cos 30^\circ = 0.866" />（一方が遅れ・他方が進みで、無効電力は互いに打ち消し合う）。<strong>有効電力の分担が等しくなるのはこの場合だけ</strong></li>
          <li><Eq tex="\cos\theta = 0.866" />（<Eq tex="\theta=30^\circ" />）→ 一方は 1.0、他方は 0.5</li>
          <li><Eq tex="\theta > 60^\circ" />（遅れ力率 0.5 未満）→ <Eq tex="\cos(30^\circ+\theta) < 0" /> となり、理想変圧器で考えると一方の有効電力の向きが逆になる（このとき他方が負荷合計より大きい有効電力を送り、その差分が逆向きの器を通って戻る。<strong>負荷全体が発電に転じるわけではなく、合計は変わらない</strong>）</li>
        </ul>
        <p>合計は <Eq tex="V_L I_L\{\cos(30^\circ-\theta)+\cos(30^\circ+\theta)\} = \sqrt{3}\,V_L I_L\cos\theta" /> で三相出力に一致する。<strong>どちらの器がどちらの力率になるかは相順・残存した2辺・電流の向きの取り方で入れ替わる</strong>ので、結線図を見ずに決めつけない。</p>
      </Fold>

      <h3 id="v-fault-trap">正誤判定の急所（V結線）</h3>
      <div className="table-wrap"><table className="data-table">
        <thead><tr><th scope="col">命題</th><th scope="col">判定</th><th scope="col">理由</th></tr></thead>
        <tbody>
          <tr><td>1台故障後の出力は故障前の 2/3（66.7%）になる</td><td><strong>誤</strong></td><td>台数比ではなく <Eq tex="1/\sqrt{3}=57.7\%" />。巻線電流が √3 倍になるのが効く</td></tr>
          <tr><td>V結線の利用率は 57.7% である</td><td><strong>誤</strong></td><td>利用率（残り2台基準）は 86.6%。57.7% はΔ3台基準の出力比</td></tr>
          <tr><td>V結線では線間電圧が2つしか得られない</td><td><strong>誤</strong></td><td>3つとも得られる。第3の電圧は <Eq tex="\dot V_{ab}+\dot V_{bc}+\dot V_{ca}=0" /> の関係で定まる（大きさは実負荷時に多少不平衡）</td></tr>
          <tr><td>平衡負荷なら2台の<strong>有効電力</strong>分担は常に等しい</td><td><strong>誤</strong></td><td>皮相電力と巻線電流は常に等しく損失もほぼ等しいが、有効分担は力率 <Eq tex="\cos(30^\circ\mp\theta)" /> で偏る（等しいのは力率1のときだけ）</td></tr>
          <tr><td>Y-Y結線も1台を切り離すだけでV運転に移行できる</td><td><strong>誤</strong></td><td>①Y のまま1台外しても残り2台は開放Δにならない ②Y巻線は <Eq tex="V_L/\sqrt{3}" /> 定格なので、そのままΔの2辺に組み替えると √3 倍の過励磁。同じ結線のまま継続できるのはΔ-Δの利点</td></tr>
          <tr><td>V結線でも三相の中性点が取れる</td><td><strong>誤</strong></td><td>Δ-Δと同じく固有の三相中性点なし。中性点が要るなら接地変圧器等を別設する</td></tr>
          <tr><td>V結線の三相出力は <Eq tex="\sqrt{3}\,S_n" /> である</td><td><strong>正</strong></td><td>定義どおり（<Eq tex="S_n" />: 単器の定格容量）</td></tr>
        </tbody>
      </table></div>

      <Fold label="例題 — 50 kV·A ×3台のΔ-Δで1台故障" sub="最大三相容量・故障前比・利用率は？（解答を開く）">
        <p><strong>問:</strong> 定格容量 50 kV·A の単相変圧器3台をΔ-Δ結線し、150 kV·A の三相負荷に供給していた。1台が故障し残り2台をV結線とする。(1) 供給できる最大三相容量 (2) 故障前に対する割合 (3) 利用率を求めよ。</p>
        <p>(1) <Eq tex="S_V = \sqrt{3}\times 50 \approx 86.6\;[\mathrm{kV\cdot A}]" /></p>
        <p>(2) <Eq tex="86.6/150 = 0.577 \to 57.7\%" /> ／ (3) <Eq tex="86.6/(2\times 50) = 0.866 \to 86.6\%" /></p>
        <p><strong>実務的な意味:</strong> 150 kV·A の負荷をそのまま載せると2台が過負荷になる。<span className="marker">負荷を 86.6 kV·A 以下に制限</span>して初めて継続運転できる（＝<strong>故障前のバンク定格 150 kV·A に対する実負荷率</strong>が 57.7% 以下なら、負荷を切らずに移行できる）。</p>
      </Fold>

      <Fold label="発展 — 200 kW・力率0.8 をV結線で供給するには" sub="必要容量と有効・無効の分担（解答を開く）">
        <p><strong>問:</strong> 三相平衡負荷 200 kW・力率 0.8（遅れ）をV結線で供給する。単相変圧器1台に必要な容量と、各変圧器の有効電力分担を求めよ。</p>
        <p>三相皮相電力 <Eq tex="S = 200/0.8 = 250\;[\mathrm{kV\cdot A}]" />、1台あたり <Eq tex="S_n \ge 250/\sqrt{3} \approx 144.3\;[\mathrm{kV\cdot A}]" /></p>
        <p><Eq tex="\theta = \cos^{-1}0.8 = 36.87^\circ" /> なので各器の力率は <Eq tex="\cos(30^\circ-36.87^\circ)=0.993" />、<Eq tex="\cos(30^\circ+36.87^\circ)=0.393" />。</p>
        <p>有効分担は <Eq tex="144.3\times 0.993 \approx 143\;[\mathrm{kW}]" /> と <Eq tex="144.3\times 0.393 \approx 57\;[\mathrm{kW}]" />（合計 200 kW で検算 ✓。<strong>ただし合計は 250 × cos θ で決まるため、どちらの器が力率 0.993 側かの取り違えは合計では捕まらない</strong>）。無効分担も <Eq tex="144.3\sin 6.87^\circ \approx 17\;[\mathrm{kvar}]" /> と <Eq tex="144.3\sin 66.87^\circ \approx 133\;[\mathrm{kvar}]" />（合計 150 kvar ＝ <Eq tex="200\tan 36.87^\circ" /> ✓）で大きく偏る。<strong>皮相電力はどちらも 144.3 kV·A で等しく、違うのは有効・無効電力の分担</strong>。ここは三種の必須線より一段深い論点なので、まず 57.7% / 86.6% / <Eq tex="\sqrt{3}S_n" /> と分母の区別を固めてから取り組めばよい。</p>
      </Fold>

      <Fold label="V結線の副作用（論説で問われる）" sub="第3高調波・電圧不平衡・常用との違い">
        <ul>
          <li><strong>Δの閉ループが消える</strong> → 第3高調波（triplen）励磁電流をΔ内に循環させておけなくなる。その結果がどこに現れるか（線電流・電圧波形）は電源インピーダンス・鉄心構造・接地条件によるが、<strong>Δ-Δの長所を1つ失う</strong>のは確か。</li>
          <li><strong>実負荷時に端子電圧が不平衡になり得る</strong> → 2台の漏れインピーダンスによる電圧降下が3つの線間電圧に同じ形では現れないため。平衡電源・同一変比の理想無負荷なら不平衡は生じない（実器では無負荷でも変比差・励磁特性差で微小な不平衡は残り得る）。程度は %Z・X/R・負荷力率・電源の強さ次第で、一般にΔ-Δより不利。</li>
          <li><strong>故障退避としてのV-V運転は暫定運用</strong> → 出力制限のうえで使い、復旧後は3台のΔ-Δに戻すのが原則。</li>
        </ul>
        <p style={{ margin: "8px 0 0" }}>一方、<strong>V結線そのものは常用される結線</strong>でもある。需要が小さいうちは2台で供給し、増えたら3台目を足してΔ-Δにする段階増設や、柱上の灯動共用（異容量V結線）がその例。「故障時の応急」と「計画的な常用」は別物として区別する。</p>
      </Fold>

      <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "10px 0 0" }}>
        ▶ 結線方式そのものの比較（Y-Y / Δ-Δ / Y-Δ / Δ-Y の位相変位・第3高調波・用途）は <a href="https://kfurufuru.github.io/secretary-portal-public/denken3-denryoku-wiki.html#henatsuki" target="_blank" rel="noopener">電力Wiki「2.1 変圧器（基礎ハブ）」の三相結線とV結線</a>へ。
      </p>

      <h2 id="quick-review"><span className="h-num">14.</span>1分復習（即答チェック）</h2>
      <div className="box">
        <details><summary>巻数比 a と電圧・電流の関係は？</summary>a = N₁/N₂ = V₁/V₂ = I₂/I₁（電流は巻数比の逆比）</details>
        <details><summary>%Z = 5% のとき短絡電流は定格の何倍？</summary>20倍（I_s = (100/%Z)·I_n）</details>
        <details><summary>短絡試験で Ze・Re・Xe を出す順番と式は？</summary>①Ze = Vs/Is（<strong>斜辺</strong>）→ ②Re = Ps/Is²（電力計 ≒ 銅損・<strong>電流基準</strong>）→ ③Xe = √(Ze²−Re²)（<strong>直角合成</strong>）。②で Ps/Vs² としない、③で Ze−Re としないの2点が失点源</details>
        <details><summary>短絡試験の測定値だけで検算するには？</summary>cosθ = Ps/(VsIs) を出し、Re = Ze·cosθ、Xe = Ze·sinθ で再計算する。三平方とは<strong>別の計算経路</strong>なので途中の算術ミスを拾える。ただし2経路は代数的には同じ式（Ze·cosθ ≡ Ps/Is²）なので、<strong>立式そのものの誤りは拾えない</strong></details>
        <details><summary>短絡試験の与件に定格が無いとき、何が求められて何が求められない？</summary>求められる＝Ze・Re・Xe（測定値だけで出る）／<strong>求められない</strong>＝%Z・電圧変動率・短絡電流（定格電圧 Vn または定格容量 SN が要る）。「定格電流を流した」だけでは Vn は確定しない</details>
        <details><summary>変圧器の最高効率の条件は？</summary>鉄損 = 銅損（P_i = x²P_cN）。そのときの負荷率 x = √(P_i / P_cN)。分母は全負荷銅損であって、そのときの実銅損ではない</details>
        <details><summary>通常効率と全日効率は何が違う？</summary>通常効率＝ある運転点を <strong>kW の比</strong>で評価（η = Pout /(Pout+Pi+x²PcN)）／全日効率＝1日全体を <strong>kWh の比</strong>で評価（ηd = Wout /(Wout+Wi+Wc)）。効率自体はどちらも無次元で [%] 表示。<strong>主に重視される用途</strong>が通常効率＝電力用変圧器、全日効率＝負荷変動の大きい配電用変圧器（同じ1台について両方を評価でき、対象機器が排他的に分かれるわけではない）</details>
        <details><summary>全日効率は kW と kWh のどちらで計算する？</summary><strong>kWh（電力量）</strong>。出力・鉄損・銅損をそれぞれ電力量に直してから分母に入れる。通常効率を求めてから時間を掛けても全日効率にはならない（鉄損と銅損では掛ける時間が違うため）</details>
        <details><summary>出力電力量の式は？</summary>Wout = Σ Sk·cosφk·tk [kWh]。kV·A は皮相電力なので、有効電力量にするには<strong>力率を掛ける</strong>。無負荷の時間帯は出力ゼロなので足さない</details>
        <details><summary>鉄損電力量の式は？</summary>Wi = Pi × Ton [kWh]。Ton は<strong>電圧が加わっている時間</strong>。24時間通電のときだけ Pi×24 で、「12時間だけ電源に接続」ならその通電時間を使う</details>
        <details><summary>銅損電力量の式は？</summary>Wc = PcN × Σ xk²·tk [kWh]（xk = Sk/SN）。各時間帯ごとに<strong>2乗してから足す</strong>。全負荷銅損 PcN をそのまま使うのではない</details>
        <details><summary>50% 負荷のとき銅損は全負荷銅損の何%？</summary><strong>25%</strong>（x² = 0.5² = 0.25）。半分ではない。銅損は I²R で、電圧一定なら I は kV·A に比例するので負荷率の2乗で効く</details>
        <details><summary>出力の計算には力率を使うのに、負荷率には原則使わないのはなぜ？</summary>出力は<strong>有効電力</strong>なので kV·A に力率を掛ける。一方、銅損を決めるのは<strong>巻線電流</strong>で、負荷率の本質は x = I/IN。三相では I = S/(√3V) なので、電圧一定なら電流は kV·A に比例し x = S/SN（kV·A どうしの比）で取れる。力率を掛けると低力率の時間帯の銅損を過小評価する。合言葉は「力率は出力 kWh に、kV·A 負荷率は銅損に」</details>
        <details><summary>負荷が「40 kW・力率0.8」と kW で与えられたら負荷率は？（定格 100 kV·A）</summary><strong>x = 0.5</strong>。負荷率は皮相電力の比なので、まず S = P/cosφ = 40/0.8 = <strong>50 kV·A</strong> に換算してから x = 50/100 = 0.5。<span className="marker">40/100 = 0.4 としない</span>。「力率を掛けない」のは負荷が kV·A で与えられたときの話で、kW 与件では力率で<strong>割って</strong> kV·A に直す</details>
        <details><summary>無負荷通電中（電源は入・負荷ゼロ）に発生する損失は？</summary><strong>鉄損だけ</strong>。銅損は三種の計算ではほぼ 0 として扱う（励磁電流によるわずかな銅損は無視する前提）</details>
        <details><summary>電源切離し中（開放）に発生する損失は？</summary><strong>鉄損も銅損も発生しない</strong>。「無負荷」と「電源切離し」を混同すると、鉄損電力量の通電時間を取り違える</details>
        <details><summary>全日効率の計算順序（5ステップ）は？</summary>①各時間帯の出力電力量 Sk·cosφk·tk → ②合計して Wout → ③鉄損電力量 Wi = Pi·Ton → ④銅損電力量 Wc = PcN·Σxk²tk → ⑤ηd = Wout/(Wout+Wi+Wc)×100。最後に 0〜100% に収まるか検算する</details>
        <details><summary>電圧変動率の簡易式は？</summary>ε ≈ p·cosθ + q·sinθ（遅れ力率では sinθ が正）</details>
        <details><summary>V結線の出力と利用率は？</summary>出力 = √3 × 単器容量。利用率 √3/2 ≈ 86.6%（Δ結線3台比の出力は 57.7%）</details>
        <details><summary>Δ-Δ の1台が故障したら出力は何%になる？</summary>1/√3 ≈ 57.7%（2/3 = 66.7% ではない）。巻線電流が線電流そのものになり √3 倍の負担になるため</details>
        <details><summary>V結線で線間電圧が3つとも得られるのはなぜ？</summary>3つの線間電圧の和はゼロ（V̇ab+V̇bc+V̇ca=0）なので、2つを2台で作れば残り1つは V̇bc=−(V̇ab+V̇ca) として定まる（実負荷では電圧降下の分だけ不平衡が出る）</details>

        <p>整流回路がAC→DCを実現できるのは、ダイオードの<strong>一方向性（順方向で導通・逆方向で阻止）</strong>を利用しているから。この一方向性は、理論で学ぶ<strong>PN接合の電位障壁</strong>に由来する。P形とN形を接合すると接合部にキャリアの拡散で<strong>空乏層</strong>ができ、内部に電位障壁（拡散電位）が立つ。順方向（PにプラスNにマイナス）に電圧を加えると障壁が下がってキャリアが流れ込み導通し、逆方向では障壁がさらに高くなって電流をほぼ通さない。これが<strong>整流作用</strong>の正体。</p>
        <p>導通時もダイオードは抵抗ゼロではなく、障壁を越えるぶんの<strong>順方向電圧降下</strong> <Eq tex="V_F" />（シリコンで約0.6〜0.7 V）が残る。単相全波整流の平均値 <Eq tex="V_d = \dfrac{2\sqrt{2}}{\pi}V \approx 0.900\,V" /> はダイオードを理想（<Eq tex="V_F=0" />）とした値。<strong>ブリッジ整流では各半周期にダイオードが2個直列で導通する</strong>ので、実機の出力は約 <Eq tex="2V_F" /> ぶん下がる（センタータップ形なら1個ぶん）。<strong>「制御不可＝ゲートがなく順方向で必ず導通する」</strong>というダイオードの性質も、外部信号ではなく接合の物理だけでオン・オフが決まることを意味する。</p>
        <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#semiconductor" target="_blank" rel="noopener">→ 理論Wiki「半導体・ダイオード」でPN接合の電位障壁と順方向電圧降下を深掘り</a></p>
      </Box>

      <h2 id="phys"><span className="h-num">1.</span>すべての変圧器に共通の物理（3点）</h2>

      <h3>1-1. 磁気平衡：N₁I₁ ≈ N₂I₂</h3>
      <p>変圧器は2つの巻線が共通の鉄心を共有する構造。一次に電流 <Eq tex="I_1" /> が流れると鉄心には <span className="marker">起磁力 <Eq tex="N_1 I_1" /></span>（アンペアターン）が発生し、磁束 <Eq tex="\Phi" /> をつくる。二次に電流 <Eq tex="I_2" /> が流れると、レンツの法則により <strong>一次の磁束を打ち消す向き</strong> に二次起磁力 <Eq tex="N_2 I_2" /> が立つ。</p>
      <p>結果として、定常状態では両者がほぼ釣り合う：</p>
      <Eq display tex="N_1 I_1 \;\approx\; N_2 I_2" />
      <p>厳密には <Eq tex="N_1 I_1 - N_2 I_2 = N_1 I_\text{励磁}" /> で、釣り合いの差分が <strong>励磁電流</strong>（鉄心に磁束を作るために必要な分・通常は定格の数%程度）。<strong>磁気平衡の式は「励磁電流が小さいときに成り立つ近似」</strong>であることを覚えておくと、セクション3でCT開放時に何が起きるかが見える。</p>

      <h3>1-2. 鉄心は B_s で飽和する</h3>
      <p>鉄心の磁束密度 <Eq tex="B" /> は、内部の磁界 <Eq tex="H" /> に比例して増える…が、ある値 <Eq tex="B_s" />（<strong>飽和磁束密度</strong>・珪素鋼板で約2.0 T。実用の設計磁束密度は余裕をみた1.5〜1.7 T程度）で頭打ちになる。これが <strong>磁気飽和</strong>。</p>
      <BHCurveSVG />
      <p>図のように、B-H曲線は <strong>直線域 → ニー（屈曲点） → 飽和域</strong> の3区間に分かれる。直線域では透磁率 <Eq tex="\mu_r" /> が数千と大きく、わずかな H で B が大きく増える。飽和域では <Eq tex="dB/dH" /> が真空の値（μ₀）近くまで激減し、いくら H を増やしても B はほとんど増えない。</p>
      <p>変圧器は通常、<strong>B-H 直線域の中ほど</strong> で動作するよう設計される（鉄心断面積と巻数で <Eq tex="B" /> を決め打ちする）。ここまでは「通常運用」。<strong>飽和域に突入したら何が起きるか</strong>はセクション3で見る（CT開放時の事故の核心）。</p>

      <h3>1-3. 二次誘起電圧は dΦ/dt に比例</h3>
      <p>ファラデーの法則により、鉄心を貫く磁束 <Eq tex="\Phi" /> が時間変化すると、巻線に誘導起電力が発生する：</p>
      <Eq display tex="V_2 \;=\; -N_2 \dfrac{d\Phi}{dt}" />
      <p>ここで重要なのは、<strong>二次電圧は「磁束そのもの」ではなく「磁束の変化率」に比例する</strong>こと。<Eq tex="\Phi" /> が正弦波なら <Eq tex="d\Phi/dt" /> も正弦波だが、<strong>波形が歪むと dΦ/dt は頂点付近で巨大化する</strong>。これがセクション3のスパイク電圧の物理的源泉。</p>

      <Box kind="formula" label="セクション1 まとめ（CT・VT共通）">
        <p>① 磁気平衡 <Eq tex="N_1 I_1 \approx N_2 I_2" />（励磁電流を無視した近似）<br/>
        ② 鉄心は <Eq tex="B_s" /> で飽和する（B-H 曲線）<br/>
        ③ 二次電圧 <Eq tex="V_2 = -N_2 (d\Phi/dt)" />（磁束変化率に比例）</p>
        <p>この3点は CT も VT も同じ。違いは「一次側から何を強制するか」だけ。</p>
      </Box>
