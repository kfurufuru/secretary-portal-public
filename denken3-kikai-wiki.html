      <h2 id="vt"><span className="h-num">2.</span>VT：一次側から「電圧」を強制する使い方</h2>

      <h3>2-1. 接続と動作</h3>
      <p>VT（Voltage Transformer・計器用変圧器）は被測定回路の電圧を低圧側で測るために <span className="marker">並列接続</span> される。電圧計と同じ繋ぎ方。一次端子電圧 <Eq tex="V_1" /> は被測定回路の電圧そのもので <strong>VT自身は V₁ を変えられない</strong>。</p>
      <p>巻線方程式 <Eq tex="V_1 \approx N_1 (d\Phi/dt)" /> から、<strong>V₁ が決まれば自動的に磁束 Φ が決まる</strong>（巻線抵抗降下を無視した近似）。設計者は通常運用で Φ が B-H 直線域に収まるよう鉄心を選ぶ。よって <strong>磁束は安定</strong>。二次には <Eq tex="V_2 = (N_2/N_1) V_1" /> が現れ、これを計器で読む。</p>

      <h3>2-2. 二次開放：安全（標準運用）</h3>
      <p>二次を開放すると <Eq tex="I_2 = 0" />。しかし一次電圧 <Eq tex="V_1" /> が磁束 <Eq tex="\Phi" /> を決めているので、<strong>磁束は変化しない</strong>。二次端子には <Eq tex="V_2 = (N_2/N_1) V_1" /> がそのまま現れて、無負荷でも計器でそのまま電圧を読める。<span className="marker">VTを無負荷状態で置いておくのは標準運用</span>。</p>

      <h3>2-3. 二次短絡：禁止（焼損）</h3>
      <p>二次を短絡すると <Eq tex="V_2 \approx 0" /> に近づく。一次電圧 <Eq tex="V_1" /> はそのままなので、二次起電力と短絡端子の電位差を <strong>巻線インピーダンス（小さい）</strong> だけで割った大電流が二次に流れる。一次も磁気平衡を保つために I₁ が急増し、<Eq tex="I^2 R" /> 銅損で <strong>巻線が焼損</strong>。VT保護のため二次側にはヒューズを入れるのが標準設計。</p>

      <h3>2-4. 二次側を接地する理由と、接地種別（高圧D種・特別高圧A種）</h3>
      <p>VTは高圧側（一次）と低圧側（二次）の間に絶縁が入っているが、絶縁劣化で混触すると <strong>二次に高電圧が侵入</strong> し計器・人体に到達する。二次側を接地しておけば、その点が大地電位に固定され、計器筐体も安全。実務では二次1端子を接地する。</p>
      <Box kind="formula" label="根拠条文：電技解釈 第28条（計器用変成器の2次側電路の接地）">
        <p>「<strong>高圧</strong>計器用変成器の2次側電路には、<span className="marker">D種接地工事</span>を施すこと。<br/>2　<strong>特別高圧</strong>計器用変成器の2次側電路には、<span className="marker">A種接地工事</span>を施すこと。」</p>
        <p style={{margin:"8px 0 0"}}>⚠️ <strong>接地種別は電圧区分で変わる</strong>。高圧（6.6 kV など）なら D種（接地抵抗100Ω以下）だが、<strong>特別高圧なら A種</strong>（10Ω以下）。「計器用変成器の二次はD種」と丸暗記すると特別高圧の設問で失点する。CT・VT のどちらでも同じ条文が適用される。</p>
        <p style={{fontSize:"12px", color:"var(--ink-mute)", margin:"6px 0 0"}}>典拠：電気設備の技術基準の解釈（令和7年11月）第28条・原典PDF逐語照合済（2026-07-26）</p>
      </Box>

      <Box kind="formula" label="セクション2 まとめ（VT）">
        <p>一次に電圧を強制 → 磁束が決まる → 二次は <strong>開放OK・短絡NG</strong>（過電流で焼損）。二次1端子D種接地で感電防止。</p>
      </Box>

      <SectionCheck pageId="keiki-yo-henseiki" sectionId="vt" />

      <h2 id="ct"><span className="h-num">3.</span>CT：一次側から「電流」を強制する使い方</h2>

      <h3>3-1. 接続と動作</h3>
      <p>CT（Current Transformer・変流器）は被測定回路の電流を低圧側で測るために <span className="marker">直列挿入</span> される。電流計と同じ繋ぎ方。一次電流 <Eq tex="I_1" /> は被測定回路の電流そのもので <strong>CT自身は I₁ を変えられない</strong>。これが VT との根本的な違い。</p>

      <h3>3-2. 二次短絡：磁気平衡が成立して正常</h3>
      <p>二次を短絡（または低抵抗の電流計を接続）すると、磁気平衡 <Eq tex="N_1 I_1 \approx N_2 I_2" /> が成り立つように二次電流 <Eq tex="I_2 \approx (N_1/N_2) I_1" /> が <strong>自動的に流れる</strong>。一次起磁力 <Eq tex="N_1 I_1" /> と二次起磁力 <Eq tex="N_2 I_2" /> は <strong>ほぼ完全に打ち消し合い</strong>、正味の起磁力（＝励磁起磁力）はごくわずか。したがって磁束 <Eq tex="\Phi" /> は B-H 直線域に収まり <strong>正常動作</strong>。</p>

      <Box kind="mistake" label="よくある誤解：CTも短絡すれば「抵抗が小さい→大電流」で焼けるのでは？">
        <p><strong>誤解の出どころ</strong>：VTの焼損（セクション2-3）を <Eq tex="I = V/Z" /> で理解すると「Zを小さくすれば電流が増える」が一般則に見え、CTの短絡（Z→0）も最も危険な操作に思えてくる。</p>
        <p><strong>なぜ当てはまらないか</strong>：<Eq tex="I = V/Z" /> が使えるのは <strong>V が固定されている</strong>ときだけ。CTで固定されているのは V ではなく <strong>I</strong> のほうで、二次電流は磁気平衡が決める。</p>
        <Eq display tex="I_2 \approx \dfrac{N_1}{N_2} I_1" />
        <p>この式の右辺に <strong>二次側のインピーダンスは現れない</strong>。二次電流は一次電流だけで決まる。</p>
        <p>短絡しても電流計をつないでも <Eq tex="I_2" /> は変わらない（1000/5 A のCTで一次に定格1000Aが流れていれば、どちらでも5A）。<span className="marker">Zを下げる方向には、そもそも何も起こらない</span>。危険は Z を上げる方向（負担過大 → その極限が開放）にしか存在しない。この<strong>非対称</strong>がCTの本質。</p>
        <p><strong>むしろ短絡が一番楽</strong>：二次端子電圧は <Eq tex="V_2 = I_2 Z_B" />（<Eq tex="Z_B" /> ＝負担）なので、<Eq tex="Z_B = 0" /> なら <Eq tex="V_2 \approx 0" />（残るのは二次巻線自身の抵抗・漏れリアクタンスの降下だけ）。磁束もほぼゼロで、鉄心に <strong>最もストレスがかからない</strong>状態になる。</p>
        <p><strong>用語の罠</strong>：同じ「短絡」でも意味が入れ替わる。<span className="marker">CTの二次短絡は、VTでいう「二次開放（無負荷）」に当たる</span>。逆にCTの二次開放が、VTの二次短絡に当たる暴走状態。「短絡＝危険・開放＝安全」という言葉のイメージをそのまま持ち込むと、CTでは必ず逆になる。</p>
        <p><strong>危険の本質</strong>：短絡・開放という行為そのものではなく、<strong>駆動源が生きたまま誤った終端をすること</strong>。だから変圧器でも一次電圧をインピーダンス電圧まで下げれば二次短絡は正常な試験になり（2.1 変圧器の短絡試験）、CTでも主回路が停電して <Eq tex="I_1 = 0" /> なら二次開放は無害。</p>
      </Box>

      <h3>3-3. 二次開放：磁気平衡が壊れ深飽和へ突入</h3>
      <p>二次を開放すると <Eq tex="I_2 = 0" />。一次は被測定回路に直列で <strong>I₁ は依然として流れ続ける</strong>（VTと違って一次電流を CT は止められない）。打ち消す相手のいない一次起磁力 <Eq tex="N_1 I_1" /> は <strong>全部が励磁起磁力</strong> として鉄心に注入される。</p>
      <p>通常運用時の励磁起磁力は定格起磁力の数%だが、開放時は <strong>100%が励磁分</strong> に化ける。励磁起磁力は <span className="marker">桁違いに大きく</span>、鉄心は <Eq tex="B_s" /> に深く突き刺さる <strong>深飽和</strong> に突入する。</p>

      <h3>3-4. 深飽和 → 二次電圧スパイク（数kV）</h3>
      <p>深飽和に入ると磁束 <Eq tex="\Phi" /> の時間波形が歪む。正弦波の一次電流が <Eq tex="\pm" /> ピークに達するとき、鉄心は飽和限界に貼り付いて <Eq tex="\Phi" /> はほとんど増えない（フラット）。一方、一次電流がゼロ付近を横切る瞬間、<strong>飽和から急に抜け出して磁束が一気に向きを変える</strong>。結果として磁束波形は <span className="marker">ほぼ方形波</span> になり、<strong>ゼロクロス付近で dΦ/dt が極端に大きい</strong>。</p>
      <p><Eq tex="V_2 = -N_2 (d\Phi/dt)" /> より、二次に <strong>数kVのスパイク電圧</strong> が瞬時に発生 → 巻線の絶縁設計を超えて <strong>絶縁破壊・感電事故</strong>。これがCT二次開放禁止の物理的核心。</p>

      <h3>3-5. 現場運用：短絡端子で「常に閉路」を保つ</h3>
      <p>点検でCT二次側の電流計を交換するとき、いきなり計器を外すと一瞬で二次が開放状態になり、上記の事故が発生する。これを防ぐため、CT二次端子台には <strong>短絡用ピース（短絡端子）</strong> が標準装備されている。手順は：</p>
      <ol>
        <li>短絡端子を投入（二次を短絡する）</li>
        <li>古い電流計を外す</li>
        <li>新しい電流計を取り付ける</li>
        <li>短絡端子を解放</li>
      </ol>
      <p>常に「閉路を保つ」設計で、物理的に開放させない仕組み。<strong>短絡端子の存在理由がセクション3-3・3-4の物理から導かれる</strong>のがこの設計の美しさ。</p>

      <p><strong>CT二次回路にはヒューズを入れない</strong>。VTは二次短絡が危険なので二次側をヒューズで保護する（セクション2-3）が、CTは逆に <strong>開放が危険</strong>。ヒューズが溶断すれば、その瞬間に二次開放＝セクション3-3・3-4の事故そのものになる。<span className="marker">「異常時は保護素子で切る」という常識が、CT二次回路にだけは通用しない</span>。禁則が逆だからで、これも物理から導ける。</p>

      <h3>3-6. 二次側1端子を D種接地する理由</h3>
      <p>VTと同じく一次高圧と二次低圧の混触対策で二次側を接地する（<strong>高圧はD種・特別高圧はA種</strong>＝解釈第28条。セクション2-4参照）。役割は<strong>混触時に二次回路の対地電位が高圧まで持ち上がるのを防ぐこと</strong>に尽きる。</p>
      <Box kind="mistake" label="接地は開放スパイクの対策ではない">
        <p>「接地しておけば開放スパイクも逃げる」は<strong>誤り</strong>。開放時の高電圧は二次端子 k–l の<span className="marker">間</span>に現れるので、片方の端子を接地しても電流の経路はできず、スパイクの大きさは変わらない。<strong>開放スパイクを防ぐのは短絡端子による常時閉路（セクション3-5）</strong>で、接地（感電・混触対策）とは目的が別。混同すると「接地してあるから開放してよい」という最も危険な結論に到達する。</p>
      </Box>

      <Box kind="formula" label="セクション3 まとめ（CT）">
        <p>一次に電流を強制 → 二次は磁気平衡で <Eq tex="I_2 \approx (N_1/N_2) I_1" /> が <strong>流れる必要</strong> → 二次は <strong>短絡OK・開放NG</strong>（深飽和→スパイク→絶縁破壊）。現場では短絡端子で常時閉路を維持。二次1端子D種接地で感電防止。</p>
      </Box>

      <SectionCheck pageId="keiki-yo-henseiki" sectionId="ct" />

      <h2 id="derived"><span className="h-num">4.</span>禁則は自動的に逆になる（セクション1〜3で導出済）</h2>
      <p>セクション2とセクション3を並べると、禁則は <strong>暗記するまでもなく</strong> 逆になることが分かる：</p>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th scope="col"></th><th scope="col">一次側に強制する量</th><th scope="col">二次OK</th><th scope="col">二次NG（と物理）</th></tr></thead>
          <tbody>
            <tr><td>VT</td><td>電圧 V₁</td><td>開放（無負荷でΦ維持）</td><td>短絡 → 巻線焼損（I²R 銅損）</td></tr>
            <tr><td>CT</td><td>電流 I₁</td><td>短絡（磁気平衡成立）</td><td>開放 → 深飽和 → V₂スパイク → 絶縁破壊</td></tr>
          </tbody>
        </table>
      </div>
      <p>試験で「CTの二次は開放してはならない」を見たとき、覚えていなくても <strong>「CT＝電流を強制する装置 → 開放すると磁気平衡が崩れる → 深飽和」</strong> と毎回再導出できれば、混同事故はゼロになる。</p>

      <Box kind="example" label="補足: 回路理論からの圧縮表現（参考・電験3種範囲外）">
        <p>電気回路理論には「<strong>電流源は開放してはならない／電圧源は短絡してはならない</strong>」という基本則がある。CTは一次側から見ると <Eq tex="I_1" /> を強制する <strong>電流源等価</strong>、VTは <Eq tex="V_1" /> を強制する <strong>電圧源等価</strong> と見なすと、上記の禁則はこの基本則の系として圧縮できる。</p>
        <p>ただし「等価電源」の概念は本来は回路理論の話で、電験3種範囲外。<strong>本筋はセクション1〜3の物理で導出済み</strong>であって、このメタファーは「思い出すための短縮形」に過ぎないことに注意。物理を理解せずメタファーだけ覚えると、また丸暗記に戻ってしまう。</p>
      </Box>

      <SectionCheck pageId="keiki-yo-henseiki" sectionId="derived" />

      <h2 id="ratio"><span className="h-num">5.</span>巻数比の式は磁気平衡の系</h2>
      <p>巻数比の公式は独立に2本あるわけではなく、<strong>セクション1の磁気平衡と磁束変化率から派生</strong>する。</p>

      <h3>5-1. CT の変流比</h3>
      <p>セクション1-1の磁気平衡 <Eq tex="N_1 I_1 \approx N_2 I_2" /> を整理：</p>
      <FormulaCard num="01 / 02" name="CTの変流比" eq="\dfrac{I_1}{I_2} \;\approx\; \dfrac{N_2}{N_1}"
        note={<>例：1000/5 A の CT は一次1000Aを二次5Aに変換（巻数比は逆比 1:200）。読み値 <Eq tex="I_2" /> から一次電流は <Eq tex="I_1 = (1000/5) I_2 = 200 \times I_2" /> で機械的に求まる。</>} />

      <h3>5-2. VT の変圧比</h3>
      <p>セクション1-3の <Eq tex="V = N (d\Phi/dt)" /> を一次・二次で書き、辺々割る：</p>
      <FormulaCard num="02 / 02" name="VTの変圧比" eq="\dfrac{V_1}{V_2} \;=\; \dfrac{N_1}{N_2}"
        note={<>例：6600/110 V の VT は変成比 60:1。三相回路では <Eq tex="6600/\sqrt{3}\ /\ 110/\sqrt{3}" /> 表記（相電圧基準）も使われる。</>} />

      <h3>5-3. 端子記号</h3>
      <ul>
        <li><strong>VT</strong>：一次 U-V、二次 u-v（国内従来表記。IEC 整合表記では一次 A-B〈接地形は A-N〉・二次 a-b）。減極性が標準</li>
        <li><strong>CT</strong>：一次 K-L（K=入口・L=出口）、二次 k-l（国内従来表記。IEC 整合表記では一次 P1-P2・二次 S1-S2）。減極性が標準</li>
        <li>結線図では端子記号で判別できる：<strong>K-L なら CT、U-V なら VT</strong>（国内従来表記では大文字=一次・小文字=二次。IEC 整合の P1/S1 系は数字記号なので、図中の表記体系全体で判別する）</li>
      </ul>

      <Box kind="example" label="例題 2.3.1（変成比の数値計算）">
        <p><strong>問:</strong> 6.6 kV 受電設備で 1000/5 A のCTと 6600/110 V のVTを使用。二次側で計測した電流5A・電圧100Vのとき、一次側の有効電力を求めよ（単相換算・力率1.0として）。</p>
        <p><strong>解:</strong></p>
        <Eq display tex="I_1 = (1000/5) \times 5 = 1000\;[\mathrm{A}]" />
        <Eq display tex="V_1 = (6600/110) \times 100 = 6000\;[\mathrm{V}]" />
        <Eq display tex="P_1 = V_1 I_1 \times 1.0 = 6{,}000{,}000\;[\mathrm{W}] = 6\;[\mathrm{MW}]" />
        <p>変成比は「一次値÷二次読み値」の定格比をそのまま掛ければよい。</p>
      </Box>

      <SectionCheck pageId="keiki-yo-henseiki" sectionId="ratio" />

      <h2 id="check"><span className="h-num">6.</span>セルフチェック（物理から再導出する練習）</h2>
      <p>穴埋めではなく <strong>「なぜそうなるか」をセクション1〜3から説明する</strong> 練習。文字数は1問あたり3〜4行を目安に。</p>

      <Box kind="formula" label="問1: CT 二次短絡が安全な理由">
        <p>「CTの二次を短絡してしまった。これが事故ではなく <strong>むしろ正常動作</strong> である理由を、セクション1の磁気平衡から説明せよ。」</p>
        <p style={{marginTop:'8px', fontSize:'12px', color:'var(--ink-3,#888)'}}>確認ポイント：N₁I₁ ≈ N₂I₂ の磁気平衡式 → 二次に I₂ が流れて一次起磁力を打ち消す → 正味の起磁力は小さい → 鉄心は直線域 → 正常。</p>
      </Box>

      <Box kind="formula" label="問2: VT 二次短絡が焼損につながる物理過程">
        <p>「VTの二次を短絡すると巻線が焼損する物理過程を <strong>3ステップ</strong> で書け。」</p>
        <p style={{marginTop:'8px', fontSize:'12px', color:'var(--ink-3,#888)'}}>確認ポイント：① V₁ が Φ を決め V₂ = (N₂/N₁)V₁ が誘起 → ② 短絡で V₂≈0 だが巻線インピーダンスのみで電流制限 → ③ 大電流で I²R 銅損 → 巻線温度上昇 → 焼損。</p>
      </Box>

      <Box kind="formula" label="問3: CT 二次開放で起きる「飽和」と「スパイク電圧」の関係">
        <p>「CT二次を開放すると、なぜ <strong>「鉄心の飽和」と「二次の高電圧スパイク」がセットで起きる</strong> のか説明せよ。」</p>
        <p style={{marginTop:'8px', fontSize:'12px', color:'var(--ink-3,#888)'}}>確認ポイント：開放で I₂=0 → N₁I₁ を打ち消す相手がなく全起磁力が励磁分に → 鉄心が B_s 深く突入（深飽和）→ Φ が方形波化 → ゼロクロス付近で dΦ/dt 巨大 → V₂ = -N₂(dΦ/dt) よりスパイク発生。「飽和」と「スパイク」は同じ深飽和現象の二側面。</p>
      </Box>

      <Box kind="formula" label="問4: 短絡端子の存在理由を物理から導く">
        <p>「現場でCT二次側の電流計を交換するとき <strong>「短絡端子で短絡してから外す」手順が必須</strong> な理由を、セクション3から導け。」</p>
        <p style={{marginTop:'8px', fontSize:'12px', color:'var(--ink-3,#888)'}}>確認ポイント：直接外すと一瞬でも二次開放状態 → セクション3-3・3-4の深飽和→スパイクが発生し絶縁破壊と感電の危険 → 短絡端子で常時閉路を維持すれば磁気平衡が崩れず Φ は直線域に留まる。物理から運用器具の設計理由が出てくる。</p>
      </Box>

      <Box kind="formula" label="問5: 二次側接地の目的と接地種別">
        <p>「CT・VT どちらも二次側を接地する。<strong>両端接地ではなく1端子のみ</strong> である理由と、<strong>接地種別が電圧区分でどう変わるか</strong> をセクション2-4・3-6から説明せよ。」</p>
        <p style={{marginTop:'8px', fontSize:'12px', color:'var(--ink-3,#888)'}}>確認ポイント：1端子のみ＝二次回路に閉路を作らない（両端接地は地絡電流ループの危険）／種別＝高圧計器用変成器はD種（100Ω以下）・特別高圧計器用変成器はA種（10Ω以下）＝解釈第28条／目的＝混触時の二次高電圧を大地電位に逃がし感電防止。</p>
      </Box>

      <h2 id="slip"><span className="h-num">1.</span>同期速度とすべり（同期機 ⇄ 誘導機）</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「三相誘導電動機の回転子は同期速度で回る」<br/>
        ○ 回転子は同期速度より<strong>すべり s の分だけ遅い</strong>。同期速度で回る（s＝0）のは同期機。誘導機は必ず s＞0。</p>
      </Box>
      <Eq display tex="N_s = \dfrac{120 f}{p} \quad,\quad s = \dfrac{N_s - N}{N_s} \quad,\quad N = N_s(1-s)" />
      <p><Eq tex="N_s" />（同期速度）は<strong>回転磁界そのものの速さ</strong>で、負荷によらず一定。実際に回る回転子の速度 <Eq tex="N" /> がすべり分だけ遅れる。「同期速度＝回転子の速度」と読み替えないこと。</p>

      <h2 id="dc"><span className="h-num">2.</span>直流電動機の速度特性（他励・分巻・直巻）</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「直巻電動機は速度がほぼ一定」<br/>
        ○ ほぼ<strong>定速度なのは分巻</strong>（と他励）。<strong>直巻は負荷で速度が大きく変化</strong>し、無負荷では危険な高速（暴走）。</p>
      </Box>
      <p>始動トルクが大きいのは<strong>直巻</strong>（電車・クレーンなど）。負荷変動に対し速度を保ちたい用途は分巻。「定速度か／始動トルク大か」で結びつける。</p>

      <h2 id="ctvt"><span className="h-num">3.</span>CT と VT の二次側の禁則</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「CTは二次短絡厳禁・VTは二次開放厳禁」<br/>
        ○ <strong>逆</strong>。<strong>CT＝二次開放厳禁</strong>（高電圧スパイクで絶縁破壊）、<strong>VT＝二次短絡厳禁</strong>（過電流で焼損）。</p>
      </Box>
      <p>CTは一次電流が磁束を強制する「電流源的」動作なので、二次を開くと磁束が飽和して高電圧が出る。VTは一次電圧が磁束を決める「電圧源的」動作なので、二次短絡で大電流が流れる。詳しい物理は <a href="#" onClick={(e) => { e.preventDefault(); onNav('keiki-yo-henseiki'); }}>計器用変成器（CT・VT）</a> を参照。</p>

      <h2 id="ydelta"><span className="h-num">4.</span>Y-Δ始動の始動電流・始動トルク</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「Y始動にすると始動電流は全電圧始動の 1/√3 になる」<br/>
        ○ <strong>線電流・始動トルクとも 1/3</strong>。1/√3 は各相にかかる電圧（相電圧）の比。</p>
      </Box>
      <p>Y結線では各相の電圧が線間電圧の <Eq tex="1/\sqrt{3}" /> になる。始動トルクは電圧の2乗に比例するので <Eq tex="(1/\sqrt{3})^2 = 1/3" />。線電流も全電圧（Δ）始動の 1/3。「1/√3」で止めると誤答。</p>

      <h2 id="eff"><span className="h-num">5.</span>変圧器の効率が最大になる条件</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「変圧器の効率は定格負荷で最大」<br/>
        ○ <strong>鉄損（無負荷損）＝銅損（負荷損）</strong>のとき最大。一般に<strong>定格より低い負荷率</strong>で効率がピークになる。</p>
      </Box>
      <Eq display tex="\alpha_{\max} = \sqrt{\dfrac{P_i}{P_c}}" />
      <p>鉄損 <Eq tex="P_i" /> は負荷によらず一定、銅損は負荷率の2乗に比例（全負荷銅損 <Eq tex="P_c" />）。両者が等しくなる負荷率 <Eq tex="\alpha_{\max}" /> で効率が最大。</p>

      <h2 id="rect"><span className="h-num">6.</span>整流回路の平均値と実効値</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「整流した電圧は実効値で読む／実効値で直流分を計算する」<br/>
        ○ <strong>直流分（直流電圧計の読み）は平均値</strong>、<strong>発熱・電力（I²R）は実効値</strong>。用途で使い分ける。</p>
      </Box>
      <p style={{ marginBottom: 4 }}><strong>単相全波整流（正弦波）の平均値と実効値</strong></p>
      <Eq display tex="V_\text{平均} = \dfrac{2V_m}{\pi} \approx 0.637\,V_m ,\quad V_\text{実効} = \dfrac{V_m}{\sqrt{2}} \approx 0.707\,V_m" />
      <p>平均値と実効値は別物。直流に変換した「大きさ」を問われたら平均値、抵抗の発熱や電流容量を問われたら実効値。「何を測る量か」で選ぶ。</p>

      <h2 id="kr"><span className="h-num">7.</span>同期機の短絡比と同期インピーダンス</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「短絡比が大きいほど同期インピーダンスも大きい」<br/>
        ○ <strong>逆</strong>。短絡比 <Eq tex="K_s" /> はほぼ同期インピーダンス（p.u.）の逆数。<strong>短絡比 大 ⇄ 同期インピーダンス 小</strong>。</p>
      </Box>
      <Eq display tex="K_s \approx \dfrac{1}{Z_s\,[\text{p.u.}]}" />
      <p>短絡比が大きい機械（鉄機械）は同期インピーダンスが小さく、<strong>電圧変動が小さく安定だが大型・高価</strong>。小さい機械（銅機械）はその逆。「大きい＝インピーダンスも大きい」と素直に対応させない。</p>

      <h2 id="pid"><span className="h-num">8.</span>PID 各動作の役割（P・I・D）</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「積分動作を入れると応答が速くなる」<br/>
        ○ <strong>逆</strong>。I（積分）は<strong>定常偏差を除去</strong>するのが役割で、位相が遅れるため<strong>安定度は低下しがち</strong>。速応性・減衰性を改善するのは D（微分）。</p>
      </Box>
      <p>P（比例）は偏差に比例した操作量を出すが、<strong>一般に定常偏差（オフセット）が残る</strong>（制御対象自体に積分要素があれば残らない場合もある）。「残る／除去する／先回りする」の3語で P・I・D を対応づけると取り違えない。D は単独では使わず P や PI に付加する。</p>

      <h2 id="fb-seq"><span className="h-num">9.</span>フィードバック制御とシーケンス制御</h2>
      <Box kind="mistake" label="よくある誤り → 正しい理解">
        <p>✗「シーケンス制御は時間の経過だけで進む開ループ制御である」<br/>
        ○ 順序<strong>または条件</strong>に従って各段階を逐次進める制御。時間で進むもののほか、<strong>センサ・接点の状態信号を条件に進むもの</strong>も含む。「開ループ」と限定しない。</p>
      </Box>
      <p>フィードバック制御は<strong>目標値と比較して訂正し続ける</strong>制御。対比で問われる。シーケンス側は a接点（メーク）・b接点（ブレーク）・<strong>自己保持回路</strong>が頻出。</p>
      <p style={{ margin: "8px 0 0" }}>▶ 閉ループ伝達関数は <Eq tex="Y/R = G/(1+GH)" />。<strong>分母は 1+GH</strong> で、H が1でないときに <Eq tex="1+G" /> と混同しない。開ループの時定数はフィードバックで<strong>短縮</strong>される（速応性が上がる）。詳細は <a href="#" onClick={(e) => { e.preventDefault(); onNav("auto-control"); }}>3.1 自動制御</a>。</p>

      <Box kind="tip" label="横断のコツ">
        <p>混同ペアは<strong>「何が固定で・何が変わるか」</strong>を1つ決めると解ける。同期速度＝固定／回転子＝変わる、鉄損＝固定／銅損＝変わる、CT＝電流固定／VT＝電圧固定、P＝偏差が残る／I＝偏差を消す。固定側を起点に再構成すれば毎回逆にならない。</p>
      </Box>

      <PageNav prev={{ id: "guide", title: "C 学習ガイド" }} next={{ id: "home", title: "ホーム" }} onNav={onNav} />
    </div>
  </>
);

/* 論理ゲートの記号（AND/OR/NOT の本体パスを共通化） */
const GateSym = ({ cx, cy, kind, bubble, name, expr }) => {
  const X = Number(cx), Y = Number(cy);
  const body =
    kind === "and" ? `M ${X - 20} ${Y - 17} L ${X - 3} ${Y - 17} A 17 17 0 0 1 ${X - 3} ${Y + 17} L ${X - 20} ${Y + 17} Z`
    : kind === "or" ? `M ${X - 21} ${Y - 17} Q ${X - 7} ${Y} ${X - 21} ${Y + 17} Q ${X + 2} ${Y + 15} ${X + 15} ${Y} Q ${X + 2} ${Y - 15} ${X - 21} ${Y - 17} Z`
    : `M ${X - 18} ${Y - 16} L ${X - 18} ${Y + 16} L ${X + 11} ${Y} Z`;
  const tip = kind === "and" ? X + 14 : kind === "or" ? X + 15 : X + 11;
  return (
    <g>
      <path d={body} fill="var(--bg)" stroke="var(--ink)" strokeWidth="1.6" />
      {kind !== "not" && <line x1={X - 34} y1={Y - 8} x2={X - 21} y2={Y - 8} stroke="var(--ink)" strokeWidth="1.4" />}
      {kind !== "not" && <line x1={X - 34} y1={Y + 8} x2={X - 21} y2={Y + 8} stroke="var(--ink)" strokeWidth="1.4" />}
      {kind === "not" && <line x1={X - 32} y1={Y} x2={X - 18} y2={Y} stroke="var(--ink)" strokeWidth="1.4" />}
      {bubble && <circle cx={tip + 5} cy={Y} r="4.5" fill="var(--bg)" stroke="var(--ink)" strokeWidth="1.5" />}
      <line x1={bubble ? tip + 10 : tip} y1={Y} x2={X + 34} y2={Y} stroke="var(--ink)" strokeWidth="1.4" />
      <text x={X - 2} y={Y + 38} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="var(--accent-ink)">{name}</text>
      <text x={X - 2} y={Y + 53} textAnchor="middle" fontSize="9.5" fill="var(--ink-soft)">{expr}</text>
    </g>
  );
};

      { id: "logic", heading: "論理回路の基本", body: <>
        <p>AND・OR・NOT を基本素子とし、NAND・NOR・XOR が応用される。<strong>ド・モルガンの定理</strong> <Eq tex="\overline{A+B}=\bar A\bar B" /> は頻出。</p>
        <Box kind="formula" label="覚えるべき恒等式">
          <p><Eq tex="A + AB = A,\quad A + \bar A B = A + B,\quad A(A+B)=A" /></p>
        </Box>
        <LogicGateFig />
      </>},
      { id: "flipflop", heading: "順序回路（フリップフロップ）", body: <>
        <ul>
          <li><strong>RS-FF</strong> — 基本形（NOR 形・正論理入力）では <span className="marker">R=1, S=1 が禁止入力</span>（両出力が同じ値になり、次の状態が決まらない）</li>
          <li><strong>D-FF</strong> — クロックのエッジで D 入力を取り込んで保持する。<strong>立上りか立下りかは素子で決まる</strong>（記号のクロック端子に丸が付いていれば立下り）</li>
          <li><strong>JK-FF</strong> — J=K=1 で反転動作。<strong>禁止入力がない</strong>のが RS-FF との違い</li>
        </ul>
        <Box kind="mistake" label="禁止入力は「形」で変わる">
          <p>「RS-FF の禁止入力は R=S=1」は <strong>NOR 形（正論理入力）の場合</strong>。<span className="marker">NAND 形（負論理入力）では両入力を 0 にしたときが禁止</span>になる。問題文の回路がどちらの形かを見てから答える。</p>
        </Box>
      </>},
      { id: "adda", heading: "A/D・D/A 変換", body: <p>分解能 n ビットのA/D変換器は <Eq tex="2^n" /> 段階で量子化する。逐次比較形・並列比較形・積分形が主要方式。</p> },
      { id: "radix", heading: "基数変換（2進・10進・16進）", body: <>
        <p>10進→2進は「2で割った余りを下位から並べる」。2進→16進は「<strong>4桁ずつ区切って</strong>読み替える」。逆方向（2進→10進）は各桁の重み（…, 8, 4, 2, 1）を足す。</p>
        <Box kind="example" label="例題 — 基数変換">
          <p><strong>問:</strong> (45)₁₀ を2進数と16進数で表せ。</p>
          <p><strong>解:</strong> 45 = 32 + 8 + 4 + 1 = <strong>(101101)₂</strong>。4桁ずつ区切って 0010 1101 → <strong>(2D)₁₆</strong>。検算: 2×16 + 13 = 45 ✓</p>
        </Box>
      </>},
      { id: "quick-review", heading: "1分復習（即答チェック）", body: <>
        <div className="box">
          <details><summary>ド・モルガンの定理は？</summary>A+B 全体の否定 = Āと B̄ の積／A·B 全体の否定 = Ā と B̄ の和（バーを分配すると + と · が入れ替わる）</details>
          <details><summary>RS-FF の禁止入力は？JK-FF の J=K=1 は？</summary>RS-FF は NOR 形（正論理入力）なら R=S=1 が禁止／NAND 形（負論理入力）なら両入力 0 が禁止。JK-FF の J=K=1 は反転動作（禁止入力なし）</details>
          <details><summary>n ビット A/D 変換の量子化段階数は？</summary>2ⁿ 段階（例: 8ビット = 256段階）</details>
          <details><summary>(1010)₂ は10進でいくつ？</summary>8 + 2 = 10（各桁の重み 8, 4, 2, 1 を足す）</details>
        </div>
      </>},
    ]}
  />
);

const LightingPage = ({ onNav }) => (
  <StubPage title="照明" eyebrow="4.1  LIGHTING"
    deck="光束・光度・照度・輝度の単位系を理解することが第一歩。逆二乗の法則と余弦の法則が計算の核。"
    freq="中（照明・電熱で合算 約16問・8%／単独の内訳は分離集計なし）"
    prev={{ id: "info-elec", title: "3.2 情報・電子回路" }} next={{ id: "heat", title: "4.2 電熱" }}
    onNav={onNav}
    sections={[
      { id: "units", heading: "光の単位", body: <>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th scope="col">量</th><th scope="col">記号</th><th scope="col">単位</th><th scope="col">意味</th></tr></thead>

              <tr><td>光束</td><td>F</td><td>lm（ルーメン）</td><td>光源の総光量</td></tr>

              <tr><td>輝度</td><td>L</td><td>cd/m²</td><td>見る方向への単位投影面積（見かけの面積）あたりの光度</td></tr>
            </tbody>
          </table>
        </div>
        <LightQuantityFig />
      </>},
      { id: "laws", heading: "計算法則", body: <>
        <FormulaCard num="00" name="球光源の全光束" eq="F = 4\pi I" note="均等放射の点光源。全立体角 4π [sr] × 光度 I。" />
        <FormulaCard num="01" name="逆二乗の法則" eq="E = \dfrac{I}{r^2}" note="点光源から距離 r の面の照度（垂直入射時）。" />
        <FormulaCard num="02" name="余弦の法則" eq="E = \dfrac{I\cos\theta}{r^2}" note="θ: 法線と入射光のなす角。" />
        <Box kind="example" label="理解を深める — 照度が逆二乗になる理由は理論のクーロン電界と同じ幾何">
          <p>点光源の照度 <Eq tex="E = \dfrac{I}{r^2}" /> が距離の2乗に反比例するのは、照明だけの特別な法則ではなく、理論の静電気で学ぶ点電荷の電界 <Eq tex="E = \dfrac{Q}{4\pi\varepsilon_0 r^2}" /> が逆二乗になるのと<strong>まったく同じ幾何学的な理由</strong>による。どちらも点源から出たもの（光は光束 <Eq tex="F" />、電荷は電気力線）が四方八方へ広がり、距離 <Eq tex="r" /> の球面（表面積 <Eq tex="4\pi r^2" />）に一様に分配されるため、単位面積あたりの密度が <Eq tex="1/r^2" /> で薄まる。「総量は一定のまま、広がる面積が <Eq tex="r^2" /> で増える」——これが逆二乗則の正体。</p>
          <p>立体角 <Eq tex="\omega" /> を使うと光度は <Eq tex="I = \dfrac{F}{\omega}" />（単位立体角あたりの光束）と定義され、半径 <Eq tex="r" /> の球面が立体角 <Eq tex="\omega" /> から切り取る面積は <Eq tex="A = \omega r^2" />。その面に届く光束 <Eq tex="F = I\omega" /> をこの面積で割れば <Eq tex="E = \dfrac{F}{A} = \dfrac{I\omega}{\omega r^2} = \dfrac{I}{r^2}" /> となり、逆二乗則が立体角から自然に導かれる。電気力線が球面を貫く本数（電束）から電界を求めるガウスの法則と発想は完全に同型で、照度の逆二乗は理論の電気力線・クーロンの法則に還元できる。</p>
          <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#coulomb-field" target="_blank" rel="noopener">→ 理論Wiki「静電気・クーロンの法則」で点電荷の電界 E=Q/(4πε₀r²) と電気力線・逆二乗則を深掘り</a></p>
        </Box>
        <FormulaCard num="03" name="平均照度（屋内照明）" eq="E = \dfrac{F \cdot N \cdot U \cdot M}{A}"
          note="N:灯具数, U:照明率, M:保守率, A:被照面積" />
        <IlluminanceGeometryFig />
        <Box kind="example" label="例題 — 点光源の直下照度と斜め点の水平面照度">
          <p>光度 <Eq tex="I = 1000\;\mathrm{cd}" /> の点光源が床からの高さ <Eq tex="h = 2\;\mathrm{m}" /> にある。(a) 光源直下の床の照度、(b) 直下から水平に <Eq tex="x = 1.5\;\mathrm{m}" /> 離れた床点 P の水平面照度を求めよ。</p>
          <p><strong>(a) 直下</strong>：距離は <Eq tex="r = h = 2\;\mathrm{m}" /> で光は床に垂直入射。逆二乗の法則そのまま。</p>
          <Eq display tex="E = \dfrac{I}{h^2} = \dfrac{1000}{2^2} = 250\;[\mathrm{lx}]" />
          <p><strong>(b) 斜め点 P</strong>：まず点光源から P までの<strong>斜め距離</strong> <Eq tex="r = \sqrt{h^2 + x^2} = \sqrt{2^2 + 1.5^2} = 2.5\;\mathrm{m}" />。入射角 <Eq tex="\theta" />（鉛直＝床の法線から測る）は <Eq tex="\cos\theta = \dfrac{h}{r} = \dfrac{2}{2.5} = 0.8" />。水平面照度は<strong>余弦の法則</strong>で、</p>
          <Eq display tex="E_h = \dfrac{I}{r^2}\cos\theta = \dfrac{1000}{2.5^2}\times 0.8 = 160 \times 0.8 = 128\;[\mathrm{lx}]" />
          <p style={{margin:"8px 0 0"}}>⚠️ 最頻出の取り違え：分母は<strong>斜め距離 <Eq tex="r" />（点光源→点P）</strong>の2乗であって、高さ <Eq tex="h" /> の2乗ではない。<Eq tex="r = \sqrt{h^2 + x^2}" /> を先に出し、<Eq tex="\cos\theta = h/r" /> を掛ける。1本にまとめると <Eq tex="E_h = \dfrac{I h}{r^3} = \dfrac{I h}{(h^2 + x^2)^{3/2}}" />。</p>
        </Box>
      </>},
      { id: "quick-review", heading: "1分復習（即答チェック）", body: <>
        <div className="box">
          <details><summary>光束・光度・照度・輝度の単位は？</summary>光束=lm（ルーメン）／光度=cd（カンデラ）／照度=lx（ルクス）／輝度=cd/m²</details>
          <details><summary>点光源・距離 r の面の照度（逆二乗の法則）は？</summary>E = I/r²（垂直入射）。傾き θ なら E = I·cosθ/r²（余弦の法則）</details>
          <details><summary>屋内照明の平均照度の式は？</summary>E = F·N·U·M / A（N:灯具数, U:照明率, M:保守率, A:被照面積）</details>
          <details><summary>均等放射の点光源の全光束は？</summary>F = 4πI（全立体角 4π sr × 光度 I。立体角の定義から）</details>
        </div>
      </>},
    ]}
  />
);

const HeatPage = ({ onNav }) => (
  <StubPage title="電熱" eyebrow="4.2  ELECTRIC HEATING"
    deck="ジュール熱・熱伝導・電気加熱方式（抵抗加熱・誘導加熱・誘電加熱・マイクロ波）を扱う。" freq="中（照明・電熱で合算 約16問・8%／単独の内訳は分離集計なし）"
    prev={{ id: "lighting", title: "4.1 照明" }} next={{ id: "chemistry", title: "4.3 電気化学" }}
    onNav={onNav}
    sections={[
      { id: "joule", heading: "発熱量と温度上昇", body: <>
        <FormulaCard num="01" name="ジュール熱" eq="Q = I^2 R t = P t \;[\mathrm{J}]" />
        <FormulaCard num="02" name="温度上昇" eq="Q = c \cdot m \cdot \Delta T" note="c: 比熱, m: 質量, ΔT: 温度差" />
        <Box kind="example" label="例題">
          <p>1 kW のヒーターで水 2 kg を 20℃ から 80℃ まで加熱する時間は？（水の比熱 4.2 kJ/(kg·K)、損失なし）</p>
          <Eq display tex="t = \dfrac{c m \Delta T}{P} = \dfrac{4200 \times 2 \times 60}{1000} = 504\;[\mathrm{s}]" />
        </Box>
        <Box kind="example" label="理解を深める — ジュール熱は理論の消費電力 P=I²R の時間積分">
          <p>電熱の発熱量 <Eq tex="Q = I^2 R t\;[\mathrm{J}]" /> は新しい公式ではなく、理論の直流回路で学ぶ消費電力 <Eq tex="P = I^2 R = VI = \dfrac{V^2}{R}\;[\mathrm{W}]" /> を時間で積み上げただけ。電力 <Eq tex="P" /> は「1秒あたりに抵抗で電気エネルギーが熱に変わる量」なので、これを <Eq tex="t" /> 秒ぶん掛ければ総発熱量 <Eq tex="Q = P\,t" /> になる。ジュール熱の物理は、抵抗 <Eq tex="R" /> で電気エネルギーが熱に変わる現象そのもので、理論の「直流回路の電力・ジュールの法則」に完全に還元できる。</p>
          <p>さらにこの熱量 <Eq tex="Q" /> が物体に与えられると、温度が <Eq tex="Q = c m \Delta T" /> の関係で上昇する。電気側 <Eq tex="Q = I^2 R t = Pt" /> と熱側 <Eq tex="Q = c m \Delta T" /> を同じ <Eq tex="Q" /> で結べば、上の例題のように加熱時間 <Eq tex="t = \dfrac{c m \Delta T}{P}" /> が一発で出る。電気量(J)と熱量(J)が同じ単位で橋渡しされている点が要。</p>
          <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#dc-circuit" target="_blank" rel="noopener">→ 理論Wiki「直流回路の電力・ジュールの法則」で P=I²R=VI=V²/R の導出を深掘り</a></p>
        </Box>
      </>},
      { id: "methods", heading: "電気加熱の方式", body: <ul>
        <li><strong>抵抗加熱</strong> — 抵抗体に電流を流す（電気こんろ）</li>
        <li><strong>アーク加熱</strong> — 電極間アーク（製鋼）</li>
        <li><strong>誘導加熱</strong> — 渦電流による加熱（IH調理器・焼入れ）</li>
        <li><strong>誘電加熱</strong> — 高周波で誘電損失を利用（プラスチック溶接）</li>
        <li><strong>マイクロ波加熱</strong> — 誘電加熱の一種。数 GHz の交番電界で<strong>水分子（双極子）の向きが振られ、追従しきれないぶんが誘電損失として発熱</strong>する（電子レンジ）。<span className="marker">分子の共鳴を起こしているのではない</span></li>
      </ul>},
      { id: "heatpump", heading: "ヒートポンプとCOP（成績係数）", body: <>
        <FormulaCard num="03" name="成績係数（COP）" eq="\mathrm{COP} = \dfrac{Q}{W}"
          note="Q: 得られる熱量, W: 入力電力量。外気から熱を汲み上げるため COP は 1 を超える（実用機で 3〜6 程度）" />
        <HeatPumpFig />
        <p>ヒートポンプは電力で熱を<strong>作る</strong>のではなく<strong>汲み上げて運ぶ</strong>装置。だから入力電力以上の熱が得られ、抵抗加熱（COP=1相当）より高効率。<strong>加熱COP = 冷房COP + 1</strong>（Q_加熱 = Q_冷房 + W より。<strong>同一サイクル・同一運転状態で成り立つ関係</strong>で、別条件で測定した市販機の定格暖房COPと定格冷房COPを直接結ぶ式ではない）も頻出。</p>
      </>},
      { id: "quick-review", heading: "1分復習（即答チェック）", body: <>
        <div className="box">
          <details><summary>ジュール熱の式は？</summary>Q = I²Rt = Pt [J]</details>
          <details><summary>温度上昇の式は？</summary>Q = c·m·ΔT（c:比熱, m:質量, ΔT:温度差）</details>
          <details><summary>IH調理器・焼入れの加熱方式は？電子レンジは？</summary>IH・焼入れ=誘導加熱（渦電流）／電子レンジ=マイクロ波加熱（誘電加熱の一種・水分子（双極子）の向きが交番電界に追従しきれず誘電損失として発熱。共鳴ではない）</details>
          <details><summary>ヒートポンプの COP はなぜ 1 を超える？</summary>電力で熱を作るのではなく外気から汲み上げて運ぶため。COP = Q/W（実用機で3〜6）。加熱COP = 冷房COP + 1（同一運転状態での関係）</details>
        </div>
      </>},
    ]}
  />
);

const ChemPage = ({ onNav }) => (
  <StubPage title="電気化学" eyebrow="4.3  ELECTROCHEMISTRY"
    deck="ファラデーの法則・電池・電気分解。出題は少ないが基本式は確実に。" freq="低（付録 A の分野別集計では「その他」に含まれ、単独の内訳なし）"
    prev={{ id: "heat", title: "4.2 電熱" }} next={{ id: "drive-mech", title: "4.4 電動機応用" }}
    onNav={onNav}
    sections={[
      { id: "faraday", heading: "ファラデーの法則", body: <>
        <FormulaCard num="01" name="析出量" eq="W = \dfrac{M \cdot I \cdot t}{n \cdot F}"
          note="M:原子量, n:価数, F:ファラデー定数 (96500 C/mol)。流れた電流が全て目的の反応に使われる（電流効率100%）とした式で、試験問題は原則この前提。実際の電解では水素発生などの副反応があり析出量はこれより少なくなる。" />
        <ElectrolysisFig />
        <Box kind="example" label="理解を深める — 析出量の I·t は直流回路の電気量 Q=It そのもの">
          <p>ファラデーの法則 <Eq tex="W = \dfrac{M \cdot I \cdot t}{n \cdot F}" /> に現れる <Eq tex="I \cdot t" /> は、理論の直流回路で学ぶ <strong>電気量</strong> <Eq tex="Q = I t" />（電流×時間、単位クーロン C）そのもの。つまり析出量は流れた電気量 <Eq tex="Q" /> に比例する <Eq tex="W \propto Q" />。分母の <Eq tex="n \cdot F" /> は「物質1molを析出させるのに必要な電気量」で、ファラデー定数 <Eq tex="F = 96500" /> C/mol は電子1molが運ぶ電荷（アボガドロ数 × 電気素量 <Eq tex="e" />）に等しい。だから <Eq tex="\dfrac{I t}{n F}" /> は「流れた電子のmol数 ÷ 価数」＝析出する物質のmol数。電気分解は直流回路を流れる電荷を電子のやり取りに翻訳しただけで、両者は同じ <Eq tex="Q = I t" /> で結ばれている。</p>
          <p style={{margin:"8px 0 0"}}><a href="https://kfurufuru.github.io/secretary-portal-public/denken3-riron-wiki.html#dc-circuit" target="_blank" rel="noopener">→ 理論Wiki「2.1 直流回路」で電気量 Q=It と電流の定義を深掘り</a></p>
        </Box>
        <Box kind="example" label="例題 — 電気分解の析出量">
          <p>硫酸銅(II) <Eq tex="\mathrm{CuSO}_4" /> 水溶液を電流 <Eq tex="I = 10\;\mathrm{A}" /> で <Eq tex="t = 1930\;\mathrm{s}" />（32分10秒）電気分解した。陰極に析出する銅の質量 <Eq tex="W" /> を求めよ。銅の原子量 <Eq tex="M = 64" />、価数 <Eq tex="n = 2" />、ファラデー定数 <Eq tex="F = 96500\;\mathrm{C/mol}" />。</p>
          <Eq display tex="W = \dfrac{M I t}{n F} = \dfrac{64 \times 10 \times 1930}{2 \times 96500} = 6.4\;[\mathrm{g}]" />
          <p style={{margin:"8px 0 0"}}>💡 mol で追っても同じ：電気量 <Eq tex="Q = It = 19300\;\mathrm{C}" /> → 電子 <Eq tex="Q/F = 0.2\;\mathrm{mol}" /> → 価数2なので銅 <Eq tex="0.1\;\mathrm{mol}" /> → <Eq tex="0.1 \times 64 = 6.4\;\mathrm{g}" />。⚠️ 価数 <Eq tex="n" /> は<strong>分母</strong>（2価は同じ電気量でも1価の半分しか析出しない）。</p>
        </Box>
      </>},
      { id: "battery", heading: "電池（一次・二次・燃料電池）", body: <>
        <ul>

const GlossaryPage = ({ data, onNav, focus }) => {
  const [filter, setFilter] = useState("all");
  const [highlight, setHighlight] = useState(null);
  const letters = ["all", "あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ"];
  // 検索結果から選択された用語（focus）へ着地して一時ハイライトする。
  // 行フィルタで対象が非表示のことがあるため、まず ALL に戻す。
  // 描画完了を待つため要素が現れるまで短間隔でリトライ（最大2秒・fail-open）。
  useEffect(() => {
    if (!focus) return;
    setFilter("all");
    setHighlight(focus.term);
    let tries = 0;
    const timer = setInterval(() => {
      const el = document.getElementById("gl-" + focus.term);
      if (el) {
        el.scrollIntoView({ block: "start", behavior: "auto" });
        clearInterval(timer);
      } else if (++tries > 40) {
        clearInterval(timer);
      }
    }, 50);
    const off = setTimeout(() => setHighlight(null), 2400);
    return () => { clearInterval(timer); clearTimeout(off); };
  }, [focus]);
  const groups = useMemo(() => {
    const filtered = filter === "all" ? data.glossary : data.glossary.filter(g => g.letter === filter);
    const byLetter = {};
    filtered.forEach(g => { (byLetter[g.letter] = byLetter[g.letter] || []).push(g); });
    return byLetter;
  }, [filter, data.glossary]);
  return (
    <>
      <Crumbs items={[{ id: "home", label: "ホーム" }, { label: "リファレンス" }, { label: "用語集・索引" }]} onNav={onNav} />
      <PageHeader eyebrow="APPENDIX B  GLOSSARY & INDEX" title="用語集・索引"

        <div className="glossary-toolbar">
          {letters.map(l => (
            <button key={l} className={filter === l ? "active" : ""} onClick={() => setFilter(l)}>
              {l === "all" ? "ALL" : l}
            </button>
          ))}
        </div>
        {Object.keys(groups).sort().map(letter => (
          <div key={letter} className="glossary-section">
            <h3>{letter}</h3>
            {groups[letter].map((g, i) => (
              <div key={i} id={"gl-" + g.term} className="glossary-entry"
                   style={highlight === g.term ? { background: "var(--accent-soft)" } : undefined}>
                <div>
                  <div className="glossary-term">{g.term}</div>
                  <div className="glossary-reading">{g.reading}</div>
                </div>
                <div className="glossary-def">{g.def}</div>
              </div>
            ))}
          </div>
        ))}
        {Object.keys(groups).length === 0 && (
          <p style={{ color: 'var(--ink-mute)', textAlign: 'center', padding: '40px 0' }}>該当する用語がありません。</p>
        )}

      <PageNav prev={{ id: "trends", title: "出題傾向データ" }} next={{ id: "guide", title: "学習ガイド" }} onNav={onNav} />
    </>
  );
};

</script>
<script type="text/babel">
/* app.jsx */
/* ============================================================
   App shell — sidebar nav, main router, search, TOC, Tweaks
   ============================================================ */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "indigo",
  "fontSize": 15,
  "lineHeight": 1.85
}/*EDITMODE-END*/;

/* ---------- Sidebar ---------- */
const Sidebar = ({ chapters, currentPage, onNav, mobileOpen, onCloseMobile, searchQuery, onSearchChange, searchResults, onSearchSelect }) => {
  const [openChapters, setOpenChapters] = useState(() => Object.fromEntries(chapters.map(c => [c.id, true])));
  const toggle = (id) => setOpenChapters(s => ({ ...s, [id]: !s[id] }));
  const inputRef = useRef(null);
  useEffect(() => {
    const k = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        inputRef.current?.focus();
      }
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);
  return (
    <aside className={`sidebar${mobileOpen ? ' mobile-open' : ''}`}>
      <div className="brand" onClick={() => { onNav("home"); onCloseMobile?.(); }} style={{ cursor: 'pointer' }}>
        <div className="brand-mark">電</div>
        <div>
          <div className="brand-title">機械Wiki</div>
          <div className="brand-sub">DENKEN-3 / MACHINERY</div>
        </div>
      </div>

      <div className="search">
        <span className="search-icon" aria-hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        </span>
        <input ref={inputRef} type="text" placeholder="検索（ページ・用語）" value={searchQuery} onChange={(e) => onSearchChange(e.target.value)} />
        {!searchQuery && <span className="search-kbd">⌘K</span>}
        {searchQuery && searchResults.length > 0 && (
          <div className="search-results">
            {searchResults.map((r, i) => (
              <div key={i} className="search-result" onClick={() => { onSearchSelect(r); onCloseMobile?.(); }}>
                <div className="search-result-title" dangerouslySetInnerHTML={{ __html: r.titleHtml }} />
                <div className="search-result-meta">{r.kind} — {r.context}</div>
              </div>
            ))}
          </div>
        )}
        {searchQuery && searchResults.length === 0 && (
          <div className="search-results"><div className="search-result"><div className="search-result-meta">該当なし</div></div></div>
        )}
      </div>

      {chapters.map(ch => (
        <div key={ch.id} className="nav-group">
          <button className="nav-chapter" data-open={openChapters[ch.id]} onClick={() => toggle(ch.id)}>
            <svg className="nav-chapter-caret" viewBox="0 0 12 12" fill="currentColor"><path d="M3 4l3 4 3-4z"/></svg>
            {ch.title}
            <span className="nav-chapter-num">{ch.num}</span>
          </button>
          <ul className="nav-items" data-open={openChapters[ch.id]}>
            {ch.pages.map(p => (
              <li key={p.id} className={`nav-item${currentPage === p.id ? ' active' : ''}`}
                  onClick={() => { onNav(p.id); onCloseMobile?.(); }}>
                <span className="nav-item-num">{p.num}</span>
                <span style={{ flex: 1 }}>{p.title}</span>
                {p.featured && <span className="nav-badge">★</span>}
              </li>
            ))}
          </ul>
        </div>
      ))}

      <a href="https://kfurufuru.github.io/secretary-portal-public/" style={{display:'block',textAlign:'center',padding:'0.6rem 0',margin:'0.5rem 0.75rem',borderRadius:'6px',background:'var(--bg-sunken)',color:'var(--ink-mute)',textDecoration:'none',fontSize:'0.78rem',letterSpacing:'0.02em'}}>← ポータルに戻る</a>

      <div className="sidebar-footer">
        本Wikiは電験3種「機械」科目の独習用にまとめた教材集である。掲載する出題傾向データは編集者の集計によるものであり、本試験を保証するものではない。
      </div>
    </aside>
  );
};

/* ---------- TOC (right rail) ---------- */
const TOC = ({ page }) => {
  const [items, setItems] = useState([]);
  const [active, setActive] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const update = () => {
      if (cancelled) return;
      const heads = document.querySelectorAll('.content h2[id], .content h3[id]');
      const next = [...heads].map(h => ({
        id: h.id,
        text: h.textContent.replace(/^§\d+\s*/, '').trim(),
        level: h.tagName === 'H2' ? 2 : 3,
      }));
      setItems(prev => {
        if (prev.length === next.length && prev.every((p, i) => p.id === next[i].id)) return prev;
        return next;
      });
    };
    update();
    const t = setTimeout(update, 200);
    return () => { cancelled = true; clearTimeout(t); };
  }, [page]);
  useEffect(() => {
    const onScroll = () => {
      const heads = [...document.querySelectorAll('.content h2[id], .content h3[id]')];
      let cur = null;
      for (const h of heads) {
        if (h.getBoundingClientRect().top < 80) cur = h.id;
      }
      setActive(prev => prev === cur ? prev : cur);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, [page]);
  if (items.length === 0) return <aside className="toc" />;
  return (
    <aside className="toc">
      <div className="toc-label">On this page</div>
      <ul>
        {items.map(it => (
          <li key={it.id} className={it.level === 3 ? 'h3' : ''}>
            {/* href は #<pageId>/<sectionId>。素の #<sectionId> だと再読み込みで
                ページ判定に失敗して home へ落ちるため（深いリンク対応）。 */}
            <a href={`#${page}/${it.id}`} className={active === it.id ? 'active' : ''}>{it.text}</a>
          </li>
        ))}
      </ul>
    </aside>
  );
};

/* ---------- Search index ----------
   ページ名・用語に加えて **本文セクション見出し** も索引に載せる。
   anchor を持つ項目は選択時に #<pageId>/<anchor> へ直接着地する。 */
function buildSearchIndex(data) {
  const items = [];
  data.chapters.forEach(ch => {
    ch.pages.forEach(p => {
      items.push({ kind: "ページ", title: p.title, id: p.id, context: `${ch.title} / ${p.num}`, terms: `${p.title} ${p.num}` });
    });
  });
  (data.sections || []).forEach(s => {
    items.push({
      kind: "セクション", title: s.title, id: s.page, anchor: s.anchor,
      context: `${s.pageTitle} — ${s.desc}`,
      terms: `${s.title} ${s.desc} ${s.keywords || ''} ${s.pageTitle}`,
    });
  });
  data.glossary.forEach(g => {
    items.push({ kind: "用語", title: g.term, id: "glossary", anchor: "gl-" + g.term, context: g.def.slice(0, 40) + "…", terms: `${g.term} ${g.reading} ${g.def}` });
  });
  return items;
}

function searchIndex(idx, q) {
  if (!q || !q.trim()) return [];
  const lower = q.toLowerCase();
  return idx.filter(i => i.terms.toLowerCase().includes(lower)).slice(0, 12).map(i => {
    const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i');
    return { ...i, titleHtml: i.title.replace(re, '<mark>$1</mark>') };
  });
}

/* ---------- Hash routing ----------
   ハッシュは `#<pageId>` または `#<pageId>/<セクションid>` の2形式。
   ページ内アンカーを `#loss` のような素の id にすると、再読み込み時に
   pageIds に無いため home へ落ちる（＝深いリンクが壊れる）。ページIDを
   必ず先頭に持たせることで、リロード・戻る/進む・直リンクすべてで
   同じ見出しに着地する。既存の `#transformer` 単独形も従来どおり動く。 */
function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return { page: null, anchor: null };
  const i = raw.indexOf('/');
  if (i === -1) return { page: raw, anchor: null };
  // 用語アンカー（gl-同期速度 等）は日本語を含むため percent-encoding されうる。
  // decode 失敗（不正な % 列）は生文字列のまま扱う（fail-open）。
  let anchor = raw.slice(i + 1) || null;
  if (anchor) { try { anchor = decodeURIComponent(anchor); } catch (e) { /* keep raw */ } }
  return { page: raw.slice(0, i), anchor };
}

/* ---------- App ---------- */
const App = () => {
  const data = window.WIKI_DATA;
  const [tweaks, setTweak] = window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, () => {}];

  const [page, setPage] = useState(() => {
    const { page: p } = parseHash();
    return p && pageIds().includes(p) ? p : 'home';
  });
  // 着地させたいセクションid。ページ描画（KaTeX含む）完了後に scrollIntoView する。
  const [anchor, setAnchor] = useState(() => parseHash().anchor);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  // 検索結果から用語集の特定語へ着地させるための対象。tick を持たせることで
  // 同じ語を続けて選択しても effect が再発火する（hash 経由だと再発火しない）。
  const [glossaryFocus, setGlossaryFocus] = useState(null);
  const searchIdx = useMemo(() => buildSearchIndex(data), [data]);
  const searchResults = useMemo(() => searchIndex(searchIdx, searchQuery), [searchIdx, searchQuery]);

  // Apply tweaks to root
  useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    document.documentElement.dataset.accent = tweaks.accent;
    document.documentElement.style.setProperty('--fs-base', tweaks.fontSize + 'px');
    document.documentElement.style.setProperty('--lh-base', tweaks.lineHeight);
  }, [tweaks]);

  // navigate('transformer') / navigate('transformer', 'loss') の両方を受ける。
  const navigate = (id, sectionId) => {
    setPage(id);
    setAnchor(sectionId || null);
    // 日本語アンカー（gl-同期速度 等）はエンコードして格納（reload 時は parseHash が decode）
    location.hash = sectionId ? `${id}/${encodeURIComponent(sectionId)}` : id;
    if (!sectionId) window.scrollTo({ top: 0, behavior: 'auto' });
  };
  useEffect(() => {
    const onHash = () => {
      const { page: p, anchor: a } = parseHash();
      if (p && pageIds().includes(p)) {
        setPage(p);
        setAnchor(a);
        if (!a) window.scrollTo({ top: 0, behavior: 'auto' });
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // アンカーへの着地。KaTeX の描画でレイアウトが動くため、要素が現れるまで
  // 短い間隔でリトライする（最大 2 秒）。見つからなければ何もしない（fail-open）。
  useEffect(() => {
    if (!anchor) return;
    let tries = 0;
    const timer = setInterval(() => {
      const el = document.getElementById(anchor);
      if (el) {
        el.scrollIntoView({ block: 'start', behavior: 'auto' });
        clearInterval(timer);
      } else if (++tries > 40) {
        clearInterval(timer);
      }
    }, 50);
    return () => clearInterval(timer);
  }, [page, anchor]);

  function pageIds() {
    return ['home', ...data.chapters.flatMap(c => c.pages.map(p => p.id))];
  }

  const renderPage = () => {
    const props = { data, onNav: navigate };
    switch (page) {
      case 'home':              return <HomePage {...props} />;
      case 'dc-machine':        return <DCMachinePage {...props} />;
      case 'induction-machine': return <InductionMachinePage {...props} />;
      case 'synchronous':       return <SynchronousPage {...props} />;
      case 'single-phase-im':   return <SinglePhaseIMPage {...props} />;
      case 'transformer':       return <TransformerPage {...props} />;
      case 'power-elec':        return <PowerElecPage {...props} />;
      case 'keiki-yo-henseiki': return <KeikiYoHenseikiPage {...props} />;
      case 'yougo-konzai':      return <YougoKonzaiPage {...props} />;
      case 'auto-control':      return <AutoControlPage {...props} />;
      case 'info-elec':         return <InfoElecPage {...props} />;
      case 'lighting':          return <LightingPage {...props} />;
      case 'heat':              return <HeatPage {...props} />;
      case 'chemistry':         return <ChemPage {...props} />;
      case 'drive-mech':        return <DriveMechPage {...props} />;
      case 'trends':            return <TrendsPage {...props} />;
      case 'glossary':          return <GlossaryPage {...props} focus={glossaryFocus} />;
      case 'guide':             return <GuidePage {...props} />;
      case 'study-log':         return <StudyLogPage {...props} />;
      default:                  return <HomePage {...props} />;
    }
  };

  return (
    <>
      <div className="app">
        <Sidebar chapters={data.chapters} currentPage={page} onNav={navigate}
                 mobileOpen={mobileOpen} onCloseMobile={() => setMobileOpen(false)}
                 searchQuery={searchQuery} onSearchChange={setSearchQuery}
                 searchResults={searchResults}
                 onSearchSelect={(r) => {
                   if (r.id === 'glossary' && r.anchor) setGlossaryFocus({ term: r.title, tick: Date.now() });
                   navigate(r.id, r.anchor);
                   setSearchQuery('');
                 }} />
        <main className="main" key={page}>{renderPage()}</main>
        <TOC key={`toc-${page}`} page={page} />
      </div>
      <button className="mobile-menu-btn" onClick={() => setMobileOpen(o => !o)} aria-label="メニュー">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="表示">
            <window.TweakRadio label="テーマ" value={tweaks.theme} onChange={(v) => setTweak('theme', v)}
              options={[{ value: 'light', label: 'ライト' }, { value: 'dark', label: 'ダーク' }]} />
            <window.TweakRadio label="アクセント" value={tweaks.accent} onChange={(v) => setTweak('accent', v)}
              options={[
                { value: 'indigo', label: 'インディゴ' },
                { value: 'forest', label: 'フォレスト' },
                { value: 'rust', label: 'ラスト' },
                { value: 'aubergine', label: 'オーベルジン' },
              ]} />
          </window.TweakSection>
          <window.TweakSection title="タイポグラフィ">
            <window.TweakSlider label="フォントサイズ" value={tweaks.fontSize} onChange={(v) => setTweak('fontSize', v)}
              min={13} max={19} step={1} suffix="px" />
            <window.TweakSlider label="行間" value={tweaks.lineHeight} onChange={(v) => setTweak('lineHeight', v)}
              min={1.5} max={2.2} step={0.05} />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
